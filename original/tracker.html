<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Question Log — JEE tracker</title>
<style>
:root{
  color-scheme: dark;
  --ink:#0e1218; --ink-2:#141a23; --ink-3:#1b232e;
  --rule:#26303d; --rule-soft:#1e2732;
  --text:#e7edf5; --text-2:#93a3b8; --text-3:#5f7086;
  --ok:#3ecf8e; --no:#ff5f6d; --flag:#ffb03a; --hw:#7aa2ff; --cant:#a678f5;
  --math:#a78bfa; --phys:#4cc9f0; --chem:#ffa94d;
  --accent:#a78bfa; --r:10px; --tint:rgba(255,255,255,.02); --tint2:rgba(255,255,255,.05);
  --topbar-bg:rgba(14,18,24,.94);
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
/* alternate themes — only the base palette changes; subject colours,
   result colours (ok/no/flag/hw/cant) and accent stay put so nothing
   elsewhere in the app needs to know which theme is active */
:root[data-theme="red"]{
  --ink:#160b0c; --ink-2:#1e1113; --ink-3:#271619;
  --rule:#3a2226; --rule-soft:#2c1a1d;
  --text:#f5e9ea; --text-2:#b89a9c; --text-3:#836b6d;
  --topbar-bg:rgba(22,11,12,.94);
}
:root[data-theme="green"]{
  --ink:#0a120e; --ink-2:#101a14; --ink-3:#16241b;
  --rule:#233a2c; --rule-soft:#1b2c22;
  --text:#e8f2ec; --text-2:#9ab8a8; --text-3:#647d70;
  --topbar-bg:rgba(10,18,14,.94);
}
:root[data-theme="light"]{
  color-scheme: light;
  --ink:#f4f5f7; --ink-2:#ffffff; --ink-3:#eceef2;
  --rule:#d7dbe2; --rule-soft:#e3e6ec;
  --text:#161a20; --text-2:#4c5768; --text-3:#7c8798;
  --tint:rgba(10,15,25,.035); --tint2:rgba(10,15,25,.06);
  --topbar-bg:rgba(244,245,247,.88);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);
  background-image:linear-gradient(var(--tint) 1px,transparent 1px),
                   linear-gradient(90deg,var(--tint) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 120px}

.topbar{position:sticky;top:0;z-index:40;background:var(--topbar-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule-soft)}
.tbrow{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.tbrow.tabs{padding-top:0;padding-bottom:7px;gap:4px;overflow-x:auto;scrollbar-width:none}
.tbrow.tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--text-3);white-space:nowrap;border:1px solid transparent}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--text);border-color:var(--rule);background:var(--ink-2)}
.crumbs{display:flex;align-items:center;flex-wrap:nowrap;gap:2px;font-family:var(--mono);font-size:12.5px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{padding:3px 6px;border-radius:5px;color:var(--text-2);white-space:nowrap}
.crumb:hover{background:var(--ink-3);color:var(--text)}
.crumb.here{color:var(--text);cursor:default}
.sep{color:var(--text-3);padding:0 1px}
.tool{display:flex;align-items:center;gap:7px;flex:none;border:1px solid var(--rule);background:var(--ink-2);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.tool:hover{border-color:var(--accent)}
.tool:disabled{opacity:.35;cursor:not-allowed}
.tool.on{border-color:var(--hw);color:var(--hw)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--text-3)}
.dot.on{background:var(--flag);box-shadow:0 0 0 3px rgba(255,176,58,.16)}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.14)}
.badge{font-family:var(--mono);font-size:11px;background:var(--hw);color:#0a1020;border-radius:99px;padding:1px 6px;font-weight:700}
.badge.run{background:var(--ok);color:#08150f}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin:0 0 6px}
h1{font-size:27px;line-height:1.15;letter-spacing:-.02em;margin:0 0 4px;font-weight:700}
h2{font-size:19px;letter-spacing:-.01em;margin:0;font-weight:650}
h3.sec{font-size:16px;margin:34px 0 12px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--text-2);font-size:13.5px;margin:0 0 20px}
.pagehead{padding-top:24px;border-bottom:1px solid var(--rule-soft);padding-bottom:20px;margin-bottom:26px}
.pagehead .row-between{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead .row-between h1{flex:1 1 auto;min-width:0}

.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{display:block;width:100%;text-align:left;background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:20px;transition:border-color .12s,transform .12s;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-title{font-size:17px;font-weight:650;letter-spacing:-.01em}
.card-note{color:var(--text-3);font-size:12.5px;font-family:var(--mono);margin-top:14px;line-height:1.85}
.pct{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.pct.zero{color:var(--text-3)}
.tagx{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--rule);border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:middle}
.pen{margin-left:7px;font-size:12px;color:var(--text-3);padding:2px 5px;border-radius:5px;opacity:0;transition:opacity .12s}
.card:hover .pen,.node:hover .pen{opacity:1}
.pen:hover{background:var(--ink-3);color:var(--accent)}
@media (hover:none){.pen{opacity:.6}}
.subj{overflow:hidden;padding:24px 22px 22px}
.subj .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.subj h2{font-size:22px}
.subj .meta{font-family:var(--mono);font-size:12px;color:var(--text-3);margin-top:2px}
.rail{height:5px;border-radius:99px;background:var(--ink-3);overflow:hidden;margin-top:14px}
.rail > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ex .card-title{font-size:16px}
.ex-sub{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-top:2px}
.mosaic{display:flex;flex-wrap:wrap;gap:2.5px;margin:16px 0 4px}
.cell{width:7px;height:7px;border-radius:1.5px;background:var(--ink-3)}
.cell.c{background:var(--ok)} .cell.w{background:var(--no)}
.cell.d{background:var(--text-3)} .cell.x{background:var(--cant)}
.cell.f{box-shadow:inset 0 0 0 1.5px var(--flag)}
.stats{display:flex;gap:18px;margin-top:14px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-2);flex-wrap:wrap}
.stats b{font-weight:600;color:var(--text)}
.stats .k{color:var(--text-3);letter-spacing:.05em}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:var(--r);margin-bottom:14px}
.field{display:flex;align-items:center;gap:6px}
.field label,.blabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
select,.tin{background:var(--ink-3);border:1px solid var(--rule);border-radius:7px;padding:6px 9px;font-size:13px}
.spacer{flex:1}
.bulk{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{border:1px solid var(--rule);border-radius:7px;padding:6px 11px;font-size:13px;font-weight:550;background:var(--ink-3)}
.tbtn:hover{border-color:var(--accent)}
.tbtn.warn:hover{border-color:var(--flag);color:var(--flag)}
.tbtn.on{border-color:var(--accent);color:var(--accent)}

.sheet{border:1px solid var(--rule-soft);border-radius:var(--r);background:var(--ink-2);user-select:none}
.sheet > :first-child{border-radius:var(--r) var(--r) 0 0}
.sheet > :last-child{border-radius:0 0 var(--r) var(--r)}
.row{display:grid;grid-template-columns:62px 58px 122px minmax(100px,1fr) 132px 88px 40px;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--rule-soft);position:relative}
.row:first-child{border-top:none}
.head{border-top:none;background:var(--ink-3);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);position:sticky;top:var(--topbar-h,86px);z-index:5;padding-top:9px;padding-bottom:9px}
.row.done{background:rgba(62,207,142,.035)}
.row.cant{background:rgba(166,120,245,.10)}
.row.sel{background:rgba(122,162,255,.16)}
.row.hw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hw)}
.qn{font-family:var(--mono);font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;cursor:grab}
.sheet.dragging .qn{cursor:grabbing}
.row.done .qn{color:var(--text-2)}
.qn i{font-style:normal;font-size:8.5px;letter-spacing:.08em;color:var(--hw);border:1px solid rgba(122,162,255,.45);border-radius:3px;padding:0 3px}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:13px;color:transparent}
.check:hover{border-color:var(--text-2)}
.check.on{background:var(--ok);border-color:var(--ok);color:#08150f}
.bub{display:flex;gap:5px;align-items:center}
.bub button{width:26px;height:26px;border-radius:99px;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:13px;line-height:1;color:var(--text-3);flex:none}
.bub button:hover{border-color:var(--text-2);color:var(--text-2)}
.bub .c.on{background:var(--ok);border-color:var(--ok);color:#08150f}
.bub .w.on{background:var(--no);border-color:var(--no);color:#20060a}
.why{width:auto!important;padding:0 7px;height:22px!important;border-radius:6px!important;font-family:var(--mono);font-size:10px!important;letter-spacing:.06em;border-color:rgba(255,95,109,.45)!important;color:var(--no)!important}
.why:hover{background:rgba(255,95,109,.12)}
.note{width:100%;background:transparent;border:none;border-bottom:1px solid var(--rule-soft);padding:4px 2px;font-size:13px;color:var(--text-2);user-select:text}
.note::placeholder{color:#3d4b5c}
.note:focus{outline:none;border-bottom-color:var(--accent);color:var(--text)}
.marks{display:flex;gap:5px}
.flag,.cantb{border:1.5px solid var(--rule);border-radius:7px;padding:3px 7px;font-size:11px;font-family:var(--mono);letter-spacing:.05em;color:var(--text-3);white-space:nowrap}
.flag:hover,.cantb:hover{border-color:var(--text-2)}
.flag.on{border-color:var(--flag);color:var(--flag);background:rgba(255,176,58,.1)}
.cantb.on{border-color:var(--cant);color:var(--cant);background:rgba(166,120,245,.14)}
.stars{display:flex;gap:3px}
.stars button{font-size:17px;line-height:1;color:#333f4d;padding:1px}
.stars button:hover{color:var(--flag)}
.stars button.on{color:var(--flag)}
.empty{padding:34px 16px;text-align:center;color:var(--text-3);font-size:14px}
.hint{font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-top:10px;line-height:1.7}

.selbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--ink-3);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;box-shadow:0 12px 40px rgba(0,0,0,.55);width:max-content;max-width:calc(100vw - 24px)}
.selbar[hidden]{display:none}
.selbar .n{font-family:var(--mono);font-size:12px;color:var(--hw);padding-right:4px;white-space:nowrap}

.branch{border-left:1px solid var(--rule-soft);margin-left:9px;padding-left:16px}
.node{display:flex;align-items:center;gap:8px;padding:7px 0}
.twisty{width:20px;height:20px;border-radius:5px;border:1px solid var(--rule);display:grid;place-items:center;font-size:10px;color:var(--text-2);flex:none}
.twisty:hover{border-color:var(--accent)}
.node .nm{font-size:14px;font-weight:600}
.node .lv{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.hwitem{background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:9px;padding:13px 14px;margin:8px 0}
.hwitem.warnbox{border-color:rgba(255,176,58,.5)}
.hwitem.late{border-color:rgba(255,95,109,.55)}
.hwitem.fin{opacity:.6}
.hwhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hwhead .loc{font-size:14px;font-weight:600}
.hwhead .rng{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.hwhead .prog{font-family:var(--mono);font-size:12px;color:var(--hw);margin-left:auto}
.due{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-radius:5px;padding:1px 7px;color:var(--text-2)}
.due.soon{border-color:var(--flag);color:var(--flag)}
.due.over{border-color:var(--no);color:var(--no)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:11.5px;min-width:34px;padding:4px 6px;border-radius:6px;border:1px solid var(--rule);color:var(--text-3);background:var(--ink-3);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--text-2);color:var(--text-2)}
.chip.d{border-color:var(--text-3);color:var(--text-2)}
.chip.c{background:var(--ok);border-color:var(--ok);color:#08150f;font-weight:700}
.chip.w{background:var(--no);border-color:var(--no);color:#20060a;font-weight:700}
.chip.x{background:var(--cant);border-color:var(--cant);color:#15082a;font-weight:700}
.warntext{color:var(--flag);font-size:12.5px;font-family:var(--mono);margin-top:9px}
.x{color:var(--text-3);font-size:16px;line-height:1;padding:2px 5px;border-radius:5px}
.x:hover{color:var(--no);background:rgba(255,95,109,.1)}
.panel{background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:16px;margin-bottom:22px}
.hwrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plusbtn{width:32px;height:32px;border-radius:8px;border:1px dashed var(--rule);color:var(--text-2);font-size:17px;display:grid;place-items:center;flex:none}
.plusbtn:hover{border-color:var(--hw);color:var(--hw);border-style:solid}
.plusbtn:disabled{opacity:.35;cursor:not-allowed}

.fab{position:fixed;left:20px;bottom:20px;z-index:55;width:48px;height:48px;border-radius:99px;background:var(--accent);color:#0b0f14;font-size:24px;font-weight:600;display:grid;place-items:center;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.fab[hidden]{display:none}
.fab:hover{filter:brightness(1.1)}
.fabmenu{position:fixed;left:20px;bottom:78px;z-index:56;background:var(--ink-3);border:1px solid var(--rule);border-radius:11px;padding:6px;min-width:212px;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.fabmenu[hidden]{display:none}
.fabmenu button{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:7px;font-size:13.5px}
.fabmenu button:hover{background:var(--ink-2)}
.fabmenu button.danger{color:var(--no)}
.fabmenu .grp{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);padding:7px 11px 4px}

/* pomodoro */
.timerwrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap;justify-content:center;padding:26px 20px}
.clock{font-family:var(--mono);font-size:64px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.clock.brk{color:var(--ok)}
.ring{position:relative;width:330px;height:330px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%;display:block}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-top:6px}
.actbtn{border:1px solid var(--rule);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;background:var(--ink-3);display:flex;align-items:center;gap:7px}
.actbtn i{width:9px;height:9px;border-radius:99px;display:block;font-style:normal}
.actbtn.on{border-color:var(--accent);background:var(--tint2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.numin{width:74px;background:var(--ink-3);border:1px solid var(--rule);border-radius:7px;padding:6px 8px;font-size:13px;font-family:var(--mono)}

/* calendar + charts */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);text-align:center;padding-bottom:4px}
.day{aspect-ratio:1;border:1px solid var(--rule-soft);border-radius:7px;background:var(--ink-2);padding:5px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;justify-content:flex-start;min-height:52px}
.day.blank{border:none;background:none}
.day .dn{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.day.today{border-color:var(--accent)}
.day.on{border-color:var(--rule)}
.day.pick{outline:2px solid var(--accent);outline-offset:1px}
.day .tot{font-family:var(--mono);font-size:9.5px;color:var(--text-2);margin-top:auto}
.chartrow{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:18px;margin-bottom:16px}
.lg{display:flex;flex-direction:column;gap:7px;min-width:200px;flex:1}
.lg div{display:flex;align-items:center;gap:8px;font-size:13px}
.lg i{width:10px;height:10px;border-radius:3px;display:block;flex:none}
.lg b{margin-left:auto;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .l{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-top:3px}

/* marks tables */
.tabstrip{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ttab{border:1px solid var(--rule);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--text-3);background:var(--ink-2);display:flex;align-items:center;gap:6px}
.ttab.on{color:var(--text);border-color:var(--accent)}
.tblwrap{overflow-x:auto;border:1px solid var(--rule-soft);border-radius:var(--r);background:var(--ink-2)}
table.mk{border-collapse:collapse;width:100%;min-width:760px}
table.mk th,table.mk td{border-bottom:1px solid var(--rule-soft);border-right:1px solid var(--rule-soft);padding:0;text-align:left}
table.mk th{background:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:9px 10px;white-space:nowrap;position:relative}
table.mk th .pen{position:static;opacity:.5;margin-left:4px}
table.mk td input{width:100%;background:transparent;border:none;padding:9px 10px;font-size:13.5px;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.mk td input:focus{outline:none;background:var(--ink-3)}

<script>
"use strict";

/* ============================================================
   19. MATHS IN NOTES
   A small LaTeX subset turned into MathML, which every current
   browser draws natively. No library and no font files, so it
   still works with the page saved on a laptop and no internet.
   Write maths between dollar signs:  $\frac{1}{2}mv^2$
   ============================================================ */
const TEX_SYM = {
  alpha:"α", beta:"β", gamma:"γ", delta:"δ", epsilon:"ε", varepsilon:"ε", zeta:"ζ",
  eta:"η", theta:"θ", vartheta:"ϑ", iota:"ι", kappa:"κ", lambda:"λ", mu:"μ", nu:"ν",
  xi:"ξ", pi:"π", rho:"ρ", sigma:"σ", tau:"τ", upsilon:"υ", phi:"φ", varphi:"φ",
  chi:"χ", psi:"ψ", omega:"ω",
  Gamma:"Γ", Delta:"Δ", Theta:"Θ", Lambda:"Λ", Xi:"Ξ", Pi:"Π", Sigma:"Σ",
  Upsilon:"Υ", Phi:"Φ", Psi:"Ψ", Omega:"Ω",
  times:"×", div:"÷", pm:"±", mp:"∓", cdot:"⋅", ast:"∗", star:"⋆",
  leq:"≤", le:"≤", geq:"≥", ge:"≥", neq:"≠", ne:"≠", approx:"≈", equiv:"≡",
  sim:"∼", simeq:"≃", propto:"∝", ll:"≪", gg:"≫",
  infty:"∞", partial:"∂", nabla:"∇", forall:"∀", exists:"∃", emptyset:"∅",
  in:"∈", notin:"∉", subset:"⊂", subseteq:"⊆", supset:"⊃", supseteq:"⊇",
  cup:"∪", cap:"∩", setminus:"∖", angle:"∠", perp:"⊥", parallel:"∥",
  rightarrow:"→", to:"→", leftarrow:"←", Rightarrow:"⇒", Leftarrow:"⇐",
  leftrightarrow:"↔", Leftrightarrow:"⇔", mapsto:"↦", implies:"⟹",
  degree:"°", circ:"∘", prime:"′", hbar:"ℏ", ell:"ℓ", Re:"ℜ", Im:"ℑ",
  dots:"…", ldots:"…", cdots:"⋯", therefore:"∴", because:"∵",
  quad:"\u2003", qquad:"\u2003\u2003", ",":"\u2009", ";":"\u2005", " ":" "
};
const TEX_OPS = {
  sum:"∑", prod:"∏", int:"∫", iint:"∬", iiint:"∭", oint:"∮", lim:"lim",
  sqrt:"√", frac:"", binom:""
};
const TEX_FUN = ["sin","cos","tan","cot","sec","csc","log","ln","exp","max","min",
                 "arcsin","arccos","arctan","sinh","cosh","tanh","det","gcd","lcm","deg","mod"];
const TEX_ACC = {vec:"→", hat:"^", bar:"‾", overline:"‾", tilde:"~", dot:"˙", ddot:"¨"};

function texTokens(src){
  const out = []; let i = 0;
  while(i < src.length){
    const ch = src[i];
    if(ch === "\\"){
      const m = /^\\([A-Za-z]+|.)/.exec(src.slice(i));
      out.push({t:"cmd", v:m[1]}); i += m[0].length; continue;
    }
    if(ch === "{" || ch === "}"){ out.push({t:ch}); i++; continue; }
    if(ch === "^" || ch === "_"){ out.push({t:ch}); i++; continue; }
    if(/\s/.test(ch)){ i++; continue; }
    if(/[0-9]/.test(ch)){
      const m = /^[0-9]+(\.[0-9]+)?/.exec(src.slice(i));
      out.push({t:"num", v:m[0]}); i += m[0].length; continue;
    }
    if(/[A-Za-z]/.test(ch)){ out.push({t:"id", v:ch}); i++; continue; }
    out.push({t:"op", v:ch}); i++;
  }
  return out;
}
const mml = (tag, inner, attr) => `<${tag}${attr?" "+attr:""}>${inner}</${tag}>`;
function texEsc(s){ return String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* one item: a group, a command, or a single character */
function texAtom(tk, p){
  const t = tk[p.i];
  if(!t) return "";
  if(t.t === "{"){ p.i++; return mml("mrow", texSeq(tk, p, true)); }
  if(t.t === "num"){ p.i++; return mml("mn", texEsc(t.v)); }
  if(t.t === "id"){ p.i++; return mml("mi", texEsc(t.v)); }
  if(t.t === "op"){
    p.i++;
    if("()[]|".indexOf(t.v) >= 0)
      return mml("mo", texEsc(t.v), 'stretchy="false" lspace="0" rspace="0"');
    return mml("mo", texEsc(t.v));
  }
  if(t.t === "}"){ p.i++; return ""; }
  if(t.t === "cmd"){
    const c = t.v;
    p.i++;
    const SPACE = {",":"0.17em", ":":"0.22em", ";":"0.28em", "!":"-0.17em", " ":"0.25em",
                   quad:"1em", qquad:"2em"};
    if(SPACE[c] !== undefined) return `<mspace width="${SPACE[c]}"/>`;
    if(c === "frac" || c === "dfrac" || c === "tfrac"){
      const a = texAtom(tk,p), b = texAtom(tk,p);
      return mml("mfrac", a + b);
    }
    if(c === "binom"){
      const a = texAtom(tk,p), b = texAtom(tk,p);
      return mml("mrow", mml("mo","(") + mml("mfrac", a+b, 'linethickness="0"') + mml("mo",")"));
    }
    if(c === "sqrt"){
      if(tk[p.i] && tk[p.i].t === "op" && tk[p.i].v === "["){
        p.i++;
        let idx = "";
        while(p.i < tk.length && !(tk[p.i].t === "op" && tk[p.i].v === "]")) idx += texAtom(tk,p);
        p.i++;
        return mml("mroot", texAtom(tk,p) + mml("mrow", idx));
      }
      return mml("msqrt", texAtom(tk,p));
    }
    if(TEX_ACC[c]) return mml("mover", texAtom(tk,p) + mml("mo", TEX_ACC[c]), 'accent="true"');
    if(c === "text" || c === "mathrm" || c === "mbox"){
      /* keep the words as words */
      let depth = 0, s = "";
      if(tk[p.i] && tk[p.i].t === "{"){
        p.i++; depth = 1;
        while(p.i < tk.length && depth){
          const x = tk[p.i];
          if(x.t === "{") depth++;
          else if(x.t === "}"){ depth--; if(!depth){ p.i++; break; } }
          else s += (x.v !== undefined ? x.v : "");
          p.i++;
        }
      }
      return mml("mtext", texEsc(s));
    }
    if(c === "left" || c === "right"){
      const d = tk[p.i]; p.i++;
      const v = d ? (d.v === "." ? "" : d.v) : "";
      return v ? mml("mo", texEsc(v), 'stretchy="true"') : "";
    }
    if(c === "lim"){ return mml("mo", "lim", 'movablelimits="true"'); }
    if(TEX_OPS[c]) return mml("mo", TEX_OPS[c], 'stretchy="false"');
    if(TEX_FUN.indexOf(c) >= 0) return mml("mi", c, 'mathvariant="normal"');
    if(TEX_SYM[c] !== undefined){
      const v = TEX_SYM[c];
      /* capital Greek stands upright, lower case leans like a variable */
      if(/[ΓΔΘΛΞΠΣΥΦΨΩ]/.test(v)) return mml("mi", texEsc(v), 'mathvariant="normal"');
      return /[A-Za-zα-ω]/.test(v) ? mml("mi", texEsc(v)) : mml("mo", texEsc(v));
    }
    return mml("mi", texEsc(c));
  }
  p.i++; return "";
}
/* walk a run of atoms, attaching ^ and _ to whatever came before */
function texSeq(tk, p, endAtBrace){
  const parts = [];
  while(p.i < tk.length){
    const t = tk[p.i];
    if(t.t === "}"){ p.i++; if(endAtBrace) break; continue; }
    if(t.t === "^" || t.t === "_"){
      p.i++;
      const script = texAtom(tk, p);
      const base = parts.pop() || mml("mrow","");
      const next = tk[p.i];
      if(next && (next.t === "^" || next.t === "_") && next.t !== t.t){
        p.i++;
        const other = texAtom(tk, p);
        parts.push(mml("msubsup", base + (t.t === "_" ? script + other : other + script)));
      } else {
        parts.push(mml(t.t === "^" ? "msup" : "msub", base + script));
      }
      continue;
    }
    parts.push(texAtom(tk, p));
  }
  return parts.join("");
}
function texRow(src){ return texSeq(texTokens(src), {i:0}, false); }
function texToMathML(src, display){
  try{
    return `<math xmlns="http://www.w3.org/1998/Math/MathML"${display?' display="block"':""}>${texRow(src)}</math>`;
  }catch(e){
    return `<span class="texfail">${texEsc("$"+src+"$")}</span>`;
  }
}
/* turn a piece of writing into HTML, converting anything between dollars */
function mathText(s){
  if(s == null) return "";
  const str = String(s);
  if(str.indexOf("$") < 0) return texEsc(str).replace(/\n/g,"<br>");
  let out = "", i = 0;
  while(i < str.length){
    const open = str.indexOf("$", i);
    if(open < 0){ out += texEsc(str.slice(i)).replace(/\n/g,"<br>"); break; }
    out += texEsc(str.slice(i, open)).replace(/\n/g,"<br>");
    const block = str[open+1] === "$";
    const mark = block ? "$$" : "$";
    const close = str.indexOf(mark, open + mark.length);
    if(close < 0){ out += texEsc(str.slice(open)).replace(/\n/g,"<br>"); break; }
    out += texToMathML(str.slice(open + mark.length, close), block);
    i = close + mark.length;
  }
  return out;
}
const hasMath = s => typeof s === "string" && s.indexOf("$") >= 0;

/* a live preview under any box you can type maths into */
function wireMathPreview(inputId, previewId){
  const input = document.getElementById(inputId), prev = document.getElementById(previewId);
  if(!input || !prev) return;
  const paint = ()=>{
    const v = input.value;
    if(!hasMath(v)){ prev.hidden = true; prev.innerHTML = ""; return; }
    prev.hidden = false;
    prev.innerHTML = mathText(v);
  };
  input.addEventListener("input", paint);
  paint();
}

   4. THE TREE
   ============================================================ */
let TREE = null;
function buildTree(){
  TREE = {order:[], subjects:{}};
  for(const code of ["M","P","C"]){
    const b = BUILTIN[code];
    const sub = {code, name:S.x.ren["s:"+code]||b.name, short:b.short, accent:b.accent, custom:false, modules:{}, order:[]};
    /* every module exists before any chapter is placed, so a chapter moved
       into a later module still has somewhere to land */
    for(let m=1;m<=6;m++){
      sub.modules[m] = {id:m, name:S.x.ren["m:"+code+":"+m]||("Module "+m), custom:false, chapters:[]};
      sub.order.push(m);
    }
    for(let m=1;m<=6;m++){
      (b.modules[m]||[]).forEach(row=>{
        /* a built-in chapter can be re-homed into another module by the user */
        const dest = (S.x.mod||{})["c:"+code+":"+row[0]];
        const home = (dest!==undefined && Number(dest)>=1 && Number(dest)<=6) ? Number(dest) : m;
        const ch = {no:row[0], name:S.x.ren["c:"+code+":"+row[0]]||row[1], custom:false, mod:home, exs:[]};
        BUILT_EX.forEach(e=>ch.exs.push({code:e.code, name:S.x.ren["e:"+code+":"+ch.no+":"+e.code]||e.name,
                                         tag:e.tag, custom:false, base:row[e.i]*(e.mult||1)}));
        sub.modules[home].chapters.push(ch);
      });
    }
    TREE.subjects[code] = sub; TREE.order.push(code);
  }
  S.x.subs.forEach(cs=>{
    TREE.subjects[cs.code] = {code:cs.code, name:cs.name, short:cs.name, accent:cs.accent, custom:true, modules:{}, order:[]};
    TREE.order.push(cs.code);
  });
  for(const sc of TREE.order){
    const sub = TREE.subjects[sc];
    (S.x.mods[sc]||[]).forEach(cm=>{ sub.modules[cm.id] = {id:cm.id, name:cm.name, custom:true, chapters:[]}; sub.order.push(cm.id); });
    for(const mid of sub.order)
      (S.x.chs[sc+"|"+mid]||[]).forEach(cc=>sub.modules[mid].chapters.push({no:cc.no, name:cc.name, custom:true, mod:mid, exs:[]}));
    for(const mid of sub.order)
      sub.modules[mid].chapters.forEach(ch=>
        (S.x.exs[sc+"|"+ch.no]||[]).forEach(ce=>ch.exs.push({code:ce.code, name:ce.name, tag:"Added by you", custom:true})));
    labelChapters(sc);
  }
  return TREE;
}
/* ch.no is the permanent key; ch.label is the number on screen */
function labelChapters(sc){
  const sub = TREE.subjects[sc];
  let flow = 0;
  sub.order.forEach(m=>sub.modules[m].chapters.forEach(ch=>{ if(!ch.custom) flow = Math.max(flow, ch.no); }));
  sub.order.forEach(m=>{
    let seq = 0;
    sub.modules[m].chapters.forEach(ch=>{
      const k = "c:"+sc+":"+ch.no;
      const set = S.x.num[k];
      if(set !== undefined && set !== null) ch.label = Number(set);
      else if(!ch.custom) ch.label = ch.no;
      else if(Number(m) <= 6) ch.label = flow + 1;          /* keep the syllabus running on */
      else ch.label = seq + 1;                              /* a module of your own starts at 1 */
      if(Number(m) <= 6) flow = Math.max(flow, ch.label);
      seq = Math.max(seq, ch.label);
    });
    sub.modules[m].chapters.sort((a,b)=>a.label-b.label);
  });
}
const chLabel = ch => (ch && ch.label !== undefined) ? ch.label : (ch?ch.no:"");
const chTitle = ch => ch ? chLabel(ch)+". "+ch.name : "";
const subjOf = sc => TREE.subjects[sc];
const modOf  = (sc,m) => { const s = subjOf(sc); return s && s.modules[m]; };
function chapOf(sc, no){
  const s = subjOf(sc); if(!s) return null;
  for(const m of s.order){ const c = s.modules[m].chapters.find(c=>c.no===Number(no)); if(c) return c; }
  return null;
}
const exOf = (sc,ch,code) => ch && ch.exs.find(e=>e.code===code);
function qCount(sc, ch, code){
  const k = key(sc, ch.no, code);
  if(S.x.cnt[k] !== undefined) return S.x.cnt[k];
  const e = exOf(sc, ch, code);
  return e ? (e.base||0) : 0;
}
const exList = (sc,ch) => ch.exs.filter(e => e.custom || qCount(sc,ch,e.code) > 0);
function allChapters(sc){
  const s = subjOf(sc); if(!s) return [];
  let out=[]; s.order.forEach(m=>{ out = out.concat(s.modules[m].chapters); }); return out;
}
function arrFor(sc,no,code,len){
  const k = key(sc,no,code);
  if(!S.d[k] || S.d[k].length!==len){
    const old = S.d[k]||[], next = new Array(len).fill(0);
    for(let i=0;i<Math.min(old.length,len);i++) next[i]=old[i];
    S.d[k]=next;
  }
  return S.d[k];
}

const blank = () => ({n:0,done:0,correct:0,wrong:0,cant:0,flag:0});
function addTo(a,b){ ["n","done","correct","wrong","cant","flag"].forEach(k=>a[k]+=b[k]); return a; }
function exStats(sc,ch,code){
  const n = qCount(sc,ch,code), st = blank(); st.n = n;
  const a = S.d[key(sc,ch.no,code)]; if(!a) return st;
  for(let i=0;i<n;i++){ const v=a[i]||0;
    if(isDone(v)) st.done++;
    const r=result(v); if(r===1) st.correct++; else if(r===2) st.wrong++; else if(r===3) st.cant++;
    if(isFlag(v)) st.flag++; }
  return st;
}
function chapStats(sc,ch){ const t=blank(); exList(sc,ch).forEach(e=>addTo(t,exStats(sc,ch,e.code))); return t; }
function modStats(sc,m){ const t=blank(); const mo=modOf(sc,m); if(mo) mo.chapters.forEach(c=>addTo(t,chapStats(sc,c))); return t; }
function subjStats(sc){ const t=blank(); const s=subjOf(sc); if(s) s.order.forEach(m=>addTo(t,modStats(sc,m))); return t; }
const pct = st => st.n ? Math.round(st.done/st.n*100) : 0;
const acc = st => (st.correct+st.wrong) ? Math.round(st.correct/(st.correct+st.wrong)*100) : null;

function parseRange(str, max){
  const out=[], bad=[];
  const parts = String(str).split(",").map(p=>p.trim()).filter(Boolean);
  if(!parts.length) return {list:[], error:"Type a question range, like 20-30."};
  for(const p of parts){
    const m = p.match(/^(\d+)\s*(?:[-–—to]+\s*(\d+))?$/i);
    if(!m) return {list:[], error:'"'+p+'" is not a range. Use 20-30, or 12, or 20-30, 45.'};
    let a=parseInt(m[1],10), b=m[2]?parseInt(m[2],10):a;
    if(a>b){ const t=a; a=b; b=t; }
    if(a<1) return {list:[], error:"Question numbers start at 1."};
    if(b>max) bad.push(p);
    for(let i=a;i<=b;i++) out.push(i-1);
  }
  if(bad.length) return {list:[], error:"This exercise has "+max+" questions, so "+bad.join(", ")+" is outside it."};
  return {list:[...new Set(out)].sort((x,y)=>x-y), error:null};
}
function toRange(idx){
  if(!idx.length) return "";
  const s=[...idx].sort((a,b)=>a-b), out=[]; let a=s[0], p=s[0];
  for(let i=1;i<=s.length;i++){
    if(i<s.length && s[i]===p+1){ p=s[i]; continue; }
    out.push(a===p ? String(a+1) : (a+1)+"-"+(p+1));
    a=s[i]; p=s[i];
  }
  return out.join(",");
}
function hwResolve(it){
  if(it.kind==="back"){
    const sub = it.s?subjOf(it.s):null, ch = (it.s&&it.c)?chapOf(it.s,it.c):null;
    const ex = (ch&&it.e)?exOf(it.s,ch,it.e):null;
    return {back:true, missing:!!(it.e && !ex), list:[], n:ex?qCount(it.s,ch,it.e):0, sub, ch, ex};
  }
  /* a task may name none, some or all of a location */
  if(it.kind==="task") return {task:true, missing:false, list:[], n:0,
    sub: it.s?subjOf(it.s):null, ch:(it.s&&it.c)?chapOf(it.s,it.c):null, ex:null};
  const sub = subjOf(it.s), ch = sub ? chapOf(it.s, it.c) : null;
  const ex = ch ? exOf(it.s, ch, it.e) : null;
  if(!sub||!ch||!ex) return {missing:true, list:[], sub, ch, ex, n:0};
  const n = qCount(it.s, ch, it.e);
  const raw = parseRange(it.r, Number.MAX_SAFE_INTEGER).list;
  const list = raw.filter(i=>i<n);
  return {missing:false, over:raw.length-list.length, list, sub, ch, ex, n};
}
function hwStats(it){
  if(it.kind==="task") return {done: it.done?1:0, total:1, r:hwResolve(it)};
  if(it.kind==="back"){
    const r = hwResolve(it);
    if(!r.ex) return {done: it.done?1:0, total:1, r};     /* a lecture, ticked by hand */
    const a = S.d[key(it.s,it.c,it.e)]||[];
    let done = 0; for(let i=0;i<r.n;i++) if(isDone(a[i]||0)) done++;
    return {done, total:r.n, r};
  }
  const r = hwResolve(it); if(r.missing) return {done:0,total:0,r};
  const a = S.d[key(it.s,it.c,it.e)]||[];
  let done=0; r.list.forEach(i=>{ if(isDone(a[i]||0)) done++; });
  return {done, total:r.list.length, r};
}
/* how much of everything ever set for one chapter is done, finished lists included */
function chapterHwStats(sc, cno){
  let done=0, total=0;
  S.h.concat(S.hd).forEach(it=>{
    if(it.kind==="task" || it.kind==="back") return;
    if(it.s!==sc || String(it.c)!==String(cno)) return;
    const st = hwStats(it); done += st.done; total += st.total;
  });
  return {done, total, pct: total ? Math.round(done/total*100) : 0};
}
/* take specific questions back out of whatever lists cover them */
function removeQsFromHomework(qks){
  const set = new Set(qks);
  let touched = 0;
  S.h = S.h.filter(it=>{
    if(it.kind==="task" || it.kind==="back") return true;
    const base = key(it.s,it.c,it.e);
    const before = parseRange(it.r, Number.MAX_SAFE_INTEGER).list;
    const after = before.filter(i=>!set.has(base+"."+i));
    if(after.length === before.length) return true;
    touched++;
    if(!after.length) return false;
    it.r = toRange(after);
    return true;
  });
  return touched;
}
function hwTotals(){ let done=0,total=0; S.h.forEach(it=>{const s=hwStats(it); done+=s.done; total+=s.total;}); return {done,total,left:total-done}; }
/* pull a set of questions out of every homework list that mentions them */
function removeFromHomework(qks){
  const want = new Set(qks);
  let touched = 0, dropped = 0;
  S.h = S.h.filter(it=>{
    if(it.kind==="task" || it.kind==="back") return true;
    const base = key(it.s,it.c,it.e);
    const list = parseRange(it.r, Number.MAX_SAFE_INTEGER).list;
    const kept = list.filter(i=>!want.has(base+"."+i));
    if(kept.length === list.length) return true;
    touched += list.length - kept.length;
    if(!kept.length){ dropped++; return false; }
    it.r = toRange(kept);
    return true;
  });
  return {touched, dropped};
}

/* how much homework a chapter has ever carried, finished lists included */
function chapterHwStats(sc, cno){
  const seen = {};
  S.h.concat(S.hd).forEach(it=>{
    if(it.kind==="task" || it.kind==="back") return;
    if(it.s!==sc || String(it.c)!==String(cno)) return;
    const base = key(it.s,it.c,it.e);
    hwResolve(it).list.forEach(i=>{ seen[base+"."+i] = true; });
  });
  const keys = Object.keys(seen);
  let done = 0;
  keys.forEach(qk=>{
    const dot = qk.lastIndexOf(".");
    const arr = S.d[qk.slice(0,dot)];
    if(arr && isDone(arr[Number(qk.slice(dot+1))]||0)) done++;
  });
  return {total:keys.length, done, pct: keys.length?Math.round(done/keys.length*100):0};
}

function hwIndexSet(sc,no,code){
  const set = new Set();
  S.h.forEach(it=>{ if(it.kind==="task"||it.kind==="back") return;
    if(it.s===sc && String(it.c)===String(no) && it.e===code) hwResolve(it).list.forEach(i=>set.add(i)); });
  return set;
}
/* a list whose questions are all ticked moves to Finished, with an undo offer */
function sweepFinishedHomework(){
  /* anything no longer complete becomes sweepable again */
  S.h.forEach(it=>{ const s=hwStats(it); if(s.done < s.total) delete it.keep; });
  const finished = S.h.filter(it=>{ const s=hwStats(it); return !it.keep && s.total>0 && s.done===s.total; });
  if(!finished.length) return false;
  finished.forEach(it=>{ it.fin = Date.now(); S.hd.unshift(it); });
  S.h = S.h.filter(it=>!finished.includes(it));
  const names = finished.map(it=>(it.kind==="task"||it.kind==="back") ? (it.title || (hwResolve(it).ex||{}).name || "backlog") : ((hwResolve(it).ex||{}).name || "homework"));
  const ids = finished.map(it=>it.id);
  /* a targeted undo: put the list back and keep it there, rather than
     rewinding the tick that completed it and letting it sweep straight out again */
  toastUndo("Finished " + names.join(", ") + " — moved out of homework", ()=>{
    S.hd = S.hd.filter(x=>ids.indexOf(x.id) < 0);
    finished.forEach(it=>{ delete it.fin; it.keep = true; S.h.push(it); });
    markDirty();
    if(typeof VIEW !== "undefined" && VIEW.name==="hw") viewHomework();
    else if(typeof ctx !== "undefined" && ctx) drawSheet();
    paintTabs(); toast("Put back into homework");
  });
  return true;
}
function dueState(d){
  if(!d) return "";
  const today = todayKey();
  if(d < today) return "over";
  const t = new Date(); t.setDate(t.getDate()+2);
  if(d <= dayKey(t)) return "soon";
  return "";
}
function prettyDue(d){
  const today = todayKey();
  if(d === today) return "due today";
  const t = new Date(); t.setDate(t.getDate()+1);
  if(d === dayKey(t)) return "due tomorrow";
  if(d < today) return "overdue " + d;
  return "due " + d;
}

/* ============================================================
   6. SAVE CODE — v3, still reads v1 and v2
   ============================================================ */
const A64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!#$%&()*+,-.";
function fingerprint(str){ let h=5381; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))>>>0; return h.toString(36); }
function metaObject(){ return {x:S.x, h:S.h, hd:S.hd, r:S.r, log:S.log, stat:S.stat, marks:S.marks, pom:S.pom, dl:S.dl, norec:S.norec, hwSort:S.hwSort, goals:S.goals, col:S.col, bm:S.bm, notes:S.notes, an:S.an, rev:S.rev, theme:S.theme}; }
function makeCode(){
  const segs=[];
  Object.keys(S.d).sort().forEach(k=>{
    const a=S.d[k]; if(!a.some(v=>v)) return;
    let out="",i=0;
    while(i<a.length){ let j=i; while(j<a.length && a[j]===a[i]) j++;
      const run=j-i; out += A64[a[i]] + (run>1?run:""); i=j; }
    segs.push(k+":"+out);
  });
  const notes=[];
  Object.keys(S.n).sort().forEach(k=>{ const v=S.n[k]; if(v&&v.trim()) notes.push(k+"="+encodeURIComponent(v)); });
  const body = "v3|"+Date.now().toString(36)+"|"+segs.join(";")+"|"+notes.join(";")+"|"+encodeURIComponent(JSON.stringify(metaObject()));
  return "JEE-"+btoa(body+"|"+fingerprint(body));
}
function readCode(raw){
  let code = (raw||"").trim().replace(/\s+/g,"");
  if(!code) throw new Error("Paste a code first.");
  if(code.startsWith("JEE-")) code = code.slice(4);
  let body;
  try{ body = atob(code); }catch(e){ throw new Error("That is not a valid code. Check that you copied all of it."); }
  const cut = body.lastIndexOf("|");
  if(cut<0) throw new Error("That is not a valid code.");
  const payload = body.slice(0,cut), sum = body.slice(cut+1);
  if(fingerprint(payload)!==sum) throw new Error("This code is damaged or was cut off. Paste the whole code, with nothing added.");
  const f = payload.split("|");
  if(!["v1","v2","v3"].includes(f[0])) throw new Error("This code was made by a different version of the tracker.");
  const d={}, n={};
  if(f[2]) f[2].split(";").forEach(seg=>{
    const p=seg.indexOf(":"); if(p<0) return;
    const k=seg.slice(0,p), bd=seg.slice(p+1), arr=[]; let i=0;
    while(i<bd.length){
      const val = A64.indexOf(bd[i]); i++;
      if(val<0) throw new Error("This code is damaged.");
      let num=""; while(i<bd.length && bd[i]>="0" && bd[i]<="9"){ num+=bd[i]; i++; }
      const run = num?parseInt(num,10):1;
      if(!(run>0)||run>100000) throw new Error("This code is damaged.");
      for(let r=0;r<run;r++) arr.push(val);
    }
    d[k]=arr;
  });
  if(f[3]) f[3].split(";").forEach(seg=>{
    const p=seg.indexOf("="); if(p<0) return;
    n[seg.slice(0,p)] = decodeURIComponent(seg.slice(p+1));
  });
  const out = {d, n, x:newCustom(), h:[], hd:[], r:{}, log:[], stat:{}, marks:newMarks(),
               dl:[], norec:false, hwSort:"loc", goals:newGoals(), col:[], bm:{}, notes:[], an:newAnalysis(), rev:newRevision(), theme:"dark",
               pom:Object.assign({}, POM_DEFAULT), at:new Date(parseInt(f[1],36))};
  if(f[0]!=="v1" && f[4]){
    try{
      const meta = JSON.parse(decodeURIComponent(f[4]));
      if(meta.x) out.x = Object.assign(newCustom(), meta.x);
      if(Array.isArray(meta.h)) out.h = meta.h;
      if(Array.isArray(meta.hd)) out.hd = meta.hd;
      if(meta.r) out.r = meta.r;
      if(Array.isArray(meta.log)) out.log = meta.log;
      if(meta.stat) out.stat = meta.stat;
      if(meta.marks && meta.marks.tables) out.marks = meta.marks;
      if(meta.pom) out.pom = Object.assign(out.pom, meta.pom);
      if(Array.isArray(meta.dl)) out.dl = meta.dl;
      if(typeof meta.norec === "boolean") out.norec = meta.norec;
      if(meta.hwSort) out.hwSort = meta.hwSort;
      if(meta.goals) out.goals = Object.assign(newGoals(), meta.goals);
      if(Array.isArray(meta.col)) out.col = meta.col;
      if(meta.bm) out.bm = meta.bm;
      if(Array.isArray(meta.notes)) out.notes = meta.notes;
      if(meta.an && Array.isArray(meta.an.folders)) out.an = meta.an;
      if(meta.rev && meta.rev.items) out.rev = meta.rev;
      if(meta.theme && ["dark","red","green","light"].indexOf(meta.theme)>=0) out.theme = meta.theme;
      if(Array.isArray(meta.col)) out.col = meta.col;
      if(meta.bm) out.bm = meta.bm;
      if(Array.isArray(meta.notes)) out.notes = meta.notes;
      if(meta.an && Array.isArray(meta.an.folders)) out.an = meta.an;
      if(meta.rev && meta.rev.items) out.rev = meta.rev;
      if(meta.bm) out.bm = meta.bm;
      if(Array.isArray(meta.notes)) out.notes = meta.notes;
      if(meta.an && Array.isArray(meta.an.folders)) out.an = meta.an;
      if(meta.rev && meta.rev.items) out.rev = meta.rev;
    }catch(e){ throw new Error("This code is damaged."); }
  }
  return out;
}

  if(r.s==="coll"){ VIEW={name:"coll"}; setAccent(null); paintTabs(); fab.hidden=true; return viewCollections(); }
  if(r.s==="an"){
    setAccent(null); paintTabs(); fab.hidden=false;
    const f = r.m ? anFolder(r.m) : null;
    if(!f){ VIEW={name:"an"}; return viewAnalysis(); }
    const t = r.c ? anTest(f, r.c) : null;
    if(!t){ VIEW={name:"anFolder", f:f.id}; return viewAnFolder(f); }
    VIEW={name:"anTest", f:f.id, t:t.id};
    return viewAnTest(f, t);
  }
  if(r.s==="goals"){ VIEW={name:"goals"}; setAccent(null); paintTabs(); fab.hidden=true; return viewGoals(); }
  if(r.s==="rev"){ VIEW={name:"rev"}; setAccent(null); paintTabs(); fab.hidden=false; return viewRevision(); }
  if(r.s==="manual"){ VIEW={name:"manual"}; setAccent(null); paintTabs(); fab.hidden=true; return viewManual(); }
  if(r.s==="marks"){ VIEW={name:"marks"}; setAccent(null); paintTabs(); fab.hidden=false; return viewMarks(); }

  paintTabs(); fab.hidden=false;
  if(!r.s || !subjOf(r.s)){ VIEW={name:"home"}; setAccent(null); return viewHome(); }
  setAccent(r.s);
  if(!r.m || !modOf(r.s,r.m)){ VIEW={name:"subject", s:r.s}; return viewSubject(r.s); }
  if(!r.c){ VIEW={name:"module", s:r.s, m:Number(r.m)}; return viewModule(r.s, Number(r.m)); }
  const ch = chapOf(r.s, r.c);
  if(!ch){ VIEW={name:"subject", s:r.s}; return viewSubject(r.s); }
  if(!r.e || !exOf(r.s,ch,r.e)){ VIEW={name:"chapter", s:r.s, m:Number(r.m), c:ch.no}; return viewChapter(r.s, Number(r.m), ch); }
  VIEW={name:"exercise", s:r.s, m:Number(r.m), c:ch.no, e:r.e};
  return viewExercise(r.s, Number(r.m), ch, r.e);
}

let filter = {status:"all", star:"all", sort:"num"};
let order = [], sel = new Set(), ctx = null, focusQ = null;

  }
  const arr = arrFor(sc,ch.no,code,n);
  ctx = {sc, ch, code, arr, n, hw:hwIndexSet(sc,ch.no,code)};

  app.innerHTML = recBanner() + `<div class="pagehead"><div class="eyebrow">${esc(chTitle(ch))} · ${esc(ex.tag)}</div>
      <h1>${esc(ex.name)}</h1><div id="exStats">${statLine(exStats(sc,ch,code))}</div></div>
    <div class="toolbar">
      <div class="field"><label for="fStatus">Show</label><select id="fStatus">
        <option value="all">Everything</option><option value="todo">Not solved</option>
        <option value="done">Solved</option><option value="correct">Correct</option>
        <option value="wrong">Wrong</option><option value="cant">Could not solve</option>
        <option value="flag">Marked for review</option><option value="hw">Homework</option></select></div>
      <div class="field"><label for="fStar">Stars</label><select id="fStar">
        <option value="all">Any</option><option value="3">3 stars</option><option value="2">2 stars</option>
        <option value="1">1 star</option><option value="0">No stars</option></select></div>
      <div class="field"><label for="fSort">Order</label><select id="fSort">
        <option value="num">Question number</option><option value="starDesc">Stars, high to low</option>
        <option value="starAsc">Stars, low to high</option></select></div>
      <span class="spacer"></span>
      <div class="bulk">
        <button class="tbtn warn" id="allDone">Mark all solved</button>
        <button class="tbtn warn" id="allCorrect">Mark all correct</button>
        <button class="tbtn warn" id="clearEx">Clear exercise</button></div>
    </div>
    <div class="panel" style="padding:12px;margin-bottom:14px">
      <div class="hwrow">
        <span class="blabel" style="margin:0">Apply to questions</span>
        <input class="tin" id="rngIn" placeholder="4, 7, 8-9, 45-60" style="flex:1;min-width:170px">
        <select id="rngWhat">
          <option value="done">Mark solved</option>
          <option value="correct">Mark correct</option>
          <option value="wrong">Mark wrong</option>
          <option value="cant">Could not solve</option>
          <option value="flag">Mark for review</option>
          <option value="unflag">Remove review</option>
          <option value="undone">Mark not solved</option>
          <option value="s3">Give 3 stars</option>
          <option value="s2">Give 2 stars</option>
          <option value="s1">Give 1 star</option>
          <option value="s0">Remove stars</option>
        </select>
        <button class="btn primary" id="rngGo">Apply</button>
      </div>
      <div class="msg bad" id="rngMsg"></div>
    </div>
    <div class="sheet" id="sheet"></div>
    <div class="hint">Drag down the question numbers to select a run, then tick them together or send them to homework.</div>`;

  document.getElementById("fStatus").value = filter.status;
  document.getElementById("fStar").value = filter.star;
  document.getElementById("fSort").value = filter.sort;
  const map = {fStatus:"status", fStar:"star", fSort:"sort"};
  Object.keys(map).forEach(id=>document.getElementById(id).addEventListener("change", e=>{
    filter[map[id]] = e.target.value; clearSelection(true); drawSheet(); }));

  document.getElementById("allDone").onclick = async ()=>{
    if(await ask("Mark all solved?", `This ticks all ${n} questions in ${ex.name} as solved. Questions already marked keep their result.`, "Mark all solved")){
      snapshot("mark all solved");
      for(let i=0;i<n;i++){ if(!isDone(arr[i])) bumpStat(sc,1); arr[i]=setDone(arr[i],1); }
      afterBulk("All questions marked solved"); }
  };
  document.getElementById("allCorrect").onclick = async ()=>{
    if(await ask("Mark all correct?", `This marks all ${n} questions in ${ex.name} as solved and correct. Anything you had recorded as wrong will be overwritten.`, "Mark all correct")){
      snapshot("mark all correct");
      for(let i=0;i<n;i++){ if(!isDone(arr[i])) bumpStat(sc,1); arr[i]=setResult(setDone(arr[i],1),1); delete S.r[key(sc,ch.no,code)+"."+i]; }
      afterBulk("All questions marked correct"); }
  };
  document.getElementById("clearEx").onclick = async ()=>{
    if(await ask("Clear this exercise?", `This erases every tick, result, star and note in ${ex.name}.`, "Clear exercise", true)){
      snapshot("clear exercise");
      for(let i=0;i<n;i++){ if(isDone(arr[i])) bumpStat(sc,-1); arr[i]=0;
        delete S.n[key(sc,ch.no,code)+"."+i]; delete S.r[key(sc,ch.no,code)+"."+i]; }
      afterBulk("Exercise cleared"); }
  };
  const applyRange = ()=>{
    const msg = document.getElementById("rngMsg");
    const p = parseRange(document.getElementById("rngIn").value, n);
    if(p.error){ msg.className="msg bad"; msg.textContent = p.error; return; }
    const what = document.getElementById("rngWhat").value;
    snapshot(p.list.length+" questions changed");
    p.list.forEach(i=>{
      let v = arr[i]||0; const was = isDone(v);
      const qk = key(sc,ch.no,code)+"."+i;
      if(what==="done") v = setDone(v,1);
      else if(what==="undone"){ v = setResult(setDone(v,0),0); delete S.r[qk]; }
      else if(what==="correct"){ v = setResult(setDone(v,1),1); delete S.r[qk]; }
      else if(what==="wrong"){
        v = setResult(setDone(v,1),2);
        /* a bulk range cannot ask why each one was wrong, so it starts as Other */
        if(!S.r[qk]) S.r[qk] = {d:todayKey(), t:["oth"]};
      }
      else if(what==="cant"){ v = setResult(setDone(v,0),3); delete S.r[qk]; }
      else if(what==="flag") v = setFlag(v,1);
      else if(what==="unflag") v = setFlag(v,0);
      else if(what[0]==="s") v = setStars(v, Number(what[1]));
      arr[i]=v;
      if(!was && isDone(v)) bumpStat(sc,1);
      if(was && !isDone(v)) bumpStat(sc,-1);
    });
    msg.className="msg good";
    msg.textContent = p.list.length+" questions updated.";
    document.getElementById("rngIn").value = "";
    markDirty(); drawSheet(); refreshStats(); sweepFinishedHomework(); paintTabs();
    toastUndo(p.list.length+" questions updated");
  };
  document.getElementById("rngGo").onclick = applyRange;
  document.getElementById("rngIn").onkeydown = e=>{ if(e.key==="Enter") applyRange(); };

  drawSheet();
  if(focusQ !== null){
    const want = focusQ; focusQ = null;
    setTimeout(()=>{
      const row = document.querySelector(`.row[data-i="${want}"]`);
      if(!row) return;
      row.scrollIntoView({block:"center"});
      /* its own flash, so the row does not look drag-selected when it is not */
      row.classList.add("jump");
      setTimeout(()=>row.classList.remove("jump"), 1600);
    }, 40);
  }
}
function afterBulk(msg){ markDirty(); drawSheet(); refreshStats(); sweepFinishedHomework(); paintTabs(); toast(msg); }
function refreshStats(){ const el = document.getElementById("exStats"); if(el&&ctx) el.innerHTML = statLine(exStats(ctx.sc,ctx.ch,ctx.code)); }

function computeOrder(){
  const {arr,n,hw} = ctx;
  let idx=[]; for(let i=0;i<n;i++) idx.push(i);
  idx = idx.filter(i=>{
    const v=arr[i]||0, r=result(v);
    if(filter.status==="todo" && isDone(v)) return false;
    if(filter.status==="done" && !isDone(v)) return false;
    if(filter.status==="correct" && r!==1) return false;
    if(filter.status==="wrong" && r!==2) return false;
    if(filter.status==="cant" && r!==3) return false;
    if(filter.status==="flag" && !isFlag(v)) return false;
    if(filter.status==="hw" && !hw.has(i)) return false;
    if(filter.star!=="all" && stars(v)!==Number(filter.star)) return false;
    return true;
  });
  if(filter.sort==="starDesc") idx.sort((x,y)=>stars(arr[y]||0)-stars(arr[x]||0)||x-y);
  if(filter.sort==="starAsc")  idx.sort((x,y)=>stars(arr[x]||0)-stars(arr[y]||0)||x-y);
  return idx;
}
function drawSheet(){
  const sheet = document.getElementById("sheet"); if(!sheet||!ctx) return;
  ctx.hw = hwIndexSet(ctx.sc, ctx.ch.no, ctx.code);
  order = computeOrder();
  sheet.innerHTML = `<div class="row head"><span>Q.no</span><span>Solved</span><span>Result</span><span>Your note</span><span>Review</span><span>Rating</span><span>Saved</span></div>`
    + (order.length ? order.map(i=>rowHTML(i)).join("")
       : `<div class="empty">No questions match this filter. Change <strong>Show</strong> or <strong>Stars</strong> above.</div>`);
}
function rowHTML(i){
  const v = ctx.arr[i]||0, r = result(v), st = stars(v);
  const qk = key(ctx.sc,ctx.ch.no,ctx.code)+"."+i;
  const note = S.n[qk]||"", rec = S.r[qk];
  const cls = [isDone(v)?"done":"", r===3?"cant":"", sel.has(i)?"sel":"", ctx.hw.has(i)?"hw":""].filter(Boolean).join(" ");
  const why = r===2 ? `<button class="why" data-act="why" title="${rec&&rec.t.length?esc(rec.t.map(tagName).join(", ")):"Say what went wrong"}">${rec&&rec.t.length?rec.t.length+" TAG"+(rec.t.length>1?"S":""):"WHY?"}</button>` : "";
  return `<div class="row ${cls}" data-i="${i}">
    <span class="qn" title="Drag down to select several questions">${String(i+1).padStart(3,"0")}${ctx.hw.has(i)?'<i>HW</i>':""}</span>
    <span class="c-chk"><button class="check ${isDone(v)?"on":""}" data-act="done" aria-label="Question ${i+1} solved" aria-pressed="${!!isDone(v)}">✓</button></span>
    <span class="c-bub bub">
      <button class="c ${r===1?"on":""}" data-act="res" data-v="1" aria-label="Correct">✓</button>
      <button class="w ${r===2?"on":""}" data-act="res" data-v="2" aria-label="Wrong">✕</button>${why}</span>
    <span class="c-note"><input class="note" value="${esc(note)}" placeholder="Add a note" aria-label="Note for question ${i+1}"></span>
    <span class="c-flag marks">
      <button class="flag ${isFlag(v)?"on":""}" data-act="flag" aria-pressed="${!!isFlag(v)}">RETRY</button>
      <button class="cantb ${r===3?"on":""}" data-act="res" data-v="3" aria-pressed="${r===3}" title="Could not solve">STUCK</button></span>
    <span class="c-stars stars">${[1,2,3].map(k=>`<button class="${st>=k?"on":""}" data-act="star" data-v="${k}" aria-label="${k} star">★</button>`).join("")}</span>
    <span class="c-bm"><button class="bm ${(S.bm[qk]||[]).length?"on":""}" data-act="bm" title="Save to a collection" aria-label="Save question ${i+1} to a collection">${bmIcon((S.bm[qk]||[]).length)}</button></span>
  </div>`;
}
function redrawRow(i){ const el = document.querySelector(`.row[data-i="${i}"]`); if(el) el.outerHTML = rowHTML(i); }

document.addEventListener("click", e=>{
  if(!e.target.closest("#sheet") || !ctx) return;
  const btn = e.target.closest("[data-act]");
  if(!btn){
    const row = e.target.closest(".row:not(.head)");
    if(row && sel.size){ const i=+row.dataset.i; sel.has(i)?sel.delete(i):sel.add(i); redrawRow(i); paintSelbar(); }
    return;
  }
  const row = btn.closest(".row"), i = Number(row.dataset.i);
  const qk = key(ctx.sc,ctx.ch.no,ctx.code)+"."+i;
  let v = ctx.arr[i]||0;
  const act = btn.dataset.act, was = isDone(v);
  if(act==="why"){ openReasons(qk); return; }
  if(act==="bm"){ openBookmark(qk, ()=>drawSheet()); return; }
  if(act==="bm"){ openBookmark(qk, ()=>{ drawSheet(); refreshStats(); }); return; }
  if(act==="done"){ const now=!isDone(v); v=setDone(v,now); if(!now){ v=setResult(v,0); delete S.r[qk]; } }
  if(act==="res"){
    const w = Number(btn.dataset.v);
    if(result(v)===w){ v = setResult(v,0); if(w===2) delete S.r[qk]; }
    else{
      /* "could not solve" is the opposite of finishing it, so it does not tick Solved */
      v = setResult(setDone(v, w===3?0:1), w);
      if(w===2){ S.r[qk] = S.r[qk] || {d:todayKey(), t:[]}; }
      else delete S.r[qk];
    }
  }
  if(act==="flag") v = setFlag(v,!isFlag(v));
  if(act==="star"){ const w=Number(btn.dataset.v); v = setStars(v, stars(v)===w?0:w); }
  ctx.arr[i]=v;
  if(!was && isDone(v)) bumpStat(ctx.sc,1);
  if(was && !isDone(v)) bumpStat(ctx.sc,-1);
  redrawRow(i); markDirty(); refreshStats();
  if(act==="res" && Number(btn.dataset.v)===2 && result(v)===2 && !(S.r[qk].t||[]).length) openReasons(qk);
  if(isDone(v) && !was){ if(sweepFinishedHomework()) drawSheet(); }
  paintTabs();
});
document.addEventListener("input", e=>{
  if(!ctx || !e.target.classList.contains("note")) return;
  const row = e.target.closest(".row"); if(!row) return;
  const k = key(ctx.sc,ctx.ch.no,ctx.code)+"."+row.dataset.i;
  if(e.target.value) S.n[k]=e.target.value; else delete S.n[k];
  markDirty();
});

/* what went wrong — multi-select, editable later, custom options stick */
function openReasons(qk, after){
  const rec = S.r[qk] = S.r[qk] || {d:todayKey(), t:[]};
  const draw = ()=>{
    openModal(`<h3>What went wrong?</h3><p>Pick as many as apply. You can change this any time.</p>
      <div class="opts" id="opts">${tagList().map(t=>`

let drag = null;
document.addEventListener("pointerdown", e=>{
  if(!ctx || !e.target.closest("#sheet")) return;
  if(e.target.closest("button,input,select,a")) return;
  const row = e.target.closest(".row:not(.head)"); if(!row) return;
  drag = {anchor:Number(row.dataset.i), active:false, timer:null, x:e.clientX, y:e.clientY, cx:e.clientX, cy:e.clientY};
  if(e.pointerType!=="mouse") drag.timer = setTimeout(()=>{ if(drag) startDrag(); }, 350);
});
function startDrag(){
  drag.active = true; sel = new Set([drag.anchor]);
  const sh = document.getElementById("sheet");
  sh.style.touchAction="none"; sh.classList.add("dragging");
  drawSheet(); paintSelbar(); requestAnimationFrame(dragLoop);
}
function extendTo(x,y){
  const el = document.elementFromPoint(x,y);
  const row = el && el.closest && el.closest(".row:not(.head)");
  if(!row) return;
  const a = order.indexOf(drag.anchor), b = order.indexOf(Number(row.dataset.i));
  if(a<0||b<0) return;
  const next = new Set(order.slice(Math.min(a,b), Math.max(a,b)+1));
  if(next.size===sel.size && [...next].every(i=>sel.has(i))) return;
  sel = next;
  document.querySelectorAll("#sheet .row:not(.head)").forEach(r=>r.classList.toggle("sel", sel.has(+r.dataset.i)));
  paintSelbar();
}
function dragLoop(){
  if(!drag||!drag.active) return;
  const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--topbar-h"))||86;
  const h = window.innerHeight, edge = 56;
  let d = 0;
  if(drag.cy < top+edge) d = -Math.ceil((top+edge-drag.cy)/8);
  else if(drag.cy > h-edge) d = Math.ceil((drag.cy-(h-edge))/8);
  if(d){ window.scrollBy(0,d); extendTo(drag.cx, drag.cy); }
  requestAnimationFrame(dragLoop);
}
document.addEventListener("pointermove", e=>{
  if(!drag||!ctx) return;
  drag.cx=e.clientX; drag.cy=e.clientY;
  if(!drag.active){
    if(Math.abs(e.clientY-drag.y)+Math.abs(e.clientX-drag.x) < 6) return;
    if(e.pointerType==="mouse" && (e.buttons&1)) startDrag();
    else { clearTimeout(drag.timer); drag=null; }
    if(!drag||!drag.active) return;
  }
  e.preventDefault(); extendTo(e.clientX, e.clientY);
}, {passive:false});
function endDrag(){
  if(!drag) return;
  clearTimeout(drag.timer);
  const sh = document.getElementById("sheet");
  if(sh){ sh.style.touchAction=""; sh.classList.remove("dragging"); }
  drag = null;
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
function clearSelection(quiet){ sel = new Set(); if(!quiet) drawSheet(); paintSelbar(); }
function paintSelbar(){

document.getElementById("selbar").addEventListener("click", e=>{
  const b = e.target.closest("[data-s]"); if(!b) return;
  if(!ctx){ return hwBarAction(b.dataset.s); }
  const list = [...sel].sort((x,y)=>x-y), act = b.dataset.s;

    markDirty(); clearSelection(true); drawSheet(); paintTabs();

              s:ctx.sc, c:ctx.ch.no, e:ctx.code, r:toRange(list)});
    markDirty(); clearSelection(true); drawSheet(); paintTabs();
    toastUndo(list.length+" questions added to homework"); return;
  }
  snapshot(list.length+" questions changed");
  list.forEach(i=>{
    let v = ctx.arr[i]||0; const was = isDone(v);
    const qk = key(ctx.sc,ctx.ch.no,ctx.code)+"."+i;
    if(act==="done") v = setDone(v,1);
    if(act==="correct"){ v = setResult(setDone(v,1),1); delete S.r[qk]; }

  sweepFinishedHomework(); paintTabs();
  toastUndo(list.length+" questions updated");
});

function taskWhere(it){
  const bits = [];
  const sub = it.s && subjOf(it.s); if(sub) bits.push(sub.short);
  const mo = it.s && it.m && modOf(it.s, it.m); if(mo) bits.push(mo.name);
  const ch = it.s && it.c && chapOf(it.s, it.c); if(ch) bits.push(chTitle(ch));
  const ex = ch && it.e && exOf(it.s, ch, it.e); if(ex) bits.push(ex.name);
  return bits.join(" · ");
}

const qkOf = (it,i) => key(it.s,it.c,it.e)+"."+i;
function splitQk(qk){
  const dot = qk.lastIndexOf(".");
  const k = qk.slice(0,dot), i = Number(qk.slice(dot+1));
  return {s:k[0], c:k.slice(1,-1), e:k.slice(-1), i};
}
/* due date first, then whichever has more left to do */
function hwPriority(a,b){
  if(a.due && !b.due) return -1;
  if(!a.due && b.due) return 1;
  if(a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  const la = hwStats(a), lb = hwStats(b);
  return (lb.total-lb.done) - (la.total-la.done);
}
