        return opts.length ? `<optgroup label="${esc(srcShort(g))} — ${esc(g)}">${opts.map(p2=>`<option value="${esc(p2.k)}">${esc(chTitle(p2.ch))}</option>`).join("")}</optgroup>` : ""; }).join("");
      return `<div class="lk ${st}"><span class="lk-dot" title="${st==="ok"?"Linked by name":st==="fuzzy"?"Matched by a similar name":"No match"}"></span>
        <span class="lk-name" title="${esc(c.name)}">${esc(c.name)}</span>
        <span class="lk-chips">${chips || `<span class="lk-none">No matching chapter</span>`}</span>
        <span class="lk-act">${(S.ig.idmap||{})[c.id]?`<button class="lk-reset" data-linkreset="${esc(c.id)}" title="Back to the automatic match">↺</button>`:""}
          <select class="lk-add" data-addlink="${esc(c.id)}" title="Link another tracker chapter"><option value="">＋ Link</option>${free}</select></span></div>`;
    }).join("");
    links = `<section class="panel setsec" id="set-links">
      <div class="eyebrow">Chapter links</div><h2>Planner chapters and their tracker chapters</h2>
      <p class="sub">Matched by subject first, then by name. Each link shows where the tracker chapter comes from — a syllabus module or a reference book. A link is only a lookup, so Statistics can show your prep grade beside the chapter; nothing is copied between the two syllabuses.</p>
      <div class="lk-bar">
        <div class="seg">${["phy","chem","math"].map(sj=>`<button class="${setLinkSub===sj?"on":""}" data-linksub="${sj}">${({phy:"Physics",chem:"Chemistry",math:"Mathematics"})[sj]}${subStats[sj]?` <em>${subStats[sj]}</em>`:""}</button>`).join("")}</div>
        <div class="seg">${[["all","All"],["fuzzy","To check"],["none","Unmatched"]].map(([v,lb])=>`<button class="${setLinkFilter===v?"on":""}" data-linkfilter="${v}">${lb}${v!=="all"&&stats[v]?` <em>${stats[v]}</em>`:""}</button>`).join("")}</div>
      </div>
      <div class="lk-sum"><span><i class="lk-dot ok"></i>${stats.ok} linked by name</span><span><i class="lk-dot fuzzy"></i>${stats.fuzzy} to check</span><span><i class="lk-dot none"></i>${stats.none} unmatched</span></div>
      <div class="lk-list">${rows || `<div class="empty">Nothing here — every chapter in this filter is linked.</div>`}</div>
    </section>`;
  }

  /* exam deadlines */
  const ex = ASYAPI ? ASYAPI.exam() : {main:"", adv:""};
  const jee = `<section class="panel setsec" id="set-exams">
    <div class="eyebrow">Exam deadlines</div><h2>JEE Main and JEE Advanced</h2>
    <p class="sub">Both are deadlines in Statistics, running from your first day in the app (${esc(S.ig.joined||todayKey())}) and covering Physics, Chemistry and Mathematics. Their dates are the planner's exam dates — change either and the other follows.</p>
    <div class="hwrow" style="flex-wrap:wrap">
      <span class="blabel" style="margin:0">JEE Main</span><input class="tin" type="date" id="exMain" value="${esc(ex.main)}">
      <span class="blabel" style="margin:0">JEE Advanced</span><input class="tin" type="date" id="exAdv" value="${esc(ex.adv)}">
    </div></section>`;

  app.innerHTML = recBanner() + `<div class="pagehead"><div class="eyebrow">Settings</div><h1>Make it yours</h1>
      <p class="sub">For the whole app. The planner's own settings — routines, block types, prep grades — are under Asymptote → Settings.</p></div>
    <div class="setnav">${[["appearance","Appearance"],["planner","Study log → planner"],["links","Chapter links"],["exams","Exam deadlines"]].map(([id,l])=>`<a class="tbtn ${sec===id?"on":""}" href="#/settings/${id}">${l}</a>`).join("")}</div>
    ${appearance}${mapping}${links}${jee}`;
  if(sec){ const el = document.getElementById("set-"+sec); if(el) setTimeout(()=>el.scrollIntoView({block:"start"}), 30); }

  app.querySelectorAll("[data-lookpreset]").forEach(b=>b.onclick = ()=>{ lookPreset(b.dataset.lookpreset); viewSettings(); });
  app.querySelectorAll("[data-lookpal]").forEach(b=>b.onclick = ()=>{ lookSet({pal:b.dataset.lookpal}); viewSettings(); });
  app.querySelectorAll("[data-lookplan]").forEach(b=>b.onclick = ()=>{ lookSet({planPal:b.dataset.lookplan}); viewSettings(); });
  app.querySelectorAll("[data-look]").forEach(b=>b.onclick = ()=>{
    const [k,v] = b.dataset.look.split("|");
    lookSet({[k]: v==="true" ? true : v==="false" ? false : v}, k==="countdown" || k==="size"); viewSettings();
  });
  app.querySelectorAll("[data-actmap]").forEach(sel=>sel.onchange = ()=>{
    S.ig.actMap = S.ig.actMap || {}; S.ig.actMap[sel.dataset.actmap] = sel.value;
    markDirty(); plannerSync(true); toast("Saved — the planner is up to date");
  });
  app.querySelectorAll("[data-recv]").forEach(b=>b.onclick = ()=>{
    const cur = recvTypes() || [], id = b.dataset.recv;
    S.ig.recvTypes = cur.includes(id) ? cur.filter(x=>x!==id) : cur.concat([id]);
    markDirty(); plannerSync(true); viewSettings("planner"); toast("Saved — the planner is up to date");
  });
  const rr = document.getElementById("recvReset");
  if(rr) rr.onclick = ()=>{ S.ig.recvTypes = null; markDirty(); plannerSync(true); viewSettings("planner"); toast("Back to the default"); };
  app.querySelectorAll("[data-acttype]").forEach(sel=>sel.onchange = ()=>{
    S.ig.actType = S.ig.actType || {};
    if(sel.value) S.ig.actType[sel.dataset.acttype] = sel.value; else delete S.ig.actType[sel.dataset.acttype];
    markDirty(); plannerSync(true); toast("Saved — the planner is up to date");
  });
  app.querySelectorAll("[data-actmap]").forEach(sel=>sel.addEventListener("change", ()=>viewSettings("planner")));
  app.querySelectorAll("[data-linksub]").forEach(b=>b.onclick = ()=>{ setLinkSub = b.dataset.linksub; viewSettings("links"); });
  app.querySelectorAll("[data-linkfilter]").forEach(b=>b.onclick = ()=>{ setLinkFilter = b.dataset.linkfilter; viewSettings("links"); });
  const ov = id => { S.ig.idmap = S.ig.idmap || {}; return S.ig.idmap[id] = S.ig.idmap[id] || {add:[], del:[]}; };
  app.querySelectorAll("[data-unlink]").forEach(b=>b.onclick = ()=>{
    const [id,k] = b.dataset.unlink.split("|"), o = ov(id);
    o.add = o.add.filter(x=>x!==k); if(!o.del.includes(k)) o.del.push(k);
    PREP_CACHE = null; markDirty(); viewSettings("links");
  });
  app.querySelectorAll("[data-addlink]").forEach(sel=>sel.onchange = ()=>{
    if(!sel.value) return; const id = sel.dataset.addlink, o = ov(id);
    o.del = o.del.filter(x=>x!==sel.value); if(!o.add.includes(sel.value)) o.add.push(sel.value);
    PREP_CACHE = null; markDirty(); viewSettings("links");
  });
  app.querySelectorAll("[data-linkreset]").forEach(b=>b.onclick = ()=>{ delete S.ig.idmap[b.dataset.linkreset]; PREP_CACHE = null; markDirty(); viewSettings("links"); });
  const exSet = (id, w)=>{ const el = document.getElementById(id); if(el) el.onchange = ()=>{ if(!ASYAPI) return; ASYAPI.setExam(w, el.value); jeeSync(); toast(el.value ? "Date saved — the deadline follows" : "Date cleared"); }; };
  exSet("exMain","main"); exSet("exAdv","adv");
}

/* ============================================================
   34. OVERVIEW — where you stand today, on one screen
   ============================================================ */
function ovDayTotals(k){
  const min = S.log.filter(l=>dayKey(new Date(l[0]*60000))===k).reduce((a,l)=>a+l[1],0);
  const q = Object.values(S.stat[k]||{}).reduce((a,b)=>a+b,0);
  return {min, q};
}
function ovStreak(){
  const active = k => { const t = ovDayTotals(k); return t.min>0 || t.q>0; };
  const d = new Date(); if(!active(dayKey(d))) d.setDate(d.getDate()-1);
  let n = 0, guard = 0;
  while(active(dayKey(d)) && guard++ < 3650){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function hwLabel(it){
  const r = hwResolve(it);
  if(it.kind==="task") return it.title || "Task";
  if(it.kind==="back") return "Backlog · " + (r.ch ? chTitle(r.ch) : "chapter") + (r.ex ? " · "+r.ex.name : "");
  return (r.ch ? chTitle(r.ch) : "Missing chapter") + (r.ex ? " · "+r.ex.name : "") + (it.r ? " · Q"+it.r : "");
}
function viewOverview(){
  crumbs([{label:"Home",href:"#/"},{label:"Overview"}]);
  const k = todayKey(), t = ovDayTotals(k), g = S.goals.day || {q:40, h:4};
  const goalMin = Math.round((+g.h||0)*60), goalQ = +g.q||0;
  const pctOf = (v,goal) => goal ? Math.min(100, Math.round(v/goal*100)) : 0;
  const hm2 = m => Math.floor(m/60)+"h "+(m%60)+"m";
  /* countdowns */
  const days = d => Math.round((new Date(d+"T00:00:00") - new Date(k+"T00:00:00"))/86400000);
  const jee = S.dl.filter(d=>(d.id==="jee-main"||d.id==="jee-adv") && d.date>=k).sort((a,b)=>a.date<b.date?-1:1);
  const nt = ASYAPI ? ASYAPI.nextTest() : null;
  const cds = jee.map(d=>`<div class="ovcd"><b>${days(d.date)}</b><span>day${days(d.date)===1?"":"s"} to ${esc(d.name)}</span><small>${esc(d.date)}</small></div>`).join("")
    + (nt ? `<div class="ovcd test"><b>${days(nt.date)}</b><span>day${days(nt.date)===1?"":"s"} to ${esc(nt.title)}</span><small>${esc(nt.date)}${nt.start?" · "+esc(nt.start):""}</small></div>` : "");
  /* last seven days */
  const week = []; for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); const kk = dayKey(d); week.push({k:kk, d, ...ovDayTotals(kk)}); }
  const maxM = Math.max(30, ...week.map(w=>w.min));
  const strip = week.map(w=>`<div class="ovday ${w.k===k?"today":""}" title="${esc(w.k)}: ${hm2(w.min)}, ${w.q} questions">
      <i style="height:${Math.max(3, Math.round(w.min/maxM*56))}px"></i><span>${w.d.toLocaleDateString(undefined,{weekday:"narrow"})}</span></div>`).join("");
  /* the planner's day */
  const ag = ASYAPI ? ASYAPI.agenda() : null;
  const plan = !ag ? `<div class="hint">The planner is starting…</div>`
    : (ag.items.length ? `<div class="ovlist">${ag.items.slice(0,9).map(i=>`<div class="ovrow ${i.done?"done":""}"><i style="background:${esc(i.c||"var(--text-3)")}"></i>
        <span class="ovt">${esc(i.start||"—")}${i.end?"–"+esc(i.end):""}</span><span class="grow">${esc(i.title)}</span>${i.done?'<span class="tagx" style="color:var(--ok)">done</span>':""}</div>`).join("")}</div>`
      : `<div class="empty" style="padding:14px">Nothing planned today.</div>`)
      + `<div class="stats" style="margin-top:10px"><span><span class="k">planned</span> <b>${hm2(ag.planned||0)}</b></span><span><span class="k">studied</span> <b>${hm2(ag.studied||0)}</b></span>${ag.revToday?`<span><span class="k">revisions</span> <b>${ag.revDone}/${ag.revToday}</b></span>`:""}${ag.revDue?`<span><span class="k">reminders due</span> <b style="color:var(--flag)">${ag.revDue}</b></span>`:""}</div>`;
  /* homework */
  const hw = S.h.map(it=>({it, st:hwStats(it)})).filter(x=>x.st.done < x.st.total)
    .sort((a,b)=>(a.it.due||"9999")<(b.it.due||"9999")?-1:1);
  const hwDue = hw.filter(x=>x.it.due && x.it.due <= dayKey(new Date(Date.now()+2*86400000)));
  const hwHTML = hw.length ? `<div class="ovlist">${(hwDue.length?hwDue:hw).slice(0,6).map(x=>`<a class="ovrow" href="#/hw">
      <span class="grow">${esc(hwLabel(x.it))}</span><span class="tagx">${x.st.done}/${x.st.total}</span>${x.it.due?`<span class="due ${dueState(x.it.due)}">${esc(prettyDue(x.it.due))}</span>`:""}</a>`).join("")}</div>
      <div class="hint" style="margin-top:8px">${hw.length} list${hw.length===1?"":"s"} unfinished${hwDue.length?" · "+hwDue.length+" due within two days":""}.</div>`
    : `<div class="empty" style="padding:14px">All homework done.</div>`;
  /* weakest chapters */
  const ca = chapterAnalysis().rows.filter(r=>r.group==="weak").slice(0,3);
  const weak = ca.length ? `<div class="ovlist">${ca.map(r=>{ const pg = prepFor(r.sc, r.no);
      return `<a class="ovrow" href="#/${esc(r.sc)}/${esc(String(r.ch.mod))}/${esc(String(r.no))}"><i style="background:${r.c}"></i><span class="grow">${esc(chTitle(r.ch))} <span class="hint" style="margin:0">${esc(r.mod)}</span></span>
        <span class="tagx" style="color:${scaleColor(r.acc)}">${r.attempts?r.acc+"% correct":"—"}</span>${pg!=null?`<span class="tagx" style="color:${prepColor(pg)}" title="Your prep grade in the planner">prep ${pg.toFixed(1)}</span>`:""}</a>`; }).join("")}</div>`
    : `<div class="empty" style="padding:14px">No chapter is well below your average yet.</div>`;
  /* latest tests */
  const tests = [];
  (S.an.folders||[]).forEach(f=>{
    const done = (f.tests||[]).filter(tt=>AN_SUBS.some(s=>(+tt.subs[s].sc||0)!==0 || (+tt.subs[s].wr||0)>0));
    if(!done.length) return;
    const last = done[done.length-1], prev = done.length>1 ? done[done.length-2] : null;
    tests.push({f, t:last, sc:anScored(last), d: prev ? anScored(last)-anScored(prev) : null});
  });
  const testHTML = tests.length ? `<div class="ovlist">${tests.slice(0,4).map(x=>`<a class="ovrow" href="#/an/${esc(x.f.id)}/${esc(x.t.id)}">
      <span class="grow">${esc(x.t.name)} <span class="hint" style="margin:0">${esc(x.f.name)}</span></span><b>${x.sc}</b>
      ${x.d!=null?`<span class="tagx" style="color:${x.d>0?"var(--ok)":x.d<0?"var(--no)":"var(--text-3)"}">${x.d>0?"+":""}${x.d} vs previous</span>`:""}</a>`).join("")}</div>`
    : `<div class="empty" style="padding:14px">No test marks yet.</div>`;
  const streak = ovStreak();
  const effToday = ag && ag.effKnown ? Math.round(Math.min(ag.effMin, Math.max(t.min, ag.studied||0))) : null;
  const prodToday = ag && ag.prod != null ? ag.prod : null;
  app.innerHTML = recBanner() + `<div class="pagehead"><div class="eyebrow">Overview</div><h1>${esc(new Date().toLocaleDateString(undefined,{weekday:"long", day:"numeric", month:"long"}))}</h1>
      <p class="sub">Where you stand today, across the tracker and the planner.</p></div>

    <div class="grid g3">

/* ============================================================
   35. TO-DO — nested checklists with labels, on the Homework page
   ============================================================ */
function newTodo(){
  const labels = [["Create short notes","#a78bfa"],["Collect modules","#4cc9f0"],["Revise","#63e6be"],["Ask a doubt","#ffa94d"]];
  return {items:[], labels:labels.map(([n,c],i)=>({id:"l"+i, n, c})), hideDone:false};
}
let todoFilter = "", todoEdit = null;
const tdKids = id => S.todo.items.filter(x=>(x.parent||null)===(id||null));
function tdDesc(id){ const out = []; const walk = p => tdKids(p).forEach(c=>{ out.push(c); walk(c.id); }); walk(id); return out; }
function tdCount(id){ const d = tdDesc(id); return {done:d.filter(x=>x.done).length, all:d.length}; }
/* a parent is done exactly when everything under it is */
function tdSettle(id){
  let p = S.todo.items.find(x=>x.id===id), guard = 0;
  while(p && p.parent && guard++ < 50){
    const par = S.todo.items.find(x=>x.id===p.parent); if(!par) break;
    const kids = tdKids(par.id); par.done = kids.length>0 && kids.every(k=>k.done);
    p = par;
  }
}
function tdMatches(it){
  if(!todoFilter) return true;
  const hit = x => (x.labels||[]).includes(todoFilter);
  return hit(it) || tdDesc(it.id).some(hit);
}
function todoHTML(){
  const T = S.todo, open = T.items.filter(x=>!x.done).length;
  const lab = id => T.labels.find(l=>l.id===id);
  const row = (it, depth) => {
    if(T.hideDone && it.done && !tdDesc(it.id).some(x=>!x.done)) return "";
    if(!tdMatches(it)) return "";
    const kids = tdKids(it.id), c = kids.length ? tdCount(it.id) : null, isOpen = it.open !== false;
    const text = todoEdit===it.id
      ? `<input class="tin td-in" data-tdtext="${esc(it.id)}" value="${esc(it.t)}" placeholder="What needs doing?">`
      : `<span class="td-t" data-tdedit="${esc(it.id)}" title="Click to edit">${esc(it.t) || '<span class="hint" style="margin:0">(empty)</span>'}</span>`;
    return `<div class="td ${it.done?"done":""}" style="--d:${depth}">
      ${kids.length ? `<button class="td-car" data-tdopen="${esc(it.id)}" aria-label="${isOpen?"Fold":"Unfold"}">${isOpen?"▾":"▸"}</button>` : `<span class="td-car"></span>`}
      <button class="td-chk ${it.done?"on":""}" data-tdchk="${esc(it.id)}" aria-label="${it.done?"Mark not done":"Mark done"}">${it.done?"✓":""}</button>
      ${text}
      ${(it.labels||[]).map(id=>lab(id)).filter(Boolean).map(l=>`<span class="td-lab" style="--lc:${esc(l.c)}">${esc(l.n)}</span>`).join("")}
      ${c ? `<span class="td-n">${c.done}/${c.all}</span>` : ""}
      <span class="td-acts"><button class="pen" data-tdsub="${esc(it.id)}" title="Add a sub-item">＋</button><button class="pen" data-tdlab="${esc(it.id)}" title="Labels">🏷</button><button class="x" data-tddel="${esc(it.id)}" title="Delete">×</button></span>
    </div>${kids.length && isOpen ? kids.map(k=>row(k, depth+1)).join("") : ""}`;
  };
  const tops = tdKids(null);
  return `<div class="panel todo">
    <div class="td-add"><input class="tin" id="tdNew" placeholder="Add a to-do and press Enter — e.g. Make short notes for Rotation" style="flex:1;min-width:220px">
      <button class="tbtn primary" id="tdAdd">Add</button></div>
    <div class="hwrow" style="margin:10px 0 6px;flex-wrap:wrap">
      <button class="actbtn ${todoFilter?"":"on"}" data-tdfilter="">All</button>
      ${T.labels.map(l=>`<button class="actbtn ${todoFilter===l.id?"on":""}" data-tdfilter="${esc(l.id)}"><i style="background:${esc(l.c)}"></i>${esc(l.n)}</button>`).join("")}
      <button class="tbtn" id="tdLabels" title="Add, rename or delete labels">Edit labels</button>
      <span class="spacer"></span>
      <button class="tbtn ${T.hideDone?"on":""}" id="tdHide">${T.hideDone?"Showing open only":"Hide done"}</button>
    </div>
    <div class="td-list">${tops.length ? tops.map(t=>row(t,0)).join("") : `<div class="empty" style="padding:14px">Nothing on your list. Add something above — then <b>＋</b> on any item to put steps inside it.</div>`}</div>
    <div class="hint">${open} open · click a to-do to edit it · <b>Tab</b> while editing tucks it under the one above, <b>Shift+Tab</b> brings it back out · ticking a to-do ticks everything inside it.</div>
  </div>`;
}
function wireTodo(redraw){
  const T = S.todo, $ = id => document.getElementById(id);
  const add = (text, parent) => { const it = {id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), t:text, done:false, parent:parent||null, labels:[], open:true, at:Date.now()};
    if(todoFilter) it.labels.push(todoFilter);
    T.items.push(it); if(parent){ const p = T.items.find(x=>x.id===parent); if(p){ p.open = true; p.done = false; tdSettle(it.id); } } return it; };
  const nw = $("tdNew");
  const go = ()=>{ const v = nw.value.trim(); if(!v) return; snapshot("add a to-do"); add(v, null); markDirty(); redraw(); const n = $("tdNew"); n && n.focus(); };
  nw.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } };
  $("tdAdd").onclick = go;
  $("tdHide").onclick = ()=>{ T.hideDone = !T.hideDone; markDirty(); redraw(); };
  app.querySelectorAll("[data-tdfilter]").forEach(b=>b.onclick = ()=>{ todoFilter = b.dataset.tdfilter; redraw(); });
  app.querySelectorAll("[data-tdopen]").forEach(b=>b.onclick = ()=>{ const it = T.items.find(x=>x.id===b.dataset.tdopen); it.open = it.open===false; markDirty(); redraw(); });
  app.querySelectorAll("[data-tdchk]").forEach(b=>b.onclick = ()=>{
    const it = T.items.find(x=>x.id===b.dataset.tdchk); if(!it) return;
    snapshot(it.done?"untick a to-do":"tick a to-do");
    it.done = !it.done; tdDesc(it.id).forEach(x=>x.done = it.done); tdSettle(it.id);
    markDirty(); redraw();
  });
  app.querySelectorAll("[data-tdsub]").forEach(b=>b.onclick = ()=>{ snapshot("add a step"); const it = add("", b.dataset.tdsub); todoEdit = it.id; markDirty(); redraw(); });
  app.querySelectorAll("[data-tdedit]").forEach(sp=>sp.onclick = ()=>{ todoEdit = sp.dataset.tdedit; redraw(); });
  app.querySelectorAll("[data-tddel]").forEach(b=>b.onclick = async ()=>{
    const it = T.items.find(x=>x.id===b.dataset.tddel); if(!it) return;
    const n = tdDesc(it.id).length;
    if(n && !await ask("Delete this to-do?", `Everything inside it goes too — ${n} item${n>1?"s":""}. Undo brings it back.`, "Delete", true)){ redraw(); return; }
    snapshot("delete a to-do");
    const gone = new Set([it.id, ...tdDesc(it.id).map(x=>x.id)]);
    T.items = T.items.filter(x=>!gone.has(x.id)); if(it.parent) tdSettle(T.items.find(x=>x.parent===it.parent)?.id || it.parent);
    markDirty(); redraw(); toastUndo("Deleted");
  });
  app.querySelectorAll("[data-tdlab]").forEach(b=>b.onclick = ()=>openTodoLabels(b.dataset.tdlab, redraw));
  $("tdLabels").onclick = ()=>openLabelManager(redraw);
  const inp = app.querySelector(".td-in");
  if(inp){
    inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
    const it = T.items.find(x=>x.id===inp.dataset.tdtext);
    const done = keep=>{ const v = inp.value.trim(); todoEdit = null;
      if(!v){ T.items = T.items.filter(x=>x.id!==it.id && !tdDesc(it.id).some(d=>d.id===x.id)); }
      else it.t = v;
      markDirty(); if(keep!==false) redraw(); };
    inp.onkeydown = e=>{
      if(e.key==="Enter"){ e.preventDefault(); done(); }
      if(e.key==="Escape"){ e.preventDefault(); if(!it.t){ T.items = T.items.filter(x=>x.id!==it.id); } todoEdit = null; redraw(); }
      if(e.key==="Tab"){
        e.preventDefault(); it.t = inp.value;
        const sibs = tdKids(it.parent), i = sibs.indexOf(it);
        if(!e.shiftKey && i>0){ it.parent = sibs[i-1].id; sibs[i-1].open = true; }
        else if(e.shiftKey && it.parent){ const par = T.items.find(x=>x.id===it.parent); it.parent = par ? par.parent : null; }
        tdSettle(it.id); markDirty(); redraw();
      }
    };
    inp.onblur = ()=>{ if(todoEdit===it.id) setTimeout(()=>{ if(todoEdit===it.id) done(); }, 120); };
  }
}
function openTodoLabels(id, redraw){
  const it = S.todo.items.find(x=>x.id===id); if(!it) return;
  onEsc = ()=>{};
  const draw = ()=>{
    paintModal("tdlab", `<h3>Labels</h3><p>${esc(it.t||"This to-do")}</p>
      <div class="opts">${S.todo.labels.map(l=>`<div class="opt ${(it.labels||[]).includes(l.id)?"on":""}" data-tdl="${esc(l.id)}"><span class="bx">✓</span><i style="width:10px;height:10px;border-radius:99px;background:${esc(l.c)};display:inline-block;margin-right:8px"></i>${esc(l.n)}</div>`).join("")}</div>
      <div class="hwrow" style="margin-top:10px"><input class="tin" id="tdlNew" placeholder="New label, e.g. Make flashcards" style="flex:1"><button class="tbtn" id="tdlAdd">Add</button></div>
      <div class="acts"><button class="btn primary" id="tdlDone">Done</button></div>`);
    modal.querySelectorAll("[data-tdl]").forEach(o=>o.onclick = ()=>{
      const l = o.dataset.tdl; it.labels = it.labels || [];
      it.labels = it.labels.includes(l) ? it.labels.filter(x=>x!==l) : it.labels.concat([l]); markDirty(); draw(); });
    const addL = ()=>{ const v = modal.querySelector("#tdlNew").value.trim(); if(!v) return;
      const l = {id:"l"+Date.now().toString(36), n:v, c:PALETTE[S.todo.labels.length % PALETTE.length]}; S.todo.labels.push(l);
      it.labels = (it.labels||[]).concat([l.id]); markDirty(); draw(); };
    modal.querySelector("#tdlAdd").onclick = addL;
    modal.querySelector("#tdlNew").onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); addL(); } };
    modal.querySelector("#tdlDone").onclick = ()=>{ closeModal(); redraw(); };
  };
  draw();
}
function openLabelManager(redraw){
  onEsc = ()=>{};
  const draw = ()=>{
    paintModal("tdman", `<h3>To-do labels</h3><p>Rename, recolour or delete. Deleting a label only takes it off the to-dos that have it.</p>
      <div class="opts">${S.todo.labels.map(l=>`<div class="opt" style="cursor:default;align-items:center;gap:8px">
        <button class="td-sw" data-tdc="${esc(l.id)}" style="background:${esc(l.c)}" title="Change colour"></button>
        <input class="tin" data-tdn="${esc(l.id)}" value="${esc(l.n)}" style="flex:1">
        <button class="x" data-tdx="${esc(l.id)}" title="Delete label">×</button></div>`).join("") || `<div class="empty">No labels.</div>`}</div>
      <div class="hwrow" style="margin-top:10px"><input class="tin" id="tdmNew" placeholder="New label" style="flex:1"><button class="tbtn" id="tdmAdd">Add</button></div>
      <div class="acts"><button class="btn primary" id="tdmDone">Done</button></div>`);
    modal.querySelectorAll("[data-tdn]").forEach(i=>i.onchange = ()=>{ const l = S.todo.labels.find(x=>x.id===i.dataset.tdn); if(l && i.value.trim()){ l.n = i.value.trim(); markDirty(); } });
    modal.querySelectorAll("[data-tdc]").forEach(b=>b.onclick = ()=>{ const l = S.todo.labels.find(x=>x.id===b.dataset.tdc); const i = PALETTE.indexOf(l.c); l.c = PALETTE[(i+1) % PALETTE.length]; markDirty(); draw(); });
    modal.querySelectorAll("[data-tdx]").forEach(b=>b.onclick = ()=>{ const id = b.dataset.tdx;
      S.todo.labels = S.todo.labels.filter(x=>x.id!==id); S.todo.items.forEach(x=>{ x.labels = (x.labels||[]).filter(y=>y!==id); });
      if(todoFilter===id) todoFilter = ""; markDirty(); draw(); });
    const addL = ()=>{ const v = modal.querySelector("#tdmNew").value.trim(); if(!v) return;
      S.todo.labels.push({id:"l"+Date.now().toString(36), n:v, c:PALETTE[S.todo.labels.length % PALETTE.length]}); markDirty(); draw(); };
    modal.querySelector("#tdmAdd").onclick = addL;
    modal.querySelector("#tdmNew").onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); addL(); } };
    modal.querySelector("#tdmDone").onclick = ()=>{ closeModal(); redraw(); };
  };
  draw();
}

/* ============================================================
   36. A FLAME FOR THE STREAK — yellow at the start, red at two
   weeks, blue from thirty days on
   ============================================================ */
function flameHTML(n){
  const s = Math.min(n, 30);
  const h = s <= 15 ? 50 - 50*(s/15) : 360 - 145*((s-15)/15);
  const c1 = `hsl(${h.toFixed(0)} 100% 55%)`, c2 = `hsl(${h.toFixed(0)} 100% 68%)`, c3 = `hsl(${h.toFixed(0)} 100% 90%)`;
  return `<span class="flame ${n?"":"out"} ${n>=30?"max":""}" style="--f1:${c1};--f2:${c2};--f3:${c3}" title="${n}-day streak${n>=30?" — at its hottest":""}" aria-hidden="true">
    <i class="fl f1"></i><i class="fl f2"></i><i class="fl f3"></i><i class="sp s1"></i><i class="sp s2"></i><i class="sp s3"></i></span>`;
}

/* ============================================================
   37. PASTE A SCREENSHOT INTO FILES
   ============================================================ */
document.addEventListener("paste", e=>{
  if(typeof VIEW==="undefined" || VIEW.name!=="files") return;
  const items = [...((e.clipboardData && e.clipboardData.items) || [])].filter(i=>i.kind==="file" && /^image\//.test(i.type));
  if(!items.length) return;
  e.preventDefault();
  const now = new Date(), p2 = n=>String(n).padStart(2,"0");
  const stamp = `${now.getFullYear()}-${p2(now.getMonth()+1)}-${p2(now.getDate())} ${p2(now.getHours())}.${p2(now.getMinutes())}.${p2(now.getSeconds())}`;
  const files = items.map((i,k)=>{ const f = i.getAsFile(), ext = (f.type.split("/")[1]||"png").replace("jpeg","jpg");
    return new File([f], `Screenshot ${stamp}${items.length>1?" ("+(k+1)+")":""}.${ext}`, {type:f.type}); });
  fsUpload(files, VIEW.f || null);
});

/* ---------- leaving with something unfinished ----------
   Closing or reloading while a timer or speedrun is running, or before your
   latest changes are saved as a code or file, asks you to confirm first.
   Browsers only allow their own wording in that box, so if you choose to
   stay, the app says what it was about and offers the fix. */
function flushSave(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; try{ autoSave(); }catch(err){} } }
function leaveReason(){
  if(TIMER.running) return "timer";
  if(TIMER.sr && TIMER.sr.phase==="run") return "speedrun";
  if(S.dirty) return "unsaved";
  return null;
}
const storageWorks = ()=>{ try{ localStorage.setItem("qlog.probe","1"); localStorage.removeItem("qlog.probe"); return true; }catch(e){ return false; } };
function leaveNotice(why){
  const msg = {
    timer:"A timer is still running. Stop &amp; log it first, or the session won't be recorded.",
    speedrun:"A speedrun is still going. Finish it so it gets logged.",
    unsaved: storageWorks() ? "Your latest changes haven't been saved as a code or file yet. They're kept in this browser for now, but save a copy before you close the app."
                   : "This browser isn't letting the app store anything, so your changes exist only on this page. Save them as a code or file before you close it."
  }[why];
  onEsc = ()=>{};
  const head = {timer:"A timer is still running", speedrun:"A speedrun is still going", unsaved:"Your changes haven't been saved"}[why];
  openModal(`<h3>${head}</h3><p>${msg}</p>
    <div class="acts"><button class="btn" id="lvStay">Keep working</button>
      ${why==="unsaved" ? `<button class="btn primary" id="lvGo">Save now</button>` : `<button class="btn primary" id="lvGo">Go to the timer</button>`}</div>`);
  modal.querySelector("#lvStay").onclick = closeModal;
  modal.querySelector("#lvGo").onclick = ()=>{ closeModal(); if(why==="unsaved") openSave(); else location.hash = "#/study"; };
}
window.addEventListener("beforeunload", e=>{
  flushSave();
  const why = leaveReason(); if(!why) return;
  e.preventDefault(); e.returnValue = "Your changes haven't been saved.";
  /* this only ever runs if you chose to stay on the page */
  setTimeout(()=>leaveNotice(why), 600);
});
/* phones close tabs without asking: at least keep this browser's copy current */
window.addEventListener("pagehide", flushSave);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flushSave(); });
