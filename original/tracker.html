function drawHwTree(){
  const mount = document.getElementById("hwTree"); if(!mount) return;
  let html = "";
  if(!S.h.length){
    html = `<div class="empty">Nothing outstanding. Add a question range above, or switch to <strong>Something else</strong> for anything that is not questions.</div>`;
  } else if(S.hwSort === "pri"){
    html = S.h.slice().sort((a,b)=>((b.kind==="task")-(a.kind==="task")) || hwPriority(a,b))
      .map(it=>hwItemHTML(it,false,true)).join("");
  } else {
    /* anything that is not questions sits at the top, wherever it belongs */
    const backs = S.h.filter(it=>it.kind==="back")
      .sort((a,b)=>(a.due?0:1)-(b.due?0:1) || String(a.due||"").localeCompare(String(b.due||"")));
    if(backs.length) html += `<h3 class="sec" style="margin-top:0">Backlog (${backs.length})</h3>`
      + backs.map(it=>hwItemHTML(it,false)).join("");
    const tasks = S.h.filter(it=>it.kind==="task")
      .sort((a,b)=>(a.due?0:1)-(b.due?0:1) || String(a.due||"").localeCompare(String(b.due||"")));
    if(tasks.length) html += `<h3 class="sec"${backs.length?"":' style="margin-top:0"'}>To do (${tasks.length})</h3>`
      + tasks.map(it=>hwItemHTML(it,false)).join("");
    const qItems = S.h.filter(it=>it.kind!=="task" && it.kind!=="back");
    const tree = {};
    qItems.forEach(it=>{
      const r = hwResolve(it);
      const sK = it.s, mK = r.missing ? "?" : String(r.ch.mod), cK = String(it.c);
      ((((tree[sK]=tree[sK]||{})[mK]=tree[sK][mK]||{})[cK]=tree[sK][mK][cK]||[])).push(it);
    });
    if(qItems.length && (tasks.length || backs.length)) html += `<h3 class="sec">Questions</h3>`;
    const tw = k=>`<button class="twisty" data-t="${esc(k)}">${S.closed[k]?"▸":"▾"}</button>`;
    const order = Object.keys(tree).sort((a,b)=>a==="~"?-1:b==="~"?1:0);
    for(const sc of order){
      const sub = sc==="~" ? null : subjOf(sc), sk = "s:"+sc;
      let closed = false;
      if(sc !== "~"){
        html += `<div class="node">${tw(sk)}<span class="lv">Subject</span><span class="nm">${esc(sub?sub.name:"(removed)")}</span></div>`;
        if(S.closed[sk]) continue;
        html += `<div class="branch">`;
        closed = true;
      }
      for(const mk of Object.keys(tree[sc])){
        const mo = sub && sub.modules[mk], mkey = "m:"+sc+":"+mk;
        let mOpen = false;
        if(mk !== "~"){
          html += `<div class="node">${tw(mkey)}<span class="lv">Module</span><span class="nm">${esc(mo?mo.name:"Unknown module")}</span></div>`;
          if(S.closed[mkey]) continue;
          html += `<div class="branch">`; mOpen = true;
        }
        for(const ck of Object.keys(tree[sc][mk])){
          const ch = sc==="~" ? null : chapOf(sc,ck), ckey = "c:"+sc+":"+ck;
          let cOpen = false;
          if(ck !== "~"){
            const cst = ch ? chapterHwStats(sc, ck) : null;
            html += `<div class="node">${tw(ckey)}<span class="lv">Chapter</span><span class="nm">${esc(ch?chTitle(ch):"Chapter "+ck+" (removed)")}</span>
              ${cst&&cst.total?`<span class="rng" style="margin-left:auto">${cst.done}/${cst.total} homework done · ${cst.pct}%</span>`:""}</div>`;
            if(S.closed[ckey]) continue;
            html += `<div class="branch">`; cOpen = true;
          }
          /* anything that is not a question list reads first */
          tree[sc][mk][ck].slice().sort((a,b)=>(b.kind==="task")-(a.kind==="task"))
            .forEach(it=>{ html += hwItemHTML(it,false); });
          if(cOpen) html += `</div>`;
        }
        if(mOpen) html += `</div>`;
      }
      if(closed) html += `</div>`;
    }
  }
  if(S.hd.length){
    const fk = "fin";
    html += `<h3 class="sec"><button class="twisty" data-t="${fk}" style="margin-right:8px">${S.closed[fk]?"▸":"▾"}</button>Finished (${S.hd.length})</h3>`;
    if(!S.closed[fk]) html += S.hd.slice(0,40).map(it=>hwItemHTML(it,true)).join("");
  }
  mount.innerHTML = html;
}
function hwItemHTML(it, finished, showLoc){
  if(it.kind==="back"){
    const st = hwStats(it), r = st.r;
    const tracked = !!r.ex;
    const pct = st.total ? Math.round(st.done/st.total*100) : 0;
    const ds = it.due ? dueState(it.due) : "";
    const where = taskWhere(it);
    const label = it.title || (r.ex ? r.ex.name : "Backlog");
    return `<div class="hwitem ${finished||(!tracked&&it.done)?"fin":""} ${ds==="over"&&!finished?"late":""}">
      <div class="hwhead">
        ${tracked?`<span class="tagx" style="margin:0">Backlog</span>`
                 :`<button class="check ${it.done?"on":""}" data-task="${esc(it.id)}" aria-pressed="${!!it.done}" title="Mark done">✓</button>`}
        ${r.ex?`<a class="loc" href="#/${it.s}/${r.ch.mod}/${it.c}/${it.e}">${esc(label)}</a>`
              :`<span class="loc">${esc(label)}</span>`}
        ${where?`<span class="rng">${esc(where)}</span>`:""}
        ${it.due?`<span class="due ${finished?"":ds}">${esc(prettyDue(it.due))}</span>`:""}
        <span class="prog">${tracked?`${st.total-st.done} of ${st.total} left`:(it.done?"done":"to do")}</span>
        <button class="tbtn" data-hedit="${esc(it.id)}">Edit</button>
        ${finished?`<button class="x" data-restore="${it.id}" title="Put back">↩</button>`:""}
        <button class="x" data-del="${it.id}" title="Remove">×</button></div>
      ${tracked?`<div class="rail"><i style="width:${pct}%"></i></div>`:""}</div>`;
  }
  if(it.kind==="task"){
    const ds = it.due ? dueState(it.due) : "";
    const where = taskWhere(it);
    return `<div class="hwitem ${finished||it.done?"fin":""} ${ds==="over"&&!it.done?"late":""}">
      <div class="hwhead">
        <button class="check ${it.done?"on":""}" data-task="${esc(it.id)}" aria-pressed="${!!it.done}" title="Mark done">✓</button>
        <span class="loc" style="${it.done?"text-decoration:line-through;opacity:.7":""}">${esc(it.title)}</span>
        ${where?`<span class="rng">${esc(where)}</span>`:`<span class="rng">no location</span>`}
        ${it.due?`<span class="due ${finished?"":ds}">${esc(prettyDue(it.due))}</span>`:""}
        <span class="prog">${it.done?"done":"to do"}</span>
        <button class="tbtn" data-hedit="${esc(it.id)}">Edit</button>
        ${finished?`<button class="x" data-restore="${it.id}" title="Put back">↩</button>`:""}
        <button class="x" data-del="${it.id}" title="Remove">×</button></div></div>`;
  }
  const st = hwStats(it), r = st.r;
  if(r.missing) return `<div class="hwitem warnbox"><div class="hwhead">
    <span class="loc">This homework points somewhere that no longer exists</span>
    <button class="x" data-del="${it.id}" title="Remove">×</button></div>
    <div class="warntext">Questions ${esc(it.r)} — the chapter or exercise was removed.</div></div>`;
  const a = S.d[key(it.s,it.c,it.e)]||[];
  const chips = r.list.map(i=>{
    const v = a[i]||0, res = result(v);
    let cls = res===1?"c":res===2?"w":res===3?"x":isDone(v)?"d":"";
    if(hsel.has(qkOf(it,i))) cls += " sel";
    return `<button class="chip ${cls}" data-hw="${it.id}" data-i="${i}" data-qk="${qkOf(it,i)}"
      title="${isFlag(v)?"marked for review · ":""}${stars(v)?stars(v)+"★ · ":""}click to tick, double-click to edit">${i+1}</button>`;
  }).join("");
  const ds = it.due ? dueState(it.due) : "";
  const where = showLoc ? `${esc(subjOf(it.s)?subjOf(it.s).short:it.s)} · ${esc(r.ch.name)} · ` : "";
  return `<div class="hwitem ${finished?"fin":""} ${r.over?"warnbox":""} ${ds==="over"&&!finished?"late":""}">
    <div class="hwhead">
      <a class="loc" href="#/${it.s}/${r.ch.mod}/${it.c}/${it.e}">${where}${esc(r.ex.name)}</a>
      <span class="rng">Q ${esc(it.r)}</span>
      ${it.due?`<span class="due ${finished?"":ds}">${esc(prettyDue(it.due))}</span>`:""}
      ${finished?'<span class="due">finished</span>':""}
      <span class="prog">${st.done}/${st.total} done</span>
      <button class="tbtn" data-hedit="${esc(it.id)}">Edit</button>
      ${finished?`<button class="x" data-restore="${it.id}" title="Put back">↩</button>`:""}
      <button class="x" data-del="${it.id}" title="Remove">×</button></div>
    <div class="chips">${chips}</div>
    ${r.over?`<div class="warntext">${r.over} question${r.over>1?"s":""} in this range no longer exist — ${esc(r.ex.name)} now has ${r.n}.</div>`:""}</div>`;
}

/* toggling one question from a homework chip */
function toggleFromChip(qk){
  const q = splitQk(qk);
  const arr = arrFor(q.s, q.c, q.e, qCount(q.s, chapOf(q.s,q.c), q.e));
  const now = !isDone(arr[q.i]||0);
  arr[q.i] = setDone(arr[q.i]||0, now);
  if(!now){ arr[q.i] = setResult(arr[q.i],0); delete S.r[qk]; }
  bumpStat(q.s, now?1:-1);
  markDirty(); sweepFinishedHomework(); viewHomework(); paintTabs();
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-t]");
  if(t){ S.closed[t.dataset.t] = !S.closed[t.dataset.t]; drawHwTree(); return; }
  const del = e.target.closest("[data-del]");
  if(del){
    snapshot("remove homework");
    S.h = S.h.filter(x=>x.id!==del.dataset.del);
    S.hd = S.hd.filter(x=>x.id!==del.dataset.del);
    markDirty(); viewHomework(); paintTabs(); toastUndo("Homework removed"); return;
  }
  const res = e.target.closest("[data-restore]");
  if(res){
    snapshot("restore homework");
    const it = S.hd.find(x=>x.id===res.dataset.restore);
    if(it){ delete it.fin; it.keep = true; if(it.kind==="task") it.done = false; S.hd = S.hd.filter(x=>x!==it); S.h.push(it); }
    markDirty(); viewHomework(); paintTabs(); toastUndo("Put back into homework"); return;
  }
  const tk = e.target.closest("[data-task]");
  if(tk){
    const it = S.h.concat(S.hd).find(x=>x.id===tk.dataset.task); if(!it) return;
    it.done = !it.done;
    markDirty(); sweepFinishedHomework(); viewHomework(); paintTabs(); return;
  }
  const ed = e.target.closest("[data-hedit]");
  if(ed){ editHomework(ed.dataset.hedit); return; }
  const chip = e.target.closest("[data-hw]");
  if(chip){
    if(hsel.size){ const qk = chip.dataset.qk; hsel.has(qk)?hsel.delete(qk):hsel.add(qk); drawHwTree(); paintSelbar(); return; }
    /* held briefly so a double-click can cancel it and open the editor instead.
       A click on a different chip flushes the waiting one straight away, so
       ticking several chips quickly never drops any of them. */
    const qk = chip.dataset.qk;
    if(pendingTick){
      clearTimeout(pendingTick.timer);
      const prev = pendingTick; pendingTick = null;
      if(prev.qk !== qk) toggleFromChip(prev.qk);
    }
    pendingTick = {qk, timer:setTimeout(()=>{ pendingTick = null; toggleFromChip(qk); }, 230)};
  }
});
document.addEventListener("dblclick", e=>{
  const chip = e.target.closest("[data-hw]"); if(!chip) return;
  if(pendingTick){ clearTimeout(pendingTick.timer); pendingTick = null; }
  openQuestionEditor(chip.dataset.qk);
});

/* change what a homework item covers, and when it is due */
function editHomework(id){
  const it = S.h.concat(S.hd).find(x=>x.id===id); if(!it) return;
  const isQ = !it.kind;
  const r = hwResolve(it);
  const max = isQ && !r.missing ? r.n : 0;
  const label = isQ ? ((r.ex||{}).name || "homework")
              : it.kind==="back" ? (it.title || (r.ex||{}).name || "backlog")
              : it.title;
  onEsc = ()=>{};
  openModal(`<h3>Edit</h3><p>${esc(label)}</p>
    ${isQ?`<div class="block"><div class="blabel">Questions</div>
      <input type="text" id="ehr" value="${esc(it.r)}" placeholder="20-30, or 20-30, 45">
      <div class="hint">This exercise has ${max} questions.</div></div>`
     :`<div class="block"><div class="blabel">Name</div>
      <input type="text" id="ehTitle" value="${esc(it.title||"")}" ${it.kind==="back"&&r.ex?'placeholder="Leave blank to use the exercise name"':""}></div>`}
    <div class="block"><div class="blabel">Due date</div>
      <div class="hwrow">
        <input class="tin" type="date" id="ehDue" value="${esc(it.due||"")}">
        ${it.due?`<button class="tbtn" id="ehClear">Remove the due date</button>`:""}
      </div>
      <div class="hint">${it.due?"":"None set — pick one from the calendar if you want."}</div></div>
    <div class="msg bad" id="ehMsg"></div>
    <div class="acts"><button class="btn" id="ehNo">Cancel</button>
    <button class="btn primary" id="ehYes">Save</button></div>`);
  const clear = modal.querySelector("#ehClear");
  if(clear) clear.onclick = ()=>{ modal.querySelector("#ehDue").value = ""; };
  modal.querySelector("#ehNo").onclick = ()=>{ closeModal(); viewHomework(); };
  modal.querySelector("#ehYes").onclick = ()=>{
    const msg = modal.querySelector("#ehMsg");
    if(isQ){
      const parsed = parseRange(modal.querySelector("#ehr").value, max);
      if(parsed.error){ msg.textContent = parsed.error; return; }
      snapshot("edit homework");
      it.r = toRange(parsed.list);
    } else {
      const t = modal.querySelector("#ehTitle").value.trim();
      if(!t && !(it.kind==="back" && r.ex)){ msg.textContent = "Give it a name."; return; }
      snapshot("edit homework");
      if(t) it.title = t; else delete it.title;
    }
    const due = modal.querySelector("#ehDue").value;
    if(due) it.due = due; else delete it.due;
    delete it.keep;
    markDirty(); closeModal(); sweepFinishedHomework(); viewHomework(); paintTabs(); toastUndo("Homework updated");
  };
}

/* full editor for one question, reachable from homework */
function openQuestionEditor(qk){
  const q = splitQk(qk);
  const ch = chapOf(q.s,q.c); if(!ch) return;
  const ex = exOf(q.s,ch,q.e);
  const arr = arrFor(q.s,q.c,q.e,qCount(q.s,ch,q.e));
  const draw = ()=>{
    const v = arr[q.i]||0, r = result(v), rec = S.r[qk];
    openModal(`<h3>Question ${q.i+1}</h3><p>${esc(chTitle(ch))} · ${esc(ex?ex.name:"")}</p>
      <div class="block"><div class="blabel">Result</div>
        <div class="hwrow">
          <button class="tbtn ${r===1?"on":""}" data-q="1">Correct</button>
          <button class="tbtn ${r===2?"on":""}" data-q="2">Wrong</button>
          <button class="tbtn ${r===3?"on":""}" data-q="3">Could not solve</button>
          <button class="tbtn ${r===0?"on":""}" data-q="0">Not marked</button></div>
        ${r===2?`<div class="hwrow" style="margin-top:10px">
          <button class="tbtn" id="qWhy">${rec&&rec.t.length?esc(rec.t.map(tagName).join(", ")):"Say what went wrong"}</button></div>`:""}
      </div>
      <div class="block"><div class="blabel">Flags</div>
        <div class="hwrow">
          <button class="tbtn ${isDone(v)?"on":""}" data-q="done">${isDone(v)?"Solved":"Not solved"}</button>
          <button class="tbtn ${isFlag(v)?"on":""}" data-q="flag">Retry / review</button>
          <span class="stars" style="margin-left:6px">${[1,2,3].map(k=>`<button class="${stars(v)>=k?"on":""}" data-star="${k}">★</button>`).join("")}</span>
        </div></div>
      <div class="block"><div class="blabel">Note</div>
        <input type="text" id="qNote" value="${esc(S.n[qk]||"")}" placeholder="Add a note">
        <div class="mprev" id="qNotePrev" hidden></div>
        <div class="mhint">${MATH_HINT}</div></div>
      <div class="block"><button class="tbtn" id="qBm">${bmIcon((S.bm[qk]||[]).length)} Save to a collection</button></div>
      <div class="block"><div class="blabel">Collections</div>
        <button class="tbtn" id="qBm">${bmIcon((S.bm[qk]||[]).length)} ${(S.bm[qk]||[]).length?"Saved in "+(S.bm[qk]||[]).length:"Save to a collection"}</button></div>
      <div class="acts"><button class="btn primary" id="qDone">Done</button></div>`);
    modal.querySelectorAll("[data-q]").forEach(b=>b.onclick = ()=>{
      let v = arr[q.i]||0; const was = isDone(v);
      const a = b.dataset.q;
      if(a==="done"){ const now=!isDone(v); v=setDone(v,now); if(!now){ v=setResult(v,0); delete S.r[qk]; } }
      else if(a==="flag") v = setFlag(v,!isFlag(v));
      else{
        const w = Number(a);
        v = w===0 ? setResult(v,0) : setResult(setDone(v, w===3?0:1), w);
        if(w===2) S.r[qk] = S.r[qk]||{d:todayKey(), t:[]}; else delete S.r[qk];
      }
      arr[q.i]=v;
      if(!was && isDone(v)) bumpStat(q.s,1);
      if(was && !isDone(v)) bumpStat(q.s,-1);
      markDirty(); draw();
    });
    modal.querySelectorAll("[data-star]").forEach(b=>b.onclick = ()=>{
      const w = Number(b.dataset.star);
      arr[q.i] = setStars(arr[q.i]||0, stars(arr[q.i]||0)===w?0:w);
      markDirty(); draw();
    });
    wireMathPreview("qNote", "qNotePrev");
    const bmb = modal.querySelector("#qBm");
    if(bmb) bmb.onclick = ()=>openBookmark(qk, draw);
    const why = modal.querySelector("#qWhy");
    if(why) why.onclick = ()=>{ openReasons(qk, draw); };
    modal.querySelector("#qNote").oninput = e=>{
      if(e.target.value) S.n[qk] = e.target.value; else delete S.n[qk];
      markDirty();
    };
    modal.querySelector("#qDone").onclick = ()=>{
      closeModal(); sweepFinishedHomework();
      if(ctx) drawSheet(); else viewHomework();
      paintTabs();
    };
  };
  onEsc = ()=>{ sweepFinishedHomework(); if(ctx) drawSheet(); else viewHomework(); paintTabs(); };
  draw();
}

/* drag across chips */
document.addEventListener("pointerdown", e=>{
  if(ctx) return;
  const chip = e.target.closest("[data-hw]"); if(!chip) return;
  const box = chip.closest(".chips");
  hdrag = {box, anchor:chip.dataset.qk, active:false, timer:null, x:e.clientX, y:e.clientY};
  if(e.pointerType!=="mouse") hdrag.timer = setTimeout(()=>{ if(hdrag) startHDrag(); }, 350);
});
function startHDrag(){
  hdrag.active = true;
  if(pendingTick){ clearTimeout(pendingTick.timer); pendingTick = null; }
  hsel = new Set([hdrag.anchor]);
  hdrag.box.style.touchAction = "none";
  /* paint the chips directly rather than redrawing the tree, which would
     detach the container the drag is tracking */
  hdrag.box.querySelectorAll("[data-hw]").forEach(c=>c.classList.toggle("sel", hsel.has(c.dataset.qk)));
  paintSelbar();
}
function hExtend(x,y){
  const el = document.elementFromPoint(x,y);
  const chip = el && el.closest && el.closest("[data-hw]");
  if(!chip || chip.closest(".chips") !== hdrag.box) return;
  const all = [...hdrag.box.querySelectorAll("[data-hw]")].map(c=>c.dataset.qk);
  const a = all.indexOf(hdrag.anchor), b = all.indexOf(chip.dataset.qk);
  if(a<0||b<0) return;
  const next = new Set(all.slice(Math.min(a,b), Math.max(a,b)+1));
  if(next.size===hsel.size && [...next].every(k=>hsel.has(k))) return;
  hsel = next;
  hdrag.box.querySelectorAll("[data-hw]").forEach(c=>c.classList.toggle("sel", hsel.has(c.dataset.qk)));
  paintSelbar();
}
document.addEventListener("pointermove", e=>{
  if(!hdrag || ctx) return;
  if(!hdrag.active){
    if(Math.abs(e.clientY-hdrag.y)+Math.abs(e.clientX-hdrag.x) < 6) return;
    if(e.pointerType==="mouse" && (e.buttons&1)) startHDrag();
    else { clearTimeout(hdrag.timer); hdrag=null; }
    if(!hdrag||!hdrag.active) return;
  }
  e.preventDefault(); hExtend(e.clientX, e.clientY);
}, {passive:false});
function endHDrag(){
  if(!hdrag) return;
  clearTimeout(hdrag.timer);
  if(hdrag.box) hdrag.box.style.touchAction = "";
  hdrag = null;
}
document.addEventListener("pointerup", endHDrag);
document.addEventListener("pointercancel", endHDrag);

function paintHwBar(bar){
  bar.hidden = false;
  bar.innerHTML = `<span class="n">${hsel.size} selected</span>
    <button class="tbtn" data-s="done">Mark solved</button>
    <button class="tbtn" data-s="correct">Correct</button>
    <button class="tbtn" data-s="wrong">Wrong</button>
    <button class="tbtn" data-s="cant">Stuck</button>
    <button class="tbtn" data-s="flag">Review</button>
    <button class="tbtn" data-s="undone">Not solved</button>
    <button class="tbtn" data-s="unhw">Remove from homework</button>
    <button class="tbtn" data-s="clear">Clear</button>`;
}
function hwBarAction(act){
  if(act==="clear"){ hsel = new Set(); drawHwTree(); paintSelbar(); return; }
  if(act==="unhw"){
    snapshot("remove from homework");
    const n = removeQsFromHomework([...hsel]);
    hsel = new Set(); markDirty(); viewHomework(); paintTabs();
    toastUndo(n ? "Taken out of "+n+" homework list"+(n>1?"s":"") : "None of those were in homework");
    return;
  }
  if(act==="unhw"){
    snapshot("remove from homework");
    const res = removeFromHomework([...hsel]);
    hsel = new Set();
    markDirty(); viewHomework(); paintTabs();
    toastUndo(res.touched+" questions taken out of homework");
    return;
  }
  snapshot(hsel.size+" questions changed");
  [...hsel].forEach(qk=>{
    const q = splitQk(qk);
    const arr = arrFor(q.s,q.c,q.e,qCount(q.s,chapOf(q.s,q.c),q.e));
    let v = arr[q.i]||0; const was = isDone(v);
    if(act==="done") v = setDone(v,1);
    if(act==="undone"){ v = setResult(setDone(v,0),0); delete S.r[qk]; }
    if(act==="correct"){ v = setResult(setDone(v,1),1); delete S.r[qk]; }
    if(act==="wrong"){ v = setResult(setDone(v,1),2); S.r[qk] = S.r[qk]||{d:todayKey(), t:[]}; }
    if(act==="cant"){ v = setResult(setDone(v,0),3); delete S.r[qk]; }
    if(act==="flag") v = setFlag(v,1);
    arr[q.i]=v;
    if(!was && isDone(v)) bumpStat(q.s,1);
    if(was && !isDone(v)) bumpStat(q.s,-1);
  });
  const n = hsel.size;
  hsel = new Set();
  markDirty(); sweepFinishedHomework(); viewHomework(); paintTabs();
  toastUndo(n+" questions updated");
}

/* ============================================================
   12. STUDY LOG
   ============================================================ */
const HARD_STOP = 20*3600;         /* the timer gives up after 20 hours */
const NUDGE = 2*3600;              /* endless mode suggests a break every 2 hours */
/* Elapsed time is read from the clock, never counted in ticks: background tabs
   get their timers throttled, so tick counting loses minutes. acc holds the
   seconds banked before the current run, since is when the current run began. */
const TIMER = {running:false, mode:"focus", endless:false, left:25*60, total:25*60,
               up:0, nudged:0, acc:0, since:null, phaseStart:null,
               act:null, dl:null, tick:null};
function elapsedSec(){
  return Math.floor(TIMER.acc + (TIMER.running && TIMER.since ? (Date.now()-TIMER.since)/1000 : 0));
}
function beginPhase(seconds){
  TIMER.total = seconds; TIMER.acc = 0; TIMER.since = null;
  TIMER.up = 0; TIMER.nudged = 0; TIMER.left = seconds; TIMER.phaseStart = null;
}
function fmtClock(s){
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return h ? h+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")
           : m+":"+String(sec).padStart(2,"0");
}
function activityColor(id){
  const sub = subjOf(id); if(sub) return sub.accent;
  const a = actList().find(a=>a.id===id); if(a) return a.c;
  return id==="sr" ? "#ff5f6d" : "#7aa2ff";
}
function activityName(id){
  const sub = subjOf(id); if(sub) return sub.name;
  const a = actList().find(a=>a.id===id); if(a) return a.n;
  return id==="sr" ? "Speedrun" : "Study";   /* sessions logged before it was removed */
}
function allActivities(){
  return TREE.order.map(sc=>({id:sc, n:subjOf(sc).name, c:subjOf(sc).accent}))
    .concat(actList().map(a=>({id:a.id, n:a.n, c:a.c})));
}
let audioCtx = null;
function chime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    [880,1320].forEach((f,k)=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      const t0 = audioCtx.currentTime + k*0.18;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0+0.55);
    });
  }catch(e){}
}
function logSession(actId, minutes, dlId, whenMin, speedrun){
  if(!actId || minutes < 1) return;
  const row = [whenMin!==undefined?whenMin:Math.floor(Date.now()/60000) - minutes, minutes, actId];
  if(dlId || speedrun) row.push(dlId||null);
  if(speedrun) row.push(1);
  S.log.push(row); markDirty();
}
/* recompute from the clock; safe to call as often as we like */
function syncTimer(){
  const e = elapsedSec();
  if(TIMER.endless){
    TIMER.up = e; TIMER.left = 0;
    if(!TIMER.running) return;
    if(e >= HARD_STOP){ toast("20 hours — stopping and logging"); stopTimer(); return; }
    if(e - TIMER.nudged >= NUDGE){
      TIMER.nudged = Math.floor(e/NUDGE)*NUDGE;
      if(S.pom.chime!=="never") chime();
      toast("That is "+Math.floor(e/3600)+" hours straight — worth a break");
    }
    return;
  }
  TIMER.up = e;

function phaseEnd(){
  const wasFocus = TIMER.mode==="focus";
  const started = TIMER.phaseStart;
  if(wasFocus) logSession(TIMER.act, Math.round(TIMER.total/60), TIMER.dl,
                          started ? Math.floor(started/60000) : undefined);
  const ch = S.pom.chime;
  if(ch==="both" || (wasFocus&&ch==="focus") || (!wasFocus&&ch==="break")) chime();
  TIMER.mode = wasFocus ? "brk" : "focus";
  beginPhase((TIMER.mode==="focus" ? S.pom.focus : S.pom.brk)*60);
  const carryOn = wasFocus ? S.pom.autoBrk : S.pom.autoFocus;
  if(carryOn){ TIMER.since = Date.now(); TIMER.phaseStart = Date.now(); }
  else { TIMER.running = false; clearInterval(TIMER.tick); TIMER.tick = null; }
  if(VIEW.name==="study") viewStudy();
  paintTabs();
  toast(wasFocus ? (carryOn?"Focus done — break started":"Focus done — take a break")
                 : (carryOn?"Break over — focus started":"Break over — back to it"));
}

let statView = {mode:"month", anchor:new Date(), from:"", to:"", dl:"",
  heat:{days:30, subs:null, metric:"time"}, line:{days:30, hidden:new Set(), dl:"", metric:"time"},
  spider:{mode:"subjects", subj:"", chapters:null, metric:"pct"}};
function periodRange(){
  const a = new Date(statView.anchor); a.setHours(0,0,0,0);
  if(statView.mode==="day") return {from:a, to:a, label:a.toDateString()};
  if(statView.mode==="week"){
    const s = new Date(a); s.setDate(a.getDate()-((a.getDay()+6)%7));
    const e = new Date(s); e.setDate(s.getDate()+6);
    return {from:s, to:e, label:"Week of "+s.toDateString()};
  }
  if(statView.mode==="range"){
    const f = statView.from ? new Date(statView.from+"T00:00:00") : a;
    const t = statView.to ? new Date(statView.to+"T00:00:00") : a;
    return f<=t ? {from:f, to:t, label:dayKey(f)+" to "+dayKey(t)}
                : {from:t, to:f, label:dayKey(t)+" to "+dayKey(f)};
  }
  if(statView.mode==="deadline") return deadlineRange(statView.dl, a);
  const s = new Date(a.getFullYear(), a.getMonth(), 1), e = new Date(a.getFullYear(), a.getMonth()+1, 0);
  return {from:s, to:e, label:s.toLocaleString(undefined,{month:"long", year:"numeric"})};
}
function dlStart(d){ return d.start || d.made || d.date; }
function deadlineRange(id, fallback){
  const a = fallback || new Date();
  const d = S.dl.find(x=>x.id===id);
  if(!d) return {from:a, to:a, label:"No deadline chosen"};
  const f = new Date(dlStart(d)+"T00:00:00");
  let t = new Date(d.date+"T00:00:00");
  if(t < f) t = f;
  return {from:f, to:t, label:d.name, subs:d.subs&&d.subs.length?new Set(d.subs):null, dlId:id};
}
/* the equivalent stretch immediately before this one, for change-over-time */
function prevRange(R, mode){
  if(mode==="month"){
    const f = new Date(R.from); f.setMonth(f.getMonth()-1);
    return {from:new Date(f.getFullYear(),f.getMonth(),1), to:new Date(f.getFullYear(),f.getMonth()+1,0)};
  }
  const days = Math.round((R.to-R.from)/86400000)+1;
  const t = new Date(R.from); t.setDate(t.getDate()-1);
  const f = new Date(t); f.setDate(t.getDate()-days+1);
  return {from:f, to:t};
}
const inRange = (k,from,to) => k >= dayKey(from) && k <= dayKey(to);
/* the first day anything at all was recorded */
function firstEntryDay(){
  let best = null;
  S.log.forEach(l=>{ const k = dayKey(new Date(l[0]*60000)); if(!best || k < best) best = k; });
  Object.keys(S.stat).forEach(k=>{ if(!best || k < best) best = k; });
  Object.keys(S.r).forEach(qk=>{ const d = S.r[qk].d; if(d && (!best || d < best)) best = d; });
  return best;
}
/* averages should not be spread over days that predate the app */
function clampFrom(from){
  const f = firstEntryDay(); if(!f) return from;
  const fd = new Date(f+"T00:00:00");
  return from < fd ? fd : from;
}
/* averages should not be diluted by days before you ever opened the app */
function firstDataDay(){
  let first = null;
  const see = k => { if(k && (!first || k < first)) first = k; };
  S.log.forEach(l=>see(dayKey(new Date(l[0]*60000))));
  Object.keys(S.stat).forEach(see);
  Object.keys(S.r).forEach(qk=>see(S.r[qk].d));
  return first;
}

/* one place that turns a date range into numbers, shared by Statistics and Goals */
function computeMetrics(from, to, subs, dlId){
  const mins = {};
  const sessions = S.log.filter(l=>{
    if(subs && !subs.has(l[2]) && !(dlId && l[3]===dlId)) return false;
    return inRange(dayKey(new Date(l[0]*60000)), from, to);
  });
  sessions.forEach(l=>{ mins[l[2]] = (mins[l[2]]||0) + l[1]; });
  const solved = {};
  Object.keys(S.stat).forEach(k=>{ if(!inRange(k,from,to)) return;
    Object.keys(S.stat[k]).forEach(s=>{ if(subs && !subs.has(s)) return; solved[s]=(solved[s]||0)+S.stat[k][s]; }); });
  const wrongTags = {}; let wrongCount = 0;
  Object.keys(S.r).forEach(qk=>{
    const rec = S.r[qk];
    if(!rec.d || !inRange(rec.d,from,to)) return;
    if(subs && !subs.has(qk[0])) return;
    wrongCount++;
    if(!rec.t.length) wrongTags["__none"]=(wrongTags["__none"]||0)+1;
    rec.t.forEach(t=>wrongTags[t]=(wrongTags[t]||0)+1);
  });
  const totalMin = Object.values(mins).reduce((a,b)=>a+b,0);
  const totalQ = Object.values(solved).reduce((a,b)=>a+b,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const endReal = to > today ? today : to;
  const first = firstDataDay();
  let startReal = from;
  if(first){ const f = new Date(first+"T00:00:00"); if(f > startReal) startReal = f; }
  const spanDays = Math.max(1, Math.round((endReal-startReal)/86400000)+1);
  const dayHas = {};
  sessions.forEach(l=>{ dayHas[dayKey(new Date(l[0]*60000))] = true; });
  return {mins, solved, sessions, totalMin, totalQ, wrongCount, wrongTags, spanDays,
          activeDays: Object.keys(dayHas).length,
          longest: sessions.reduce((m,l)=>Math.max(m,l[1]),0),
          avgSession: sessions.length ? Math.round(totalMin/sessions.length) : 0,
          missRate: totalQ ? Math.round(wrongCount/totalQ*1000)/10 : 0};
}
const hm = m => Math.floor(m/60)+"h "+Math.round(m%60)+"m";
function minutesByDay(subs){
  const m = {};
  S.log.forEach(l=>{
    if(subs && !subs.has(l[2]) && !(l[3] && l[3]===statView.dl)) return;
    const k = dayKey(new Date(l[0]*60000));
    (m[k] = m[k]||{})[l[2]] = (m[k][l[2]]||0) + l[1];
  });
  return m;
}
function arcPath(cx,cy,r,a0,a1){
  const p = a=>[cx+r*Math.cos(a), cy+r*Math.sin(a)];
  const [x0,y0]=p(a0), [x1,y1]=p(a1);
  return `M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1} Z`;
}
function bars(data, unit){
  if(!data.length) return `<div class="empty" style="padding:18px">Nothing recorded in this period.</div>`;
  const max = Math.max.apply(null, data.map(d=>d.v)) || 1;
  return `<div class="chartrow"><div class="lg" style="width:100%">${data.map(d=>`
    <div style="display:block">
      <div style="display:flex;align-items:center;gap:8px"><i style="background:${d.c}"></i>${esc(d.n)}<b>${d.v}${unit||""}</b></div>
      <div class="rail" style="margin-top:5px"><i style="width:${Math.round(d.v/max*100)}%;background:${d.c}"></i></div>
    </div>`).join("")}</div></div>`;
}
function pie(data, size, unit){
  const shown = data.filter(d=>d.v > 0);
  const total = shown.reduce((a,d)=>a+d.v,0);
  if(!total) return `<div class="empty" style="padding:18px">Nothing recorded in this period.</div>`;
  const r = size/2 - 2;
  let body;
  if(shown.length === 1){
    /* a single slice is the whole circle — an arc from a point back to itself
       draws nothing, so use a plain circle instead */
    body = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="${shown[0].c}"/>`;
  } else {
    let a0 = -Math.PI/2; body = "";
    shown.forEach(d=>{
      const a1 = a0 + (d.v/total)*Math.PI*2;
      body += `<path d="${arcPath(size/2,size/2,r,a0,a1)}" fill="${d.c}" stroke="var(--ink-2)" stroke-width="2"/>`;
      a0 = a1;
    });
  }
  const hole = size*0.28;
  return `<div class="chartrow">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">${body}
      <circle cx="${size/2}" cy="${size/2}" r="${hole}" fill="var(--ink-2)"/>
      <text x="${size/2}" y="${size/2+5}" text-anchor="middle" fill="var(--text)" font-size="15" font-family="ui-monospace,monospace">${total}${unit||""}</text></svg>
    <div class="lg">${shown.map(d=>`<div><i style="background:${d.c}"></i>${esc(d.n)}<b>${d.v}${unit||""} · ${Math.round(d.v/total*100)}%</b></div>`).join("")}</div></div>`;
}
function viewStats(){
  crumbs([{label:"Home",href:"#/"},{label:"Statistics"}]);
  const R = periodRange();
  const {from,to,label} = R, subs = R.subs || null;
  const byDay = minutesByDay(subs);

  /* calendar */
  let cal = "";
  const dows = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const dayTotals = k => byDay[k] ? Object.values(byDay[k]).reduce((a,b)=>a+b,0) : 0;
  if(statView.mode==="month" || statView.mode==="week"){
    let cells = [];
    if(statView.mode==="month"){
      const lead = (new Date(from.getFullYear(), from.getMonth(), 1).getDay()+6)%7;
      for(let i=0;i<lead;i++) cells.push(null);
      for(let d=1;d<=to.getDate();d++) cells.push(new Date(from.getFullYear(), from.getMonth(), d));
    } else {
      for(let i=0;i<7;i++){ const dt=new Date(from); dt.setDate(from.getDate()+i); cells.push(dt); }
    }
    const peak = Math.max(1, ...cells.filter(Boolean).map(dt=>dayTotals(dayKey(dt))));

/* ============================================================
   24. STUDY HEATMAP
   ============================================================ */
function heatmapDays(){
  const chosen = statView.heat.subs || new Set(allActivities().map(a=>a.id));
  const n = Math.max(7, Math.min(365, statView.heat.days||30));
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const k = dayKey(d);
    let mins = 0;
    if(statView.heat.metric==="q"){
      /* questions solved that day, per subject, from the daily tally */
      const rec = S.stat[k] || {};
      Object.keys(rec).forEach(sc=>{ if(chosen.has(sc)) mins += rec[sc]; });
    } else {
      S.log.forEach(l=>{ if(chosen.has(l[2]) && dayKey(new Date(l[0]*60000))===k) mins += l[1]; });
    }
    days.push({k, d, mins});
  }
  return days;
}
/* bright green for the most-studied days in the period, fading through to
   bright red for the least — a plain hollow cell means nothing at all */
function heatColor(mins, max){
  if(mins<=0) return "var(--ink-3)";
  const frac = max ? Math.max(0, Math.min(1, mins/max)) : 0;
  const red=[255,80,90], green=[58,214,140];
  const mix = k => Math.round(red[k] + (green[k]-red[k])*frac);
  return `rgb(${mix(0)},${mix(1)},${mix(2)})`;
}
function heatmapHTML(){
  const days = heatmapDays();
  const max = Math.max(1, ...days.map(d=>d.mins));
  const first = days[0].d;
  const lead = (first.getDay()+6)%7;
  const cells = new Array(lead).fill(null).concat(days);
  const weeks = [];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  const dows = ["M","T","W","T","F","S","S"];
  let grid = `<div style="display:flex;gap:3px;overflow-x:auto;padding-bottom:6px">
    <div style="display:flex;flex-direction:column;gap:3px;margin-right:3px">${dows.map(d=>
      `<div style="height:15px;font-family:var(--mono);font-size:9px;color:var(--text-3);display:flex;align-items:center">${d}</div>`).join("")}</div>`;
  weeks.forEach(week=>{
    grid += `<div style="display:flex;flex-direction:column;gap:3px">`;
    week.forEach(day=>{
      grid += !day ? `<div style="width:15px;height:15px"></div>`
        : `<div style="width:15px;height:15px;border-radius:3px;background:${heatColor(day.mins,max)}" title="${day.k} · ${day.mins}${statView.heat.metric==="q"?" questions":" min"}"></div>`;
    });
    grid += `</div>`;
  });
  grid += `</div>`;
  const acts = statView.heat.metric==="q" ? allActivities().filter(a=>subjOf(a.id)) : allActivities();
  const chosen = statView.heat.subs || new Set(allActivities().map(a=>a.id));
  return `<div class="panel">
    <div class="hwrow" style="margin-bottom:14px">
      <span class="blabel" style="margin:0">Last</span>
      <input class="numin" type="number" id="heatDays" min="7" max="365" value="${statView.heat.days}">
      <span class="blabel" style="margin:0">days</span>
      <span class="spacer"></span>
      <button class="tbtn ${statView.heat.metric==="time"?"on":""}" data-heatmetric="time">Time studied</button>
      <button class="tbtn ${statView.heat.metric==="q"?"on":""}" data-heatmetric="q">Questions done</button></div>
    <div class="hwrow" style="margin-bottom:16px;flex-wrap:wrap">${acts.map(a=>`
      <button class="actbtn ${chosen.has(a.id)?"on":""}" data-heatsub="${esc(a.id)}"><i style="background:${a.c}"></i>${esc(a.n)}</button>`).join("")}</div>
    ${grid}
    <div class="legend" style="margin-top:12px">
      <span>less</span>
      ${[0,0.25,0.5,0.75,1].map(f=>`<i style="background:${heatColor(f||0.001, 1)};width:12px;height:12px"></i>`).join("")}
      <span>more</span></div>
  </div>`;
}
function wireHeatmap(){
  document.querySelectorAll("[data-heatmetric]").forEach(b=>b.onclick = ()=>{
    statView.heat.metric = b.dataset.heatmetric; viewStats(); });
  const inp = document.getElementById("heatDays");
  if(inp) inp.onchange = e=>{ statView.heat.days = Math.max(7, Math.min(365, parseInt(e.target.value,10)||30)); viewStats(); };

/* ============================================================
   25. STUDY TIME LINE GRAPH — smooth, per-subject, toggleable
   ============================================================ */
/* Catmull-Rom through the points, turned into cubic bezier segments so
   the line reads as a smooth curve instead of straight joins */
function smoothPath(pts){
  if(pts.length<2) return "";
  if(pts.length===2) return `M ${pts[0].x} ${pts[0].y} L ${pts[1].x} ${pts[1].y}`;
  let d = `M ${pts[0].x} ${pts[0].y} `;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d += `C ${c1x} ${c1y} ${c2x} ${c2y} ${p2.x} ${p2.y} `;
  }
  return d;
}
function lineGraphData(){
  const dlObj = statView.line.dl ? S.dl.find(d=>d.id===statView.line.dl) : null;
  let from, to = new Date(); to.setHours(0,0,0,0);
  if(dlObj){
    from = new Date(dlStart(dlObj)+"T00:00:00");
    const end = new Date(dlObj.date+"T00:00:00");
    if(end < to) to = end;
    if(to < from) to = from;
  } else {
    const days = Math.max(2, Math.min(180, statView.line.days||30));
    from = new Date(to); from.setDate(to.getDate()-(days-1));
  }
  const cap = Math.min(180, Math.max(2, Math.round((to-from)/86400000)+1));
  const subs = dlObj && dlObj.subs && dlObj.subs.length ? new Set(dlObj.subs) : null;
  const labels = [], perAct = {}, total = [];
  for(let i=0;i<cap;i++){
    const d = new Date(from); d.setDate(from.getDate()+i);
    const k = dayKey(d);
    labels.push(k);
    let dayTotal = 0;
    if(statView.line.metric==="q"){
      const rec = S.stat[k] || {};
      Object.keys(rec).forEach(sc=>{
        if(dlObj && subs && !subs.has(sc)) return;
        perAct[sc] = perAct[sc] || new Array(cap).fill(0);
        perAct[sc][i] += rec[sc];
        dayTotal += rec[sc];
      });
    } else {
      S.log.forEach(l=>{
        if(dayKey(new Date(l[0]*60000))!==k) return;
        if(dlObj){ const match = (subs && subs.has(l[2])) || l[3]===dlObj.id; if(!match) return; }
        perAct[l[2]] = perAct[l[2]] || new Array(cap).fill(0);
        perAct[l[2]][i] += l[1];
        dayTotal += l[1];
      });
    }
    total.push(dayTotal);
  }
  return {labels, perAct, total};
}
function lineGraphHTML(){
  const {labels, perAct, total} = lineGraphData();
  const W=760, H=260, padL=44, padR=14, padT=14, padB=32;
  const maxV = Math.max(1, ...total, ...Object.values(perAct).reduce((a,v)=>a.concat(v),[]));
  const x = i => padL + (labels.length<2?0:i/(labels.length-1))*(W-padL-padR);
  const y = v => padT + (1-v/maxV)*(H-padT-padB);
  const series = [{id:"__total", n:"Total", c:"var(--accent)", vals:total}]
    .concat(Object.keys(perAct).map(id=>({id, n:activityName(id), c:activityColor(id), vals:perAct[id]})));
  const hidden = statView.line.hidden;
  const paths = series.filter(s=>!hidden.has(s.id)).map(s=>{
    const pts = s.vals.map((v,i)=>({x:x(i), y:y(v)}));
    return `<path d="${smoothPath(pts)}" fill="none" stroke="${s.c}" stroke-width="${s.id==="__total"?3:2}" stroke-linecap="round" opacity="${s.id==="__total"?1:0.85}"/>`;
  }).join("");
  const ticks = [0,0.25,0.5,0.75,1].map(f=>Math.round(maxV*f));
  const every = Math.max(1, Math.ceil(labels.length/6));
  const live = S.dl.filter(d=>!d.hidden);
  return `<div class="panel">
    <div class="hwrow" style="margin-bottom:10px;flex-wrap:wrap">
      <span class="blabel" style="margin:0">Last</span>
      <input class="numin" type="number" id="lineDays" min="2" max="180" value="${statView.line.days}" ${statView.line.dl?"disabled":""}>
      <span class="blabel" style="margin:0">days</span>
      ${live.length?`<span class="blabel" style="margin:0">or for</span>
        <select id="lineDl"><option value="">— pick a deadline —</option>${live.map(d=>`<option value="${esc(d.id)}"${statView.line.dl===d.id?" selected":""}>${esc(d.name)}</option>`).join("")}</select>`:""}
      <span class="spacer"></span>
      <button class="tbtn ${statView.line.metric==="time"?"on":""}" data-linemetric="time">Time studied</button>
      <button class="tbtn ${statView.line.metric==="q"?"on":""}" data-linemetric="q">Questions done</button>
    </div>
    <div class="hwrow" style="margin-bottom:12px;flex-wrap:wrap">${series.map(s=>`
      <button class="actbtn ${hidden.has(s.id)?"":"on"}" data-lineseries="${esc(s.id)}" style="${hidden.has(s.id)?"opacity:.45":""}"><i style="background:${s.c}"></i>${esc(s.n)}</button>`).join("")}</div>
    ${labels.length<2 ? `<div class="empty">Not enough days in range.</div>` : `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${ticks.map(t=>`<line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--rule-soft)"/>
        <text x="${padL-8}" y="${y(t)+4}" text-anchor="end" fill="var(--text-3)" font-size="10" font-family="ui-monospace,monospace">${t}</text>`).join("")}
      ${paths}
      ${labels.map((l,i)=>i%every?"":`<text x="${x(i)}" y="${H-padB+18}" text-anchor="middle" fill="var(--text-3)" font-size="10" font-family="ui-monospace,monospace">${l.slice(5)}</text>`).join("")}
    </svg>`}
  </div>`;
}
function wireLineGraph(){
  document.querySelectorAll("[data-linemetric]").forEach(b=>b.onclick = ()=>{
    statView.line.metric = b.dataset.linemetric; viewStats(); });
  const inp = document.getElementById("lineDays");

/* only chapters with at least one solved question count, so a subject
   you have barely touched does not drag the whole axis down to near zero */
function subjectChapterStats(sc){
  return allChapters(sc).map(ch=>({ch, st:chapStats(sc,ch)})).filter(x=>x.st.done>0);
}
function spiderDefaultData(){
  return TREE.order.map(sc=>{
    const rows = subjectChapterStats(sc);
    const doneSum = rows.reduce((a,r)=>a+r.st.done,0), totalSum = rows.reduce((a,r)=>a+r.st.n,0);
    return {label:subjOf(sc).short, value: totalSum?Math.round(doneSum/totalSum*100):0, c:subjOf(sc).accent};
  });
}
function spiderCustomData(){
  const sc = statView.spider.subj; if(!sc) return [];
  const started = subjectChapterStats(sc);
  let chs = statView.spider.chapters;
  if(!chs || !chs.length) chs = started.slice(0,7).map(r=>r.ch.no);
  return chs.map(no=>{
    const ch = chapOf(sc,no); if(!ch) return null;
    const st = chapStats(sc,ch);
    const value = statView.spider.metric==="acc"
      ? (st.correct+st.wrong ? Math.round(st.correct/(st.correct+st.wrong)*100) : 0)
      : (st.n ? Math.round(st.done/st.n*100) : 0);
    const mo = subjOf(sc).modules[ch.mod];
    return {label:chTitle(ch), sub: mo?mo.name:"", value, c:subjOf(sc).accent};
  }).filter(Boolean);
}
function radarSVG(data, size){
  if(data.length<3) return `<div class="empty">Pick at least 3 chapters to draw a web.</div>`;
  const R = size/2-54, cx=size/2, cy=size/2, n=data.length;
  const angle = i => -Math.PI/2 + i*2*Math.PI/n;
  const pt = (i,frac) => [cx+R*frac*Math.cos(angle(i)), cy+R*frac*Math.sin(angle(i))];
  const rings = [0.25,0.5,0.75,1].map(f=>`<polygon points="${data.map((_,i)=>pt(i,f).join(",")).join(" ")}" fill="none" stroke="var(--rule-soft)"/>`).join("");
  const spokes = data.map((_,i)=>{ const [x,y]=pt(i,1); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--rule-soft)"/>`; }).join("");
  const poly = data.map((d,i)=>pt(i,Math.max(0.02,d.value/100)).join(",")).join(" ");
  const clip = (t,n) => t.length>n ? t.slice(0,n-1)+"…" : t;
  /* the module or reference book sits above the chapter, so two chapters of the
     same name in different modules can be told apart */
  const labels = data.map((d,i)=>{ const [x,y]=pt(i,1.2);
    const top = d.sub ? `<tspan x="${x}" dy="-0.5em" font-size="9" opacity="0.72">${esc(clip(d.sub,22))}</tspan>` : "";
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="var(--text-2)" font-size="11" font-family="ui-sans-serif">${top}<tspan x="${x}" dy="${d.sub?"1.2em":"0"}">${esc(clip(d.label,16))}</tspan></text>`; }).join("");
  const dots = data.map((d,i)=>{ const [x,y]=pt(i,Math.max(0.02,d.value/100));
    return `<circle cx="${x}" cy="${y}" r="4" fill="${d.c}"><title>${esc(d.sub?d.sub+" · "+d.label:d.label)}: ${d.value}%</title></circle>`; }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size}px;height:auto;display:block;margin:0 auto">
    ${rings}${spokes}<polygon points="${poly}" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2"/>${dots}${labels}</svg>`;
}

function wireSpider(){
  document.querySelectorAll("[data-spidermode]").forEach(b=>b.onclick = ()=>{ statView.spider.mode = b.dataset.spidermode; viewStats(); });
  const sel = document.getElementById("spiderSubj");
  if(sel) sel.onchange = e=>{ statView.spider.subj = e.target.value; statView.spider.chapters = null; viewStats(); };
  document.querySelectorAll("[data-spidermetric]").forEach(b=>b.onclick = ()=>{ statView.spider.metric = b.dataset.spidermetric; viewStats(); });
  document.querySelectorAll("[data-spiderchap]").forEach(b=>b.onclick = ()=>{
    const no = Number(b.dataset.spiderchap);
    const started = subjectChapterStats(statView.spider.subj);
    let cur = statView.spider.chapters || started.slice(0,7).map(r=>r.ch.no);
    const has = cur.includes(no);
    if(!has && cur.length>=7){ toast("Up to 7 chapters at a time"); return; }
    cur = has ? cur.filter(x=>x!==no) : cur.concat([no]);
    statView.spider.chapters = cur;
    viewStats();
  });
}

function dayCell(dt,k,rec,peak){
  const tot = rec ? Object.values(rec).reduce((a,b)=>a+b,0) : 0;
  const acts = rec ? Object.keys(rec) : [];
  const bars = acts.map(a=>`<i style="background:${activityColor(a)};flex:1;height:${Math.max(24, Math.round(rec[a]/peak*100))}%"></i>`).join("");
  return `<button class="day ${tot?"on":""} ${k===todayKey()?"today":""}" data-day="${k}" title="${tot} min">
    <span class="dn">${dt.getDate()}</span>
    ${tot?`<span class="bars">${bars}</span><span class="tot">${tot}m</span>`:""}</button>`;
}

/* rows and columns can be dragged into a different order */
let dragRow = null, dragCol = null;
function wireMarksDrag(t){
  const table = app.querySelector("table.mk"); if(!table) return;

  table.querySelectorAll("[data-rowdrag]").forEach(g=>{
    g.addEventListener("dragstart", e=>{
      dragRow = Number(g.dataset.rowdrag); dragCol = null;
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", String(dragRow)); }catch(_){}
      g.closest("tr").classList.add("dragging");
    });
    g.addEventListener("dragend", ()=>{
      dragRow = null;
      table.querySelectorAll("tr").forEach(r=>r.classList.remove("dragging","dropzone"));
    });
  });
  table.querySelectorAll("tbody tr").forEach(tr=>{
    tr.addEventListener("dragover", e=>{
      if(dragRow === null) return;
      e.preventDefault();
      table.querySelectorAll("tr").forEach(r=>r.classList.remove("dropzone"));
      tr.classList.add("dropzone");
    });
    tr.addEventListener("drop", e=>{
      if(dragRow === null) return;
      e.preventDefault();
      const to = Number(tr.dataset.row);
      if(to !== dragRow){
        snapshot("move a row");
        const moved = t.rows.splice(dragRow,1)[0];
        t.rows.splice(to, 0, moved);
        markDirty(); viewMarks(); toastUndo("Row moved");
      }
      dragRow = null;
    });
  });

  table.querySelectorAll("[data-coldrag]").forEach(g=>{
    g.addEventListener("dragstart", e=>{
      dragCol = g.dataset.coldrag; dragRow = null;
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", dragCol); }catch(_){}
    });
    g.addEventListener("dragend", ()=>{
      dragCol = null;
      table.querySelectorAll("th").forEach(h=>h.classList.remove("dropcol"));
    });
  });
  table.querySelectorAll("th[data-colid]").forEach(th=>{
    th.addEventListener("dragover", e=>{
      if(!dragCol) return;
      e.preventDefault();
      table.querySelectorAll("th").forEach(h=>h.classList.remove("dropcol"));
      th.classList.add("dropcol");
    });
    th.addEventListener("drop", e=>{
      if(!dragCol) return;
      e.preventDefault();
      const to = th.dataset.colid;
      if(to !== dragCol){
        const from = t.cols.findIndex(c=>c.id===dragCol);
        const at = t.cols.findIndex(c=>c.id===to);
        if(from >= 0 && at >= 0){
          snapshot("move a column");
          const moved = t.cols.splice(from,1)[0];
          t.cols.splice(at, 0, moved);
          markDirty(); viewMarks(); toastUndo("Column moved");
        }
      }
      dragCol = null;
    });
  });
}

/* which column runs along the bottom — the first one unless you say otherwise */
function xCol(t){ return (graphX && t.cols.some(c=>c.id===graphX)) ? graphX : (t.cols[0]||{}).id; }
function cellText(t, row, colId){
  const c = t.cols.find(c=>c.id===colId); if(!c) return "";
  return c.calc ? calcCell(t,row,c) : (row.v[colId]||"");
}
function curTable(){ return S.marks.tables.find(t=>t.id===S.marks.cur) || S.marks.tables[0]; }
let graphCol = "", graphX = "";
const numOf = v => { const n = parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,"")); return isFinite(n)?n:null; };

/* a plain line chart: the first column supplies the labels along the bottom */
function lineChart(labels, values, colour, title){
  const pts = values.map((v,i)=>({v, i})).filter(p=>p.v!==null);
  if(pts.length < 2) return `<div class="empty">Fill in at least two rows with numbers to draw a graph.</div>`;
  const W = 720, H = 260, padL = 52, padR = 18, padT = 18, padB = 46;
  const lo0 = Math.min.apply(null, pts.map(p=>p.v)), hi0 = Math.max.apply(null, pts.map(p=>p.v));
  const pad = (hi0-lo0)||Math.abs(hi0)||1;
  const lo = lo0 - pad*0.12, hi = hi0 + pad*0.12;
  const x = i => padL + (values.length<2?0:i/(values.length-1))*(W-padL-padR);
  const y = v => padT + (1-(v-lo)/(hi-lo))*(H-padT-padB);
  const ticks = [0,0.25,0.5,0.75,1].map(f=>lo+(hi-lo)*f);
  const line = pts.map((p,k)=>(k?"L":"M")+x(p.i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area = line+" L "+x(pts[pts.length-1].i).toFixed(1)+" "+(H-padB)+" L "+x(pts[0].i).toFixed(1)+" "+(H-padB)+" Z";
  const every = Math.ceil(labels.length/8);
  return `<div class="chartrow" style="display:block">
    <div class="blabel" style="margin-bottom:8px">${esc(title)}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${esc(title)}">
      ${ticks.map(t=>`<line x1="${padL}" x2="${W-padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--rule-soft)"/>
        <text x="${padL-8}" y="${(y(t)+4).toFixed(1)}" text-anchor="end" fill="var(--text-3)" font-size="11" font-family="ui-monospace,monospace">${Math.round(t*10)/10}</text>`).join("")}
      <path d="${area}" fill="${colour}" opacity="0.10"/>
      <path d="${line}" fill="none" stroke="${colour}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" fill="${colour}" stroke="var(--ink-2)" stroke-width="2"><title>${esc(labels[p.i]||("Row "+(p.i+1)))}: ${p.v}</title></circle>`).join("")}
      ${labels.map((l,i)=>i%every?"":`<text x="${x(i).toFixed(1)}" y="${H-padB+20}" text-anchor="middle" fill="var(--text-3)" font-size="11" font-family="ui-monospace,monospace">${esc(String(l||i+1).slice(0,12))}</text>`).join("")}
    </svg></div>`;
}
function calcCell(t,row,col){
  if(col.calc==="pct"){
    const tot = parseFloat(row.v.tot), sc = parseFloat(row.v.sc);
    if(!isFinite(tot) || !isFinite(sc) || tot<=0) return "—";
    return (Math.round(sc/tot*1000)/10) + "%";
  }
  return "";
}

let goalView = {mode:"week", anchor:new Date(), from:"", to:"", dl:""};

function goalRange(){
  const a = new Date(goalView.anchor); a.setHours(0,0,0,0);
  if(goalView.mode==="day") return {from:a, to:a, label:a.toDateString()};
  if(goalView.mode==="week"){
    const s = new Date(a); s.setDate(a.getDate()-((a.getDay()+6)%7));
    const e = new Date(s); e.setDate(s.getDate()+6);
    return {from:s, to:e, label:"Week of "+s.toDateString()};
  }
  if(goalView.mode==="range"){
    const f = goalView.from ? new Date(goalView.from+"T00:00:00") : a;
    const t = goalView.to ? new Date(goalView.to+"T00:00:00") : a;
    return f<=t ? {from:f, to:t, label:dayKey(f)+" to "+dayKey(t)} : {from:t, to:f, label:dayKey(t)+" to "+dayKey(f)};
  }
  if(goalView.mode==="deadline") return deadlineRange(goalView.dl, a);
  const s = new Date(a.getFullYear(), a.getMonth(), 1), e = new Date(a.getFullYear(), a.getMonth()+1, 0);
  return {from:s, to:e, label:s.toLocaleString(undefined,{month:"long", year:"numeric"})};
}
const goalTargets = () => (S.goals[goalView.mode] || S.goals.week);

/* "up 24%" / "down 8%" / "no change", handling a zero starting point honestly */
function changeText(now, before, lowerIsBetter){
  if(before === 0 && now === 0) return {t:"no change", c:"var(--text-3)"};
  if(before === 0) return {t:"first period with anything recorded", c:"var(--text-2)"};
  const pctChange = Math.round((now-before)/Math.abs(before)*1000)/10;
  if(pctChange === 0) return {t:"no change", c:"var(--text-3)"};
  const up = pctChange > 0;
  const good = lowerIsBetter ? !up : up;
  return {t:(up?"up ":"down ")+Math.abs(pctChange)+"% from last period", c:good?"var(--ok)":"var(--no)"};
}
function goalCard(title, unit, actual, target, before, lowerIsBetter, note){
  const hit = lowerIsBetter ? actual <= target : actual >= target;
  const raw = target === 0 ? (hit?100:0) : Math.round(actual/target*100);
  const bar = Math.max(0, Math.min(100, lowerIsBetter ? (hit?100:Math.max(0,100-raw)) : raw));
  const ch = changeText(actual, before, lowerIsBetter);
  return `<div class="card" style="cursor:default">
    <div class="card-top"><span class="card-title">${esc(title)}</span>
      <span class="pct" style="color:${hit?"var(--ok)":"var(--flag)"}">${hit?"met":"not yet"}</span></div>
    <div class="stats" style="margin-top:8px">
      <span><span class="k">so far</span> <b>${actual}${unit}</b></span>
      <span><span class="k">target</span> <b>${lowerIsBetter?"≤ ":""}${target}${unit}</b></span>
    </div>
    <div class="rail"><i style="width:${bar}%;background:${hit?"var(--ok)":"var(--flag)"}"></i></div>
    <div class="stats"><span style="color:${ch.c}">${esc(ch.t)}</span></div>
    ${note?`<div class="hint">${esc(note)}</div>`:""}</div>`;
}

function viewGoals(){
  crumbs([{label:"Home",href:"#/"},{label:"Goals"}]);
  const R = goalRange(), subs = R.subs || null;
  const P = prevRange(R, goalView.mode);
  const now = computeMetrics(clampFrom(R.from), R.to, subs, R.dlId);
  const was = computeMetrics(clampFrom(P.from), P.to, subs, R.dlId);
  const g = goalTargets();
  const hours = m => Math.round(m/60*10)/10;

  /* the mistake goal is about the change in rate, not the rate itself */
  const rateNow = now.missRate, rateBefore = was.missRate;
  const drift = Math.round((rateNow - rateBefore)*10)/10;
  const driftOk = drift <= g.m;

  app.innerHTML = recBanner() + `<div class="pagehead"><div class="eyebrow">Goals</div><h1>${esc(R.label)}</h1>
      <p class="sub">Targets are kept separately for each period, so a daily target is not confused with a monthly one.</p></div>
    <div class="toolbar">
      <div class="bulk">
        ${["day","week","month","range"].map(m=>`<button class="tbtn ${goalView.mode===m?"on":""}" data-gmode="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join("")}
        ${S.dl.length?`<button class="tbtn ${goalView.mode==="deadline"?"on":""}" data-gmode="deadline">Deadline</button>`:""}
      </div>
      <span class="spacer"></span>
      ${goalView.mode==="range"
        ? `<input class="tin" type="date" id="gFrom" value="${esc(goalView.from||dayKey(R.from))}">
           <input class="tin" type="date" id="gTo" value="${esc(goalView.to||dayKey(R.to))}">`
        : goalView.mode==="deadline"
        ? `<select id="gDl">${S.dl.map(d=>`<option value="${esc(d.id)}"${goalView.dl===d.id?" selected":""}>${esc(d.name)}</option>`).join("")}</select>`
        : `<button class="tbtn" data-gstep="-1">← Previous</button>
           <button class="tbtn" data-gstep="0">Today</button>
           <button class="tbtn" data-gstep="1">Next →</button>`}
      <button class="tbtn" id="editGoals">Edit targets</button>
    </div>
    <div class="grid g3">
      ${goalCard("Questions solved","", now.totalQ, g.q, was.totalQ, false)}
      ${goalCard("Hours studied","h", hours(now.totalMin), g.h, hours(was.totalMin), false)}
      ${(()=>{
        const noData = now.totalQ === 0;
        return `<div class="card" style="cursor:default">
        <div class="card-top"><span class="card-title">Mistake rate</span>
          <span class="pct" style="color:${noData?"var(--text-3)":(driftOk?"var(--ok)":"var(--flag)")}">${noData?"—":(driftOk?"met":"not yet")}</span></div>
        <div class="stats" style="margin-top:8px">
          <span><span class="k">now</span> <b>${noData?"—":rateNow+"%"}</b></span>
          <span><span class="k">before</span> <b>${was.totalQ?rateBefore+"%":"—"}</b></span>
          <span><span class="k">target</span> <b>≤ ${g.m>0?"+":""}${g.m}%</b></span></div>
        <div class="rail"><i style="width:${noData?0:Math.max(2,Math.min(100,rateNow))}%;background:${driftOk?"var(--ok)":"var(--flag)"}"></i></div>
        <div class="stats"><span style="color:${noData?"var(--text-3)":(drift<=0?"var(--ok)":"var(--no)")}">
          ${noData ? "nothing solved in this period yet"
                   : (was.totalQ===0 ? "first period with anything recorded"
                      : (drift===0?"no change":(drift>0?"up ":"down ")+Math.abs(drift)+" points from last period"))}</span></div>
        <div class="hint">Share of the questions you solved that came out wrong. A shorter bar is better.</div>
      </div>`; })()}
    </div>
    <h3 class="sec">How this period compares</h3>
    <div class="kpis">
      ${kpiChange("Questions solved", now.totalQ, was.totalQ, "")}
      ${kpiChange("Time studied", now.totalMin, was.totalMin, " min")}
      ${kpiChange("Days studied", now.activeDays, was.activeDays, "")}
      ${kpiChange("Average session", now.avgSession, was.avgSession, " min")}
      ${kpiChange("Longest session", now.longest, was.longest, " min")}
      ${kpiChange("Wrong answers", now.wrongCount, was.wrongCount, "", true)}
    </div>
    <div class="hint">Compared with ${esc(dayKey(P.from))} to ${esc(dayKey(P.to))}.</div>`;

  app.querySelectorAll("[data-gmode]").forEach(b=>b.onclick = ()=>{
    goalView.mode = b.dataset.gmode;
    if(goalView.mode==="range" && !goalView.from){
      const t = new Date(), f = new Date(); f.setDate(t.getDate()-13);
      goalView.from = dayKey(f); goalView.to = dayKey(t);
    }
    if(goalView.mode==="deadline" && !goalView.dl && S.dl.length) goalView.dl = S.dl[0].id;
    viewGoals();
  });
  app.querySelectorAll("[data-gstep]").forEach(b=>b.onclick = ()=>{
    const s = Number(b.dataset.gstep);
    if(s===0) goalView.anchor = new Date();
    else{
      const a = new Date(goalView.anchor);
      if(goalView.mode==="day") a.setDate(a.getDate()+s);
      else if(goalView.mode==="week") a.setDate(a.getDate()+7*s);
      else a.setMonth(a.getMonth()+s);
      goalView.anchor = a;
    }
    viewGoals();
  });
  const gf = document.getElementById("gFrom"), gt = document.getElementById("gTo");
  if(gf) gf.onchange = e=>{ goalView.from = e.target.value; viewGoals(); };
  if(gt) gt.onchange = e=>{ goalView.to = e.target.value; viewGoals(); };
  const gd = document.getElementById("gDl");
  if(gd) gd.onchange = e=>{ goalView.dl = e.target.value; viewGoals(); };
  document.getElementById("editGoals").onclick = editGoals;
}
function kpiChange(label, now, before, unit, lowerIsBetter){
  const ch = changeText(now, before, lowerIsBetter);
  return `<div class="kpi"><div class="v">${now}${unit}</div><div class="l">${esc(label)}</div>
    <div class="stats" style="margin-top:6px"><span style="color:${ch.c};font-size:11px">${esc(ch.t)}</span></div></div>`;

/* ============================================================
   16. COLLECTIONS
   The star and retry collections are worked out from the questions
   themselves, so bookmarking into one really does set that star.
   ============================================================ */
const VIRTUAL_COLS = [
  {id:"s3", n:"3 star questions", kind:"star", v:3},
  {id:"s2", n:"2 star questions", kind:"star", v:2},
  {id:"s1", n:"1 star questions", kind:"star", v:1},
  {id:"rt", n:"Retry questions",  kind:"flag"},
  {id:"wr", n:"Wrong questions",  kind:"res", v:2},
  {id:"st", n:"Stuck questions",  kind:"res", v:3},
  {id:"nt", n:"Questions with notes", kind:"note", readonly:true},
  {id:"mine", n:"My notes", kind:"mine", readonly:true},
  {id:"exam", n:"Exam notes", kind:"exam", readonly:true}
];
/* standalone notes: written on their own, not attached to any question */
/* test notes live on the test itself and are shown, read-only, in their own collection */
function examNotes(){
  const out = [];
  (S.an.folders||[]).forEach(f=>f.tests.forEach(t=>{
    if(t.notes && t.notes.trim())
      out.push({id:"an_"+f.id+"_"+t.id, t:t.notes, c:[], at:0, exam:f.name+" · "+t.name,
                href:`#/an/${f.id}/${t.id}`});
  }));
  return out;
}
const notesIn = col => col.kind==="exam" ? examNotes()
                     : col.kind==="mine" ? S.notes.slice()
                     : col.kind==="custom" ? S.notes.filter(n=>(n.c||[]).indexOf(col.id)>=0)
                     : [];
const allCollections = () => VIRTUAL_COLS.concat((S.col||[]).map(c=>({id:c.id, n:c.n, kind:"custom"})));
const colDef = id => allCollections().find(c=>c.id===id);

function bmIcon(on){
  return `<svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><path d="M1.4 1.4h9.2v11.2L6 9.2l-4.6 3.4z" fill="${on?"currentColor":"none"}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}
/* pull a question key apart and look up what it belongs to */
function qkInfo(qk){
  const dot = qk.lastIndexOf(".");
  const base = qk.slice(0,dot), i = Number(qk.slice(dot+1));
  const s = base[0], c = base.slice(1,-1), e = base.slice(-1);
  const sub = subjOf(s), ch = sub ? chapOf(s,c) : null, ex = ch ? exOf(s,ch,e) : null;
  return {qk, base, i, s, c, e, sub, ch, ex, v:(S.d[base]||[])[i]||0};
}
function inCollection(qk, col){
  if(col.kind==="star") return stars(qkInfo(qk).v) === col.v;
  if(col.kind==="flag") return !!isFlag(qkInfo(qk).v);
  if(col.kind==="res"){
    if(result(qkInfo(qk).v) !== col.v) return false;
    if(col.v===2 && wrongTagFilter!=="all"){
      const rec = S.r[qk];
      if(wrongTagFilter==="__none") return !rec || !rec.t.length;
      return !!(rec && rec.t.indexOf(wrongTagFilter) >= 0);
    }
    return true;
  }
  if(col.kind==="note") return !!(S.n[qk] && S.n[qk].trim());
  return (S.bm[qk]||[]).indexOf(col.id) >= 0;
}
function collectionMembers(col){
  const out = [];
  if(col.kind==="custom"){
    Object.keys(S.bm).forEach(qk=>{ if((S.bm[qk]||[]).indexOf(col.id)>=0) out.push(qk); });
  } else if(col.kind==="note"){
    Object.keys(S.n).forEach(qk=>{ if(S.n[qk] && S.n[qk].trim()) out.push(qk); });
  } else {
    /* one test for every derived kind, so star / retry / wrong / stuck agree */
    Object.keys(S.d).forEach(base=>{
      (S.d[base]||[]).forEach((v,i)=>{
        if(!v) return;
        const qk = base+"."+i;
        if(inCollection(qk, col)) out.push(qk);
      });
    });
  }
  return out.filter(qk=>{ const q = qkInfo(qk); return q.sub && q.ch && q.ex; })
            .sort((a,b)=>a<b?-1:1);
}
function setMembership(qk, col, on){
  const q = qkInfo(qk);
  if(col.kind==="star"){
    const arr = arrFor(q.s, q.c, q.e, qCount(q.s, q.ch, q.e));
    arr[q.i] = setStars(arr[q.i]||0, on ? col.v : 0);
  } else if(col.kind==="flag"){
    const arr = arrFor(q.s, q.c, q.e, qCount(q.s, q.ch, q.e));
    arr[q.i] = setFlag(arr[q.i]||0, on?1:0);
  } else if(col.kind==="custom"){
    const cur = new Set(S.bm[qk]||[]);
    on ? cur.add(col.id) : cur.delete(col.id);
    if(cur.size) S.bm[qk] = [...cur]; else delete S.bm[qk];
  }
  markDirty();
}

function openBookmark(qk, after){
  const q = qkInfo(qk);
  const draw = ()=>{
    openModal(`<h3>Save question ${q.i+1}</h3>
      <p>${esc(q.ch?chTitle(q.ch):"")} · ${esc(q.ex?q.ex.name:"")}</p>
      <div class="opts" id="cols">${allCollections().map(c=>`
        <div class="opt ${inCollection(qk,c)?"on":""} ${c.readonly?"ro":""}" data-c="${esc(c.id)}"
             role="checkbox" aria-checked="${inCollection(qk,c)}" tabindex="${c.readonly?-1:0}">
          <span class="bx">✓</span>${esc(c.n)}${c.readonly?' <span class="tagx">automatic</span>':""}</div>`).join("")}</div>
      <div class="hwrow" style="margin-top:12px">
        <input class="tin" id="newCol" placeholder="New collection" style="flex:1">
        <button class="btn" id="addCol">Create</button></div>
      <div class="hint">Saving into a star collection sets that star on the question.</div>
      <div class="acts"><button class="btn primary" id="bmDone">Done</button></div>`);
    modal.querySelectorAll(".opt").forEach(el=>{
      const c = colDef(el.dataset.c);
      if(c.readonly) return;
      const toggle = ()=>{ setMembership(qk, c, !inCollection(qk,c)); draw(); };
      el.onclick = toggle;
      el.onkeydown = ev=>{ if(ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); toggle(); } };
    });
    const add = ()=>{
      const v = modal.querySelector("#newCol").value.trim(); if(!v) return;
      snapshot("new collection");
      const id = "k"+Date.now().toString(36);
      S.col.push({id, n:v});
      setMembership(qk, {id, kind:"custom"}, true);
      draw();
    };
    modal.querySelector("#addCol").onclick = add;
    modal.querySelector("#newCol").onkeydown = e=>{ if(e.key==="Enter") add(); };
    modal.querySelector("#bmDone").onclick = ()=>{ closeModal(); if(after) after(); };
  };
  onEsc = ()=>{ if(after) after(); };
  draw();
}

let collPick = "s3";
let wrongTagFilter = "all";
/* also reached from the N shortcut and the add menu */
async function newCollection(){
  const n = await prompt2("New collection","Save questions into it with the bookmark at the end of any row.","Collection name","",{ok:"Create"});
  if(!n) return;
  snapshot("new collection");
  const id = "k"+Date.now().toString(36);
  S.col.push({id, n}); collPick = id;
  markDirty(); viewCollections(); toastUndo("Collection created");
}
function viewCollections(){
  crumbs([{label:"Home",href:"#/"},{label:"Collections"}]);
  const cols = allCollections();
  if(!cols.some(c=>c.id===collPick)) collPick = "s3";
  const col = colDef(collPick);
  const members = collectionMembers(col);
  const counts = {}; cols.forEach(c=>counts[c.id] = collectionMembers(c).length + notesIn(c).length);

  const loose = notesIn(col);
  const tagBar = col.id === "wr" ? (()=>{
    const counts = {}; let none = 0;
    Object.keys(S.r).forEach(qk=>{
      const info = qkInfo(qk);
      if(!info.ex || result(info.v)!==2) return;
      const t = S.r[qk].t;
      if(!t.length) none++; else t.forEach(x=>counts[x]=(counts[x]||0)+1);
    });
    const opts = [["all","Every reason",Object.keys(S.r).length?null:0]]
      .concat(tagList().filter(t=>counts[t.id]).map(t=>[t.id,t.n,counts[t.id]]))
      .concat(none?[["__none","Not tagged yet",none]]:[]);
    return `<div class="tabstrip" style="margin-bottom:14px">${opts.map(o=>
      `<button class="ttab ${wrongTagFilter===o[0]?"on":""}" data-wtag="${esc(o[0])}">${esc(o[1])}
        ${o[2]!=null?`<span style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${o[2]}</span>`:""}</button>`).join("")}</div>`;
  })() : "";
  const canWrite = col.kind==="mine" || col.kind==="custom";
  app.innerHTML = recBanner() + `<div class="pagehead"><div class="eyebrow">Collections</div>
      <div class="row-between"><h1>${esc(col.n)}</h1>
        <button class="btn primary" id="newColl">+ New collection</button></div>
      <div class="stats"><span><span class="k">questions</span> <b>${members.length}</b></span>
        ${loose.length||canWrite?`<span><span class="k">notes</span> <b>${loose.length}</b></span>`:""}</div></div>
    <div class="tabstrip">
      ${cols.map(c=>`<button class="ttab ${c.id===collPick?"on":""}" data-coll="${esc(c.id)}">${esc(c.n)}
        <span class="badge" style="background:var(--ink-3);color:var(--text-3)">${counts[c.id]}</span>
        ${c.kind==="custom"&&c.id===collPick?`<span class="pen" style="opacity:.7" data-collren="${esc(c.id)}">✎</span><span class="pen" style="opacity:.7" data-colldel="${esc(c.id)}">×</span>`:""}</button>`).join("")}
    </div>
    ${tagBar}
    ${canWrite?`<div class="panel">
      <div class="blabel">Write a note</div>
      <div class="hwrow" style="margin-top:8px">
        <input class="tin" id="noteIn" placeholder="Anything worth remembering" style="flex:1;min-width:220px">
        <button class="btn primary" id="noteAdd">Add note</button></div>
      <div class="mprev" id="notePrev" hidden></div>
      <div class="mhint">${MATH_HINT}</div>
      ${col.kind==="custom"?`<div class="hint">It goes into ${esc(col.n)} and into My notes.</div>`
        :`<div class="hint">Notes here are yours alone — nothing to do with a particular question.</div>`}</div>`:""}
    ${loose.map(noteRowHTML).join("")}
    ${members.length ? members.map(qk=>collRowHTML(qk, col)).join("")
      : (loose.length ? "" : `<div class="empty">${col.kind==="mine"
          ? "No notes yet. Write one above."
          : col.kind==="custom"
          ? "Nothing saved here yet. Use the bookmark at the end of any question row."
          : col.kind==="note" ? "No notes written yet."
          : "No questions in this collection yet."}</div>`)}`;

  app.querySelectorAll("[data-coll]").forEach(b=>b.onclick = e=>{
    if(e.target.closest("[data-collren],[data-colldel]")) return;
    collPick = b.dataset.coll; viewCollections();
  });
  app.querySelectorAll("[data-collren]").forEach(b=>b.onclick = async e=>{
    e.stopPropagation();
    const c = S.col.find(x=>x.id===b.dataset.collren);
    const n = await prompt2("Rename collection","","Collection name",c.n,{ok:"Rename"});
    if(n){ snapshot("rename collection"); c.n = n; markDirty(); viewCollections(); }
  });
  app.querySelectorAll("[data-colldel]").forEach(b=>b.onclick = async e=>{
    e.stopPropagation();
    const c = S.col.find(x=>x.id===b.dataset.colldel);
    if(!await ask("Delete "+c.n+"?","The questions themselves are untouched — only the collection goes.","Delete",true)) return;
    snapshot("delete collection");
    S.col = S.col.filter(x=>x.id!==c.id);
    Object.keys(S.bm).forEach(qk=>{
      S.bm[qk] = S.bm[qk].filter(id=>id!==c.id);
      if(!S.bm[qk].length) delete S.bm[qk];
    });
    S.notes.forEach(n=>{ n.c = (n.c||[]).filter(id=>id!==c.id); });
    collPick = "s3"; markDirty(); viewCollections(); toastUndo("Collection deleted");
  });
  document.getElementById("newColl").onclick = newCollection;
  app.querySelectorAll("[data-goto]").forEach(b=>b.onclick = ()=>{
    const q = qkInfo(b.dataset.goto);
    focusQ = q.i;
    location.hash = `#/${q.s}/${q.ch.mod}/${q.c}/${q.e}`;
  });
  app.querySelectorAll("[data-wtag]").forEach(b=>b.onclick = ()=>{ wrongTagFilter = b.dataset.wtag; viewCollections(); });
  app.querySelectorAll("[data-cbm]").forEach(b=>b.onclick = ()=>openBookmark(b.dataset.cbm, viewCollections));
  wireMathPreview("noteIn", "notePrev");
  const nin = document.getElementById("noteIn");
  if(nin){
    const addNote = ()=>{
      const t = nin.value.trim(); if(!t) return;
      snapshot("write a note");
      const n = {id:"n"+Date.now().toString(36), t, c:[], at:Math.floor(Date.now()/60000)};
      if(col.kind==="custom") n.c.push(col.id);
      S.notes.unshift(n);
      markDirty(); viewCollections(); toastUndo("Note added");
    };
    document.getElementById("noteAdd").onclick = addNote;
    nin.onkeydown = e=>{ if(e.key==="Enter") addNote(); };
  }
  app.querySelectorAll("[data-nedit]").forEach(b=>b.onclick = ()=>editNote(b.dataset.nedit));
  app.querySelectorAll("[data-ndel]").forEach(b=>b.onclick = async ()=>{
    const n = S.notes.find(x=>x.id===b.dataset.ndel); if(!n) return;
    snapshot("delete note");
    S.notes = S.notes.filter(x=>x!==n);
    markDirty(); viewCollections(); toastUndo("Note deleted");
  });
}

/* ============================================================
   17. SPEEDRUN
   ============================================================ */
/* speedrun is a third mode alongside Pomodoro and Endless, run inline on
   the Study page rather than in a takeover modal. TIMER.sr holds a run in
   progress; nothing here is saved until the run is stopped and logged. */
function newSR(){ return {phase:"setup", target:S.pom.srQ||10, minutes:S.pom.srM||15,
  clicker: S.pom.srClicker!==false, source:null, hwId:null, order:[], done:0, startAt:0, tick:null}; }
/* question-list homework not yet finished — the ready-made topics a
   speedrun can race through instead of you picking an exercise by hand */
function speedableHomework(){
  return S.h.filter(it=>!it.kind).map(it=>{
    const st = hwStats(it), r = st.r;
    if(r.missing) return null;
    const left = st.total - st.done;
    return left>0 ? {it, label:chTitle(r.ch)+" · "+r.ex.name, left, total:st.total} : null;
  }).filter(Boolean);
}
TIMER.sr = newSR();
const isSpeedrun = l => l.length > 4 && l[4] === 1;

/* every not-yet-solved question in one exercise, in order — the "source" a
   speedrun can optionally practice against, independent of homework */
function sourceQuestions(src){
  if(!src || !src.s || !src.e) return [];
  const ch = chapOf(src.s, src.c); if(!ch) return [];
  const n = qCount(src.s, ch, src.e), a = S.d[key(src.s,src.c,src.e)]||[];
  const out = [];
  for(let i=0;i<n;i++) if(!isDone(a[i]||0)) out.push(key(src.s,src.c,src.e)+"."+i);
  return out;
}
function srSourceLabel(src, hwId){
  if(hwId){
    const it = S.h.find(x=>x.id===hwId);
    if(it){ const r = hwResolve(it); if(!r.missing) return chTitle(r.ch)+" · "+r.ex.name+" (homework)"; }
  }
  if(!src) return "Just practising — no specific questions";
  const ch = chapOf(src.s, src.c), ex = ch && exOf(src.s, ch, src.e);
  return ex ? (subjOf(src.s)?subjOf(src.s).short:src.s)+" · "+chTitle(ch)+" · "+ex.name : "Just practising";
}
function srSetupHTML(){

        ${hwList.map(x=>`<button class="srbox ${sr.hwId===x.it.id?"on":""}" data-srhw="${esc(x.it.id)}">
          <b>${esc(x.label)}</b><span>${x.left} of ${x.total} left</span></button>`).join("")}
        ${sr.hwId?`<button class="tbtn" id="srHwClear">Not this one</button>`:""}
      </div>`:""}
    <div class="blabel">${hwList.length?"Or pick any exercise directly":"Practising"} (optional — leave blank to just practice without tracking specific questions)</div>
    <div class="hwrow" style="margin-bottom:14px">

      <select id="srC" ${mo&&!sr.hwId?"":"disabled"}><option value="">Chapter…</option>${mo?mo.chapters.map(c=>opt(c.no,chTitle(c),sr.source&&sr.source.c)).join(""):""}</select>
      <select id="srE" ${ch&&!sr.hwId?"":"disabled"}><option value="">Exercise…</option>${exs.map(e=>opt(e.code,e.name,sr.source&&sr.source.e)).join("")}</select>

function wireSrSetup(){
  const sr = TIMER.sr;
  const on = (id,fn)=>{ const el=document.getElementById(id); if(el) el.onchange=fn; };
  on("srS", e=>{ sr.source = e.target.value ? {s:e.target.value} : null; viewStudy(); });
  on("srMo", e=>{ sr.source.m = e.target.value; delete sr.source.c; delete sr.source.e; viewStudy(); });
  on("srC", e=>{ sr.source.c = e.target.value; delete sr.source.e; viewStudy(); });
  on("srE", e=>{ sr.source.e = e.target.value; viewStudy(); });
  document.querySelectorAll("[data-srhw]").forEach(b=>b.onclick = ()=>{
    sr.hwId = sr.hwId===b.dataset.srhw ? null : b.dataset.srhw;
    sr.source = null;                    /* a homework list and a manual pick are mutually exclusive */
    viewStudy();
  });
  const clr = document.getElementById("srHwClear");
  if(clr) clr.onclick = ()=>{ sr.hwId = null; viewStudy(); };
  const swb = document.getElementById("srClickerSw");
  if(swb) swb.onclick = ()=>{ sr.clicker = !sr.clicker; viewStudy(); };
  document.querySelectorAll("[data-act-pick]").forEach(b=>b.onclick = ()=>{ TIMER.act = b.dataset.actPick; viewStudy(); });
  const go = document.getElementById("srSetup");
  if(go) go.onclick = ()=>{
    const q = parseInt(document.getElementById("srQ").value,10);
    const m = parseInt(document.getElementById("srM").value,10);
    if(!(q>0&&q<=500) || !(m>0&&m<=600)){ document.getElementById("srMsg").textContent = "Questions 1-500, minutes 1-600."; return; }
    if(!TIMER.act){ document.getElementById("srMsg").textContent = "Pick what you are studying first."; return; }
    sr.target = q; sr.minutes = m;
    S.pom.srQ = q; S.pom.srM = m; S.pom.srClicker = sr.clicker; markDirty();
    if(sr.hwId){
      const it = S.h.find(x=>x.id===sr.hwId);
      const r = it && hwResolve(it);
      sr.order = (r && !r.missing) ? r.list.map(i=>key(it.s,it.c,it.e)+"."+i).filter(qk=>!isDone((S.d[qk.slice(0,qk.lastIndexOf("."))]||[])[Number(qk.slice(qk.lastIndexOf(".")+1))]||0)) : [];
    } else {
      sr.order = sr.source && sr.source.e ? sourceQuestions(sr.source) : [];
    }
    sr.phase = "ready";
    viewStudy();
  };
}
