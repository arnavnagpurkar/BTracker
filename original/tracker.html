  modal.querySelector("#mrgBack").onclick = drawMergeStep1;
  modal.querySelector("#mrgGo").onclick = async ()=>{
    const [tsc, tno] = MERGE.target.split(":");
    const msg = modal.querySelector("#mrgMsg");
    const tCh = chapOf(tsc, tno);
    /* exercises unticked on the chapter being kept leave the merged chapter */
    const drop = exList(tsc, tCh).filter(e=>qCount(tsc,tCh,e.code)>0 && !MERGE.codes[MERGE.target].has(e.code)).map(e=>e.code);
    const dropped = new Set(drop);
    const sources = list.filter(k=>k!==MERGE.target).map(k=>{
      const [sc,no] = k.split(":");
      const codes = [...MERGE.codes[k]].map(code=>{
        let to = MERGE.mapTo[k+"|"+code] || "__new__";
        if(to!=="__new__" && (dropped.has(to) || !exOf(tsc, tCh, to))) to = "__new__";
        return {code, to};
      });
      return {sc,no,codes};
    });
    if(sources.some(s=>s.sc!==tsc)){ msg.textContent = "Chapters from different subjects can't be merged."; return; }

    let finalName = null, finalNum = null;
    if(MERGE.nameFrom==="__own__"){
      finalName = (MERGE.ownName||"").trim();
      if(!finalName){ msg.textContent = "Give the merged chapter a name."; return; }
    } else if(MERGE.nameFrom!==MERGE.target) finalName = nameOf(MERGE.nameFrom);

    if(MERGE.numFrom==="__own__"){
      finalNum = parseInt(MERGE.ownNum,10);
      if(!(finalNum>0 && finalNum<=999)){ msg.textContent = "The number has to be between 1 and 999."; return; }
    } else if(MERGE.numFrom!==MERGE.target) finalNum = numOf(MERGE.numFrom);

    if(drop.length){
      const names = drop.map(c=>exOf(tsc,tCh,c).name+" ("+qCount(tsc,tCh,c)+")").join(", ");
      if(!await ask("Leave those exercises out?",
        "You unticked "+names+" on "+tCh.name+", the chapter you are keeping. They will be removed from the merged chapter along with everything recorded in them. Undo puts it all back.",
        "Leave them out", true)){ drawMergeStep2(); return; }
    }
    performMerge(tsc, tno, sources, {name:finalName, num:finalNum, mod:MERGE.destMod, drop});
    closeModal(); toastUndo("Chapters merged");
  };
}
/* everything written about a single question lives under its key, so a move
   carries the lot: the note, the mistake record, the bookmarks and the
   collections that point at it */
/* how many questions in an exercise carry anything at all: a tick, a result, a
   review flag, stars, a note, a mistake record or a bookmark */
function exDataCount(sc, no, code){
  const base = key(sc, no, code);
  const arr = S.d[base] || [];
  const n = qCount(sc, chapOf(sc,no), code);
  let hits = 0;
  for(let i=0;i<n;i++){
    const qk = base+"."+i;
    if(arr[i] || S.n[qk] || S.r[qk] || (S.bm[qk] && S.bm[qk].length)) hits++;
  }
  return hits;
}
function moveQuestionRecords(oldKey, newKey){
  if(oldKey === newKey) return;
  if(S.n[oldKey]!==undefined){ S.n[newKey]=S.n[oldKey]; delete S.n[oldKey]; }
  if(S.r[oldKey]!==undefined){ S.r[newKey]=S.r[oldKey]; delete S.r[oldKey]; }
  if(S.bm[oldKey]!==undefined){ S.bm[newKey]=S.bm[oldKey]; delete S.bm[oldKey]; }
  (S.col||[]).forEach(c=>{
    if(!Array.isArray(c.qs)) return;
    let hit = false;
    c.qs = c.qs.map(q=>{ if(q===oldKey){ hit = true; return newKey; } return q; });
    if(hit) c.qs = [...new Set(c.qs)];
  });
}
/* one chapter's revision record folded into another's, keeping the heavier
   weight, the more recent revision and any reminder that comes first */
function mergeRevisionRecord(sc, fromNo, toNo){
  if(!S.rev || !S.rev.items) return;
  const fk = revKey(sc, fromNo), tk = revKey(sc, toNo);
  if(fk === tk) return;
  const from = S.rev.items[fk]; if(!from) return;
  const cur = S.rev.items[tk];
  if(!cur) S.rev.items[tk] = from;
  else{
    cur.weight = Math.max(+cur.weight||1, +from.weight||1);
    cur.last = Math.max(cur.last||0, from.last||0) || null;
    if(from.note) cur.note = cur.note ? cur.note+"\n"+from.note : from.note;
    if(from.remindDate && (!cur.remindDate || from.remindDate < cur.remindDate)){
      cur.remindDate = from.remindDate; cur.remindDone = from.remindDone;
    }
  }
  delete S.rev.items[fk];
}
/* an exercise left out of a merge on the chapter being kept: the exercise and
   everything recorded in it go, since the merged chapter is not to carry it */
function purgeExercise(sc, no, code){
  const base = key(sc, no, code);
  delete S.d[base];
  [S.n, S.r, S.bm].forEach(store=>Object.keys(store).forEach(k=>{
    if(k.slice(0, k.lastIndexOf("."))===base) delete store[k];
  }));
  (S.col||[]).forEach(c=>{
    if(Array.isArray(c.qs)) c.qs = c.qs.filter(q=>q.slice(0, q.lastIndexOf("."))!==base);
  });
  const hits = it => it.s===sc && String(it.c)===String(no) && it.e===code;
  S.h = S.h.filter(it=>!hits(it));
  S.hd = S.hd.filter(it=>!hits(it));
  const ch = chapOf(sc, no), ex = ch && exOf(sc, ch, code);
  if(ex && ex.custom){
    S.x.exs[sc+"|"+no] = (S.x.exs[sc+"|"+no]||[]).filter(e=>e.code!==code);
    delete S.x.cnt[base];
  } else {
    S.x.cnt[base] = 0;
  }
}
/* a chapter takes the number you give it; the chapter sitting on that number in
   the same module, and every chapter after it, moves up one to make room */
function setChapterNumber(sc, no, num){
  num = Number(num);
  const ch = chapOf(sc, no); if(!ch || !(num>0)) return 0;
  const mid = ch.mod;
  S.x.num["c:"+sc+":"+no] = num;
  buildTree();
  const mod = modOf(sc, mid);
  const peers = (mod?mod.chapters:[]).filter(c=>Number(c.no)!==Number(no))
    .sort((a,b)=>chLabel(a)-chLabel(b));
  const taken = new Set([num]);
  let moved = 0;
  peers.forEach(c=>{
    const was = Number(chLabel(c)) || 1;
    let lab = was;
    while(taken.has(lab)) lab++;
    if(lab !== was){ S.x.num["c:"+sc+":"+c.no] = lab; moved++; }
    taken.add(lab);
  });
  buildTree();
  return moved;
}
/* the number you give a chapter is its alone: anything else sitting on it, and
   anything that would then collide in turn, is nudged up one */
function reserveChapterNumber(sc, targetNo, num){
  num = Number(num);
  if(!(num > 0)) return;
  S.x.num["c:"+sc+":"+targetNo] = num;
  buildTree();
  const tgt = chapOf(sc, targetNo); if(!tgt) return;
  /* modules 1-6 share one running set of numbers; a module or reference book of
     your own counts from 1 on its own, so only its own chapters can clash */
  const inSyllabus = Number(tgt.mod) <= 6;
  const peers = allChapters(sc).filter(c=>Number(c.no)!==Number(targetNo) &&
    (inSyllabus ? Number(c.mod)<=6 : Number(c.mod)===Number(tgt.mod)));
  const taken = new Set([num]);
  peers.sort((a,b)=>chLabel(a)-chLabel(b)).forEach(c=>{
    const was = Number(chLabel(c)) || 1;
    let lab = was;
    while(taken.has(lab)) lab++;
    if(lab !== was) S.x.num["c:"+sc+":"+c.no] = lab;
    taken.add(lab);
  });
  buildTree();
}
function performMerge(sc, targetNo, sources, finish){
  targetNo = Number(targetNo);
  sources = sources.map(s=>({sc:s.sc, no:Number(s.no), codes:s.codes}));
  snapshot("merge chapters");
  /* anything unticked on the chapter being kept goes before anything arrives */
  if(finish && finish.drop && finish.drop.length){
    finish.drop.forEach(code=>purgeExercise(sc, targetNo, code));
    buildTree();
  }
  /* source chapter -> which code each of its exercises landed on in the target */
  const landed = {};
  sources.forEach(src=>{
    const map = landed[src.no] = landed[src.no] || {};
    src.codes.forEach(({code:srcCode, to})=>{
      const nSrc = qCount(sc, chapOf(sc,src.no), srcCode);
      if(!nSrc) return;
      let targetCh = chapOf(sc, targetNo);
      let destCode = to;
      if(to==="__new__" || !exOf(sc, targetCh, to)){
        /* a separate exercise of its own, even when an exercise of the same name
           is already there — only "Combine into" pours into an existing one */
        const srcEx = exOf(sc, chapOf(sc,src.no), srcCode);
        destCode = exOf(sc, targetCh, srcCode) ? freeExCode(targetCh) : srcCode;
        if(!destCode){
          let n = 1; destCode = srcCode+"x"+n;
          while(exOf(sc, targetCh, destCode)) destCode = srcCode+"x"+(++n);
        }
        (S.x.exs[sc+"|"+targetNo] = S.x.exs[sc+"|"+targetNo]||[]).push({code:destCode, name:srcEx.name});
        buildTree(); targetCh = chapOf(sc, targetNo);
      }
      map[srcCode] = destCode;
      const nBefore = qCount(sc, targetCh, destCode);
      const tArr = arrFor(sc, targetNo, destCode, nBefore + nSrc);
      const sArr = arrFor(sc, src.no, srcCode, nSrc);
      for(let i=0;i<nSrc;i++){
        tArr[nBefore+i] = sArr[i];       /* done, result, review flag and stars */
        moveQuestionRecords(key(sc,src.no,srcCode)+"."+i,
                            key(sc,targetNo,destCode)+"."+(nBefore+i));
      }
      S.x.cnt[key(sc,targetNo,destCode)] = nBefore + nSrc;
      S.h.concat(S.hd).forEach(it=>{
        if(it.kind || it.s!==sc || String(it.c)!==String(src.no) || it.e!==srcCode) return;
        const idx = parseRange(it.r, nSrc).list;
        it.c = Number(targetNo); it.e = destCode; it.r = toRange(idx.map(i=>i+nBefore));
      });
      /* the questions have moved, so the source keeps no copy of them and
         stops counting them against your progress */
      delete S.d[key(sc,src.no,srcCode)];
      S.x.cnt[key(sc,src.no,srcCode)] = 0;
      /* a custom exercise that has fully moved away no longer needs a home on the source */
      const ch = chapOf(sc, src.no);
      if(ch.custom || exOf(sc,ch,srcCode).custom){
        S.x.exs[sc+"|"+src.no] = (S.x.exs[sc+"|"+src.no]||[]).filter(e=>e.code!==srcCode);
        delete S.x.cnt[key(sc,src.no,srcCode)];
      }
    });
  });
  buildTree();
  const emptied = new Set();
  sources.forEach(src=>{
    const ch = chapOf(sc, src.no);
    const empty = !ch || exList(sc,ch).every(e=>qCount(sc,ch,e.code)===0);
    if(empty){
      emptied.add(Number(src.no));
      mergeRevisionRecord(sc, src.no, targetNo);   /* revision history comes along */
    }
    if(ch && ch.custom && empty){
      S.x.chs[sc+"|"+ch.mod] = (S.x.chs[sc+"|"+ch.mod]||[]).filter(c=>String(c.no)!==String(src.no));
    }
  });
  /* homework kept as a whole exercise, backlog rows and tasks are pinned to a
     place rather than a range, so they follow whatever they were pinned to */
  S.h.concat(S.hd).forEach(it=>{
    if(!it.kind || it.s!==sc || it.c===undefined || it.c===null) return;
    const map = landed[Number(it.c)]; if(!map) return;
    if(it.e){
      if(map[it.e]===undefined) return;
      it.e = map[it.e];
    } else if(!emptied.has(Number(it.c))) return;
    it.c = Number(targetNo);
  });
  /* the merged chapter's own identity: name, displayed number, and home */
  if(finish){
    if(finish.name){
      let rec = null;
      Object.keys(S.x.chs).forEach(k=>{
        if(k.split("|")[0]!==sc) return;
        (S.x.chs[k]||[]).forEach(c=>{ if(Number(c.no)===targetNo) rec = c; });
      });
      if(rec) rec.name = finish.name; else S.x.ren["c:"+sc+":"+targetNo] = finish.name;
    }
    if(finish.mod !== undefined && finish.mod !== null && String(finish.mod) !== ""){
      let moved = false;
      Object.keys(S.x.chs).forEach(k=>{
        if(k.split("|")[0]!==sc) return;
        const at = (S.x.chs[k]||[]).findIndex(c=>Number(c.no)===targetNo);
        if(at>=0){
          const rec = S.x.chs[k][at]; S.x.chs[k].splice(at,1);
          (S.x.chs[sc+"|"+finish.mod] = S.x.chs[sc+"|"+finish.mod]||[]).push(rec);
          moved = true;
        }
      });
      if(!moved){ S.x.mod = S.x.mod||{}; S.x.mod["c:"+sc+":"+targetNo] = Number(finish.mod); }
    }
    buildTree();
    /* the merged chapter's number is held for it alone, whether you chose a new
       one or kept the one it already had */
    const tgt = chapOf(sc, targetNo);
    reserveChapterNumber(sc, targetNo, finish.num || (tgt ? chLabel(tgt) : 0));
  }
  buildTree(); markDirty(); render();
}

/* shown once, only to people who already have recorded progress, so a
   fresh install is never nagged about a merge it has no use for */
/* ============================================================
   29. CHAPTER NUMBER COLLISION REPAIR
   Custom chapters used to be numbered from the highest built-in
   number upward. Modules 3-6 then added built-in chapters into
   that same range, so an older save can have a custom chapter
   sharing a number with a new built-in one — chapOf() then finds
   the built-in and the custom chapter's work becomes unreachable.
   Custom numbers now start at 1000 so this cannot happen again.
   ============================================================ */
const CUSTOM_NO_BASE = 1000;
function builtinChapterNos(sc){
  const set = new Set();
  const b = BUILTIN[sc]; if(!b) return set;
  Object.keys(b.modules).forEach(m=>b.modules[m].forEach(row=>set.add(row[0])));
  return set;
}
/* moves one chapter to a different number, carrying every reference with it */
function renumberChapter(sc, oldNo, newNo){
  if(String(oldNo)===String(newNo)) return;
  const oldS = String(oldNo), newS = String(newNo);
  const remapQk = qk=>{
    const dot = qk.lastIndexOf(".");
    const k = qk.slice(0,dot), i = qk.slice(dot+1);
    if(k[0]!==sc || k.slice(1,-1)!==oldS) return null;
    return sc+newS+k.slice(-1)+"."+i;
  };
  /* progress arrays */
  Object.keys(S.d).forEach(k=>{
    if(k[0]!==sc || k.slice(1,-1)!==oldS) return;
    S.d[sc+newS+k.slice(-1)] = S.d[k]; delete S.d[k];
  });
  /* notes, mistake reasons, bookmarks */
  [["n",S.n],["r",S.r],["bm",S.bm]].forEach(([,map])=>{
    Object.keys(map).forEach(qk=>{
      const nk = remapQk(qk);
      if(nk){ map[nk] = map[qk]; delete map[qk]; }
    });
  });
  /* collections point at question keys too */
  (S.col||[]).forEach(c=>{ c.qs = (c.qs||[]).map(qk=>remapQk(qk)||qk); });
  /* homework, finished homework */
  S.h.concat(S.hd).forEach(it=>{
    if(it.s===sc && String(it.c)===oldS) it.c = Number(newNo);
  });
  /* revision list is keyed "subject:chapter" */
  if(S.rev && S.rev.items && S.rev.items[sc+":"+oldS]){
    S.rev.items[sc+":"+newS] = S.rev.items[sc+":"+oldS];
    delete S.rev.items[sc+":"+oldS];
  }
  /* the chapter's own definition, its exercises and counts */
  Object.keys(S.x.chs).forEach(k=>{
    if(k.split("|")[0]!==sc) return;
    (S.x.chs[k]||[]).forEach(c=>{ if(String(c.no)===oldS) c.no = Number(newNo); });
  });
  if(S.x.exs[sc+"|"+oldS]){ S.x.exs[sc+"|"+newS] = S.x.exs[sc+"|"+oldS]; delete S.x.exs[sc+"|"+oldS]; }
  Object.keys(S.x.cnt).forEach(k=>{
    if(k[0]!==sc || k.slice(1,-1)!==oldS) return;
    S.x.cnt[sc+newS+k.slice(-1)] = S.x.cnt[k]; delete S.x.cnt[k];
  });
  [["num",S.x.num],["ren",S.x.ren]].forEach(([,map])=>{
    if(!map) return;
    const ok = "c:"+sc+":"+oldS, nk = "c:"+sc+":"+newS;
    if(map[ok]!==undefined){ map[nk] = map[ok]; delete map[ok]; }
  });
  if(S.x.mod){
    const ok = "c:"+sc+":"+oldS, nk = "c:"+sc+":"+newS;
    if(S.x.mod[ok]!==undefined){ S.x.mod[nk] = S.x.mod[ok]; delete S.x.mod[ok]; }
  }
}
let REPAIRED_CHAPTERS = 0;
function migrateChapterCollisions(){
  let moved = 0;
  Object.keys(BUILTIN).forEach(sc=>{
    const builtins = builtinChapterNos(sc);
    /* the numbers already spoken for, so a repair never lands on another one */
    const taken = new Set(builtins);
    Object.keys(S.x.chs).forEach(k=>{
      if(k.split("|")[0]===sc) (S.x.chs[k]||[]).forEach(c=>taken.add(Number(c.no)));
    });
    let next = CUSTOM_NO_BASE;
    const clashes = [];
    Object.keys(S.x.chs).forEach(k=>{
      if(k.split("|")[0]!==sc) return;
      (S.x.chs[k]||[]).forEach(c=>{ if(builtins.has(Number(c.no))) clashes.push(Number(c.no)); });
    });
    clashes.forEach(oldNo=>{
      while(taken.has(next)) next++;
      renumberChapter(sc, oldNo, next);
      taken.add(next); moved++;
    });
  });
  if(moved){ markDirty(); REPAIRED_CHAPTERS += moved; }
  return moved;
}

/* total question count in a range spec like "1-53, 63-66, 110, 378-379(a)" —
   the (a)/(b) suffixes label a sub-part of one problem, not an extra one */
function parseRangeSpecCount(spec){
  let total = 0;
  spec.split(",").forEach(part=>{
    part = part.trim().replace(/\(.*?\)/g,"").trim();
    if(!part) return;
    const m = part.match(/^(\d+)(?:-(\d+))?$/);
    if(!m) return;
    const a = parseInt(m[1],10), bEnd = m[2]?parseInt(m[2],10):a;
    total += Math.max(0, bEnd-a+1);
  });
  return total;
}
function refBookTotal(book){
  if(book.kind==="ranges") return book.chapters.reduce((a,[,spec])=>a+parseRangeSpecCount(spec),0);
  if(book.kind==="sbt") return book.chapters.reduce((a,[,n])=>a+n,0);
  return book.chapters.reduce((a,[,counts])=>a+counts.reduce((x,y)=>x+y,0),0);
}
function refBookFor(id){
  for(const sc of Object.keys(REF_BOOKS)) for(const b of REF_BOOKS[sc]) if(b.id===id) return {sc, book:b};
  return null;
}
function openRefBookPicker(){
  const added = S.x.refAdded||{};
  const draw = ()=>{
    let body = "";
    Object.keys(REF_BOOKS).forEach(sc=>{
      body += `<div class="node"><span class="lv">Subject</span><span class="nm">${esc(subjOf(sc)?subjOf(sc).name:sc)}</span></div><div class="branch">`;
      REF_BOOKS[sc].forEach(bk=>{
        const isAdded = !!added[bk.id];
        body += `<div class="card" style="margin-bottom:8px" data-refbook="${esc(bk.id)}">
          <div class="card-top"><span class="card-title">${esc(bk.name)}</span>
            ${isAdded?'<span class="tagx">added</span>':""}</div>
          <div class="card-note">${bk.chapters.length} chapters · ${refBookTotal(bk)} questions${bk.groups?" · "+refBookGroups(bk).length+" parts":""}${bk.kind==="sbt"?" · comes with a recommended set":""}</div>
        </div>`;
      });
      body += `</div>`;
    });
    onEsc = ()=>{};
    openModal(`<h3>Reference books</h3>
      <p>Adding one creates a module for it under its subject — one per part for a book that comes in parts — with a chapter per topic. Nothing is added until you pick it.</p>
      <div class="block" style="max-height:420px;overflow:auto">${body}</div>
      <div class="acts"><button class="btn" id="rbNo">Close</button></div>`);
    modal.querySelectorAll("[data-refbook]").forEach(el=>{
      el.onclick = ()=>{
        const id = el.dataset.refbook;
        if(added[id]) confirmOpenRefBook(id); else confirmAddRefBook(id);
      };
    });
    modal.querySelector("#rbNo").onclick = closeModal;
  };
  draw();
}
function confirmOpenRefBook(id){
  const loc = refBookFor(id); if(!loc) return;
  const modId = (S.x.refAdded||{})[id];
  closeModal();
  location.hash = `#/${loc.sc}/${modId}`;
}
function confirmAddRefBook(id){
  const loc = refBookFor(id); if(!loc) return;

  openModal(`<h3>Add ${esc(book.name)}?</h3>

    ${book.kind==="sbt"?`<p>Its recommended questions will also be collected into a collection called <b>SBT Recommended Questions</b>.</p>`:""}
    <div class="acts"><button class="btn" id="rbCancel">Back</button>

}
/* builds the module exactly like any hand-made custom one, just with a
   lot of chapters and exercises created in one pass */
function refBookGroups(book){
  if(!book.groups) return [null];
  const seen = [];
  book.chapters.forEach(row=>{ const g = row[2]||""; if(!seen.includes(g)) seen.push(g); });
  return seen;
}
function addRefBook(sc, book){
  snapshot("add reference book");
  /* a book split into parts gets one module per part, so its chapters sit
     alongside the syllabus modules rather than in one very long list */
  const groups = refBookGroups(book);
  const modOf = {};
  let modId = null;
  groups.forEach(g=>{
    const id = nextModuleId(sc);
    (S.x.mods[sc] = S.x.mods[sc]||[]).push({id, name: g ? (book.short||book.name)+" — "+g : book.name});
    buildTree();
    modOf[g===null?"":g] = id;
    if(modId===null) modId = id;
  });

  let sbtCol = null;
  if(book.kind==="sbt"){
    sbtCol = S.col.find(c=>c.n==="SBT Recommended Questions");
    if(!sbtCol){ sbtCol = {id:"k"+Date.now().toString(36), n:"SBT Recommended Questions", qs:[]}; S.col.push(sbtCol); }
  }

  book.chapters.forEach(row=>{
    const mId = book.groups ? modOf[row[2]||""] : modId;
    const no = nextChapterNo(sc);
    (S.x.chs[sc+"|"+mId] = S.x.chs[sc+"|"+mId]||[]).push({no, name:row[0]});
    buildTree();   /* so nextChapterNo() sees this one on the next pass */
    /* codes come straight from EX_CODES rather than freeExCode(), which reads
       the built tree — that tree does not refresh between pushes within one
       chapter, so every exercise would otherwise be handed the same code */
    let codeIdx = 0;
    const takeCode = () => EX_CODES[codeIdx++];

    if(book.kind==="std"){
      const counts = row[1];
      book.exCols.forEach((exName,i)=>{
        if(!counts[i]) return;                 /* a 0-count exercise is just left out */
        const code = takeCode();
        (S.x.exs[sc+"|"+no] = S.x.exs[sc+"|"+no]||[]).push({code, name:exName});
        S.x.cnt[key(sc,no,code)] = counts[i];
      });
    } else if(book.kind==="sbt"){
      const [,n,rec] = row;
      if(n){
        const code = takeCode();
        (S.x.exs[sc+"|"+no] = S.x.exs[sc+"|"+no]||[]).push({code, name:"Questions"});
        S.x.cnt[key(sc,no,code)] = n;
        (rec||[]).forEach(num=>{
          const i = num-1; if(i<0 || i>=n) return;
          const qk = key(sc,no,code)+"."+i;
          if(sbtCol.qs.indexOf(qk)<0) sbtCol.qs.push(qk);
          S.bm[qk] = (S.bm[qk]||[]).concat(sbtCol.id).filter((v,idx,a)=>a.indexOf(v)===idx);
        });
      }
    } else if(book.kind==="ranges"){
      const spec = row[1], n = parseRangeSpecCount(spec);
      if(n){
        const code = takeCode();
        (S.x.exs[sc+"|"+no] = S.x.exs[sc+"|"+no]||[]).push({code, name:"Problems"});
        S.x.cnt[key(sc,no,code)] = n;
      }
    }
  });

  S.x.refAdded = S.x.refAdded || {};
  S.x.refAdded[book.id] = modId;
  buildTree(); markDirty();
  location.hash = `#/${sc}/${modId}`;
  render();
  toastUndo(book.name+" added");
}

/* ============================================================
   23. BULK SELECT — delete / move / copy+paste chapters or exercises
   ============================================================ */
let BULK = {kind:"", v:null, sel:new Set()};
let CLIPBOARD = null;

function startBulkPick(kind, v){ BULK = {kind, v, sel:new Set()}; drawBulkPicker(); }
function bulkItems(){
  if(BULK.kind==="chapter"){
    return modOf(BULK.v.s, BULK.v.m).chapters.map(ch=>({key:String(ch.no), label:chTitle(ch), custom:ch.custom}));
  }
  if(BULK.kind==="exercise"){
    const ch = chapOf(BULK.v.s, BULK.v.c);
    return exList(BULK.v.s, ch).map(e=>({key:e.code, label:e.name+" ("+qCount(BULK.v.s,ch,e.code)+" questions)", custom:e.custom}));
  }
  return [];
}
function drawBulkPicker(){
  const items = bulkItems();
  const body = items.map(it=>`<div class="opt ${BULK.sel.has(it.key)?"on":""}" data-bulkpick="${esc(it.key)}" role="checkbox" tabindex="0">
    <span class="bx">✓</span>${esc(it.label)}${it.custom?' <span class="tagx">yours</span>':""}</div>`).join("");
  const nCustom = items.filter(it=>BULK.sel.has(it.key) && it.custom).length;
  const nMovable = BULK.kind==="chapter" ? BULK.sel.size : nCustom;
  onEsc = ()=>{};
  openModal(`<h3>Select ${BULK.kind==="chapter"?"chapters":"exercises"}</h3>
    <p>${BULK.kind==="chapter"
      ? "Any chapter can be moved or copied. Delete only applies to ones you added yourself — built-in chapters in the selection are skipped."
      : "Delete and move only apply to exercises you added yourself — built-in ones in the selection are skipped. Copy works on any of them."}</p>
    <div class="block" style="max-height:360px;overflow:auto"><div class="opts">${body||`<div class="hint" style="margin:0">Nothing here yet.</div>`}</div></div>
    <div class="acts">
      <button class="btn" id="bkNo">Close</button>
      <button class="btn" id="bkCopy" ${BULK.sel.size?"":"disabled"}>Copy</button>
      <button class="btn" id="bkMove" ${nMovable?"":"disabled"}>Move…</button>
      <button class="btn danger" id="bkDel" ${nCustom?"":"disabled"}>Delete</button>
    </div>`);
  modal.querySelectorAll("[data-bulkpick]").forEach(el=>{
    const toggle = ()=>{ const k=el.dataset.bulkpick; BULK.sel.has(k)?BULK.sel.delete(k):BULK.sel.add(k); drawBulkPicker(); };
    el.onclick = toggle;
    el.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } };
  });
  modal.querySelector("#bkNo").onclick = ()=>{ closeModal(); render(); };
  modal.querySelector("#bkCopy").onclick = bulkCopy;
  modal.querySelector("#bkMove").onclick = bulkMoveDialog;
  modal.querySelector("#bkDel").onclick = bulkDelete;
}
function bulkCopy(){
  const items = bulkItems().filter(it=>BULK.sel.has(it.key));
  CLIPBOARD = {kind:BULK.kind, sc:BULK.v.s, items:items.map(it=>it.key), fromChapter:BULK.v.c};
  closeModal(); render();
  toast(items.length+" "+(BULK.kind==="chapter"?"chapter":"exercise")+(items.length>1?"s":"")+" copied — open where you want them and press +, Paste");
}
async function bulkDelete(){
  const items = bulkItems().filter(it=>BULK.sel.has(it.key) && it.custom);
  if(!items.length) return;
  const noun = BULK.kind==="chapter"?"chapter":"exercise";
  if(!await ask("Delete "+items.length+" "+noun+(items.length>1?"s":"")+"?",
      "Everything recorded in them goes too. Built-in ones in your selection were left alone.", "Delete", true)) return;
  snapshot("bulk delete");
  items.forEach(it=>{
    if(BULK.kind==="chapter") deleteChapterSilently(BULK.v.s, it.key);
    else deleteExerciseSilently(BULK.v.s, BULK.v.c, it.key);
  });
  buildTree(); markDirty(); closeModal(); render();
  toastUndo(items.length+" "+noun+(items.length>1?"s":"")+" deleted");
}
function deleteChapterSilently(sc, no){
  const ch = chapOf(sc, no); if(!ch) return;
  Object.keys(S.x.chs).forEach(k=>{ if(k.split("|")[0]===sc) S.x.chs[k] = S.x.chs[k].filter(c=>String(c.no)!==String(no)); });
  delete S.x.exs[sc+"|"+no];
  dropKeys(keysOfChapter(sc, no));
  S.h = S.h.filter(it=>!(it.s===sc && String(it.c)===String(no)));
  S.hd = S.hd.filter(it=>!(it.s===sc && String(it.c)===String(no)));
}
function deleteExerciseSilently(sc, cno, code){
  S.x.exs[sc+"|"+cno] = (S.x.exs[sc+"|"+cno]||[]).filter(e=>e.code!==code);
  dropKeys([key(sc,cno,code)]);
  delete S.x.cnt[key(sc,cno,code)];
  S.h = S.h.filter(it=>!(it.s===sc && String(it.c)===String(cno) && it.e===code));
  S.hd = S.hd.filter(it=>!(it.s===sc && String(it.c)===String(cno) && it.e===code));
}
function bulkMoveDialog(){
  /* moving is safe for built-in chapters too — only their module changes,
     never their number, so nothing recorded against them is disturbed */
  const items = bulkItems().filter(it=>BULK.sel.has(it.key) && (BULK.kind==="chapter" || it.custom));
  if(!items.length) return;
  const sc = BULK.v.s, sub = subjOf(sc);
  onEsc = drawBulkPicker;
  if(BULK.kind==="chapter"){
    openModal(`<h3>Move ${items.length} chapter${items.length>1?"s":""}</h3>
      <p>They keep everything recorded in them — only which module they sit under changes.</p>
      <div class="block"><div class="blabel">Move to</div>
        <select id="mvMod">${sub.order.map(m=>`<option value="${m}"${String(m)===String(BULK.v.m)?" selected":""}>${esc(sub.modules[m].name)}</option>`).join("")}</select></div>
      <div class="acts"><button class="btn" id="mvNo">Cancel</button><button class="btn primary" id="mvGo">Move</button></div>`);
    modal.querySelector("#mvNo").onclick = drawBulkPicker;
    modal.querySelector("#mvGo").onclick = ()=>{
      const destMod = modal.querySelector("#mvMod").value;
      snapshot("move chapters");
      items.forEach(it=>{
        const no = it.key;
        /* a custom chapter's record physically moves; a built-in one keeps its
           place in the syllabus data and just gets a module override */
        let rec = null;
        Object.keys(S.x.chs).forEach(k=>{
          if(k.split("|")[0]!==sc) return;
          const at = S.x.chs[k].findIndex(c=>String(c.no)===String(no));
          if(at>=0){ rec = S.x.chs[k][at]; S.x.chs[k].splice(at,1); }
        });
        if(rec) (S.x.chs[sc+"|"+destMod] = S.x.chs[sc+"|"+destMod]||[]).push(rec);
        else { S.x.mod = S.x.mod||{}; S.x.mod["c:"+sc+":"+no] = Number(destMod); }
      });
      buildTree(); markDirty(); closeModal(); render();
      toastUndo(items.length+" chapter"+(items.length>1?"s":"")+" moved");
    };
  } else {
    const chapChoices = allChapters(sc).filter(c=>String(c.no)!==String(BULK.v.c));
    openModal(`<h3>Move ${items.length} exercise${items.length>1?"s":""}</h3>
      <p>Their questions and everything recorded on them move too.</p>
      <div class="block"><div class="blabel">Move to</div>
        <select id="mvChap">${chapChoices.map(c=>`<option value="${c.no}">${esc(chTitle(c))}</option>`).join("")}</select></div>
      <div class="acts"><button class="btn" id="mvNo">Cancel</button><button class="btn primary" id="mvGo">Move</button></div>`);
    modal.querySelector("#mvNo").onclick = drawBulkPicker;
    modal.querySelector("#mvGo").onclick = ()=>{
      const destNo = Number(modal.querySelector("#mvChap").value);
      snapshot("move exercises");
      items.forEach(it=>moveExercise(sc, BULK.v.c, it.key, destNo));
      buildTree(); markDirty(); closeModal(); render();
      toastUndo(items.length+" exercise"+(items.length>1?"s":"")+" moved");
    };
  }
}
/* relocates one exercise's definition and every bit of recorded data to a
   different chapter, picking a fresh code if the destination already uses it */
function moveExercise(sc, fromNo, code, toNo){
  const fromCh = chapOf(sc, fromNo), toCh = chapOf(sc, toNo);
  const ex = exOf(sc, fromCh, code); if(!ex) return;
  const n = qCount(sc, fromCh, code);
  let destCode = code, k=1;
  while(exOf(sc, toCh, destCode)) destCode = code+(k++);
  (S.x.exs[sc+"|"+toNo] = S.x.exs[sc+"|"+toNo]||[]).push({code:destCode, name:ex.name});
  if(n){
    const arr = arrFor(sc, fromNo, code, n);
    const dest = arrFor(sc, toNo, destCode, n);
    for(let i=0;i<n;i++){
      dest[i] = arr[i];
      const oldKey = key(sc,fromNo,code)+"."+i, newKey = key(sc,toNo,destCode)+"."+i;
      if(S.n[oldKey]!==undefined){ S.n[newKey]=S.n[oldKey]; delete S.n[oldKey]; }
      if(S.r[oldKey]!==undefined){ S.r[newKey]=S.r[oldKey]; delete S.r[oldKey]; }
      if(S.bm[oldKey]!==undefined){ S.bm[newKey]=S.bm[oldKey]; delete S.bm[oldKey];
        S.col.forEach(c=>{ const at=c.qs.indexOf(oldKey); if(at>=0) c.qs[at]=newKey; }); }
    }
    if(S.x.cnt[key(sc,fromNo,code)]!==undefined) S.x.cnt[key(sc,toNo,destCode)] = S.x.cnt[key(sc,fromNo,code)];
  }
  S.h.concat(S.hd).forEach(it=>{
    if(it.kind || it.s!==sc || String(it.c)!==String(fromNo) || it.e!==code) return;
    it.c = Number(toNo); it.e = destCode;
  });
  deleteExerciseSilently(sc, fromNo, code);
}
/* clones whatever is on the clipboard into the chapter/module you're
   looking at, with fresh chapter numbers or exercise codes as needed */
function pasteClipboard(v){
  if(!CLIPBOARD) return;
  snapshot("paste");
  if(CLIPBOARD.kind==="chapter"){
    CLIPBOARD.items.forEach(no=>{
      const src = chapOf(v.s, no); if(!src) return;
      const newNo = nextChapterNo(v.s);
      (S.x.chs[v.s+"|"+v.m] = S.x.chs[v.s+"|"+v.m]||[]).push({no:newNo, name:src.name+" (copy)"});
      exList(v.s, src).forEach(e=>{
        const n = qCount(v.s, src, e.code);
        (S.x.exs[v.s+"|"+newNo] = S.x.exs[v.s+"|"+newNo]||[]).push({code:e.code, name:e.name});
        if(n){
          const from = arrFor(v.s, no, e.code, n), to = arrFor(v.s, newNo, e.code, n);
          for(let i=0;i<n;i++){
            to[i] = from[i];
            const oldKey = key(v.s,no,e.code)+"."+i, newKey = key(v.s,newNo,e.code)+"."+i;
            if(S.n[oldKey]!==undefined) S.n[newKey]=S.n[oldKey];
            if(S.r[oldKey]!==undefined) S.r[newKey]=S.r[oldKey];
          }
          if(S.x.cnt[key(v.s,no,e.code)]!==undefined) S.x.cnt[key(v.s,newNo,e.code)] = S.x.cnt[key(v.s,no,e.code)];
        }
      });
    });
  } else {
    /* exercises are copied from wherever they were selected (recorded at copy time) */
    const destCh = chapOf(v.s, v.c);
    CLIPBOARD.items.forEach(code=>{
      const src = CLIPBOARD.fromChapter;
      const fromCh = chapOf(v.s, src); if(!fromCh) return;
      const ex = exOf(v.s, fromCh, code); if(!ex) return;
      let destCode = code, k=1;
      while(exOf(v.s, destCh, destCode)) destCode = code+(k++);
      const n = qCount(v.s, fromCh, code);
      (S.x.exs[v.s+"|"+v.c] = S.x.exs[v.s+"|"+v.c]||[]).push({code:destCode, name:ex.name});
      if(n){
        const from = arrFor(v.s, src, code, n), to = arrFor(v.s, v.c, destCode, n);
        for(let i=0;i<n;i++){
          to[i] = from[i];
          const oldKey = key(v.s,src,code)+"."+i, newKey = key(v.s,v.c,destCode)+"."+i;
          if(S.n[oldKey]!==undefined) S.n[newKey]=S.n[oldKey];
          if(S.r[oldKey]!==undefined) S.r[newKey]=S.r[oldKey];
        }
        if(S.x.cnt[key(v.s,src,code)]!==undefined) S.x.cnt[key(v.s,v.c,destCode)] = S.x.cnt[key(v.s,src,code)];
      }
    });
  }
  CLIPBOARD = null;
  buildTree(); markDirty(); render();
  toastUndo("Pasted");
}


const SUB_CODES = "abcdefghijklmnopqrstuvwxyz";
const EX_CODES  = "BDEFGHJKLNOPQRSTUVWXYZbcdefghijklmnopqrstuvwxyz";
function freeSubjectCode(){ for(const c of SUB_CODES) if(!TREE.subjects[c]) return c; return null; }
function freeExCode(ch){ const used = new Set(ch.exs.map(e=>e.code)); for(const c of EX_CODES) if(!used.has(c)) return c; return null; }
/* custom chapters live at 1000+ so a future syllabus update adding more
   built-in chapters can never collide with one the user already made */
const nextChapterNo = sc => Math.max(CUSTOM_NO_BASE, allChapters(sc).reduce((m,c)=>Math.max(m,c.no),0)+1);
const nextModuleId  = sc => subjOf(sc).order.reduce((m,x)=>Math.max(m,Number(x)),0)+1;

/* exact match so chapter 1 never sweeps up chapter 12 */
function keysOfChapter(sc,no){ const p=String(no); return Object.keys(S.d).filter(k=>k[0]===sc && k.slice(1,-1)===p); }
function dropKeys(keys){
  keys.forEach(k=>{ delete S.d[k];
    [S.n,S.r].forEach(store=>Object.keys(store).forEach(nk=>{ if(nk.slice(0,nk.lastIndexOf("."))===k) delete store[nk]; })); });
}

const COLOURS = ["#a78bfa","#4cc9f0","#ffa94d","#63e6be","#f783ac","#ffd43b","#9775fa","#4dabf7",
                 "#ff922b","#69db7c","#e599f7","#ff8787","#38d9a9","#74c0fc","#faa2c1","#b2f2bb"];
/* subjects and modules can be given a colour of their own; it is used for the
   page accent, the bars and rails, and every chart that colours by subject */
function recolourThing(k){
  const p = k.split(":");
  const isSub = p[0]==="s";
  const thing = isSub ? subjOf(p[1]) : modOf(p[1], p[2]);
  if(!thing) return;
  const cur = colorOf(k) || (isSub ? thing.accent : (subjOf(p[1])||{}).accent);
  onEsc = ()=>{};
  const swatches = COLOURS.map(c=>`<button class="hueSw" data-pick="${c}" title="${c}"
    style="background:${c};${c.toLowerCase()===String(cur).toLowerCase()?"box-shadow:0 0 0 2px var(--text)":""}"></button>`).join("");
  openModal(`<h3>Colour of ${esc(isSub?thing.name:thing.name)}</h3>
    <p>${isSub?"Used wherever this subject is drawn — cards, charts and the accent of its pages."
              :"Used for this module's card and for its pages. It does not change the subject's own colour."}</p>
    <div class="block"><div class="blabel">Pick one</div>
      <div class="hwrow" style="flex-wrap:wrap;gap:8px">${swatches}</div></div>
    <div class="block"><div class="blabel">Or choose your own</div>
      <input type="color" id="hueOwn" value="${esc(cur||"#a78bfa")}" style="width:72px;height:36px;padding:2px;background:var(--ink);border:1px solid var(--rule);border-radius:8px"></div>
    <div class="acts"><button class="btn" id="hueNo">Cancel</button>
      ${colorOf(k)?`<button class="btn" id="hueReset">Back to default</button>`:""}
      <button class="btn primary" id="hueYes">Use this colour</button></div>`);
  let picked = cur;
  const mark = ()=>modal.querySelectorAll("[data-pick]").forEach(b=>
    b.style.boxShadow = b.dataset.pick.toLowerCase()===String(picked).toLowerCase() ? "0 0 0 2px var(--text)" : "");
  modal.querySelectorAll("[data-pick]").forEach(b=>b.onclick = ()=>{
    picked = b.dataset.pick; modal.querySelector("#hueOwn").value = picked; mark(); });
  modal.querySelector("#hueOwn").oninput = e=>{ picked = e.target.value; mark(); };
  modal.querySelector("#hueNo").onclick = closeModal;
  const reset = modal.querySelector("#hueReset");
  if(reset) reset.onclick = ()=>{
    snapshot("colour"); delete S.x.colr[k];
    buildTree(); markDirty(); closeModal(); render(); toastUndo("Colour reset");
  };
  modal.querySelector("#hueYes").onclick = ()=>{
    snapshot("colour"); S.x.colr[k] = picked;
    buildTree(); markDirty(); closeModal(); render(); toastUndo("Colour changed");
  };
}

function currentName(k){
  const p = k.split(":");
  if(p[0]==="s") return subjOf(p[1]) ? subjOf(p[1]).name : "";
  if(p[0]==="m"){ const m = modOf(p[1],p[2]); return m?m.name:""; }
  if(p[0]==="c"){ const c = chapOf(p[1],p[2]); return c?c.name:""; }
  if(p[0]==="e"){ const c = chapOf(p[1],p[2]); const x = c&&exOf(p[1],c,p[3]); return x?x.name:""; }
  return "";
}

async function renameThing(k){
  const parts0 = k.split(":");
  if(parts0[0]==="c") return editChapter(parts0[1], parts0[2]);
  const cur = currentName(k);
  const labels = {s:"Subject name", m:"Module name", c:"Chapter name", e:"Exercise name"};
  const name = await prompt2("Rename", "", labels[k.split(":")[0]]||"Name", cur, {ok:"Rename"});
  if(!name || name===cur) return;
  snapshot("rename");
  const p = k.split(":");
  if(p[0]==="s"){ const cs = S.x.subs.find(x=>x.code===p[1]); if(cs) cs.name = name; else S.x.ren[k]=name; }
  else if(p[0]==="m"){ const cm = (S.x.mods[p[1]]||[]).find(x=>String(x.id)===p[2]); if(cm) cm.name=name; else S.x.ren[k]=name; }
  else if(p[0]==="c"){
    let hit=null; Object.keys(S.x.chs).forEach(kk=>{ if(kk.split("|")[0]===p[1]) (S.x.chs[kk]||[]).forEach(c=>{ if(String(c.no)===p[2]) hit=c; }); });
    if(hit) hit.name = name; else S.x.ren[k]=name;
  }
  else if(p[0]==="e"){
    const ce = (S.x.exs[p[1]+"|"+p[2]]||[]).find(x=>x.code===p[3]);
    if(ce) ce.name = name; else S.x.ren[k]=name;
  }
  buildTree(); markDirty(); render(); toastUndo("Renamed to "+name);
}

function openModal(html){ modal.classList.remove("wide"); modal.innerHTML = html; veil.hidden = false; delete modal.dataset.pane;
  const f = modal.querySelector("input,textarea,button"); if(f) f.focus(); }
/* Re-drawing a dialog that is already open keeps its scroll position and does
   not grab focus, so ticking a box never jumps the list under the pointer. */
function paintModal(pane, html){
  if(modal.dataset.pane === pane){
    const top = modal.scrollTop;
    modal.innerHTML = html; veil.hidden = false; modal.scrollTop = top;
  } else {
    openModal(html); modal.dataset.pane = pane;
  }
}
function closeModal(){ veil.hidden = true; onEsc = null; }
/* A dialog stays put unless it is closed deliberately. Clicking the backdrop
   used to dismiss it, which meant a drag that started inside the box and ended
   outside threw the work away. */
/* true only when a keystroke is meant for the page rather than a field */
function typingInto(el){
  return !!(el && (el.closest("input,textarea,select") || el.isContentEditable));
}
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && !typingInto(e.target)){
    e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y" && !typingInto(e.target)){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){
    e.preventDefault(); const b = document.getElementById("srchIn"); b.focus(); b.select(); return; }
  if(e.key === "n" || e.key === "N"){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(typingInto(e.target)) return;
    if(!veil.hidden) return;                       /* a dialog is already open */
    const a = addHereAction();
    if(!a) return;
    e.preventDefault(); closeFabMenu(); a.run();
    return;
  }
  if(e.key==="Escape"){
    if(!veil.hidden){ const f=onEsc; closeModal(); if(f) f(false); return; }
    if(!fabmenu.hidden){ closeFabMenu(); return; }
    if(sel.size) clearSelection();
  }
});

async function copyText(text){

  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();

    document.body.removeChild(ta); return ok;

}
/* ============================================================
   EXPORTS — plain CSV, one row per thing, for a spreadsheet
   ============================================================ */
function csvCell(v){
  const t = v===null || v===undefined ? "" : String(v);
  return /[",\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
}
function csv(rows){ return rows.map(r=>r.map(csvCell).join(",")).join("\r\n"); }
function downloadCSV(name, rows){
  /* the BOM is what makes Excel open UTF-8 names properly */
  const blob = new Blob(["\ufeff"+csv(rows)], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ============================================================
   SEARCH — one box for chapters, exercises, notes, collections and the rest
   ============================================================ */
function searchAll(qRaw){
  const q = qRaw.trim().toLowerCase();
  if(q.length < 2) return [];
  const out = [];
  const add = (kind, label, sub, href, score)=>out.push({kind, label, sub, href, score});
  const hit = (text) => {
    if(!text) return 0;
    const t = String(text).toLowerCase();
    const at = t.indexOf(q);
    if(at < 0) return 0;
    return at===0 ? 3 : 1;                 /* a match at the start ranks higher */
  };
  TREE.order.forEach(sc=>{
    const sub = subjOf(sc);
    let sco = hit(sub.name); if(sco) add("Subject", sub.name, "", `#/${sc}`, sco);
    sub.order.forEach(m=>{
      const mo = sub.modules[m];
      sco = hit(mo.name); if(sco) add("Module", mo.name, sub.name, `#/${sc}/${m}`, sco);
      mo.chapters.forEach(ch=>{
        sco = hit(ch.name); if(sco) add("Chapter", chTitle(ch), sub.name+" · "+mo.name, `#/${sc}/${m}/${ch.no}`, sco);
        exList(sc,ch).forEach(e=>{
          const es = hit(e.name);
          if(es && (es>1 || q.length>3)) add("Exercise", e.name, sub.name+" · "+chTitle(ch), `#/${sc}/${m}/${ch.no}/${e.code}`, es-0.5);
        });
      });
    });
  });
  allCollections().forEach(c=>{ const sco = hit(c.n); if(sco) add("Collection", c.n, "", "#/coll", sco); });
  (S.notes||[]).forEach(n=>{ const sco = hit(n.t||n.text||""); if(sco) add("Note", (n.t||n.text||"").slice(0,80), n.c?"in a collection":"", "#/coll", sco-0.5); });
  Object.keys(S.n).forEach(qk=>{
    const sco = hit(S.n[qk]); if(!sco) return;
    const q2 = qkInfo(qk); if(!q2.sub || !q2.ch || !q2.ex) return;
    add("Question note", S.n[qk].slice(0,80), chTitle(q2.ch)+" · "+q2.ex.name+" · Q"+(q2.i+1),
        `#/${q2.s}/${q2.ch.mod}/${q2.c}/${q2.e}`, sco-0.5);
  });
  S.dl.forEach(d=>{ const sco = hit(d.name); if(sco) add("Deadline", d.name, d.date, "#/stats", sco); });
  S.fs.folders.forEach(f=>{ const sco = hit(f.name); if(sco) add("Folder", f.name, fsPath(f.parent).map(x=>x.name).join(" / ")||"Files", "#/files/"+f.id, sco); });
  S.fs.files.forEach(f=>{ const sco = hit(f.name); if(sco) add("File", f.name, fsPath(f.folder).map(x=>x.name).join(" / ")||"Files", "#/files/"+(f.folder||""), sco); });
  S.marks.tables.forEach(t=>{ const sco = hit(t.n); if(sco) add("Marks table", t.n, t.rows.length+" tests", "#/marks", sco); });
  (S.an.folders||[]).forEach(f=>{
    let sco = hit(f.name); if(sco) add("Test series", f.name, "", `#/an/${f.id}`, sco);
    (f.tests||[]).forEach(t=>{ const ts = hit(t.name); if(ts) add("Test", t.name, f.name, `#/an/${f.id}/${t.id}`, ts); });
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,40);
}
function paintSearch(){
  const box = document.getElementById("srchIn"), panel = document.getElementById("srchOut");
  const res = searchAll(box.value);
  if(!box.value.trim() || box.value.trim().length<2){ panel.hidden = true; panel.innerHTML=""; return; }
  if(!res.length){
    panel.hidden = false;
    panel.innerHTML = `<div class="grp">Nothing found for “${esc(box.value.trim())}”</div>`;
    return;
  }
  let html = "", last = "";
  res.forEach((r,i)=>{
    if(r.kind !== last){ html += `<div class="grp">${esc(r.kind)}</div>`; last = r.kind; }
    html += `<a href="${esc(r.href)}" data-srch="${i}"><span style="flex:1">${esc(r.label)}</span>
      ${r.sub?`<span class="sub">${esc(r.sub)}</span>`:""}</a>`;
  });
  panel.hidden = false;
  panel.innerHTML = html;
  panel.querySelectorAll("[data-srch]").forEach(a=>a.onclick = ()=>closeSearch());
}
function closeSearch(){
  const panel = document.getElementById("srchOut");
  panel.hidden = true; panel.innerHTML = "";
  document.getElementById("srchIn").classList.remove("open");
}
(function wireSearch(){
  const box = document.getElementById("srchIn"), panel = document.getElementById("srchOut");
  box.addEventListener("input", paintSearch);
  box.addEventListener("focus", paintSearch);
  document.getElementById("srchToggle").addEventListener("click", ()=>{
    box.classList.toggle("open");
    if(box.classList.contains("open")) box.focus(); else { box.blur(); closeSearch(); }
  });
  box.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ box.value=""; closeSearch(); box.classList.remove("open"); box.blur(); return; }
    const links = [...panel.querySelectorAll("a")];
    if(!links.length) return;
    const at = links.findIndex(a=>a.classList.contains("on"));
    if(e.key==="ArrowDown" || e.key==="ArrowUp"){
      e.preventDefault();
      const next = e.key==="ArrowDown" ? Math.min(links.length-1, at+1) : Math.max(0, at<0?0:at-1);
      links.forEach(a=>a.classList.remove("on"));
      links[next].classList.add("on");
      links[next].scrollIntoView({block:"nearest"});
    }
    if(e.key==="Enter"){
      e.preventDefault();
      (links[at<0?0:at]).click();
      location.hash = (links[at<0?0:at]).getAttribute("href");
      box.blur(); closeSearch();
    }
  });
  document.addEventListener("click", e=>{
    if(!e.target.closest("#srchOut") && !e.target.closest("#srchIn") && !e.target.closest("#srchToggle")) closeSearch();
  });
})();

/* ============================================================
   33. FILES — folders and files, like a desktop explorer
   The names, folders and layout live in your save like everything
   else; the files themselves are kept in this browser's storage,
   because a page has nowhere else to keep them. Download all as a
   .zip to carry them to another device, and restore it there.
   ============================================================ */
function newFs(){ return {folders:[], files:[]}; }
const FSDB = {
  db:null,
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((res, rej)=>{
      let r;
      try{ r = indexedDB.open("btracker-files", 1); }catch(e){ return rej(e); }
      r.onupgradeneeded = ()=>{ r.result.createObjectStore("blobs"); };
      r.onsuccess = ()=>{ this.db = r.result; res(this.db); };
      r.onerror = ()=>rej(r.error);
    });
  },
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej)=>{
      const t = db.transaction("blobs", mode), st = t.objectStore("blobs");
      const out = fn(st);
      t.oncomplete = ()=>res(out && out.result!==undefined ? out.result : undefined);
      t.onerror = ()=>rej(t.error); t.onabort = ()=>rej(t.error);
    });
  },
  put(id, blob){ return this.tx("readwrite", st=>st.put(blob, id)); },
  get(id){ return this.tx("readonly", st=>st.get(id)); },
  del(id){ return this.tx("readwrite", st=>st.delete(id)); },
  keys(){ return this.tx("readonly", st=>st.getAllKeys()); }
};
let fsView = {mode:"grid", sort:"name", q:"", sel:new Set()};
const fsUid = () => "f" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fsFolder = id => S.fs.folders.find(f=>f.id===id) || null;
const fsFile = id => S.fs.files.find(f=>f.id===id) || null;
function fsPath(id){ const out = []; let f = fsFolder(id), guard = 0; while(f && guard++<50){ out.unshift(f); f = fsFolder(f.parent); } return out; }
function fsDescendants(id){ const out = new Set([id]); let grew = true; while(grew){ grew = false; S.fs.folders.forEach(f=>{ if(f.parent && out.has(f.parent) && !out.has(f.id)){ out.add(f.id); grew = true; } }); } return out; }
const fsSize = n => n < 1024 ? n+" B" : n < 1048576 ? (n/1024).toFixed(n<10240?1:0)+" KB" : (n/1048576).toFixed(1)+" MB";
function fsKind(f){
  const t = f.type || "", n = (f.name||"").toLowerCase();
  if(t==="application/pdf" || n.endsWith(".pdf")) return "pdf";
  if(t.startsWith("image/")) return "img";
  if(t.startsWith("text/") || /\.(txt|md|csv|json)$/.test(n)) return "txt";
  return "other";
}
const FS_ICON = {pdf:"📄", img:"🖼", txt:"📝", other:"📦"};
function fsNameFree(name, parent, kind, skipId){
  const taken = new Set((kind==="folder" ? S.fs.folders.filter(f=>f.parent===parent) : S.fs.files.filter(f=>f.folder===parent))
    .filter(x=>x.id!==skipId).map(x=>x.name.toLowerCase()));
  if(!taken.has(name.toLowerCase())) return name;
  const dot = kind==="folder" ? -1 : name.lastIndexOf(".");
  const base = dot>0 ? name.slice(0,dot) : name, ext = dot>0 ? name.slice(dot) : "";
  for(let i=2;i<999;i++){ const n = `${base} (${i})${ext}`; if(!taken.has(n.toLowerCase())) return n; }
  return name + " " + Date.now();
}
function fsNewFolderRaw(name, parent){
  const f = {id:fsUid(), name:fsNameFree(name, parent||null, "folder"), parent:parent||null, at:Date.now()};
  S.fs.folders.push(f); return f;
}
async function fsAddBlob(blob, name, folder){
  const id = fsUid();
  await FSDB.put(id, blob);
  const rec = {id, name:fsNameFree(name, folder||null, "file"), type:blob.type||"", size:blob.size, at:Date.now(), folder:folder||null};
  S.fs.files.push(rec); return rec;
}
async function fsUpload(list, folder){
  const files = [...list]; if(!files.length) return;
  const big = files.filter(f=>f.size > 200*1024*1024);
  if(big.length) toast(big.map(f=>f.name).join(", ")+" "+(big.length>1?"are":"is")+" over 200 MB and was left out");
  const ok = files.filter(f=>f.size <= 200*1024*1024);
  if(!ok.length) return;
  snapshot(ok.length>1 ? "upload files" : "upload a file");
  let n = 0;
  for(const f of ok){
    try{ await fsAddBlob(f, f.name, folder); n++; }
    catch(e){ toast("Couldn't store "+f.name+" — the browser's storage may be full"); }
  }
  markDirty(); if(VIEW.name==="files") render();
  if(n) toastUndo(n+" file"+(n>1?"s":"")+" added");
}
async function fsBlob(id){ const b = await FSDB.get(id); if(!b) throw new Error("missing"); return b; }
function fsMove(ids, target){
  target = target || null;
  const bad = new Set();
  ids.forEach(id=>{ if(fsFolder(id) && fsDescendants(id).has(target)) bad.add(id); });
  const go = ids.filter(id=>!bad.has(id));
  if(!go.length){ toast("A folder can't go inside itself"); return; }
  snapshot("move files");
  go.forEach(id=>{
    const fo = fsFolder(id), fi = fsFile(id);
    if(fo && fo.parent!==target){ fo.parent = target; fo.name = fsNameFree(fo.name, target, "folder", fo.id); }
    if(fi && fi.folder!==target){ fi.folder = target; fi.name = fsNameFree(fi.name, target, "file", fi.id); }
  });
  fsView.sel.clear(); markDirty(); render();
  toastUndo(go.length+" moved"+(bad.size?" — a folder can't go inside itself, so "+bad.size+" stayed":""));
}
async function fsDelete(ids){
  const folders = ids.filter(id=>fsFolder(id)), files = ids.filter(id=>fsFile(id));
  const all = new Set(); folders.forEach(id=>fsDescendants(id).forEach(x=>all.add(x)));
  const inside = S.fs.files.filter(f=>all.has(f.folder)).length;
  const what = [folders.length?folders.length+" folder"+(folders.length>1?"s":""):"", files.length?files.length+" file"+(files.length>1?"s":""):""].filter(Boolean).join(" and ");
  if(!await ask("Delete "+what+"?", inside ? "Everything inside goes too — "+inside+" file"+(inside>1?"s":"")+" in all. Undo brings it back." : "Undo brings it back.", "Delete", true)){ render(); return; }
  snapshot("delete files");
  S.fs.folders = S.fs.folders.filter(f=>!all.has(f.id));
  S.fs.files = S.fs.files.filter(f=>!all.has(f.folder) && !files.includes(f.id));
  fsView.sel.clear(); markDirty(); render(); toastUndo("Deleted");
}
async function fsRename(id){
  const fo = fsFolder(id), fi = fsFile(id), it = fo || fi; if(!it) return;
  const n = await prompt2("Rename", "", "Name", it.name, {ok:"Rename"});
  if(!n || !n.trim() || n.trim()===it.name){ render(); return; }
  snapshot("rename");
  it.name = fsNameFree(n.trim(), fo ? fo.parent : fi.folder, fo ? "folder" : "file", it.id);
  markDirty(); render(); toastUndo("Renamed");
}
async function fsNewFolder(parent){
  const n = await prompt2("New folder", "", "Name", "New folder", {ok:"Create"});
  if(!n || !n.trim()){ render(); return; }
  snapshot("new folder"); fsNewFolderRaw(n.trim(), parent); markDirty(); render(); toastUndo("Folder made");
}
function fsDownloadBlob(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
async function fsDownload(ids){
  const files = []; const all = new Set();
  ids.forEach(id=>{ if(fsFolder(id)) fsDescendants(id).forEach(x=>all.add(x)); });
  ids.forEach(id=>{ const f = fsFile(id); if(f) files.push(f); });
  if(files.length===1 && !all.size){ try{ fsDownloadBlob(await fsBlob(files[0].id), files[0].name); }catch(e){ toast("That file isn't stored in this browser"); } return; }

async function pdfRender(blob, box, width, onlyFirst){

  const n = onlyFirst ? 1 : pdf.numPages;

  }

}

const CRC_T = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c = n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n] = c>>>0; } return t; })();

function zipBuild(entries){

  const dosDate = d => (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()) & 0xFFFF;
  entries.forEach(e=>{
    const name = enc.encode(e.path), data = e.data || new Uint8Array(0), crc = e.dir ? 0 : crc32(data), d = new Date(e.at||Date.now());
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dosTime(d),true); lh.setUint16(12,dosDate(d),true); lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,dosTime(d),true); ch.setUint16(14,dosDate(d),true); ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true);
    ch.setUint32(38, e.dir ? 0x10 : 0, true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + data.length;
  });

  end.setUint32(0,0x06054b50,true); end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true);

async function zipRead(blob){
  const buf = new Uint8Array(await blob.arrayBuffer()), dv = new DataView(buf.buffer);
  let e = -1;
  for(let i=buf.length-22; i>=Math.max(0, buf.length-65558); i--){ if(dv.getUint32(i,true)===0x06054b50){ e = i; break; } }

  const dec = new TextDecoder(), out = [];
  for(let i=0;i<n;i++){

    const method = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true), nlen = dv.getUint16(p+28,true);
    const xlen = dv.getUint16(p+30,true), clen = dv.getUint16(p+32,true), loff = dv.getUint32(p+42,true);

}
const fsSafe = n => String(n).replace(/[\\/:*?"<>|]+/g,"_").trim() || "untitled";
async function fsZipExport(ids){
  const entries = [], missing = [];
  const roots = ids && ids.length ? ids : null;
  const rootFolders = new Set(roots ? roots.filter(id=>fsFolder(id)) : []);
  /* a folder's path inside the zip: from the top for "download all", or from
     the selected folder itself when only some things are chosen */
  const pathOf = fid => {
    const p = []; let f = fsFolder(fid), g = 0;
    while(f && g++ < 60){
      p.unshift(fsSafe(f.name));
      if(roots && rootFolders.has(f.id)) return p;
      f = fsFolder(f.parent);
    }
    return roots ? [] : p;
  };
  let folderIds, fileList;
  if(!roots){ folderIds = S.fs.folders.map(f=>f.id); fileList = S.fs.files.slice(); }
  else {
    const fset = new Set(); rootFolders.forEach(id=>fsDescendants(id).forEach(x=>fset.add(x)));
    folderIds = [...fset];
    fileList = S.fs.files.filter(f=>fset.has(f.folder) || roots.includes(f.id));
  }
  folderIds.forEach(id=>{ const p = pathOf(id); if(p.length) entries.push({path:p.join("/")+"/", dir:true, at:(fsFolder(id)||{}).at}); });
  toast("Packing "+fileList.length+" file"+(fileList.length===1?"":"s")+"…");
  for(const f of fileList){
    try{
      const b = await fsBlob(f.id);
      const inRoot = !roots || fsDescendants([...rootFolders][0]||"__none").has(f.folder) || [...rootFolders].some(r=>fsDescendants(r).has(f.folder));
      const p = (inRoot ? pathOf(f.folder) : []).concat(fsSafe(f.name));

    } catch(e){ missing.push(f.name); }

  if(missing.length) toast(missing.length+" file"+(missing.length>1?"s weren't":" wasn't")+" in this browser and stayed out of the zip");
}

  const top = fsNewFolderRaw("Restored "+todayKey(), parent||null);
  const made = {"":top.id};
  const ensure = segs => { let key = "", cur = top.id;
    segs.forEach(s=>{ key += "/"+s; if(!made[key]){ made[key] = fsNewFolderRaw(s, cur).id; } cur = made[key]; }); return cur; };

/* ---------- one undo, one redo, for both halves ----------
   Each half keeps its own history; this journal remembers which half
   made each change, so ↶ always takes back the most recent one. */
const JOURNAL = {u:[], r:[]};
function journalPush(app){
  if(app==="asy" && JOIN_NEXT && JOURNAL.u.length){
    const last = JOURNAL.u[JOURNAL.u.length-1];
    if(!last.includes("asy")) last.push("asy");
  } else JOURNAL.u.push([app]);
  if(JOURNAL.u.length > 300) JOURNAL.u.shift();
  JOURNAL.r.length = 0;
  if(app==="bt"){ if(ASYAPI) ASYAPI.clearRedo(); } else REDO.length = 0;
  paintUndo();
}
const canUndoIn = a => a==="bt" ? UNDO.length>0 : !!(ASYAPI && ASYAPI.canUndo());
const canRedoIn = a => a==="bt" ? REDO.length>0 : !!(ASYAPI && ASYAPI.canRedo());
const plannerVisible = () => document.getElementById("asyHost").classList.contains("on");
function undoIn(a){
  if(a==="bt") return btUndoOwn();
  ASYAPI.undoOwn();
  if(!plannerVisible()) toast("Undone: a change in the planner");
  setTimeout(()=>plannerSync(true), 0);
}
function redoIn(a){
  if(a==="bt") return btRedoOwn();
  ASYAPI.redoOwn();
  if(!plannerVisible()) toast("Redone: a change in the planner");
  setTimeout(()=>plannerSync(true), 0);
}
function undo(){
  while(JOURNAL.u.length){
    const e = JOURNAL.u.pop(), live = e.filter(canUndoIn);
    if(!live.length) continue;
    live.slice().reverse().forEach(undoIn);
    JOURNAL.r.push(live); paintUndo(); return;
  }
  if(UNDO.length){ btUndoOwn(); JOURNAL.r.push(["bt"]); paintUndo(); }
}
function redo(){
  while(JOURNAL.r.length){
    const e = JOURNAL.r.pop(), live = e.filter(canRedoIn);
    if(!live.length) continue;
    live.forEach(redoIn);
    JOURNAL.u.push(live); paintUndo(); return;
  }
  if(REDO.length){ btRedoOwn(); JOURNAL.u.push(["bt"]); paintUndo(); }
}
function paintUndo(){
  const b = document.getElementById("undoBtn"), r = document.getElementById("redoBtn");
  const nu = JOURNAL.u.length ? JOURNAL.u[JOURNAL.u.length-1] : (UNDO.length?["bt"]:[]);
  const nr = JOURNAL.r.length ? JOURNAL.r[JOURNAL.r.length-1] : (REDO.length?["bt"]:[]);
  const anyU = UNDO.length>0 || !!(ASYAPI && ASYAPI.canUndo());
  const anyR = REDO.length>0 || !!(ASYAPI && ASYAPI.canRedo());
  b.disabled = !anyU; r.disabled = !anyR;
  b.title = !anyU ? "Nothing to undo" : (nu.includes("bt") && UNDO.length ? "Undo "+UNDO[UNDO.length-1].label : "Undo the last change in the planner")+" (Ctrl+Z)";
  r.title = !anyR ? "Nothing to redo" : (nr.includes("bt") && REDO.length ? "Redo "+REDO[REDO.length-1].label : "Redo the last change in the planner")+" (Ctrl+Y)";
}

function actTarget(act){
  const m = (S.ig.actMap||{})[act];

  if(m && ids.includes(m)) return m;

}
/* the planner's type of study a session counts as: one you chose, or none, in
   which case it takes the type of whatever block it lands in */
function actType(act){
  let t = (S.ig.actType || {})[act];
  if(!ASYAPI) return "";
  /* left unset, Revision and Mock test sessions take the planner's own type of the same name */
  if(!t && (act==="rev" || act==="mock")){ const d = ASYAPI.types().find(x=>(act==="rev" ? /revision/i : /mock/i).test(x.name)); if(d) return d.id; }
  if(!t) return "";
  return ASYAPI.types().some(x=>x.id===t) ? t : "";
}
/* which planner blocks a session may go into. Left unset, every study type
   except the timetabled ones — lectures, school, commuting, tests — so
   studying during a lecture is recorded as what it was, not as the lecture */
const RECV_SKIP = /lecture|class|school|coaching|commute|travel|mock|test|exam|analysis/i;
function recvTypes(){
  if(!ASYAPI) return null;
  const all = ASYAPI.types();
  const set = Array.isArray(S.ig.recvTypes) ? S.ig.recvTypes : all.filter(t=>!RECV_SKIP.test(t.name)).map(t=>t.id);
  return all.map(t=>t.id).filter(id=>set.includes(id));
}
function plannerSessions(){

    out.push({k, date, s:d.getHours()*60+d.getMinutes(), m:Math.round(l[1]), subj, type:actType(l[2]), label:activityName(l[2])});
  });

}

/* ---------- chapter identity: subject first, then name ----------
   Only a lookup, never a sync: it lets Statistics show a planner prep
   grade beside a chapter, and carried the old Revision tab across. */
const ID_SUB = {phy:"P", chem:"C", math:"M"};
const ID_STOP = new Set(["of","the","and","in","on","to","a","an","for","with","its","their","by","from","at","as","into","s"]);
const ID_ROMAN = {i:"1",ii:"2",iii:"3",iv:"4",v:"5",vi:"6"};
function idTokens(t){
  return String(t).toLowerCase().replace(/[’'`]/g,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim().split(/\s+/)
    .filter(Boolean).map(w=>ID_ROMAN[w]||w).filter(w=>!ID_STOP.has(w))
    .map(w=> w.length>4 && /s$/.test(w) && !/(ss|us|is)$/.test(w) ? w.slice(0,-1) : w);
}
function idScore(a, b){
  const A = new Set(a), B = new Set(b);
  if(!A.size || !B.size) return 0;
  let inter = 0; A.forEach(x=>{ if(B.has(x)) inter++; });
  if(inter===A.size && inter===B.size) return 1;
  const small = A.size<=B.size ? A : B, big = small===A ? B : A;
  if(inter===small.size && (small.size>=2 || ([...small][0].length>=6 && big.size<=3))) return 0.8;
  const j = inter / (A.size + B.size - inter);
  return j>=0.5 ? j : 0;
}
function btChapterSource(sc, ch){
  const mo = subjOf(sc) && subjOf(sc).modules[ch.mod];
  return mo ? mo.name : "";
}
function idLinks(){
  if(!ASYAPI) return {};
  const out = {}, pools = {};
  ASYAPI.chapters().forEach(a=>{
    const sc = ID_SUB[a.subj]; const links = [];
    if(sc && subjOf(sc)){
      const pool = pools[sc] = pools[sc] || allChapters(sc).map(ch=>({k:sc+":"+ch.no, t:idTokens(ch.name)}));
      const at = idTokens(a.name);
      const scored = pool.map(p=>({k:p.k, s:idScore(at, p.t)})).filter(x=>x.s>0);
      const sure = scored.filter(x=>x.s===1);
      if(sure.length) sure.forEach(x=>links.push({k:x.k, fuzzy:false}));
      else {
        const good = scored.filter(x=>x.s>=0.8);
        if(good.length) good.forEach(x=>links.push({k:x.k, fuzzy:true}));
        else if(scored.length){ scored.sort((x,y)=>y.s-x.s); links.push({k:scored[0].k, fuzzy:true}); }
      }
    }
    const ov = (S.ig.idmap||{})[a.id];
    let fin = links;
    if(ov){
      const del = new Set(ov.del||[]);
      fin = links.filter(l=>!del.has(l.k));
      (ov.add||[]).forEach(k=>{ if(!fin.some(l=>l.k===k)) fin.push({k, fuzzy:false, mine:true}); });
    }
    out[a.id] = fin.filter(l=>{ const [sc,no] = l.k.split(":"); return !!chapOf(sc,no); });
  });
  return out;
}
function idReverse(){
  const rev = {}, links = idLinks();
  Object.keys(links).forEach(id=>links[id].forEach(l=>{ (rev[l.k] = rev[l.k] || []).push(id); }));
  return rev;
}
let PREP_CACHE = null;
function prepFor(sc, no){
  if(!ASYAPI) return null;
  if(!PREP_CACHE || PREP_CACHE.at < Date.now()-1500) PREP_CACHE = {at:Date.now(), rev:idReverse()};
  const ids = PREP_CACHE.rev[sc+":"+no]; if(!ids || !ids.length) return null;
  const vals = ids.map(id=>ASYAPI.prep(id)).filter(v=>v!=null);
  return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10 : null;
}
const prepColor = v => v==null ? "var(--text-3)" : `hsl(${Math.round(348 + (v/10)*(152-348+360)) % 360} 85% 64%)`;

        subj: ({P:"phy",C:"chem",M:"math"})[sc] || "", w: +it.weight || 1, last: it.last || null,
        note: it.note || "", remind: it.remindDone ? "" : (it.remindDate || ""), every: it.remindEvery || ""};
    });

let setLinkSub = "phy", setLinkFilter = "all";
/* a short name for a module or reference book, so a link reads "HCV · Vol 1"
   rather than "HC Verma — Concepts of Physics, Vol 1"; the full name is in its tooltip */
const SRC_SHORT = [[/^HC Verma/i,"HCV"],[/^DC Pandey/i,"DCP",true],[/^SBT/i,"SBT"],[/^Irodov/i,"Irodov"],[/^Cengage/i,"Cengage",true],
  [/^Neeraj Kumar/i,"N. Kumar"],[/^Narendra Awasti/i,"N. Awasti"],[/^VK Jaiswal/i,"VKJ"],[/^MS Chouhan/i,"MSC"],[/^BTest/i,"BTest"]];
function srcShort(name){
  name = String(name||"");
  const m = /^Module\s+(\d+)$/i.exec(name); if(m) return "Mod "+m[1];
  const i = name.indexOf(" — "), book = i>0 ? name.slice(0,i) : name, part = i>0 ? name.slice(i+3) : "";
  const known = SRC_SHORT.find(([re])=>re.test(book));
  if(!known) return name.length > 16 ? name.slice(0,15).trim()+"…" : name;
  const vol = /vol(?:ume)?\.?\s*(\d+)/i.exec(part);
  let p = vol ? "Vol "+vol[1] : (known[2] && part ? (part.length<=12 ? part : part.split(/[\s,&]+/)[0]) : "");
  return p ? known[1]+" · "+p : known[1];
}
function viewSettings(sec){

  const seg = (key, opts) => `<div class="seg">${opts.map(([v,l])=>`<button class="${String(L[key])===String(v)?"on":""}" data-look="${esc(key)}|${esc(String(v))}">${esc(l)}</button>`).join("")}</div>`;

    <div class="blabel" style="margin-top:16px">Planner colours</div>
    <div class="palrow">${planCard("same","Same as the tracker", (L.pal||"dark").startsWith("asy:")?ASY_PALS[(L.pal||"").slice(4)].bg:BT_PALS[L.pal||"dark"].ink, lookAccent(), "#93a3b8")}${btPals.filter(a=>a[0]!=="light").concat(asyPals).map(a=>planCard(...a)).join("")}</div>

    <div class="setgrid">

      <div class="setrow"><span>Animations</span>${seg("motion",[["off","Off"],["reduced","Reduced"],["full","Full"]])}</div>
      <div class="setrow"><span>Typeface</span>${seg("font",[["own","Each half its own"],["system","System"],["grotesk","Space Grotesk"]])}</div>
      <div class="setrow"><span>Text size</span>${seg("size",[["sm","Small"],["md","Normal"],["lg","Large"]])}</div>
      <div class="setrow"><span>Corners</span>${seg("radius",[["sharp","Sharp"],["normal","Normal"],["round","Round"]])}</div>
      <div class="setrow"><span>JEE countdown in the sidebar</span>${seg("countdown",[[true,"Show"],[false,"Hide"]])}</div>

  /* study log → planner */
  const rs = ASYAPI ? ASYAPI.rsubj() : [];
  const ts = ASYAPI ? ASYAPI.types() : [];
  const acts = everyActivity();
  const mapping = `<section class="panel setsec" id="set-planner">
    <div class="eyebrow">Study log → planner</div><h2>What each session counts as in the planner</h2>
    <p class="sub">Every session you time or add in the Study log is written into that day in the planner, as actual studied time in the study block it happened in — or, if it happened outside your study blocks, as an entry of its own in the Actual column at the time you studied. For each activity choose its <b>subject</b> there — one of the planner's subjects, <b>Anything</b>, or leave it out of the planner — and its <b>type of study</b>, such as Self study or Practice / HW.</p>
    ${!ASYAPI?`<div class="hint">The planner is still starting…</div>`:`
    <div class="maptbl">${acts.map(a=>{ const cur = (S.ig.actMap||{})[a.id] || actTarget(a.id);
      return `<div class="maprow"><span class="mapname"><i style="background:${a.c}"></i>${esc(a.n)}${actHidden(a.id)?' <span class="tagx">hidden</span>':""}</span>
        <span class="mapsel"><select data-actmap="${esc(a.id)}" title="Subject in the planner">${rs.map(r=>`<option value="${esc(r.id)}"${cur===r.id?" selected":""}>${esc(r.name)}</option>`).join("")}
          <option value="any"${cur==="any"?" selected":""}>Anything</option><option value="none"${cur==="none"?" selected":""}>Don't log in the planner</option></select>
        <select data-acttype="${esc(a.id)}" title="Type of study in the planner"${cur==="none"?" disabled":""}><option value="">Type: the block's own</option>${ts.map(t=>`<option value="${esc(t.id)}"${actType(a.id)===t.id?" selected":""}>${esc(t.name)}</option>`).join("")}</select></span></div>`; }).join("")}</div>

    <div class="hint">A session that overlaps one of these blocks goes into it. One that only overlaps other blocks — a lecture, school, a test — or no block at all is recorded as an entry of its own in the Actual column, at the time you studied, and your plan is left as it was.</div>
    <div class="hint"><b>Type of study</b> is given to the entry made for a session that happened outside your study blocks — during a lecture, say — and to each part when a block is split by subject. A session that lands in a study block you planned leaves that block's own type alone. Breaks never receive study time.</div>
    <div class="hint">Sessions from ${esc(S.ig.plFrom||todayKey())} on are written to the planner — the day the two apps were joined, so days you had already planned are left as they were. Subjects you add in the planner's Settings appear here too.</div>`}
  </section>`;

  /* chapter links */
  let links = "";
  if(ASYAPI){
    const map = idLinks(), all = ASYAPI.chapters(), chs = all.filter(c=>c.subj===setLinkSub);
    const sc = ID_SUB[setLinkSub];
    const pool = sc && subjOf(sc) ? allChapters(sc).map(ch=>({k:sc+":"+ch.no, ch, src:btChapterSource(sc,ch)})) : [];
    const state = l => !l.length ? "none" : l.some(x=>x.fuzzy) ? "fuzzy" : "ok";
    const stats = {ok:0, fuzzy:0, none:0};
    all.forEach(c=>stats[state(map[c.id]||[])]++);
    const subStats = {}; ["phy","chem","math"].forEach(sj=>{ subStats[sj] = all.filter(c=>c.subj===sj && state(map[c.id]||[])!=="ok").length; });
    const same = (a2,b2) => idTokens(a2).join(" ")===idTokens(b2).join(" ");
    const groups = {}; pool.forEach(p2=>{ (groups[p2.src] = groups[p2.src] || []).push(p2); });
    const rows = chs.filter(c=>setLinkFilter==="all" || state(map[c.id]||[])===setLinkFilter).map(c=>{
      const l = map[c.id]||[], st = state(l);
      const chips = l.map(x=>{ const [s2,no] = x.k.split(":"), ch = chapOf(s2,no); if(!ch) return "";
        const src = btChapterSource(s2,ch), label = same(ch.name, c.name) ? "Ch "+chLabel(ch) : chTitle(ch);
        return `<span class="lk-chip ${x.fuzzy?"fz":""}" title="${esc(chTitle(ch))} — ${esc(src)}${x.fuzzy?" · matched by a similar name, worth checking":""}">
          <i>${esc(srcShort(src))}</i><span>${esc(label)}</span><button data-unlink="${esc(c.id)}|${esc(x.k)}" title="Unlink" aria-label="Unlink">×</button></span>`; }).join("");
