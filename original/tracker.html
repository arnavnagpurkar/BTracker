function currentName(k){
  const p = k.split(":");
  if(p[0]==="s") return subjOf(p[1]) ? subjOf(p[1]).name : "";
  if(p[0]==="m"){ const m = modOf(p[1],p[2]); return m?m.name:""; }
  if(p[0]==="c"){ const c = chapOf(p[1],p[2]); return c?c.name:""; }
  if(p[0]==="e"){ const c = chapOf(p[1],p[2]); const x = c&&exOf(p[1],c,p[3]); return x?x.name:""; }
  return "";
}
function prompt2(title, body, label, value, opts){
  opts = opts||{};
  return new Promise(res=>{
    onEsc = ()=>res(null);
    openModal(`<h3>${esc(title)}</h3>${body?`<p>${esc(body)}</p>`:""}
      <div class="block"><div class="blabel">${esc(label)}</div>
      <input type="${opts.number?"number":"text"}" id="pv" value="${esc(value||"")}" ${opts.number?'min="1" max="2000"':""}></div>
      ${opts.second?`<div class="block"><div class="blabel">${esc(opts.second)}</div>
      <input type="number" id="pv2" min="1" max="2000" value="${esc(opts.secondValue||"")}" placeholder="e.g. 56"></div>`:""}
      <div class="msg bad" id="pmsg"></div>
      <div class="acts"><button class="btn" id="pNo">Cancel</button>
      <button class="btn primary" id="pYes">${esc(opts.ok||"Add")}</button></div>`);
    const input = modal.querySelector("#pv"); input.focus(); input.select();
    const done = ()=>{
      const val = input.value.trim();
      if(!val){ modal.querySelector("#pmsg").textContent = "Type a name first."; return; }
      if(opts.second){
        const raw = modal.querySelector("#pv2").value.trim();
        const n = parseInt(raw,10);
        if(raw && !(n>0 && n<=2000)){ modal.querySelector("#pmsg").textContent = "Questions must be a number between 1 and 2000."; return; }
        closeModal(); res({name:val, count:raw?n:0}); return;
      }
      closeModal(); res(val);
    };
    modal.querySelector("#pNo").onclick = ()=>{ closeModal(); res(null); };
    modal.querySelector("#pYes").onclick = done;
    modal.querySelectorAll("#pv,#pv2").forEach(el=>el.onkeydown = e=>{ if(e.key==="Enter") done(); });
  });
}

async function addSubject(){
  const code = freeSubjectCode();
  if(!code) return toast("You have reached the limit of extra subjects");
  const name = await prompt2("Add a subject","It starts empty — you can add modules inside it.","Subject name","",{ok:"Add subject"});
  if(!name) return;
  snapshot("add subject");
  S.x.subs.push({code, name, accent:PALETTE[S.x.subs.length % PALETTE.length]});
  S.x.mods[code] = [{id:1, name:"Module 1"}];
  buildTree(); markDirty(); location.hash = "#/"+code; render(); toastUndo("Subject added");
}
async function addModule(sc){
  const name = await prompt2("Add a module","","Module name","Module "+nextModuleId(sc),{ok:"Add module"});
  if(!name) return;
  snapshot("add module");
  (S.x.mods[sc] = S.x.mods[sc]||[]).push({id:nextModuleId(sc), name});
  buildTree(); markDirty(); render(); toastUndo("Module added");
}
async function addChapter(sc,m){
  const name = await prompt2("Add a chapter","","Chapter name","",{ok:"Add chapter"});
  if(!name) return;
  snapshot("add chapter");
  (S.x.chs[sc+"|"+m] = S.x.chs[sc+"|"+m]||[]).push({no:nextChapterNo(sc), name});
  buildTree(); markDirty(); render(); toastUndo("Chapter added");
}
async function addExercise(sc,cno){
  const ch = chapOf(sc,cno), code = freeExCode(ch);
  if(!code) return toast("This chapter cannot hold more exercises");
  const got = await prompt2("Add an exercise","","Exercise name","",
    {ok:"Add exercise", second:"How many questions? (optional)", secondValue:""});
  if(!got) return;
  snapshot("add exercise");
  (S.x.exs[sc+"|"+cno] = S.x.exs[sc+"|"+cno]||[]).push({code, name:got.name});
  if(got.count) S.x.cnt[key(sc,cno,code)] = got.count;
  buildTree(); markDirty(); render();
  toastUndo(got.count ? "Exercise added with "+got.count+" questions" : "Exercise added");
}
async function editChapter(sc, no){
  const ch = chapOf(sc, no); if(!ch) return;
  const mod = modOf(sc, ch.mod);
  onEsc = ()=>{};
  return new Promise(res=>{
    openModal(`<h3>Chapter</h3>
      <div class="block"><div class="blabel">Chapter name</div>
        <input type="text" id="cName" value="${esc(ch.name)}"></div>
      <div class="block"><div class="blabel">Number shown in ${esc(mod?mod.name:"this module")}</div>
        <input type="number" id="cNum" min="1" max="999" value="${chLabel(ch)}"></div>
      <div class="hint" style="margin-top:-10px">Only what you see changes. Everything you have recorded stays with this chapter.</div>
      <div class="msg bad" id="cMsg"></div>
      <div class="acts"><button class="btn" id="cNo">Cancel</button>
      <button class="btn primary" id="cYes">Save</button></div>`);
    const done = ()=>{
      const name = modal.querySelector("#cName").value.trim();
      const num = parseInt(modal.querySelector("#cNum").value,10);
      const msg = modal.querySelector("#cMsg");
      if(!name){ msg.textContent = "Give the chapter a name."; return; }
      if(!(num>0 && num<=999)){ msg.textContent = "The number has to be between 1 and 999."; return; }
      const clash = (mod?mod.chapters:[]).find(c=>c.no!==ch.no && chLabel(c)===num);
      if(clash){ msg.textContent = "Chapter "+num+" is already "+clash.name+" in this module."; return; }
      snapshot("edit chapter");
      if(name !== ch.name){
        let hit=null;
        Object.keys(S.x.chs).forEach(kk=>{ if(kk.split("|")[0]===sc) (S.x.chs[kk]||[]).forEach(c=>{ if(String(c.no)===String(no)) hit=c; }); });
        if(hit) hit.name = name; else S.x.ren["c:"+sc+":"+no] = name;
      }
      S.x.num["c:"+sc+":"+no] = num;
      buildTree(); markDirty(); closeModal(); render(); toastUndo("Chapter updated"); res(true);
    };
    modal.querySelector("#cNo").onclick = ()=>{ closeModal(); res(false); };
    modal.querySelector("#cYes").onclick = done;
    modal.querySelectorAll("#cName,#cNum").forEach(el=>el.onkeydown = e=>{ if(e.key==="Enter") done(); });
    const f = modal.querySelector("#cName"); f.focus(); f.select();
  });
}
async function renameThing(k){
  const parts0 = k.split(":");
  if(parts0[0]==="c") return editChapter(parts0[1], parts0[2]);
  const cur = currentName(k);
  const labels = {s:"Subject name", m:"Module name", c:"Chapter name", e:"Exercise name"};
  const name = await prompt2("Rename", "", labels[k.split(":")[0]]||"Name", cur, {ok:"Rename"});
  if(!name || name===cur) return;
  snapshot("rename");
  const p = k.split(":");
  if(p[0]==="s"){ const cs = S.x.subs.find(x=>x.code===p[1]); if(cs) cs.name = name; else S.x.ren[k]=name; }
  else if(p[0]==="m"){ const cm = (S.x.mods[p[1]]||[]).find(x=>String(x.id)===p[2]); if(cm) cm.name=name; else S.x.ren[k]=name; }
  else if(p[0]==="c"){
    let hit=null; Object.keys(S.x.chs).forEach(kk=>{ if(kk.split("|")[0]===p[1]) (S.x.chs[kk]||[]).forEach(c=>{ if(String(c.no)===p[2]) hit=c; }); });
    if(hit) hit.name = name; else S.x.ren[k]=name;
  }
  else if(p[0]==="e"){
    const ce = (S.x.exs[p[1]+"|"+p[2]]||[]).find(x=>x.code===p[3]);
    if(ce) ce.name = name; else S.x.ren[k]=name;
  }
  buildTree(); markDirty(); render(); toastUndo("Renamed to "+name);
}
async function changeCount(sc,cno,code){
  const ch = chapOf(sc,cno), cur = qCount(sc,ch,code);
  const raw = await prompt2("How many questions?","The table will grow or shrink to match.","Number of questions",String(cur),{number:true, ok:"Save"});
  if(raw===null) return;
  const v = parseInt(raw,10);
  if(!(v>0&&v<=2000)) return toast("Type a number between 1 and 2000");
  if(v<cur && !await ask("Shrink this exercise?", `Questions ${v+1} to ${cur} will be removed along with anything you recorded on them.`, "Shrink", true)) return;
  snapshot("question count");
  S.x.cnt[key(sc,cno,code)] = v; arrFor(sc,cno,code,v);
  buildTree(); markDirty(); render(); toastUndo("Now "+v+" questions");
}
async function deleteSubject(sc){
  const sub = subjOf(sc);
  if(!await ask("Delete "+sub.name+"?","Every chapter, exercise and tick inside it goes too.","Delete subject",true)) return;
  snapshot("delete subject");
  S.x.subs = S.x.subs.filter(x=>x.code!==sc);
  delete S.x.mods[sc];
  ["chs","exs"].forEach(f=>Object.keys(S.x[f]).forEach(k=>{ if(k.split("|")[0]===sc) delete S.x[f][k]; }));
  Object.keys(S.x.cnt).forEach(k=>{ if(k[0]===sc) delete S.x.cnt[k]; });
  dropKeys(Object.keys(S.d).filter(k=>k[0]===sc));
  S.h = S.h.filter(it=>it.s!==sc); S.hd = S.hd.filter(it=>it.s!==sc);
  buildTree(); markDirty(); location.hash="#/"; render(); toastUndo("Subject deleted");
}
async function deleteModule(sc,m){
  const mo = modOf(sc,m);
  if(!await ask("Delete "+mo.name+"?","Its chapters and everything recorded in them go too.","Delete module",true)) return;
  snapshot("delete module");
  mo.chapters.forEach(c=>{ dropKeys(keysOfChapter(sc,c.no));
    S.h = S.h.filter(it=>!(it.s===sc&&String(it.c)===String(c.no)));
    S.hd = S.hd.filter(it=>!(it.s===sc&&String(it.c)===String(c.no))); });
  S.x.mods[sc] = (S.x.mods[sc]||[]).filter(x=>String(x.id)!==String(m));
  delete S.x.chs[sc+"|"+m];
  buildTree(); markDirty(); location.hash="#/"+sc; render(); toastUndo("Module deleted");
}
async function deleteChapter(sc,cno){
  const ch = chapOf(sc,cno);
  if(!await ask("Delete "+ch.name+"?","Everything you recorded in this chapter goes too.","Delete chapter",true)) return;
  snapshot("delete chapter");
  const m = ch.mod;
  Object.keys(S.x.chs).forEach(k=>{ if(k.split("|")[0]===sc) S.x.chs[k] = S.x.chs[k].filter(c=>String(c.no)!==String(cno)); });
  delete S.x.exs[sc+"|"+cno];
  dropKeys(keysOfChapter(sc,cno));
  S.h = S.h.filter(it=>!(it.s===sc&&String(it.c)===String(cno)));
  S.hd = S.hd.filter(it=>!(it.s===sc&&String(it.c)===String(cno)));
  buildTree(); markDirty(); location.hash="#/"+sc+"/"+m; render(); toastUndo("Chapter deleted");
}
async function deleteExercise(sc,cno,code){
  const ch = chapOf(sc,cno), ex = exOf(sc,ch,code);
  if(!await ask("Delete "+ex.name+"?","Everything you recorded in it goes too.","Delete exercise",true)) return;
  snapshot("delete exercise");
  S.x.exs[sc+"|"+cno] = (S.x.exs[sc+"|"+cno]||[]).filter(e=>e.code!==code);
  dropKeys([key(sc,cno,code)]);
  delete S.x.cnt[key(sc,cno,code)];
  S.h = S.h.filter(it=>!(it.s===sc&&String(it.c)===String(cno)&&it.e===code));
  S.hd = S.hd.filter(it=>!(it.s===sc&&String(it.c)===String(cno)&&it.e===code));
  buildTree(); markDirty(); location.hash="#/"+sc+"/"+ch.mod+"/"+cno; render(); toastUndo("Exercise deleted");
}

/* ============================================================
   16. MODALS, TOASTS, SAVING
   ============================================================ */
function openModal(html){ modal.innerHTML = html; veil.hidden = false; delete modal.dataset.pane;
  const f = modal.querySelector("input,textarea,button"); if(f) f.focus(); }
/* Re-drawing a dialog that is already open keeps its scroll position and does
   not grab focus, so ticking a box never jumps the list under the pointer. */
function paintModal(pane, html){
  if(modal.dataset.pane === pane){
    const top = modal.scrollTop;
    modal.innerHTML = html; veil.hidden = false; modal.scrollTop = top;
  } else {
    openModal(html); modal.dataset.pane = pane;
  }
}
function closeModal(){ veil.hidden = true; onEsc = null; }
/* A dialog stays put unless it is closed deliberately. Clicking the backdrop
   used to dismiss it, which meant a drag that started inside the box and ended
   outside threw the work away. */
/* true only when a keystroke is meant for the page rather than a field */
function typingInto(el){
  return !!(el && (el.closest("input,textarea,select") || el.isContentEditable));
}
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && !typingInto(e.target)){
    e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y" && !typingInto(e.target)){ e.preventDefault(); redo(); return; }
  if(e.key === "n" || e.key === "N"){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(typingInto(e.target)) return;
    if(!veil.hidden) return;                       /* a dialog is already open */
    const a = addHereAction();
    if(!a) return;
    e.preventDefault(); closeFabMenu(); a.run();
    return;
  }
  if(e.key==="Escape"){
    if(!veil.hidden){ const f=onEsc; closeModal(); if(f) f(false); return; }
    if(!fabmenu.hidden){ closeFabMenu(); return; }
    if(sel.size) clearSelection();
  }
});
function ask(title, body, okLabel, danger){
  return new Promise(res=>{
    onEsc = res;
    openModal(`<h3>${esc(title)}</h3><p>${esc(body)}</p>
      <div class="acts"><button class="btn" id="mNo">Cancel</button>
      <button class="btn ${danger?"danger":"primary"}" id="mYes">${esc(okLabel)}</button></div>`);
    modal.querySelector("#mNo").onclick = ()=>{ closeModal(); res(false); };
    modal.querySelector("#mYes").onclick = ()=>{ closeModal(); res(true); };
  });
}
function toast(msg){
  const t = document.getElementById("toast");
  t.innerHTML = `<span>${esc(msg)}</span>`;
  t.hidden = false;
  clearTimeout(t._t); t._t = setTimeout(()=>{ t.hidden = true; }, 2400);
}
function toastUndo(msg, action){
  const t = document.getElementById("toast");
  t.innerHTML = `<span>${esc(msg)}</span><button id="tUndo">Undo</button>`;
  t.hidden = false;
  t.querySelector("#tUndo").onclick = ()=>{ t.hidden = true; (action || undo)(); };
  clearTimeout(t._t); t._t = setTimeout(()=>{ t.hidden = true; }, 6000);
}
document.getElementById("undoBtn").addEventListener("click", undo);
document.getElementById("redoBtn").addEventListener("click", redo);

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok = document.execCommand("copy"); }catch(_){}
    document.body.removeChild(ta); return ok;
  }
}
function downloadText(name, text){
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

document.getElementById("openSave").addEventListener("click", openSave);
function openSave(){
  const code = makeCode();
  const at = LS.get("qlog.at");
  const auto = LS.ok || at
    ? "Autosaved in this browser" + (at ? " at " + new Date(at).toLocaleString() : "")
    : "This browser is not letting the page store a backup, so keep a copy of the code.";
  openModal(`<h3>Save or load your progress</h3>
    <p>Everything is saved in this browser as you work. The code below is the copy you can carry to another device.</p>
    <div class="block"><div class="blabel">Your code right now</div>
      <textarea id="outCode" rows="5" readonly>${esc(code)}</textarea>
      <div class="acts" style="margin-top:8px">
        <button class="btn" id="doFile">Download .txt</button>
        <button class="btn primary" id="doCopy">Copy code</button></div>
      <div class="msg ${LS.ok||at?"good":"warn"}">${esc(auto)}</div></div>
    <div class="block"><div class="blabel">Load a saved code</div>
      <textarea id="inCode" rows="4" placeholder="Paste your code here"></textarea>
      <div class="hwrow" style="margin-top:8px"><button class="btn" id="pickFile">Open a .txt file</button>
        <input type="file" id="fileIn" accept=".txt,text/plain" style="display:none"></div>
      <div class="msg" id="loadMsg">${S.savedAt?esc("Loaded from a code saved on "+S.savedAt.toLocaleString()):""}</div>
      <div class="acts" style="margin-top:8px"><button class="btn" id="doLoad">Load code</button></div></div>
    <div class="acts"><button class="btn" id="doClose">Close</button></div>`);
  modal.querySelector("#outCode").addEventListener("focus", e=>e.target.select());
  modal.querySelector("#doCopy").onclick = async e=>{
    const ok = await copyText(code);
    if(ok){ markClean(); toast("Code copied"); e.target.textContent="Copied"; setTimeout(()=>{e.target.textContent="Copy code";},1600); }
    else { modal.querySelector("#outCode").select(); toast("Select the code and copy it manually"); }
  };
  modal.querySelector("#doFile").onclick = ()=>{
    const d = new Date();
    const time = String(d.getHours()).padStart(2,"0")+"-"+String(d.getMinutes()).padStart(2,"0");
    const name = "Cataloguer_"+dayKey(d)+"_"+time+".txt";
    downloadText(name, code);
    markClean(); toast("Saved as "+name);
  };
  modal.querySelector("#pickFile").onclick = ()=>modal.querySelector("#fileIn").click();
  modal.querySelector("#fileIn").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{ modal.querySelector("#inCode").value = String(rd.result).trim();
      const m = modal.querySelector("#loadMsg"); m.className="msg good"; m.textContent = "Loaded "+f.name+" — press Load code."; };
    rd.readAsText(f);
  };
  modal.querySelector("#doClose").onclick = closeModal;
  modal.querySelector("#doLoad").onclick = async ()=>{
    const msg = modal.querySelector("#loadMsg");
    let parsed;
    try{ parsed = readCode(modal.querySelector("#inCode").value); }
    catch(err){ msg.className="msg bad"; msg.textContent = err.message; return; }
    let done=0; Object.keys(parsed.d).forEach(k=>parsed.d[k].forEach(v=>{ if(isDone(v)) done++; }));
    if(!await ask("Load this code?",
      `It was saved on ${parsed.at.toLocaleString()} and holds ${done} solved questions${parsed.h.length?" and "+parsed.h.length+" homework lists":""}. Loading it replaces everything currently on this page.`,
      "Load code")) return;
    snapshot("load code");
    adoptCode(parsed);
    buildTree(); markClean(); autoSave();
    closeModal(); location.hash="#/"; render(); toastUndo("Progress loaded");
  };
}

(function start(){
  sizeTopbar();
  const backup = LS.get("qlog.backup");
  if(backup){ try{ adoptCode(readCode(backup)); }catch(e){} }
  migrateMarks();
  migrateAnalysis();
  if(!S.pom.kind) S.pom.kind = S.pom.endless ? "endless" : "pomo";
  rollRevisionReminders();
  applyTheme();
  migrateChapterCollisions();
  buildTree();
  TIMER.endless = S.pom.kind==="endless";
  beginPhase(S.pom.focus*60);
  paintUndo();
  paintRec();
  render();
  maybeShowUpdateNotice(REPAIRED_CHAPTERS);
  const dot = document.getElementById("dirtyDot");
  if(LS.get("qlog.at")) dot.classList.add("ok");
})();

window.addEventListener("beforeunload", e=>{
  if(TIMER.running){ e.preventDefault(); e.returnValue=""; return; }
  if(S.dirty && !LS.ok){ e.preventDefault(); e.returnValue=""; }
});
