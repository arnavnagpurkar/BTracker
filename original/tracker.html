<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Question Log — JEE tracker</title>
<style>
:root{
  color-scheme: dark;
  --ink:#0e1218; --ink-2:#141a23; --ink-3:#1b232e;
  --rule:#26303d; --rule-soft:#1e2732;
  --text:#e7edf5; --text-2:#93a3b8; --text-3:#5f7086;
  --ok:#3ecf8e; --no:#ff5f6d; --flag:#ffb03a; --hw:#7aa2ff; --cant:#a678f5;
  --math:#a78bfa; --phys:#4cc9f0; --chem:#ffa94d;
  --accent:#a78bfa; --r:10px; --tint:rgba(255,255,255,.02); --tint2:rgba(255,255,255,.05);
  --topbar-bg:rgba(14,18,24,.94);
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
/* alternate themes — only the base palette changes; subject colours,
   result colours (ok/no/flag/hw/cant) and accent stay put so nothing
   elsewhere in the app needs to know which theme is active */
:root[data-theme="red"]{
  --ink:#160b0c; --ink-2:#1e1113; --ink-3:#271619;
  --rule:#3a2226; --rule-soft:#2c1a1d;
  --text:#f5e9ea; --text-2:#b89a9c; --text-3:#836b6d;
  --topbar-bg:rgba(22,11,12,.94);
}
:root[data-theme="green"]{
  --ink:#0a120e; --ink-2:#101a14; --ink-3:#16241b;
  --rule:#233a2c; --rule-soft:#1b2c22;
  --text:#e8f2ec; --text-2:#9ab8a8; --text-3:#647d70;
  --topbar-bg:rgba(10,18,14,.94);
}
:root[data-theme="light"]{
  color-scheme: light;
  --ink:#f4f5f7; --ink-2:#ffffff; --ink-3:#eceef2;
  --rule:#d7dbe2; --rule-soft:#e3e6ec;
  --text:#161a20; --text-2:#4c5768; --text-3:#7c8798;
  --tint:rgba(10,15,25,.035); --tint2:rgba(10,15,25,.06);
  --topbar-bg:rgba(244,245,247,.88);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);
  background-image:linear-gradient(var(--tint) 1px,transparent 1px),
                   linear-gradient(90deg,var(--tint) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 120px}

.topbar{position:sticky;top:0;z-index:40;background:var(--topbar-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule-soft)}
.tbrow{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.tbrow.tabs{padding-top:0;padding-bottom:7px;gap:4px;overflow-x:auto;scrollbar-width:none}
.tbrow.tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--text-3);white-space:nowrap;border:1px solid transparent}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--text);border-color:var(--rule);background:var(--ink-2)}
.crumbs{display:flex;align-items:center;flex-wrap:nowrap;gap:2px;font-family:var(--mono);font-size:12.5px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{padding:3px 6px;border-radius:5px;color:var(--text-2);white-space:nowrap}
.crumb:hover{background:var(--ink-3);color:var(--text)}
.crumb.here{color:var(--text);cursor:default}
.sep{color:var(--text-3);padding:0 1px}
.tool{display:flex;align-items:center;gap:7px;flex:none;border:1px solid var(--rule);background:var(--ink-2);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.tool:hover{border-color:var(--accent)}
.hueSw{width:30px;height:30px;border-radius:8px;border:1px solid var(--rule)}
.srch{width:150px;max-width:34vw;background:var(--ink);border:1px solid var(--rule);border-radius:99px;
  padding:6px 12px;font-size:13px;color:var(--text);font-family:inherit}
.tbrow{position:relative}  /* anchor point for the dropdown */

.srchToggle{display:none}
@media (max-width:720px){
  .srch{display:none}
  .srchToggle{display:grid;place-items:center;padding:6px 10px;font-size:15px}
  .srch.open{
    display:block;
    position:absolute;
    top:100%;
    left:12px;
    right:12px;
    margin-top:8px;
    width:auto;max-width:none;
    background:var(--ink-2);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:8px 12px;
    z-index:80;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
.srchpanel{position:fixed;top:54px;left:12px;width:min(460px,94vw);max-height:64vh;overflow:auto;z-index:70;
  background:var(--ink-2);border:1px solid var(--rule);border-radius:12px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.srchpanel a{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--text)}
.srchpanel a:hover,.srchpanel a.on{background:var(--tint2)}
.srchpanel .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:8px 10px 4px}
.srchpanel .sub{color:var(--text-3);font-size:12px}
.tool:disabled{opacity:.35;cursor:not-allowed}
.tool.on{border-color:var(--hw);color:var(--hw)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--text-3)}
.dot.on{background:var(--flag);box-shadow:0 0 0 3px rgba(255,176,58,.16)}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.14)}
.badge{font-family:var(--mono);font-size:11px;background:var(--hw);color:#0a1020;border-radius:99px;padding:1px 6px;font-weight:700}
.badge.run{background:var(--ok);color:#08150f}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin:0 0 6px}
h1{font-size:27px;line-height:1.15;letter-spacing:-.02em;margin:0 0 4px;font-weight:700}
h2{font-size:19px;letter-spacing:-.01em;margin:0;font-weight:650}
h3.sec{font-size:16px;margin:34px 0 12px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--text-2);font-size:13.5px;margin:0 0 20px}
.pagehead{padding-top:24px;border-bottom:1px solid var(--rule-soft);padding-bottom:20px;margin-bottom:26px}
.pagehead .row-between{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead .row-between h1{flex:1 1 auto;min-width:0}

.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{display:block;width:100%;text-align:left;background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:20px;transition:border-color .12s,transform .12s;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-title{font-size:17px;font-weight:650;letter-spacing:-.01em}
.card-note{color:var(--text-3);font-size:12.5px;font-family:var(--mono);margin-top:14px;line-height:1.85}
.pct{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.pct.zero{color:var(--text-3)}
.tagx{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--rule);border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:middle}
.pen{margin-left:7px;font-size:12px;color:var(--text-3);padding:2px 5px;border-radius:5px;opacity:0;transition:opacity .12s}
.card:hover .pen,.node:hover .pen{opacity:1}
.pen:hover{background:var(--ink-3);color:var(--accent)}
@media (hover:none){.pen{opacity:.6}}
.subj{overflow:hidden;padding:24px 22px 22px}
.subj .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.subj h2{font-size:22px}
.subj .meta{font-family:var(--mono);font-size:12px;color:var(--text-3);margin-top:2px}
.rail{height:5px;border-radius:99px;background:var(--ink-3);overflow:hidden;margin-top:14px}
.rail > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ex .card-title{font-size:16px}
.ex-sub{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-top:2px}
.mosaic{display:flex;flex-wrap:wrap;gap:2.5px;margin:16px 0 4px}
.cell{width:7px;height:7px;border-radius:1.5px;background:var(--ink-3)}
.cell.c{background:var(--ok)} .cell.w{background:var(--no)}
.cell.d{background:var(--text-3)} .cell.x{background:var(--cant)}
.cell.f{box-shadow:inset 0 0 0 1.5px var(--flag)}
.stats{display:flex;gap:18px;margin-top:14px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-2);flex-wrap:wrap}
.stats b{font-weight:600;color:var(--text)}
.stats .k{color:var(--text-3);letter-spacing:.05em}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:var(--r);margin-bottom:14px}
.field{display:flex;align-items:center;gap:6px}
.field label,.blabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
select,.tin{background:var(--ink-3);border:1px solid var(--rule);border-radius:7px;padding:6px 9px;font-size:13px}
.spacer{flex:1}
.bulk{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{border:1px solid var(--rule);border-radius:7px;padding:6px 11px;font-size:13px;font-weight:550;background:var(--ink-3)}
.tbtn:hover{border-color:var(--accent)}
.tbtn.warn:hover{border-color:var(--flag);color:var(--flag)}
.tbtn.on{border-color:var(--accent);color:var(--accent)}

.sheet{border:1px solid var(--rule-soft);border-radius:var(--r);background:var(--ink-2);user-select:none}
.sheet > :first-child{border-radius:var(--r) var(--r) 0 0}
.sheet > :last-child{border-radius:0 0 var(--r) var(--r)}
.row{display:grid;grid-template-columns:62px 58px 122px minmax(100px,1fr) 132px 88px 40px;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--rule-soft);position:relative}
.row:first-child{border-top:none}
.head{border-top:none;background:var(--ink-3);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);position:sticky;top:var(--topbar-h,86px);z-index:5;padding-top:9px;padding-bottom:9px}
.row.done{background:rgba(62,207,142,.035)}
.row.cant{background:rgba(166,120,245,.10)}
.row.sel{background:rgba(122,162,255,.16)}
.row.hw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hw)}
.qn{font-family:var(--mono);font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;cursor:grab}
.sheet.dragging .qn{cursor:grabbing}
.row.done .qn{color:var(--text-2)}
.qn i{font-style:normal;font-size:8.5px;letter-spacing:.08em;color:var(--hw);border:1px solid rgba(122,162,255,.45);border-radius:3px;padding:0 3px}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:13px;color:transparent}
.check:hover{border-color:var(--text-2)}
.check.on{background:var(--ok);border-color:var(--ok);color:#08150f}
.bub{display:flex;gap:5px;align-items:center}
.bub button{width:26px;height:26px;border-radius:99px;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:13px;line-height:1;color:var(--text-3);flex:none}
.bub button:hover{border-color:var(--text-2);color:var(--text-2)}
.bub .c.on{background:var(--ok);border-color:var(--ok);color:#08150f}
.bub .w.on{background:var(--no);border-color:var(--no);color:#20060a}
.why{width:auto!important;padding:0 7px;height:22px!important;border-radius:6px!important;font-family:var(--mono);font-size:10px!important;letter-spacing:.06em;border-color:rgba(255,95,109,.45)!important;color:var(--no)!important}
.why:hover{background:rgba(255,95,109,.12)}
.note{width:100%;background:transparent;border:none;border-bottom:1px solid var(--rule-soft);padding:4px 2px;font-size:13px;color:var(--text-2);user-select:text}
.note::placeholder{color:#3d4b5c}
.note:focus{outline:none;border-bottom-color:var(--accent);color:var(--text)}
.marks{display:flex;gap:5px}
.flag,.cantb{border:1.5px solid var(--rule);border-radius:7px;padding:3px 7px;font-size:11px;font-family:var(--mono);letter-spacing:.05em;color:var(--text-3);white-space:nowrap}
.flag:hover,.cantb:hover{border-color:var(--text-2)}
.flag.on{border-color:var(--flag);color:var(--flag);background:rgba(255,176,58,.1)}
.cantb.on{border-color:var(--cant);color:var(--cant);background:rgba(166,120,245,.14)}
.stars{display:flex;gap:3px}
.stars button{font-size:17px;line-height:1;color:#333f4d;padding:1px}
.stars button:hover{color:var(--flag)}
.stars button.on{color:var(--flag)}
.empty{padding:34px 16px;text-align:center;color:var(--text-3);font-size:14px}
.hint{font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-top:10px;line-height:1.7}

.selbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--ink-3);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;box-shadow:0 12px 40px rgba(0,0,0,.55);width:max-content;max-width:calc(100vw - 24px)}
.selbar[hidden]{display:none}
.selbar .n{font-family:var(--mono);font-size:12px;color:var(--hw);padding-right:4px;white-space:nowrap}

.branch{border-left:1px solid var(--rule-soft);margin-left:9px;padding-left:16px}
.node{display:flex;align-items:center;gap:8px;padding:7px 0}
.twisty{width:20px;height:20px;border-radius:5px;border:1px solid var(--rule);display:grid;place-items:center;font-size:10px;color:var(--text-2);flex:none}
.twisty:hover{border-color:var(--accent)}
.node .nm{font-size:14px;font-weight:600}
.node .lv{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.hwitem{background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:9px;padding:13px 14px;margin:8px 0}
.hwitem.warnbox{border-color:rgba(255,176,58,.5)}
.hwitem.late{border-color:rgba(255,95,109,.55)}
.hwitem.fin{opacity:.6}
.hwhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hwhead .loc{font-size:14px;font-weight:600}
.hwhead .rng{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.hwhead .prog{font-family:var(--mono);font-size:12px;color:var(--hw);margin-left:auto}
.due{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-radius:5px;padding:1px 7px;color:var(--text-2)}
.due.soon{border-color:var(--flag);color:var(--flag)}
.due.over{border-color:var(--no);color:var(--no)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:11.5px;min-width:34px;padding:4px 6px;border-radius:6px;border:1px solid var(--rule);color:var(--text-3);background:var(--ink-3);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--text-2);color:var(--text-2)}
.chip.d{border-color:var(--text-3);color:var(--text-2)}
.chip.c{background:var(--ok);border-color:var(--ok);color:#08150f;font-weight:700}
.chip.w{background:var(--no);border-color:var(--no);color:#20060a;font-weight:700}
.chip.x{background:var(--cant);border-color:var(--cant);color:#15082a;font-weight:700}
.warntext{color:var(--flag);font-size:12.5px;font-family:var(--mono);margin-top:9px}
.x{color:var(--text-3);font-size:16px;line-height:1;padding:2px 5px;border-radius:5px}
.x:hover{color:var(--no);background:rgba(255,95,109,.1)}
.panel{background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:16px;margin-bottom:22px}
.hwrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plusbtn{width:32px;height:32px;border-radius:8px;border:1px dashed var(--rule);color:var(--text-2);font-size:17px;display:grid;place-items:center;flex:none}
.plusbtn:hover{border-color:var(--hw);color:var(--hw);border-style:solid}
.plusbtn:disabled{opacity:.35;cursor:not-allowed}

.fab{position:fixed;left:20px;bottom:20px;z-index:55;width:48px;height:48px;border-radius:99px;background:var(--accent);color:#0b0f14;font-size:24px;font-weight:600;display:grid;place-items:center;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.fab[hidden]{display:none}
.fab:hover{filter:brightness(1.1)}
.fabmenu{position:fixed;left:20px;bottom:78px;z-index:56;background:var(--ink-3);border:1px solid var(--rule);border-radius:11px;padding:6px;min-width:212px;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.fabmenu[hidden]{display:none}
.fabmenu button{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:7px;font-size:13.5px}
.fabmenu button:hover{background:var(--ink-2)}
.fabmenu button.danger{color:var(--no)}
.fabmenu .grp{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);padding:7px 11px 4px}

/* pomodoro */
.timerwrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap;justify-content:center;padding:26px 20px}
.clock{font-family:var(--mono);font-size:64px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.clock.brk{color:var(--ok)}
.ring{position:relative;width:330px;height:330px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%;display:block}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-top:6px}
.actbtn{border:1px solid var(--rule);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;background:var(--ink-3);display:flex;align-items:center;gap:7px}
.actbtn i{width:9px;height:9px;border-radius:99px;display:block;font-style:normal}
.actbtn.on{border-color:var(--accent);background:var(--tint2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.numin{width:74px;background:var(--ink-3);border:1px solid var(--rule);border-radius:7px;padding:6px 8px;font-size:13px;font-family:var(--mono)}

/* calendar + charts */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);text-align:center;padding-bottom:4px}
.day{aspect-ratio:1;border:1px solid var(--rule-soft);border-radius:7px;background:var(--ink-2);padding:5px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;justify-content:flex-start;min-height:52px}
.day.blank{border:none;background:none}
.day .dn{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.day.today{border-color:var(--accent)}
.day.on{border-color:var(--rule)}
.day.pick{outline:2px solid var(--accent);outline-offset:1px}
.day .tot{font-family:var(--mono);font-size:9.5px;color:var(--text-2);margin-top:auto}
.chartrow{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:18px;margin-bottom:16px}
.lg{display:flex;flex-direction:column;gap:7px;min-width:200px;flex:1}
.lg div{display:flex;align-items:center;gap:8px;font-size:13px}
.lg i{width:10px;height:10px;border-radius:3px;display:block;flex:none}
.lg b{margin-left:auto;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .l{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-top:3px}

/* marks tables */
.tabstrip{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ttab{border:1px solid var(--rule);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--text-3);background:var(--ink-2);display:flex;align-items:center;gap:6px}
.ttab.on{color:var(--text);border-color:var(--accent)}
.tblwrap{overflow-x:auto;border:1px solid var(--rule-soft);border-radius:var(--r);background:var(--ink-2)}
table.mk{border-collapse:collapse;width:100%;min-width:760px}
table.mk th,table.mk td{border-bottom:1px solid var(--rule-soft);border-right:1px solid var(--rule-soft);padding:0;text-align:left}
table.mk th{background:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:9px 10px;white-space:nowrap;position:relative}
table.mk th .pen{position:static;opacity:.5;margin-left:4px}
table.mk td input{width:100%;background:transparent;border:none;padding:9px 10px;font-size:13.5px;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.mk td input:focus{outline:none;background:var(--ink-3)}
table.mk td.calc{padding:9px 10px;font-family:var(--mono);font-size:13.5px;color:var(--accent);font-variant-numeric:tabular-nums}
table.mk tr:hover td{background:var(--tint)}
table.mk td.del{width:38px;text-align:center}
.grip{cursor:grab;color:var(--text-3);font-size:13px;line-height:1;padding:0 4px;user-select:none;display:inline-block}
.grip:hover{color:var(--text)}
.grip:active{cursor:grabbing}
table.mk td.grab{width:26px;text-align:center;padding:0}
table.mk tr.dragging{opacity:.4}
table.mk tr.dropzone td{box-shadow:inset 0 2px 0 var(--accent)}
table.mk th.dropcol{box-shadow:inset 2px 0 0 var(--accent)}

.veil{position:fixed;inset:0;background:rgba(6,9,13,.72);display:grid;place-items:center;padding:16px;z-index:100}
.veil[hidden]{display:none}
.modal{background:var(--ink-2);border:1px solid var(--rule);border-radius:14px;padding:20px;width:min(560px,100%);max-height:86vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:18px;letter-spacing:-.01em}
.modal p{margin:0 0 14px;color:var(--text-2);font-size:13.5px}
.modal textarea,.modal input[type=text],.modal input[type=number],.modal input[type=date]{width:100%;background:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:10px;font-size:14px;color:var(--text)}
.modal textarea{font-family:var(--mono);font-size:11.5px;word-break:break-all;resize:vertical}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--ink-3);border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--text-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0f14}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--no);border-color:rgba(255,95,109,.4)}
.btn.danger:hover{background:rgba(255,95,109,.12);border-color:var(--no)}
.block{margin-bottom:18px}
.blabel{margin-bottom:7px}
.msg{font-size:12.5px;margin-top:8px;font-family:var(--mono)}
.msg.good{color:var(--ok)} .msg.bad{color:var(--no)} .msg.warn{color:var(--flag)}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:8px;border:1px solid var(--rule-soft);cursor:pointer;font-size:14px}
.opt:hover{border-color:var(--rule)}
.opt.on{border-color:var(--no);background:rgba(255,95,109,.09)}
.opt .bx{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:11px;color:transparent;flex:none}
.opt.on .bx{background:var(--no);border-color:var(--no);color:#20060a}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--ink-3);border:1px solid var(--rule);border-radius:99px;padding:9px 12px 9px 18px;font-size:13px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.45);display:flex;align-items:center;gap:12px}
.toast[hidden]{display:none}
.toast button{font-size:12.5px;font-weight:700;color:var(--accent);border:1px solid var(--rule);border-radius:99px;padding:3px 11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:18px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:block}

.bm{border:1.5px solid var(--rule);border-radius:7px;padding:3px 7px;color:var(--text-3);display:grid;place-items:center}
.bm:hover{border-color:var(--text-2);color:var(--text-2)}
.bm.on{border-color:var(--hw);color:var(--hw);background:rgba(122,162,255,.12)}
.opt.ro{opacity:.55;cursor:default}
.srdot{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--no);margin-right:7px;vertical-align:middle}

/* stats-recording banner */
.banner{background:rgba(255,176,58,.12);border:1px solid rgba(255,176,58,.45);border-radius:var(--r);
  padding:10px 14px;margin:18px 0 0;display:flex;align-items:center;gap:12px;font-size:13.5px;flex-wrap:wrap}
.banner b{color:var(--flag)}
.tool.paused{border-color:var(--flag);color:var(--flag)}

/* homework chip selection */
.chips{user-select:none}
.chip.sel{outline:2px solid var(--hw);outline-offset:1px}
.chip{cursor:pointer}

/* vertical bars inside a calendar day */
.day .bars{display:flex;align-items:flex-end;gap:3px;flex:1;min-height:20px;width:100%;margin:4px 0 2px}
.day .bars i{display:block;border-radius:2px 2px 0 0;min-height:2px}

/* deadlines */
.dl{background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:16px;margin-bottom:12px}
.dl.near{border-color:rgba(255,176,58,.5)} .dl.past{border-color:rgba(255,95,109,.5)}
.dlhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dlhead .nm{font-size:16px;font-weight:650}
.dlhead .when{font-family:var(--mono);font-size:12px;color:var(--text-2)}
.dlsubs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dlsubs i{font-style:normal;font-family:var(--mono);font-size:10.5px;border-radius:5px;padding:2px 8px;border:1px solid var(--rule)}
.dltext{font-size:13.5px;color:var(--text-2);white-space:pre-wrap;margin-top:8px}
.dltext .blabel{margin-bottom:3px}
.setrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--rule-soft)}
.setrow:first-of-type{border-top:none}
.setrow .lbl{flex:1;font-size:14px}
.sw{width:44px;height:25px;border-radius:99px;background:var(--ink-3);border:1px solid var(--rule);position:relative;flex:none}
.sw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:99px;background:var(--text-3);transition:all .14s;display:block}
.sw.on{background:rgba(62,207,142,.25);border-color:var(--ok)}
.sw.on i{left:21px;background:var(--ok)}

/* bookmark */
.bm{font-size:14px;line-height:1;color:#3a4757;padding:2px 4px;border-radius:5px;margin-left:6px}
.bm:hover{color:var(--hw)}
.bm.on{color:var(--hw)}
.row.jump{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:rgba(122,162,255,.35)}100%{background:transparent}}

/* collections */
.colrow{display:flex;gap:12px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:9px;padding:12px 14px;margin-bottom:8px}
.colrow .qnum{font-family:var(--mono);font-size:13px;color:var(--text-2);flex:none;min-width:44px}
.colrow .where{font-size:13px;color:var(--text-3);font-family:var(--mono)}
.colrow .body{flex:1;min-width:0}
.colrow .nt{font-size:13.5px;margin-top:5px;color:var(--text)}
.colrow .acts2{display:flex;gap:6px;align-items:center;flex:none}
.dotres{width:9px;height:9px;border-radius:99px;display:inline-block;vertical-align:middle;margin-right:6px}

/* speedrun */
.srveil{position:fixed;inset:0;background:rgba(6,9,13,.94);z-index:150;display:grid;place-items:center;padding:18px;overflow:auto}
.srveil[hidden]{display:none}
.srwrap{width:min(940px,100%);text-align:center}
.srrings{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;margin:22px 0}
.srring{position:relative;width:230px;height:230px;flex:none}
.srring svg{transform:rotate(-90deg);width:100%;height:100%;display:block}
.srring .mid{position:absolute;inset:0;display:grid;place-items:center}
.srring .big{font-family:var(--mono);font-size:42px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1}
.srring .cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-top:8px}
.srtap{cursor:pointer;border:none;background:none;padding:0}
.srtap:hover .big{color:var(--ok)}
.srpace{font-family:var(--mono);font-size:34px;font-weight:650}
.srhw{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.srbox{border:1px solid var(--rule);border-radius:9px;padding:9px 12px;text-align:left;min-width:170px;max-width:260px;background:var(--ink-2)}
.srbox.on{border-color:var(--hw);background:rgba(122,162,255,.10)}
.srbox b{display:block;font-size:13.5px}
.srbox span{font-family:var(--mono);font-size:11px;color:var(--text-3)}

/* maths */
math{font-size:1.06em}
math[display="block"]{display:block;margin:8px 0}
.texfail{color:var(--no);font-family:var(--mono);font-size:.92em}
.mprev{background:var(--ink);border:1px dashed var(--rule);border-radius:8px;padding:9px 11px;margin-top:8px;font-size:14.5px;line-height:1.7;overflow-x:auto}
.mprev[hidden]{display:none}
.mhint{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:7px;line-height:1.8}
.mhint code{background:var(--ink-3);border-radius:4px;padding:1px 5px}

.man h3.sec{margin-top:38px}
.man h3.sec:first-child{margin-top:0}
.man p{color:var(--text-2);line-height:1.7;font-size:14px}
.man ul{color:var(--text-2);line-height:1.8;font-size:14px;padding-left:20px}
.man li{margin-bottom:4px}
.man details{background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:9px;padding:12px 14px;margin-bottom:8px}
.man summary{cursor:pointer;font-weight:600;font-size:14.5px;list-style:none}
.man summary::-webkit-details-marker{display:none}
.man summary::before{content:"▸ ";color:var(--text-3);font-family:var(--mono)}
.man details[open] summary::before{content:"▾ "}
.man details p{margin-top:9px}
.man .diagram{background:var(--ink-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:18px;margin:14px 0;overflow-x:auto}
.man kbd{background:var(--ink-3);border:1px solid var(--rule);border-radius:5px;padding:1px 7px;font-family:var(--mono);font-size:12px}
.man .tip{border-left:3px solid var(--hw);background:rgba(122,162,255,.07);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0;font-size:13.5px;color:var(--text-2)}

@media (max-width:860px){ .g3,.g2{grid-template-columns:1fr} .grid{gap:14px} .card{padding:16px} }
@media (max-width:720px){
  .row{grid-template-columns:auto auto 1fr auto;grid-template-areas:"qn note note note" "chk bub stars flag";row-gap:10px;column-gap:10px;padding:11px 12px}
  .row .qn{grid-area:qn} .row .c-chk{grid-area:chk} .row .c-bub{grid-area:bub}
  .row .c-note{grid-area:note} .row .c-stars{grid-area:stars;justify-self:start;margin-left:4px}
  .row .c-flag{grid-area:flag;justify-self:end}
  .row .c-bm{grid-area:qn;justify-self:end;margin-right:2px}
  .head{display:none}
  .toolbar{gap:10px} .toolbar .spacer{display:none}
  .bulk{flex-basis:100%} .bulk .tbtn{flex:1 1 auto}
  h1{font-size:23px}
  .tbrow{padding:8px 12px;gap:8px}
  .tool{padding:6px 10px;font-size:12px}
  .wrap{padding:0 12px 120px}
  .branch{padding-left:11px;margin-left:6px}
  .selbar{bottom:12px;gap:6px;padding:9px}
  .selbar .tbtn{font-size:12px;padding:6px 9px}
  .fab{left:14px;bottom:14px} .fabmenu{left:14px;bottom:70px}
  .clock{font-size:52px} .ring{width:250px;height:250px}
  .srring{width:150px;height:150px} .srring .big{font-size:27px} .srrings{gap:12px}
  .day{min-height:40px;padding:3px}
  .day .tot{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ============================================================
   READABLE DROPDOWNS
   The popup a browser draws for a <select> does not inherit the
   page's colours, so options were pale text on the platform's own
   pale background. These name both sides outright.
   ============================================================ */
select{
  background-color:var(--ink-3); color:var(--text);
  background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),
                   linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 10px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  -webkit-appearance:none;appearance:none;padding-right:30px;
}
select option,select optgroup{background-color:#141a23;color:#e7edf5}
:root[data-theme="red"] select option{background-color:#1e1113;color:#f5e9ea}
:root[data-theme="green"] select option{background-color:#101a14;color:#e8f2ec}
:root[data-theme="light"] select option{background-color:#ffffff;color:#161a20}
select option:checked,select option:hover{background-color:var(--accent);color:#0b0f14}
select:hover{border-color:var(--accent)}
input[type="date"],input[type="time"],input[type="number"],input[type="search"],input[type="text"],textarea{
  background-color:var(--ink-3);color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--text-3)}

/* ============================================================
   NEON — a glow keyed to whatever colour the thing already uses,
   so subjects, modules and themes keep their own identity, and
   movement that is quick enough to read as feedback.
   ============================================================ */
:root{
  --ease:cubic-bezier(.22,.9,.28,1);
  --glow:color-mix(in srgb,var(--accent) 60%,transparent);
  --glow-soft:color-mix(in srgb,var(--accent) 24%,transparent);
  --glow-dim:color-mix(in srgb,var(--accent) 12%,transparent);
}
:root[data-theme="light"]{
  --glow:color-mix(in srgb,var(--accent) 38%,transparent);
  --glow-soft:color-mix(in srgb,var(--accent) 16%,transparent);
  --glow-dim:color-mix(in srgb,var(--accent) 8%,transparent);
}
a,button,.card,.panel,.tab,.tbtn,.btn,.tool,.chip,.opt,.actbtn,.pen,.kpi,.hwitem,.dl,.day,.cell,
.check,.bub button,.flag,.srbox,.ttab,.srchpanel a,.sw,.bm,.hueSw,select,input,textarea,.twisty,.x{
  transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),
             box-shadow .28s var(--ease),transform .18s var(--ease),opacity .2s var(--ease),filter .2s var(--ease);
}
button:active,.card:active,.chip:active,.opt:active,.day:active,.cell:active{transform:scale(.97)}

/* the headline glow */
h1{text-shadow:0 0 26px var(--glow-soft)}
.pagehead h1{text-shadow:0 0 30px var(--glow-soft)}
.eyebrow{text-shadow:0 0 14px var(--glow-dim)}
.pct{text-shadow:0 0 16px var(--glow-soft)}

/* cards lift and light up */
.card{transition:border-color .2s var(--ease),transform .2s var(--ease),box-shadow .28s var(--ease)}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--accent);
  box-shadow:0 12px 34px rgba(0,0,0,.42),0 0 26px var(--glow-soft)}
.panel:hover{border-color:var(--rule)}
.kpi:hover{border-color:var(--accent);box-shadow:0 0 20px var(--glow-dim);transform:translateY(-2px)}

/* anything switched on hums */
.tab.on{box-shadow:0 0 18px var(--glow-soft);text-shadow:0 0 14px var(--glow)}
.tbtn:hover,.tool:hover,.btn:hover,.actbtn:hover{border-color:var(--accent)}
.tbtn.on{box-shadow:0 0 16px var(--glow-soft);text-shadow:0 0 10px var(--glow-soft)}
.actbtn.on{box-shadow:0 0 16px var(--glow-soft)}
.btn.primary{box-shadow:0 0 20px var(--glow-soft)}
.btn.primary:hover{box-shadow:0 0 34px var(--glow);transform:translateY(-1px)}
.btn.danger:hover{box-shadow:0 0 26px color-mix(in srgb,var(--no) 45%,transparent)}
.opt.on{box-shadow:0 0 16px var(--glow-dim)}
.opt:hover{border-color:var(--accent)}
.sw.on{box-shadow:0 0 16px var(--glow-soft)}
.check.on{box-shadow:0 0 14px color-mix(in srgb,var(--ok) 55%,transparent)}
.flag.on{box-shadow:0 0 14px color-mix(in srgb,var(--flag) 55%,transparent)}
.cantb.on{box-shadow:0 0 14px color-mix(in srgb,var(--cant) 55%,transparent)}
.bm.on{box-shadow:0 0 14px color-mix(in srgb,var(--flag) 45%,transparent)}
.chip.c{box-shadow:0 0 14px var(--glow)}
.chip.d{box-shadow:0 0 12px color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.w{box-shadow:0 0 12px color-mix(in srgb,var(--no) 45%,transparent)}
.chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.cell.c,.cell.d{box-shadow:0 0 10px color-mix(in srgb,var(--ok) 35%,transparent)}
.day.on,.day.pick{box-shadow:0 0 16px var(--glow-soft)}
.srbox.on{box-shadow:0 0 16px var(--glow)}
.ttab.on{box-shadow:0 0 14px var(--glow-soft)}
.crumb.here{text-shadow:0 0 12px var(--glow-dim)}

/* bars and rails run rather than jump */
.rail{box-shadow:inset 0 0 0 1px var(--rule-soft)}
.rail > i{transition:width .65s var(--ease);box-shadow:0 0 14px var(--glow);
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,#fff 0%),var(--accent))}
.lg > i,.chartrow i{transition:width .6s var(--ease)}

/* the top bar and the floating button */
.topbar{box-shadow:0 8px 28px rgba(0,0,0,.28)}
.srch:focus{box-shadow:0 0 20px var(--glow-soft)}
.srchpanel{animation:popIn .18s var(--ease) both}
.srchpanel a:hover,.srchpanel a.on{box-shadow:inset 0 0 0 1px var(--glow-soft)}
.fab{box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 28px var(--glow);animation:breathe 4.5s ease-in-out infinite}
.fab:hover{transform:translateY(-2px) rotate(90deg);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 40px var(--glow)}
.fabmenu{animation:popIn .18s var(--ease) both}
.plusbtn:hover{border-color:var(--accent);box-shadow:0 0 18px var(--glow-dim)}

/* the save dot, alive while there is something to save */
.dot.on{box-shadow:0 0 10px var(--flag);animation:pulse 1.8s ease-in-out infinite}
.dot.ok{box-shadow:0 0 10px var(--ok)}
.badge.run{animation:pulse 2s ease-in-out infinite}

/* dialogs, veils and toasts arrive rather than appear */
.veil{animation:fadeIn .16s ease both;backdrop-filter:blur(3px)}
.modal{animation:riseIn .24s var(--ease) both;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 40px var(--glow-dim)}
.toast{animation:riseIn .22s var(--ease) both;box-shadow:0 8px 30px rgba(0,0,0,.45),0 0 24px var(--glow-dim)}
.srveil{animation:fadeIn .2s ease both}
.banner{animation:riseIn .3s var(--ease) both}

/* charts: points answer the pointer */
svg circle[data-spidernode],svg circle[data-scatnode],svg circle[data-lineday],svg circle[data-mkpoint]{
  transition:filter .2s var(--ease),opacity .2s var(--ease)}
svg circle[data-spidernode]:hover,svg circle[data-scatnode]:hover,
svg circle[data-lineday]:hover,svg circle[data-mkpoint]:hover{filter:brightness(1.35) drop-shadow(0 0 7px currentColor)}
svg polygon[fill-opacity]{transition:fill-opacity .3s var(--ease)}
.ring svg circle,.srring svg circle{transition:stroke-dashoffset .5s var(--ease)}

/* a page settles in once, on arriving — never on a repaint in place,
   so a running timer does not blink every half second */
#app.anim > *{animation:riseIn .32s var(--ease) both}
#app.anim > *:nth-child(2){animation-delay:.04s}
#app.anim > *:nth-child(3){animation-delay:.08s}
#app.anim > *:nth-child(n+4){animation-delay:.12s}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes breathe{0%,100%{box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 22px var(--glow)}
  50%{box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 40px var(--glow)}}

/* anyone who has asked for less movement gets none of it */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .card:hover,.kpi:hover,.btn.primary:hover,.fab:hover{transform:none}
}
/* ============================================================
   THE SIDEBAR, THE PLANNER, SETTINGS, FILES, OVERVIEW
   ============================================================ */
:root{--side-w:214px}
html.side-col{--side-w:62px}
body{padding-left:var(--side-w);transition:padding-left .22s var(--ease,ease)}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side-w);z-index:62;display:flex;flex-direction:column;gap:6px;
  background:var(--ink-2);border-right:1px solid var(--rule-soft);padding:12px 8px 10px;overflow:hidden;
  transition:width .22s var(--ease,ease),transform .22s var(--ease,ease);box-shadow:8px 0 30px rgba(0,0,0,.18)}
.side-top{display:flex;align-items:center;gap:10px;padding:4px 8px 10px;white-space:nowrap}
.side-logo{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#0b0f14;
  background:linear-gradient(135deg,var(--accent),#4cc9f0);box-shadow:0 0 18px var(--glow-soft,transparent)}
.side-name{font-size:16px;letter-spacing:.01em}
.side-nav{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;display:flex;flex-direction:column;gap:6px}
.side-nav::-webkit-scrollbar{display:none;width:0;height:0}
.sgrp{display:flex;flex-direction:column;gap:1px}
.sgrp.solo{margin-top:4px;padding-top:6px;border-top:1px solid var(--rule-soft)}
.sg-h{display:flex;align-items:center;gap:6px;width:100%;padding:6px 10px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-3);text-align:left;white-space:nowrap}
.sg-h:hover{color:var(--text-2)}
.sg-h .car{margin-left:auto}
.sgrp.shut .sg-b{display:none}
.sn{position:relative;display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:9px;color:var(--text-2);font-size:13.5px;
  font-weight:500;white-space:nowrap;border:1px solid transparent}
.sn .g{width:20px;flex:none;text-align:center;font-size:15px;line-height:1;color:var(--text-3)}
.sn:hover{background:var(--tint2);color:var(--text)}
.sn.on{background:var(--ink-3);color:var(--text);border-color:var(--rule)}
.sn.on .g{color:var(--accent);text-shadow:0 0 12px var(--glow,transparent)}
.sn.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.sn .badge{margin-left:auto}
.side-foot{display:flex;flex-direction:column;gap:8px;padding:4px 4px 0}
.side-cd{padding:9px 10px;border:1px solid var(--rule);border-radius:10px;background:var(--ink);font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden}
.side-cd b{font-size:18px;color:var(--text);margin-right:2px;font-variant-numeric:tabular-nums}
.side-colbtn{border:1px solid var(--rule);border-radius:9px;padding:7px;color:var(--text-3);font-size:12.5px;white-space:nowrap}
.side-colbtn:hover{color:var(--text);border-color:var(--accent)}
html.side-col .sn .l, html.side-col .side-name, html.side-col .sg-h .l, html.side-col .side-cd .l, html.side-col .sn .badge{display:none}
html.side-col .sg-h{justify-content:center;padding:6px 0 4px}
html.side-col .sg-h .car{margin:0}
html.side-col .sn{justify-content:center;padding:8px 0}
html.side-col .side-top{justify-content:center;padding:4px 0 10px}
html.side-col .side-cd{text-align:center;padding:8px 2px}
.menuBtn{display:none}
.side-scrim{display:none}
.fab{left:calc(var(--side-w) + 20px)}
.fabmenu{left:calc(var(--side-w) + 20px)}
.srchpanel{left:calc(var(--side-w) + 14px)}
@media (max-width:860px){
  body{padding-left:0}
  .side{width:250px;transform:translateX(-102%)}
  html.side-col .side{width:250px}
  html.side-col .sn .l, html.side-col .side-name, html.side-col .sg-h .l, html.side-col .side-cd .l, html.side-col .sn .badge{display:initial}
  html.side-col .sn{justify-content:flex-start;padding:7px 10px}
  html.side-open .side{transform:none}
  html.side-open .side-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:61}
  .menuBtn{display:grid;place-items:center;padding:6px 10px;font-size:15px}
  .side-colbtn{display:none}
  .fab,.fabmenu{left:14px} .srchpanel{left:12px}
}
/* the planner fills the space under the top bar */
#asyHost{display:none}
#asyHost.on{display:block;height:calc(100vh - var(--topbar-h,56px));height:calc(100dvh - var(--topbar-h,56px))}
#asyHost iframe{display:block;width:100%;height:100%;border:0;background:transparent}
body.planner #app, body.planner .fab, body.planner .fabmenu{display:none !important}
body.planner{overflow:hidden}
/* settings */
.setnav{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 18px}
.setsec{margin-bottom:20px;scroll-margin-top:calc(var(--topbar-h,56px) + 12px)}
.setsec h2{margin:4px 0 6px;font-size:20px}
.palrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.palsw{display:flex;flex-direction:column;gap:6px;align-items:flex-start;width:118px;font-size:12px;color:var(--text-2);text-align:left}
.palsw .pv{width:100%;height:40px;border-radius:9px;border:1px solid var(--rule);display:flex;align-items:center;gap:6px;padding:0 10px}
.palsw .pv i{width:11px;height:11px;border-radius:99px}
.palsw.on .pv{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px var(--glow-soft,transparent)}
.palsw.on{color:var(--text)}
.card.preset.on{border-color:var(--accent);box-shadow:0 0 22px var(--glow-soft,transparent)}
.setgrid{display:grid;gap:10px;margin-top:18px}
.setrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;padding:8px 0;border-top:1px solid var(--rule-soft)}
.setrow > span{font-size:14px;color:var(--text-2)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:99px;overflow:hidden;background:var(--ink)}
.seg button{padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--text-3)}
.seg button.on{background:var(--ink-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.maptbl{display:grid;gap:6px;margin:12px 0}
.maprow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:7px 10px;border:1px solid var(--rule-soft);border-radius:9px;background:var(--ink)}
.mapname{display:flex;align-items:center;gap:9px;font-size:14px}
.mapsel{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.recvrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 4px}
.mapname i{width:10px;height:10px;border-radius:99px;display:inline-block}
.linklist{display:grid;gap:6px;max-height:560px;overflow:auto;padding-right:4px}
.linkrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--rule-soft);border-left:3px solid var(--ok);border-radius:9px;background:var(--ink)}
.linkrow.fuzzy{border-left-color:var(--flag)} .linkrow.none{border-left-color:var(--text-3)}
.linkrow b{font-weight:600;min-width:180px}
.linkchips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.lchip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 9px;border-radius:99px;border:1px solid var(--rule);font-size:12.5px;background:var(--ink-2)}
.lchip i{font-style:normal;color:var(--text-3)}
.lchip.fz{border-color:var(--flag)}
.lchip button{width:20px;height:20px;border-radius:99px;color:var(--text-3)} .lchip button:hover{color:var(--no)}
/* files */
.fsbar{align-items:center}
.fscrumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13.5px}
.fscrumbs a{padding:4px 8px;border-radius:7px;color:var(--text-2);border:1px dashed transparent}
.fscrumbs a.here{color:var(--text);font-weight:600}
.fscrumbs a:hover,.fscrumbs a.over{background:var(--ink-3);border-color:var(--accent)}
.fssel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px;border:1px solid var(--accent);border-radius:10px;background:var(--ink-2)}
.fsarea{min-height:200px;border:1px dashed transparent;border-radius:12px;padding:4px;transition:border-color .2s,background .2s}
.fsarea.over{border-color:var(--accent);background:var(--tint2)}
.fsarea.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fsarea.list{display:flex;flex-direction:column;gap:4px}
.fsitem{position:relative;border:1px solid var(--rule-soft);border-radius:11px;background:var(--ink-2);cursor:pointer;user-select:none;transition:border-color .2s,transform .18s,box-shadow .25s}
.fsitem:hover{border-color:var(--accent);box-shadow:0 0 18px var(--glow-dim,transparent)}
.fsitem.sel{border-color:var(--accent);background:var(--ink-3)}
.fsitem.over{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.fsarea.grid .fsitem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px 10px;text-align:center}
.fsarea.grid .fsico{width:100%;height:96px;display:grid;place-items:center;font-size:38px;border-radius:8px;background:var(--ink);overflow:hidden}
.fsarea.grid .fsico img{width:100%;height:100%;object-fit:cover}
.fsarea.grid .fsico.folder{background:transparent;font-size:52px}
.fsarea.list .fsitem{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 40px}
.fsarea.list .fsico{width:30px;height:30px;display:grid;place-items:center;font-size:18px;flex:none;overflow:hidden;border-radius:6px}
.fsarea.list .fsico img{width:100%;height:100%;object-fit:cover}
.fsarea.list .fsname{flex:1}
.fsico.gone{opacity:.45}
.fsname{font-size:13.5px;font-weight:600;word-break:break-word;line-height:1.3}
.fsmeta{font-size:11.5px;color:var(--text-3)}
.fscheck{position:absolute;left:8px;top:8px;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--rule);background:var(--ink);font-size:12px;color:#04220f;opacity:0;transition:opacity .15s}
.fsarea.list .fscheck{top:50%;transform:translateY(-50%);left:10px}
.fsitem:hover .fscheck,.fsitem.sel .fscheck,.fsitem:focus-visible .fscheck{opacity:1}
.fsitem.sel .fscheck{background:var(--ok);border-color:var(--ok)}
.fsacts{position:absolute;right:6px;top:6px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.fsarea.list .fsacts{position:static;opacity:.7}
.fsitem:hover .fsacts{opacity:1}
@media (hover:none){ .fscheck,.fsacts{opacity:.8} }
.fsempty{grid-column:1/-1}
.modal.wide{max-width:min(1120px,96vw);width:min(1120px,96vw)}
.fsview-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fsview-b{max-height:74vh;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--ink);border-radius:10px;padding:12px}
.fsview-b canvas{box-shadow:0 6px 24px rgba(0,0,0,.45);background:#fff;border-radius:4px}
.fsview-txt{white-space:pre-wrap;font-family:var(--mono);color:var(--text);width:100%;margin:0}
/* overview */
.ovcds{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ovcd{flex:1;min-width:170px;display:flex;flex-direction:column;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--ink-2);box-shadow:0 0 22px var(--glow-dim,transparent)}
.ovcd b{font-size:32px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:0 0 18px var(--glow-soft,transparent)}
.ovcd.test b{color:var(--flag)}
.ovcd span{font-size:13.5px;margin-top:4px} .ovcd small{color:var(--text-3);font-family:var(--mono);font-size:11px;margin-top:2px}
.ovbig{font-size:30px;font-weight:600;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.ovweek{display:flex;gap:6px;align-items:flex-end;height:78px;margin:6px 0 8px}
.ovday{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:10.5px;color:var(--text-3)}
.ovday i{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--accent);opacity:.75;transition:height .6s var(--ease,ease)}
.ovday.today i{opacity:1;box-shadow:0 0 12px var(--glow,transparent)}
.ovh{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
.ovlist{display:flex;flex-direction:column;gap:4px}
.ovrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;border:1px solid transparent;font-size:13.5px}
a.ovrow:hover{border-color:var(--rule);background:var(--ink-3)}
.ovrow i{width:8px;height:8px;border-radius:99px;flex:none}
.ovrow.done{opacity:.55} .ovrow .grow{flex:1;min-width:0}
.ovt{font-family:var(--mono);font-size:12px;color:var(--text-3);min-width:86px}
/* appearance classes */
html.look-bg-grid body{background-image:linear-gradient(color-mix(in srgb,var(--grid-acc,var(--accent)) 7%,transparent) 1px,transparent 1px),
  linear-gradient(90deg,color-mix(in srgb,var(--grid-acc,var(--accent)) 7%,transparent) 1px,transparent 1px);background-size:34px 34px;background-attachment:fixed}
html.look-bg-glow body{background-image:radial-gradient(1100px 560px at 85% -10%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),
  radial-gradient(900px 500px at -5% 110%,color-mix(in srgb,#4cc9f0 9%,transparent),transparent 60%);background-attachment:fixed}
html.look-glow-subtle{--glow:color-mix(in srgb,var(--accent) 22%,transparent);--glow-soft:color-mix(in srgb,var(--accent) 9%,transparent);--glow-dim:color-mix(in srgb,var(--accent) 5%,transparent)}
html.look-glow-off{--glow:transparent;--glow-soft:transparent;--glow-dim:transparent}
html.look-glow-off *{text-shadow:none !important}
html.look-motion-off *,html.look-motion-off *::before,html.look-motion-off *::after{animation:none !important;transition:none !important}
html.look-motion-reduced *,html.look-motion-reduced *::before,html.look-motion-reduced *::after{animation:none !important}
html.look-font-grotesk{--sans:"Space Grotesk",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}

html.look-size-sm #app,html.look-size-sm .side,html.look-size-sm .topbar{zoom:.92}
html.look-size-lg #app,html.look-size-lg .side,html.look-size-lg .topbar{zoom:1.08}
html.look-rad-sharp{--r:4px} html.look-rad-round{--r:16px}

/* chapter links */
.lk-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin:14px 0 10px}
.lk-bar .seg em{font-style:normal;font-size:11px;padding:0 6px;margin-left:4px;border-radius:99px;background:color-mix(in srgb,var(--flag) 22%,transparent);color:var(--flag)}
.lk-sum{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--text-3);margin:0 0 10px}
.lk-sum span{display:inline-flex;align-items:center;gap:7px}
.lk-list{display:flex;flex-direction:column;border:1px solid var(--rule-soft);border-radius:12px;overflow:hidden;background:var(--ink)}
.lk{display:grid;grid-template-columns:10px minmax(150px,230px) minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 14px;border-top:1px solid var(--rule-soft);transition:background .15s}
.lk:first-child{border-top:0}
.lk:hover{background:var(--tint2)}
.lk-dot{width:8px;height:8px;border-radius:99px;display:inline-block;background:var(--ok);box-shadow:0 0 8px color-mix(in srgb,var(--ok) 70%,transparent)}
.lk.fuzzy .lk-dot,.lk-dot.fuzzy{background:var(--flag);box-shadow:0 0 8px color-mix(in srgb,var(--flag) 70%,transparent)}
.lk.none .lk-dot,.lk-dot.none{background:var(--text-3);box-shadow:none}
.lk-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.lk-chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:3px 3px 3px 3px;border-radius:99px;border:1px solid var(--rule);background:var(--ink-2);font-size:12.5px;white-space:nowrap}
.lk-chip i{font-style:normal;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.lk-chip span{overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.lk-chip.fz{border-color:color-mix(in srgb,var(--flag) 60%,transparent)}
.lk-chip.fz i{color:var(--flag);background:color-mix(in srgb,var(--flag) 14%,transparent)}
.lk-chip button{width:20px;height:20px;border-radius:99px;color:var(--text-3);flex:none}
.lk-chip button:hover{color:var(--no);background:color-mix(in srgb,var(--no) 14%,transparent)}
.lk-none{font-size:12.5px;color:var(--text-3);font-style:italic}
.lk-act{display:flex;align-items:center;gap:6px}
.lk-add{width:118px;padding:5px 26px 5px 10px;font-size:12.5px;border-radius:99px}
.lk-reset{width:28px;height:28px;border-radius:99px;border:1px solid var(--rule);color:var(--text-3)}
.lk-reset:hover{color:var(--text);border-color:var(--accent)}
@media (max-width:760px){ .lk{grid-template-columns:10px minmax(0,1fr) auto;row-gap:8px} .lk-chips{grid-column:2 / -1;grid-row:2} }


/* to-do */
.todo .td-add{display:flex;gap:8px;flex-wrap:wrap}
.td-list{display:flex;flex-direction:column;margin-top:4px}
.td{display:flex;align-items:center;gap:8px;padding:6px 8px 6px calc(8px + var(--d) * 26px);border-radius:9px;position:relative;transition:background .15s}
.td:hover{background:var(--tint2)}
.td::before{content:"";position:absolute;left:calc(8px + var(--d) * 26px - 14px);top:0;bottom:0;border-left:1px dashed var(--rule);opacity:calc(var(--d) * 1)}
.td-car{width:20px;height:20px;flex:none;color:var(--text-3);font-size:12px;border-radius:5px}
button.td-car:hover{color:var(--text);background:var(--ink-3)}
.td-chk{width:20px;height:20px;flex:none;border-radius:6px;border:1.6px solid var(--rule);background:var(--ink);font-size:12px;color:#04220f;display:grid;place-items:center}
.td-chk.on{background:var(--ok);border-color:var(--ok);box-shadow:0 0 10px color-mix(in srgb,var(--ok) 55%,transparent)}
.td-t{cursor:text;font-size:14px;line-height:1.35;min-width:40px}
.td.done .td-t{text-decoration:line-through;color:var(--text-3)}
.td-in{flex:1;min-width:180px;padding:4px 8px}
.td-lab{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;color:var(--lc);background:color-mix(in srgb,var(--lc) 15%,transparent);border:1px solid color-mix(in srgb,var(--lc) 40%,transparent)}
.td-n{font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.td-acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.td:hover .td-acts,.td:focus-within .td-acts{opacity:1}
@media (hover:none){ .td-acts{opacity:.8} }
.td-sw{width:22px;height:22px;border-radius:7px;border:1px solid var(--rule);flex:none}
/* overview: effective time inside the day's line */
.ovrail{position:relative;overflow:hidden}
.ovrail > i{opacity:.45}
.ovrail > b{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:var(--ok);box-shadow:0 0 10px color-mix(in srgb,var(--ok) 70%,transparent);transition:width .65s var(--ease,ease)}
.ovsplit{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-top:6px}
.ovsplit i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px;vertical-align:1px}
/* the streak flame */
.flame{position:relative;display:inline-block;width:26px;height:34px;margin:0 6px -6px 0;vertical-align:bottom;filter:drop-shadow(0 0 6px var(--f1)) drop-shadow(0 0 14px var(--f1))}
.flame .fl{position:absolute;left:50%;bottom:0;border-radius:50% 0 50% 50%;transform-origin:50% 100%}
.flame .f1{width:22px;height:22px;margin-left:-11px;background:radial-gradient(circle at 60% 40%, var(--f2), var(--f1) 70%);animation:fl1 1.1s ease-in-out infinite alternate}
.flame .f2{width:15px;height:15px;margin-left:-7.5px;bottom:1px;background:radial-gradient(circle at 60% 40%, var(--f3), var(--f2) 75%);animation:fl2 .8s ease-in-out infinite alternate}
.flame .f3{width:8px;height:8px;margin-left:-4px;bottom:2px;background:var(--f3);animation:fl3 .6s ease-in-out infinite alternate;opacity:.95}
.flame .sp{position:absolute;bottom:14px;left:50%;width:3px;height:3px;border-radius:99px;background:var(--f2);opacity:0;animation:spark 1.6s ease-out infinite}
.flame .s2{animation-delay:.55s;margin-left:-6px} .flame .s3{animation-delay:1.05s;margin-left:5px}
.flame.max .f1{animation-duration:.7s} .flame.max .sp{animation-duration:1.1s}
.flame.out{filter:none;opacity:.35} .flame.out .fl,.flame.out .sp{animation:none} .flame.out .f1{background:var(--text-3)} .flame.out .f2,.flame.out .f3,.flame.out .sp{display:none}
@keyframes fl1{0%{transform:rotate(-45deg) scale(1,1)}50%{transform:rotate(-40deg) scale(1.06,.94)}100%{transform:rotate(-50deg) scale(.95,1.08)}}
@keyframes fl2{0%{transform:rotate(-45deg) scale(1)}100%{transform:rotate(-38deg) scale(1.12,.9)}}

@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(1)}15%{opacity:1}100%{opacity:0;transform:translate(var(--sx,2px),-22px) scale(.4)}}
.flame .s1{--sx:-3px} .flame .s3{--sx:4px}

<style>

/* ---------- primitives ---------- */
.btn{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line2); background:var(--panel2); color:var(--ink); padding:7px 13px; border-radius:var(--r1); font-size:14px; white-space:nowrap; transition:border-color .15s, box-shadow .15s, background .15s; }
