      <text x="14" y="${(H-padB+padT)/2}" text-anchor="middle" fill="var(--text-3)" font-size="12" font-family="ui-sans-serif" transform="rotate(-90 14 ${(H-padB+padT)/2})">% correct →</text>
    </svg>
    <div class="hint">Each dot is a chapter, sized by how much of it you have done. Bottom right is finished but shaky; top left is strong but barely started. Click a dot for the chapter in full.</div>`
    : `<div class="empty">No chapter has that many questions done yet.</div>`}
  </div>`;
}

/* ============================================================
   25d. PERIOD COMPARISON — one stretch of time against another
   ============================================================ */
function cmpRange(which){
  const c = statView.cmp, mode = c[which+"Mode"];
  if(mode==="dl"){
    const d = S.dl.find(x=>x.id===c[which+"Dl"]);
    if(d) return {from:new Date(dlStart(d)+"T00:00:00"), to:new Date(d.date+"T00:00:00"),
                  label:d.name, subs:(d.subs&&d.subs.length)?new Set(d.subs):null, dlId:d.id};
  }
  if(mode==="prev"){
    const a = cmpRange("a");
    const days = Math.round((a.to-a.from)/86400000)+1;
    const to = new Date(a.from); to.setDate(to.getDate()-1);
    const from = new Date(to); from.setDate(to.getDate()-days+1);
    return {from, to, label:"The "+days+" days before", subs:a.subs, dlId:null};
  }
  const f = c[which+"From"] ? new Date(c[which+"From"]+"T00:00:00") : new Date();
  const t = c[which+"To"] ? new Date(c[which+"To"]+"T00:00:00") : new Date();
  return f<=t ? {from:f, to:t, label:dayKey(f)+" → "+dayKey(t), subs:null, dlId:null}
              : {from:t, to:f, label:dayKey(t)+" → "+dayKey(f), subs:null, dlId:null};
}
function cmpNumbers(R){
  const M = computeMetrics(R.from, R.to, R.subs, R.dlId);
  const days = Math.max(1, Math.round((R.to-R.from)/86400000)+1);
  return {
    label:R.label, days,
    time:M.totalMin, q:M.totalQ, wrong:M.wrongCount,
    active:M.activeDays, sessions:M.sessions.length,
    perDay:Math.round(M.totalMin/days), qPerDay:Math.round(M.totalQ/days*10)/10,
    longest:M.longest||0, avg:M.avgSession||0
  };
}
function periodCompareHTML(){
  const c = statView.cmp;
  if(!c.aFrom){ const t = new Date(), f = new Date(); f.setDate(t.getDate()-29);
    c.aFrom = dayKey(f); c.aTo = dayKey(t); }
  const picker = (which)=>{
    const mode = c[which+"Mode"];
    const dls = S.dl;
    return `<div class="hwrow" style="flex-wrap:wrap;margin-bottom:8px">
      <span class="blabel" style="margin:0;min-width:56px">${which==="a"?"This":"against"}</span>
      ${which==="b"?`<button class="tbtn ${mode==="prev"?"on":""}" data-cmpmode="b:prev">The stretch before</button>`:""}
      <button class="tbtn ${mode==="dates"?"on":""}" data-cmpmode="${which}:dates">Dates</button>
      ${dls.length?`<button class="tbtn ${mode==="dl"?"on":""}" data-cmpmode="${which}:dl">Deadline</button>`:""}
      ${mode==="dates"?`<input class="tin" type="date" data-cmpdate="${which}:From" value="${esc(c[which+"From"]||"")}">
        <input class="tin" type="date" data-cmpdate="${which}:To" value="${esc(c[which+"To"]||"")}">`:""}
      ${mode==="dl"&&dls.length?`<select data-cmpdl="${which}">${dls.map(d=>`<option value="${esc(d.id)}"${c[which+"Dl"]===d.id?" selected":""}>${esc(d.name)}</option>`).join("")}</select>`:""}
    </div>`;
  };
  const A = cmpNumbers(cmpRange("a")), B = cmpNumbers(cmpRange("b"));
  const hm2 = m => Math.floor(m/60)+"h "+(m%60)+"m";
  const row = (label, a, b, fmt, lowerIsBetter)=>{
    const diff = a - b;
    const pctDiff = b ? Math.round(diff/b*100) : (a?100:0);
    const good = lowerIsBetter ? diff<0 : diff>0;
    const col = diff===0 ? "var(--text-3)" : (good ? "var(--ok)" : "var(--no)");
    return `<tr><td class="calc" style="color:var(--text-2)">${esc(label)}</td>
      <td class="calc"><b>${fmt?fmt(a):a}</b></td>
      <td class="calc" style="color:var(--text-3)">${fmt?fmt(b):b}</td>
      <td class="calc" style="color:${col}">${diff>0?"+":""}${fmt?fmt(diff):diff}${b?` (${diff>0?"+":""}${pctDiff}%)`:""}</td></tr>`;
  };
  return `<div class="panel">
    ${picker("a")}${picker("b")}
    <div class="tblwrap"><table class="mk" style="min-width:auto">
      <thead><tr><th>Measure</th><th>${esc(A.label)}</th><th>${esc(B.label)}</th><th>Change</th></tr></thead>
      <tbody>
        ${row("Days in the stretch", A.days, B.days)}
        ${row("Time studied", A.time, B.time, hm2)}
        ${row("Questions solved", A.q, B.q)}
        ${row("Days studied", A.active, B.active)}
        ${row("Sessions", A.sessions, B.sessions)}
        ${row("Minutes a day", A.perDay, B.perDay)}
        ${row("Questions a day", A.qPerDay, B.qPerDay)}
        ${row("Longest session (min)", A.longest, B.longest)}
        ${row("Average session (min)", A.avg, B.avg)}
        ${row("Wrong answers recorded", A.wrong, B.wrong, null, true)}
      </tbody></table></div>
    <div class="hint">Green is the better side of the change; for wrong answers that means fewer of them.</div>
  </div>`;
}

/* ============================================================
   25e. CHAPTER WISE ANALYSIS — every chapter against your own average
   ============================================================ */
function chapterAnalysis(){
  const rows = chapterRows().filter(r=>(!statView.chap.subs || statView.chap.subs.includes(r.sc)));
  const attempted = rows.filter(r=>r.attempts>0);
  const totalAtt = attempted.reduce((a,r)=>a+r.attempts,0);
  const meanAcc = totalAtt ? Math.round(attempted.reduce((a,r)=>a+r.acc*r.attempts,0)/totalAtt) : 0;
  const meanDone = rows.length ? Math.round(rows.reduce((a,r)=>a+r.done,0)/rows.length) : 0;
  rows.forEach(r=>{
    r.rel = r.attempts ? r.acc - meanAcc : r.done - meanDone;
    r.thin = r.attempts < 10;
    r.group = r.rel <= -7 ? "weak" : (r.rel >= 7 ? "strong" : "medium");
  });
  rows.sort((a,b)=>a.rel-b.rel);
  return {rows, meanAcc, meanDone};
}
function chapterAnalysisHTML(){
  const {rows, meanAcc, meanDone} = chapterAnalysis();
  const shown = statView.chap.subs;
  const groups = [["weak","Weak","var(--no)"],["medium","Medium","var(--flag)"],["strong","Strong","var(--ok)"]];
  const rowHTML = r => `<div class="opt" data-chapnode="chapter:${esc(r.sc)}:${esc(String(r.no))}" style="align-items:center">
      <i style="width:10px;height:10px;border-radius:99px;background:${r.c};display:inline-block;margin-right:9px"></i>
      <span style="flex:1">${esc(chTitle(r.ch))}
        <span class="hint" style="margin:0">${esc(subjOf(r.sc).short)} · ${esc(r.mod)}${r.thin?" · only "+r.attempts+" marked":""}</span></span>
      <span class="tagx">${r.st.done}/${r.st.n}</span>
      <span class="tagx" style="color:${scaleColor(r.done)}">${r.done}% done</span>
      <span class="tagx" style="color:${scaleColor(r.acc)}">${r.attempts?r.acc+"% correct":"—"}</span>${(()=>{ const pg = prepFor(r.sc, r.no); return pg==null ? "" : `<span class="tagx prep" style="color:${prepColor(pg)};border-color:${prepColor(pg)}66" title="Your prep grade in the planner — how this chapter feels to you, out of 10. Separate from accuracy: it does not change the grouping.">prep ${pg.toFixed(1)}</span>`; })()}
      <span class="tagx" style="color:${r.rel<0?"var(--no)":r.rel>0?"var(--ok)":"var(--text-3)"}">${r.rel>0?"+":""}${r.rel} vs your average</span>
    </div>`;
  return `<div class="panel">
    <div class="hwrow" style="margin-bottom:10px;flex-wrap:wrap">
      ${TREE.order.map(sc=>`<button class="actbtn ${(!shown||shown.includes(sc))?"on":""}" data-chapsub="${esc(sc)}" style="${(!shown||shown.includes(sc))?"":"opacity:.45"}"><i style="background:${subjOf(sc).accent}"></i>${esc(subjOf(sc).name)}</button>`).join("")}
      <span class="spacer"></span>
      <span class="hint" style="margin:0">your average: ${meanAcc}% correct · ${meanDone}% done</span>
    </div>
    ${rows.length ? groups.map(([g,name,col])=>{
      const list = rows.filter(r=>r.group===g);
      if(!list.length) return "";
      return `<div class="blabel" style="margin-top:12px;color:${col}">${name} — ${list.length} chapter${list.length>1?"s":""}</div>
        <div class="opts">${list.map(rowHTML).join("")}</div>`;
    }).join("") : `<div class="empty">Nothing solved yet, so there is nothing to compare.</div>`}
    ${ASYAPI?`<div class="hint">The coloured <b>prep</b> tag is your own grade for the chapter in the planner — how it feels to you rather than how you score. It sits alongside and never moves a chapter between groups. Links are under Settings → Chapter links.</div>`:""}
    <div class="hint">Weak and strong are relative to your own average, not to any outside standard: a chapter is weak when it is 7 points or more below where you usually sit. Click any chapter for its exercises.</div>
  </div>`;
}
function wireStatSections(){
  app.querySelectorAll("[data-scatnode],[data-chapnode]").forEach(el=>el.onclick = ()=>

    const sc = b.dataset.scatsub;

  });
  app.querySelectorAll("[data-chapsub]").forEach(b=>b.onclick = ()=>{
    const sc = b.dataset.chapsub;
    let cur = statView.chap.subs || TREE.order.slice();
    cur = cur.includes(sc) ? cur.filter(x=>x!==sc) : cur.concat([sc]);

  });

      const t = new Date(), f = new Date(); f.setDate(t.getDate()-29);

/* ============================================================
   26. SYLLABUS RADAR — % completed (or % accuracy) per chapter
   ============================================================ */
/* only chapters with at least one solved question count, so a subject
   you have barely touched does not drag the whole axis down to near zero */
function subjectChapterStats(sc){
  return allChapters(sc).map(ch=>({ch, st:chapStats(sc,ch)})).filter(x=>x.st.done>0);
}
/* red at nothing, amber halfway, green as it approaches 100 */
function scaleColor(v){
  v = Math.max(0, Math.min(100, Number(v)||0));
  const stops = [[0,[255,95,109]],[50,[255,212,59]],[100,[81,207,102]]];
  let a = stops[0], b = stops[1];
  if(v > 50){ a = stops[1]; b = stops[2]; }
  const f = (v - a[0]) / (b[0] - a[0] || 1);
  const mix = i => Math.round(a[1][i] + (b[1][i]-a[1][i])*f);
  return `rgb(${mix(0)},${mix(1)},${mix(2)})`;
}
function spiderSubjects(){
  const picked = statView.spider.subs;
  const live = TREE.order.filter(sc=>!picked || picked.includes(sc));
  return live.length ? live : TREE.order;
}
function metricValue(st){
  if(statView.spider.metric==="acc") return acc(st)===null ? 0 : acc(st);
  return pct(st);
}
function spiderDefaultData(){
  return spiderSubjects().map(sc=>{
    const rows = subjectChapterStats(sc);
    const t = blank();
    rows.forEach(r=>addTo(t, r.st));
    return {label:subjOf(sc).short, value: metricValue(t), c:subjOf(sc).accent, kind:"subject", sc};
  });
}
function spiderCustomData(){
  const sc = statView.spider.subj; if(!sc) return [];
  const started = subjectChapterStats(sc);
  let chs = statView.spider.chapters;
  if(!chs || !chs.length) chs = started.slice(0,10).map(r=>r.ch.no);
  return chs.map(no=>{
    const ch = chapOf(sc,no); if(!ch) return null;
    const st = chapStats(sc,ch);
    const mo = subjOf(sc).modules[ch.mod];
    return {label:chTitle(ch), sub: mo?mo.name:"", value: metricValue(st),
            c:subjOf(sc).accent, kind:"chapter", sc, no:ch.no};
  }).filter(Boolean);
}
function radarSVG(data, size){
  if(data.length<3) return `<div class="empty">Pick at least 3 to draw a web.</div>`;
  const R = size/2-78, cx=size/2, cy=size/2, n=data.length;
  const angle = i => -Math.PI/2 + i*2*Math.PI/n;
  const pt = (i,frac) => [cx+R*frac*Math.cos(angle(i)), cy+R*frac*Math.sin(angle(i))];
  /* the web is always drawn out of 100, so the rings read 25, 50, 75, 100 */
  const rings = [0.25,0.5,0.75,1].map(f=>`<polygon points="${data.map((_,i)=>pt(i,f).join(",")).join(" ")}" fill="none" stroke="var(--rule-soft)"/>`).join("");
  const ringText = [0.25,0.5,0.75,1].map(f=>
    `<text x="${cx+5}" y="${cy-R*f-3}" fill="var(--text-3)" font-size="${Math.round(size/60)}" font-family="ui-monospace,monospace">${Math.round(f*100)}</text>`).join("");
  const spokes = data.map((_,i)=>{ const [x,y]=pt(i,1); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--rule-soft)"/>`; }).join("");
  const poly = data.map((d,i)=>pt(i,Math.max(0.02,d.value/100)).join(",")).join(" ");
  const avg = Math.round(data.reduce((a,d)=>a+d.value,0)/data.length);
  const web = scaleColor(avg);
  const clip = (t,n2) => t.length>n2 ? t.slice(0,n2-1)+"…" : t;
  const fs = Math.max(11, Math.round(size/48));
  /* the module or reference book sits above the chapter, so two chapters of the
     same name in different modules can be told apart */
  const labels = data.map((d,i)=>{ const [x,y]=pt(i,1.16);
    const top = d.sub ? `<tspan x="${x}" dy="-0.5em" font-size="${Math.round(fs*0.82)}" opacity="0.72">${esc(clip(d.sub,24))}</tspan>` : "";
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="var(--text-2)" font-size="${fs}" font-family="ui-sans-serif">${top}<tspan x="${x}" dy="${d.sub?"1.2em":"0"}">${esc(clip(d.label,22))}</tspan><tspan x="${x}" dy="1.2em" font-size="${Math.round(fs*0.9)}" fill="${scaleColor(d.value)}">${d.value}%</tspan></text>`; }).join("");
  const dots = data.map((d,i)=>{ const [x,y]=pt(i,Math.max(0.02,d.value/100));
    const id = d.kind==="chapter" ? "chapter:"+d.sc+":"+d.no : "subject:"+d.sc;
    return `<circle class="rnode" cx="${x}" cy="${y}" r="${Math.max(5,size/90)}" fill="${scaleColor(d.value)}" stroke="var(--ink-2)" stroke-width="2" data-spidernode="${esc(id)}" style="cursor:pointer"><title>${esc(d.sub?d.sub+" · "+d.label:d.label)}: ${d.value}% — click for more</title></circle>`; }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size}px;height:auto;display:block;margin:0 auto">
    ${rings}${spokes}${ringText}<polygon points="${poly}" fill="${web}" fill-opacity="0.2" stroke="${web}" stroke-width="2"/>${dots}${labels}</svg>`;
}
function spiderHTML(){
  const mode = statView.spider.mode;
  const data = mode==="subjects" ? spiderDefaultData() : spiderCustomData();
  const sub = statView.spider.subj;
  const started = sub ? subjectChapterStats(sub) : [];
  const curChapters = statView.spider.chapters || started.slice(0,10).map(r=>r.ch.no);
  const shown = statView.spider.subs;
  const metricBtns = `<button class="tbtn ${statView.spider.metric==="pct"?"on":""}" data-spidermetric="pct">% completed</button>
      <button class="tbtn ${statView.spider.metric==="acc"?"on":""}" data-spidermetric="acc">% accuracy</button>`;
  return `<div class="panel">
    <div class="hwrow" style="margin-bottom:14px;flex-wrap:wrap">
      <button class="tbtn ${mode==="subjects"?"on":""}" data-spidermode="subjects">All subjects</button>
      <button class="tbtn ${mode==="custom"?"on":""}" data-spidermode="custom">One subject, by chapter</button>
      <span class="spacer"></span>${metricBtns}
    </div>
    ${mode==="subjects"?`<div class="hint" style="margin-bottom:8px">Which subjects to show — everything is drawn out of 100.</div>
      <div class="hwrow" style="margin-bottom:14px;flex-wrap:wrap">${TREE.order.map(sc=>
        `<button class="actbtn ${(!shown||shown.includes(sc))?"on":""}" data-spidersub="${esc(sc)}" style="${(!shown||shown.includes(sc))?"":"opacity:.45"}"><i style="background:${subjOf(sc).accent}"></i>${esc(subjOf(sc).name)}</button>`).join("")}</div>`:""}
    ${mode==="custom"?`<div class="hwrow" style="margin-bottom:12px;flex-wrap:wrap">
      <select id="spiderSubj"><option value="">Choose a subject…</option>${TREE.order.map(sc=>`<option value="${esc(sc)}"${sub===sc?" selected":""}>${esc(subjOf(sc).name)}</option>`).join("")}</select>
    </div>
    ${sub && started.length ? `<div class="hint" style="margin-bottom:10px">Pick 3 to 10 chapters — only ones with at least one solved question are listed.</div>
      ${subjOf(sub).order.filter(m=>started.some(r=>String(r.ch.mod)===String(m))).map(m=>`
        <div class="blabel" style="margin-top:6px">${esc(subjOf(sub).modules[m].name)}</div>
        <div class="hwrow" style="margin-bottom:8px;flex-wrap:wrap">${started.filter(r=>String(r.ch.mod)===String(m)).map(r=>
          `<button class="tbtn ${curChapters.includes(r.ch.no)?"on":""}" data-spiderchap="${r.ch.no}">${esc(chTitle(r.ch))}</button>`).join("")}</div>`).join("")}
      <div style="height:6px"></div>`
      : sub ? `<div class="hint" style="margin-bottom:10px">No questions solved in this subject yet.</div>` : ""}`:""}
    ${data.length ? radarSVG(data,700) : `<div class="empty">${mode==="custom"&&!sub?"Choose a subject to begin.":"Nothing solved yet."}</div>`}
    ${data.length>=3?`<div class="hint" style="text-align:center">Click any point on the web for a closer look.</div>`:""}
  </div>`;
}
/* the closer look behind a point on the web */
function spiderNodeStats(id){
  const p = id.split(":");
  if(p[0]==="subject"){
    const sc = p[1], sub = subjOf(sc); if(!sub) return;
    const st = subjStats(sc);
    const rows = sub.order.map(m=>({m, mo:sub.modules[m], st:modStats(sc,m)})).filter(r=>r.st.n);
    detailModal(sub.name, st, rows.map(r=>({
      name:r.mo.name, st:r.st, href:`#/${sc}/${r.m}`, note:r.mo.chapters.length+" chapters"})));
  } else {
    const sc = p[1], no = p[2], ch = chapOf(sc,no); if(!ch) return;
    const st = chapStats(sc,ch);
    const rows = exList(sc,ch).map(e=>({name:e.name, st:exStats(sc,ch,e.code),
      href:`#/${sc}/${ch.mod}/${ch.no}/${e.code}`, note:qCount(sc,ch,e.code)+" questions"}));
    detailModal(chTitle(ch), st, rows);
  }

/* rows and columns can be dragged into a different order */
let dragRow = null, dragCol = null;
function wireMarksDrag(t){
  const table = app.querySelector("table.mk"); if(!table) return;

  table.querySelectorAll("[data-rowdrag]").forEach(g=>{
    g.addEventListener("dragstart", e=>{
      dragRow = Number(g.dataset.rowdrag); dragCol = null;
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", String(dragRow)); }catch(_){}
      g.closest("tr").classList.add("dragging");
    });
    g.addEventListener("dragend", ()=>{
      dragRow = null;
      table.querySelectorAll("tr").forEach(r=>r.classList.remove("dragging","dropzone"));
    });
  });
  table.querySelectorAll("tbody tr").forEach(tr=>{
    tr.addEventListener("dragover", e=>{
      if(dragRow === null) return;
      e.preventDefault();
      table.querySelectorAll("tr").forEach(r=>r.classList.remove("dropzone"));
      tr.classList.add("dropzone");
    });
    tr.addEventListener("drop", e=>{
      if(dragRow === null) return;
      e.preventDefault();
      const to = Number(tr.dataset.row);
      if(to !== dragRow){
        snapshot("move a row");
        const moved = t.rows.splice(dragRow,1)[0];
        t.rows.splice(to, 0, moved);
        markDirty(); viewMarks(); toastUndo("Row moved");
      }
      dragRow = null;
    });
  });

  table.querySelectorAll("[data-coldrag]").forEach(g=>{
    g.addEventListener("dragstart", e=>{
      dragCol = g.dataset.coldrag; dragRow = null;
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", dragCol); }catch(_){}
    });
    g.addEventListener("dragend", ()=>{
      dragCol = null;
      table.querySelectorAll("th").forEach(h=>h.classList.remove("dropcol"));
    });
  });
  table.querySelectorAll("th[data-colid]").forEach(th=>{
    th.addEventListener("dragover", e=>{
      if(!dragCol) return;
      e.preventDefault();
      table.querySelectorAll("th").forEach(h=>h.classList.remove("dropcol"));
      th.classList.add("dropcol");
    });
    th.addEventListener("drop", e=>{
      if(!dragCol) return;
      e.preventDefault();
      const to = th.dataset.colid;
      if(to !== dragCol){
        const from = t.cols.findIndex(c=>c.id===dragCol);
        const at = t.cols.findIndex(c=>c.id===to);
        if(from >= 0 && at >= 0){
          snapshot("move a column");
          const moved = t.cols.splice(from,1)[0];
          t.cols.splice(at, 0, moved);
          markDirty(); viewMarks(); toastUndo("Column moved");
        }
      }
      dragCol = null;
    });
  });
}

function xCol(t){ return (graphX && t.cols.some(c=>c.id===graphX)) ? graphX : (t.cols[0]||{}).id; }
function cellText(t, row, colId){

let graphCol = "", graphX = "";
const numOf = v => { const n = parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,"")); return isFinite(n)?n:null; };

/* a plain line chart: the first column supplies the labels along the bottom */
function lineChart(labels, values, colour, title, opts){
  opts = opts || {};
  const pts = values.map((v,i)=>({v, i})).filter(p=>p.v!==null);
  if(pts.length < 2) return `<div class="empty">Fill in at least two rows with numbers to draw a graph.</div>`;
  const W = 720, H = 260, padL = 52, padR = 18, padT = 18, padB = 46;
  const lo0 = Math.min.apply(null, pts.map(p=>p.v)), hi0 = Math.max.apply(null, pts.map(p=>p.v));
  const pad = (hi0-lo0)||Math.abs(hi0)||1;
  /* the side of the graph is yours to set; left alone it fits the numbers */
  let lo = opts.lo!==undefined && opts.lo!==null && isFinite(opts.lo) ? Number(opts.lo) : lo0 - pad*0.12;
  let hi = opts.hi!==undefined && opts.hi!==null && isFinite(opts.hi) ? Number(opts.hi) : hi0 + pad*0.12;
  if(hi <= lo) hi = lo + (Math.abs(lo)||1);
  const x = i => padL + (values.length<2?0:i/(values.length-1))*(W-padL-padR);
  const y = v => padT + (1-(v-lo)/(hi-lo))*(H-padT-padB);
  const ticks = [0,0.25,0.5,0.75,1].map(f=>lo+(hi-lo)*f);
  const line = pts.map((p,k)=>(k?"L":"M")+x(p.i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area = line+" L "+x(pts[pts.length-1].i).toFixed(1)+" "+(H-padB)+" L "+x(pts[0].i).toFixed(1)+" "+(H-padB)+" Z";
  const every = Math.ceil(labels.length/8);
  return `<div class="chartrow" style="display:block">
    <div class="blabel" style="margin-bottom:8px">${esc(title)}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${esc(title)}">
      ${ticks.map(t=>`<line x1="${padL}" x2="${W-padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--rule-soft)"/>
        <text x="${padL-8}" y="${(y(t)+4).toFixed(1)}" text-anchor="end" fill="var(--text-3)" font-size="11" font-family="ui-monospace,monospace">${Math.round(t*10)/10}</text>`).join("")}
      <path d="${area}" fill="${colour}" opacity="0.10"/>
      <path d="${line}" fill="none" stroke="${colour}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${Math.max(padT, Math.min(H-padB, y(p.v))).toFixed(1)}" r="${opts.rows?6:4}" fill="${colour}" stroke="var(--ink-2)" stroke-width="2"${opts.rows?` data-mkpoint="${p.i}" style="cursor:pointer"`:""}><title>${esc(labels[p.i]||("Row "+(p.i+1)))}: ${p.v}${opts.rows?" — click for the whole test":""}</title></circle>`).join("")}
      ${labels.map((l,i)=>i%every?"":`<text x="${x(i).toFixed(1)}" y="${H-padB+20}" text-anchor="middle" fill="var(--text-3)" font-size="11" font-family="ui-monospace,monospace">${esc(String(l||i+1).slice(0,12))}</text>`).join("")}
    </svg></div>`;
}

function calcCell(t,row,col){
  if(col.calc==="pct"){
    const tot = parseFloat(row.v.tot), sc = parseFloat(row.v.sc);
    if(!isFinite(tot) || !isFinite(sc) || tot<=0) return "—";
    return (Math.round(sc/tot*1000)/10) + "%";
  }
  return "";
}

/* ============================================================
   15. GOALS
   ============================================================ */
let goalView = {mode:"week", anchor:new Date(), from:"", to:"", dl:""};

function goalRange(){
  const a = new Date(goalView.anchor); a.setHours(0,0,0,0);
  if(goalView.mode==="day") return {from:a, to:a, label:a.toDateString()};
  if(goalView.mode==="week"){
    const s = new Date(a); s.setDate(a.getDate()-((a.getDay()+6)%7));
    const e = new Date(s); e.setDate(s.getDate()+6);
    return {from:s, to:e, label:"Week of "+s.toDateString()};
  }
  if(goalView.mode==="range"){
    const f = goalView.from ? new Date(goalView.from+"T00:00:00") : a;
    const t = goalView.to ? new Date(goalView.to+"T00:00:00") : a;
    return f<=t ? {from:f, to:t, label:dayKey(f)+" to "+dayKey(t)} : {from:t, to:f, label:dayKey(t)+" to "+dayKey(f)};
  }
  if(goalView.mode==="deadline") return deadlineRange(goalView.dl, a);
  const s = new Date(a.getFullYear(), a.getMonth(), 1), e = new Date(a.getFullYear(), a.getMonth()+1, 0);
  return {from:s, to:e, label:s.toLocaleString(undefined,{month:"long", year:"numeric"})};
}
const goalTargets = () => (S.goals[goalView.mode] || S.goals.week);

/* "up 24%" / "down 8%" / "no change", handling a zero starting point honestly */
function changeText(now, before, lowerIsBetter){
  if(before === 0 && now === 0) return {t:"no change", c:"var(--text-3)"};
  if(before === 0) return {t:"first period with anything recorded", c:"var(--text-2)"};
  const pctChange = Math.round((now-before)/Math.abs(before)*1000)/10;
  if(pctChange === 0) return {t:"no change", c:"var(--text-3)"};
  const up = pctChange > 0;
  const good = lowerIsBetter ? !up : up;
  return {t:(up?"up ":"down ")+Math.abs(pctChange)+"% from last period", c:good?"var(--ok)":"var(--no)"};
}
function goalCard(title, unit, actual, target, before, lowerIsBetter, note){
  const hit = lowerIsBetter ? actual <= target : actual >= target;
  const raw = target === 0 ? (hit?100:0) : Math.round(actual/target*100);
  const bar = Math.max(0, Math.min(100, lowerIsBetter ? (hit?100:Math.max(0,100-raw)) : raw));
  const ch = changeText(actual, before, lowerIsBetter);
  return `<div class="card" style="cursor:default">
    <div class="card-top"><span class="card-title">${esc(title)}</span>
      <span class="pct" style="color:${hit?"var(--ok)":"var(--flag)"}">${hit?"met":"not yet"}</span></div>
    <div class="stats" style="margin-top:8px">
      <span><span class="k">so far</span> <b>${actual}${unit}</b></span>
      <span><span class="k">target</span> <b>${lowerIsBetter?"≤ ":""}${target}${unit}</b></span>
    </div>
    <div class="rail"><i style="width:${bar}%;background:${hit?"var(--ok)":"var(--flag)"}"></i></div>
    <div class="stats"><span style="color:${ch.c}">${esc(ch.t)}</span></div>
    ${note?`<div class="hint">${esc(note)}</div>`:""}</div>`;
}

function viewGoals(){
  crumbs([{label:"Home",href:"#/"},{label:"Goals"}]);
  const R = goalRange(), subs = R.subs || null;
  const P = prevRange(R, goalView.mode);
  const now = computeMetrics(clampFrom(R.from), R.to, subs, R.dlId);
  const was = computeMetrics(clampFrom(P.from), P.to, subs, R.dlId);
  const g = goalTargets();
  const hours = m => Math.round(m/60*10)/10;

  /* the mistake goal is about the change in rate, not the rate itself */
  const rateNow = now.missRate, rateBefore = was.missRate;
  const drift = Math.round((rateNow - rateBefore)*10)/10;
  const driftOk = drift <= g.m;

  app.innerHTML = recBanner() + `<div class="pagehead"><div class="eyebrow">Goals</div><h1>${esc(R.label)}</h1>
      <p class="sub">Targets are kept separately for each period, so a daily target is not confused with a monthly one.</p></div>
    <div class="toolbar">
      <div class="bulk">
        ${["day","week","month","range"].map(m=>`<button class="tbtn ${goalView.mode===m?"on":""}" data-gmode="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join("")}
        ${S.dl.length?`<button class="tbtn ${goalView.mode==="deadline"?"on":""}" data-gmode="deadline">Deadline</button>`:""}
      </div>
      <span class="spacer"></span>
      ${goalView.mode==="range"
        ? `<input class="tin" type="date" id="gFrom" value="${esc(goalView.from||dayKey(R.from))}">
           <input class="tin" type="date" id="gTo" value="${esc(goalView.to||dayKey(R.to))}">`
        : goalView.mode==="deadline"
        ? `<select id="gDl">${S.dl.map(d=>`<option value="${esc(d.id)}"${goalView.dl===d.id?" selected":""}>${esc(d.name)}</option>`).join("")}</select>`
        : `<button class="tbtn" data-gstep="-1">← Previous</button>
           <button class="tbtn" data-gstep="0">Today</button>
           <button class="tbtn" data-gstep="1">Next →</button>`}
      <button class="tbtn" id="editGoals">Edit targets</button>
    </div>
    <div class="grid g3">
      ${goalCard("Questions solved","", now.totalQ, g.q, was.totalQ, false)}
      ${goalCard("Hours studied","h", hours(now.totalMin), g.h, hours(was.totalMin), false)}
      ${(()=>{
        const noData = now.totalQ === 0;
        return `<div class="card" style="cursor:default">
        <div class="card-top"><span class="card-title">Mistake rate</span>
          <span class="pct" style="color:${noData?"var(--text-3)":(driftOk?"var(--ok)":"var(--flag)")}">${noData?"—":(driftOk?"met":"not yet")}</span></div>
        <div class="stats" style="margin-top:8px">
          <span><span class="k">now</span> <b>${noData?"—":rateNow+"%"}</b></span>
          <span><span class="k">before</span> <b>${was.totalQ?rateBefore+"%":"—"}</b></span>
          <span><span class="k">target</span> <b>≤ ${g.m>0?"+":""}${g.m}%</b></span></div>
        <div class="rail"><i style="width:${noData?0:Math.max(2,Math.min(100,rateNow))}%;background:${driftOk?"var(--ok)":"var(--flag)"}"></i></div>
        <div class="stats"><span style="color:${noData?"var(--text-3)":(drift<=0?"var(--ok)":"var(--no)")}">
          ${noData ? "nothing solved in this period yet"
                   : (was.totalQ===0 ? "first period with anything recorded"
                      : (drift===0?"no change":(drift>0?"up ":"down ")+Math.abs(drift)+" points from last period"))}</span></div>
        <div class="hint">Share of the questions you solved that came out wrong. A shorter bar is better.</div>
      </div>`; })()}
    </div>
    <h3 class="sec">How this period compares</h3>
    <div class="kpis">
      ${kpiChange("Questions solved", now.totalQ, was.totalQ, "")}
      ${kpiChange("Time studied", now.totalMin, was.totalMin, " min")}
      ${kpiChange("Days studied", now.activeDays, was.activeDays, "")}
      ${kpiChange("Average session", now.avgSession, was.avgSession, " min")}
      ${kpiChange("Longest session", now.longest, was.longest, " min")}
      ${kpiChange("Wrong answers", now.wrongCount, was.wrongCount, "", true)}
    </div>
    <div class="hint">Compared with ${esc(dayKey(P.from))} to ${esc(dayKey(P.to))}.</div>`;

  app.querySelectorAll("[data-gmode]").forEach(b=>b.onclick = ()=>{
    goalView.mode = b.dataset.gmode;
    if(goalView.mode==="range" && !goalView.from){
      const t = new Date(), f = new Date(); f.setDate(t.getDate()-13);
      goalView.from = dayKey(f); goalView.to = dayKey(t);
    }
    if(goalView.mode==="deadline" && !goalView.dl && S.dl.length) goalView.dl = S.dl[0].id;
    viewGoals();
  });
  app.querySelectorAll("[data-gstep]").forEach(b=>b.onclick = ()=>{
    const s = Number(b.dataset.gstep);
    if(s===0) goalView.anchor = new Date();
    else{
      const a = new Date(goalView.anchor);
      if(goalView.mode==="day") a.setDate(a.getDate()+s);
      else if(goalView.mode==="week") a.setDate(a.getDate()+7*s);
      else a.setMonth(a.getMonth()+s);
      goalView.anchor = a;
    }
    viewGoals();
  });
  const gf = document.getElementById("gFrom"), gt = document.getElementById("gTo");
  if(gf) gf.onchange = e=>{ goalView.from = e.target.value; viewGoals(); };
  if(gt) gt.onchange = e=>{ goalView.to = e.target.value; viewGoals(); };
  const gd = document.getElementById("gDl");
  if(gd) gd.onchange = e=>{ goalView.dl = e.target.value; viewGoals(); };
  document.getElementById("editGoals").onclick = editGoals;
}
function kpiChange(label, now, before, unit, lowerIsBetter){
  const ch = changeText(now, before, lowerIsBetter);
  return `<div class="kpi"><div class="v">${now}${unit}</div><div class="l">${esc(label)}</div>
    <div class="stats" style="margin-top:6px"><span style="color:${ch.c};font-size:11px">${esc(ch.t)}</span></div></div>`;
}
function editGoals(){
  const per = goalView.mode, g = Object.assign({}, S.goals[per] || S.goals.week);
  const names = {day:"a day", week:"a week", month:"a month", range:"the chosen range", deadline:"a deadline"};
  onEsc = ()=>viewGoals();
  openModal(`<h3>Targets for ${esc(names[per]||per)}</h3>
    <p>Each period keeps its own targets, so changing these will not disturb the others.</p>
    <div class="setrow"><span class="lbl">Questions solved, at least</span>
      <input class="numin" type="number" id="gq" min="0" max="100000" value="${g.q}"></div>
    <div class="setrow"><span class="lbl">Hours studied, at least</span>
      <input class="numin" type="number" id="gh" min="0" max="10000" step="0.5" value="${g.h}"></div>
    <div class="setrow"><span class="lbl">Mistake rate should change by at most<br>
      <span class="hint" style="margin:0">In percentage points against the period before. Use a negative number to aim for fewer mistakes.</span></span>
      <input class="numin" type="number" id="gm" min="-100" max="100" step="0.5" value="${g.m}"></div>
    <div class="acts"><button class="btn" id="gNo">Cancel</button><button class="btn primary" id="gYes">Save targets</button></div>`);
  modal.querySelector("#gNo").onclick = ()=>{ closeModal(); viewGoals(); };
  modal.querySelector("#gYes").onclick = ()=>{
    snapshot("edit goals");

      m: Math.max(-100, Math.min(100, parseFloat(modal.querySelector("#gm").value)||0))
    };
    markDirty(); closeModal(); viewGoals(); toastUndo("Targets saved");
  };
}

/* ============================================================
   16. COLLECTIONS
   The star and retry collections are worked out from the questions
   themselves, so bookmarking into one really does set that star.
   ============================================================ */
const VIRTUAL_COLS = [
  {id:"s3", n:"3 star questions", kind:"star", v:3},
  {id:"s2", n:"2 star questions", kind:"star", v:2},
  {id:"s1", n:"1 star questions", kind:"star", v:1},
  {id:"rt", n:"Retry questions",  kind:"flag"},
  {id:"wr", n:"Wrong questions",  kind:"res", v:2},
  {id:"st", n:"Stuck questions",  kind:"res", v:3},
  {id:"nt", n:"Questions with notes", kind:"note", readonly:true},
  {id:"mine", n:"My notes", kind:"mine", readonly:true},
  {id:"exam", n:"Exam notes", kind:"exam", readonly:true}
];
/* standalone notes: written on their own, not attached to any question */
/* test notes live on the test itself and are shown, read-only, in their own collection */
function examNotes(){
  const out = [];
  (S.an.folders||[]).forEach(f=>f.tests.forEach(t=>{
    if(t.notes && t.notes.trim())
      out.push({id:"an_"+f.id+"_"+t.id, t:t.notes, c:[], at:0, exam:f.name+" · "+t.name,
                href:`#/an/${f.id}/${t.id}`});
  }));
  return out;
}
const notesIn = col => col.kind==="exam" ? examNotes()
                     : col.kind==="mine" ? S.notes.slice()
                     : col.kind==="custom" ? S.notes.filter(n=>(n.c||[]).indexOf(col.id)>=0)
                     : [];
const allCollections = () => VIRTUAL_COLS.concat((S.col||[]).map(c=>({id:c.id, n:c.n, kind:"custom"})));
const colDef = id => allCollections().find(c=>c.id===id);

function bmIcon(on){
  return `<svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><path d="M1.4 1.4h9.2v11.2L6 9.2l-4.6 3.4z" fill="${on?"currentColor":"none"}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}
/* pull a question key apart and look up what it belongs to */
function qkInfo(qk){
  const dot = qk.lastIndexOf(".");
  const base = qk.slice(0,dot), i = Number(qk.slice(dot+1));
  const s = base[0], c = base.slice(1,-1), e = base.slice(-1);
  const sub = subjOf(s), ch = sub ? chapOf(s,c) : null, ex = ch ? exOf(s,ch,e) : null;
  return {qk, base, i, s, c, e, sub, ch, ex, v:(S.d[base]||[])[i]||0};
}
function inCollection(qk, col){
  if(col.kind==="star") return stars(qkInfo(qk).v) === col.v;
  if(col.kind==="flag") return !!isFlag(qkInfo(qk).v);
  if(col.kind==="res"){
    if(result(qkInfo(qk).v) !== col.v) return false;
    if(col.v===2 && wrongTagFilter!=="all"){
      const rec = S.r[qk];
      if(wrongTagFilter==="__none") return !rec || !rec.t.length;
      return !!(rec && rec.t.indexOf(wrongTagFilter) >= 0);
    }
    return true;
  }
  if(col.kind==="note") return !!(S.n[qk] && S.n[qk].trim());
  return (S.bm[qk]||[]).indexOf(col.id) >= 0;
}
/* the day a question landed in this collection, where that is known */
function savedOn(qk, col){
  if(col.kind==="custom") return (S.x.bmAt||{})[col.id+"|"+qk] || null;
  if(col.kind==="res" && col.v===2) return (S.r[qk]||{}).d || null;   /* the day it was marked wrong */
  return null;
}
let collFilter = {ch:"", from:"", to:""};
function filterMembers(list, col){
  return list.filter(qk=>{
    const q = qkInfo(qk);
    if(collFilter.ch && collFilter.ch !== q.s+":"+q.c) return false;
    if(collFilter.from || collFilter.to){
      const d = savedOn(qk, col);
      if(!d) return false;
      if(collFilter.from && d < collFilter.from) return false;
      if(collFilter.to && d > collFilter.to) return false;
    }
    return true;
  });
}
function collectionMembers(col){
  const out = [];
  if(col.kind==="custom"){
    Object.keys(S.bm).forEach(qk=>{ if((S.bm[qk]||[]).indexOf(col.id)>=0) out.push(qk); });
  } else if(col.kind==="note"){
    Object.keys(S.n).forEach(qk=>{ if(S.n[qk] && S.n[qk].trim()) out.push(qk); });
  } else {
    /* one test for every derived kind, so star / retry / wrong / stuck agree */
    Object.keys(S.d).forEach(base=>{
      (S.d[base]||[]).forEach((v,i)=>{
        if(!v) return;
        const qk = base+"."+i;
        if(inCollection(qk, col)) out.push(qk);
      });
    });
  }
  return out.filter(qk=>{ const q = qkInfo(qk); return q.sub && q.ch && q.ex; })
            .sort((a,b)=>a<b?-1:1);
}
function setMembership(qk, col, on){
  const q = qkInfo(qk);
  if(col.kind==="star"){
    const arr = arrFor(q.s, q.c, q.e, qCount(q.s, q.ch, q.e));
    arr[q.i] = setStars(arr[q.i]||0, on ? col.v : 0);
  } else if(col.kind==="flag"){
    const arr = arrFor(q.s, q.c, q.e, qCount(q.s, q.ch, q.e));
    arr[q.i] = setFlag(arr[q.i]||0, on?1:0);
  } else if(col.kind==="custom"){
    const cur = new Set(S.bm[qk]||[]);
    on ? cur.add(col.id) : cur.delete(col.id);
    if(cur.size) S.bm[qk] = [...cur]; else delete S.bm[qk];
    /* remember the day it went in, so a collection can be filtered by when */
    S.x.bmAt = S.x.bmAt || {};
    if(on) S.x.bmAt[col.id+"|"+qk] = todayKey();
    else delete S.x.bmAt[col.id+"|"+qk];
  }
  markDirty();
}

function openBookmark(qk, after){
  const q = qkInfo(qk);
  const draw = ()=>{
    openModal(`<h3>Save question ${q.i+1}</h3>

      <div class="opts" id="cols">${allCollections().map(c=>`
        <div class="opt ${inCollection(qk,c)?"on":""} ${c.readonly?"ro":""}" data-c="${esc(c.id)}"

        <button class="btn" id="addCol">Create</button></div>
      <div class="hint">Saving into a star collection sets that star on the question.</div>
      <div class="acts"><button class="btn primary" id="bmDone">Done</button></div>`);
    modal.querySelectorAll(".opt").forEach(el=>{
      const c = colDef(el.dataset.c);
      if(c.readonly) return;
      const toggle = ()=>{ setMembership(qk, c, !inCollection(qk,c)); draw(); };
      el.onclick = toggle;
      el.onkeydown = ev=>{ if(ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); toggle(); } };
    });

      const v = modal.querySelector("#newCol").value.trim(); if(!v) return;
      snapshot("new collection");

    modal.querySelector("#newCol").onkeydown = e=>{ if(e.key==="Enter") add(); };
    modal.querySelector("#bmDone").onclick = ()=>{ closeModal(); if(after) after(); };
  };
  onEsc = ()=>{ if(after) after(); };
  draw();
}

/* speedrun is a third mode alongside Pomodoro and Endless, run inline on
   the Study page rather than in a takeover modal. TIMER.sr holds a run in
   progress; nothing here is saved until the run is stopped and logged. */
function newSR(){ return {phase:"setup", target:S.pom.srQ||10, minutes:S.pom.srM||15,
  clicker: S.pom.srClicker!==false, source:null, hwId:null, order:[], done:0, startAt:0, tick:null}; }
/* question-list homework not yet finished — the ready-made topics a
   speedrun can race through instead of you picking an exercise by hand */
function speedableHomework(){
  return S.h.filter(it=>!it.kind).map(it=>{
    const st = hwStats(it), r = st.r;
    if(r.missing) return null;
    const left = st.total - st.done;
    return left>0 ? {it, label:chTitle(r.ch)+" · "+r.ex.name, left, total:st.total} : null;
  }).filter(Boolean);
}
TIMER.sr = newSR();
const isSpeedrun = l => l.length > 4 && l[4] === 1;

/* every not-yet-solved question in one exercise, in order — the "source" a
   speedrun can optionally practice against, independent of homework */
function sourceQuestions(src){
  if(!src || !src.s || !src.e) return [];
  const ch = chapOf(src.s, src.c); if(!ch) return [];
  const n = qCount(src.s, ch, src.e), a = S.d[key(src.s,src.c,src.e)]||[];
  const out = [];
  for(let i=0;i<n;i++) if(!isDone(a[i]||0)) out.push(key(src.s,src.c,src.e)+"."+i);
  return out;
}
function srSourceLabel(src, hwId){
  if(hwId){

    if(it){ const r = hwResolve(it); if(!r.missing) return chTitle(r.ch)+" · "+r.ex.name+" (homework)"; }
  }
  if(!src) return "Just practising — no specific questions";
  const ch = chapOf(src.s, src.c), ex = ch && exOf(src.s, ch, src.e);
  return ex ? (subjOf(src.s)?subjOf(src.s).short:src.s)+" · "+chTitle(ch)+" · "+ex.name : "Just practising";
}

function wireSrSetup(){
  const sr = TIMER.sr;
  const on = (id,fn)=>{ const el=document.getElementById(id); if(el) el.onchange=fn; };
  on("srS", e=>{ sr.source = e.target.value ? {s:e.target.value} : null; viewStudy(); });
  on("srMo", e=>{ sr.source.m = e.target.value; delete sr.source.c; delete sr.source.e; viewStudy(); });
  on("srC", e=>{ sr.source.c = e.target.value; delete sr.source.e; viewStudy(); });
  on("srE", e=>{ sr.source.e = e.target.value; viewStudy(); });
  document.querySelectorAll("[data-srhw]").forEach(b=>b.onclick = ()=>{
    sr.hwId = sr.hwId===b.dataset.srhw ? null : b.dataset.srhw;
    sr.source = null;                    /* a homework list and a manual pick are mutually exclusive */

function srRunHTML(){

function srTick(){
  const sr = TIMER.sr;
  if(sr.phase !== "run") return;
  const el = Math.min(sr.minutes*60, (Date.now()-sr.startAt)/1000);
  if(el >= sr.minutes*60 || sr.done >= sr.target){ srStop(); return; }
  if(VIEW.name==="study") viewStudy();
}
/* which of the run's questions are ticked — any of them, in any order */
function srPicked(sr){
  if(!(sr.picked instanceof Set)){
    sr.picked = new Set();
    for(let i=0;i<(sr.done||0);i++) sr.picked.add(i);   /* a run already under way */
  }
  if(!(sr.mine instanceof Set)) sr.mine = new Set();     /* the ones this run ticked itself */
  return sr.picked;
}
function wireSrRun(){
  const sr = TIMER.sr;
  document.querySelectorAll("[data-srcell]").forEach(b=>b.onclick = ()=>{
    if(!sr.clicker) return;
    const i = Number(b.dataset.srcell);
    const picked = srPicked(sr);
    const qk = sr.order[i];
    const q = qk ? qkInfo(qk) : null;
    if(picked.has(i)){
      /* taking one back, and with it the tick this run put on the question */
      picked.delete(i);
      if(q && sr.mine.has(i)){
        const arr = arrFor(q.s,q.c,q.e,qCount(q.s,q.ch,q.e));
        if(isDone(arr[q.i]||0)){ arr[q.i] = setDone(arr[q.i]||0,0); bumpStat(q.s,-1); markDirty(); }
        sr.mine.delete(i);
      }
    } else {
      picked.add(i);
      if(q){
        const arr = arrFor(q.s,q.c,q.e,qCount(q.s,q.ch,q.e));
        if(!isDone(arr[q.i]||0)){ arr[q.i] = setDone(arr[q.i]||0,1); bumpStat(q.s,1); markDirty(); sr.mine.add(i); }
      }
    }
    sr.done = picked.size;
    if(sr.done >= sr.target || sr.done >= (sr.order.length||sr.target)) srStop();
    else viewStudy();
  });
  document.getElementById("srStop").onclick = srStop;
}
/* stopping without the clicker needs to ask what actually got finished */
function srStop(){
  const sr = TIMER.sr;
  clearInterval(sr.tick); sr.tick = null;
  if(sr.clicker || sr.done > 0){ srLog(sr.done); return; }
  if(sr.order.length){
    let picked = new Set();
    const draw = ()=>{
      openModal(`<h3>What did you finish?</h3><p>Pick every question you completed during the run.</p>
        <div class="chips" style="margin-bottom:14px">${sr.order.map((qk,i)=>{
          const q = qkInfo(qk);
          return `<button class="chip ${picked.has(i)?"c":""}" data-pick="${i}">${q.i+1}</button>`;
        }).join("")}</div>
        <div class="acts"><button class="btn" id="srCancel">Keep going</button>
        <button class="btn primary" id="srConfirm">Log ${picked.size} done</button></div>`);
      modal.querySelectorAll("[data-pick]").forEach(b=>b.onclick = ()=>{
        const i = Number(b.dataset.pick);
        picked.has(i) ? picked.delete(i) : picked.add(i);
        draw();
      });
      modal.querySelector("#srCancel").onclick = ()=>{ closeModal();
        clearInterval(sr.tick); sr.tick = setInterval(srTick, 500); viewStudy(); };
      modal.querySelector("#srConfirm").onclick = ()=>{
        picked.forEach(i=>{
          const q = qkInfo(sr.order[i]);
          const arr = arrFor(q.s,q.c,q.e,qCount(q.s,q.ch,q.e));
          if(!isDone(arr[q.i]||0)){ arr[q.i] = setDone(arr[q.i]||0,1); bumpStat(q.s,1); }
        });
        markDirty(); closeModal(); srLog(picked.size);
      };
    };
    onEsc = ()=>{ clearInterval(sr.tick); sr.tick = setInterval(srTick, 500); viewStudy(); };
    draw();
  } else {
    openModal(`<h3>How many did you finish?</h3>
      <div class="block"><input class="numin" type="number" id="srHow" min="0" max="${sr.target}" value="0"></div>
      <div class="acts"><button class="btn" id="srCancel">Keep going</button>
      <button class="btn primary" id="srConfirm">Log it</button></div>`);
    document.getElementById("srCancel").onclick = ()=>{ closeModal();
      clearInterval(sr.tick); sr.tick = setInterval(srTick, 500); viewStudy(); };
    document.getElementById("srConfirm").onclick = ()=>{
      const n = Math.max(0, Math.min(sr.target, parseInt(document.getElementById("srHow").value,10)||0));
      closeModal(); srLog(n);
    };
    onEsc = ()=>{ clearInterval(sr.tick); sr.tick = setInterval(srTick, 500); viewStudy(); };
  }
}
function srLog(done){
  const sr = TIMER.sr;
  clearInterval(sr.tick); sr.tick = null;
  const mins = Math.max(1, Math.round((Date.now()-sr.startAt)/60000));
  const startMin = Math.floor(sr.startAt/60000);
  /* the trailing 1 marks a speedrun; the two numbers after are target and done,
     which is also how the average-time-per-question statistic is derived */
  S.log.push([startMin, mins, TIMER.act || "rev", TIMER.dl || null, 1, sr.target, done]);
  markDirty(); sweepFinishedHomework();
  TIMER.sr = newSR();
  statView.mode = "day"; statView.anchor = new Date();
  if(location.hash.indexOf("#/stats") === 0){ viewStats(); paintTabs(); }
  else location.hash = "#/stats";
  toast("Speedrun logged — "+done+" of "+sr.target+" in "+mins+" min");
}
/* time per question, averaged over every speedrun in a date range */
function avgQuestionTime(from, to, subs, dlId){
  let secs = 0, qs = 0;
  S.log.forEach(l=>{
    if(!isSpeedrun(l) || !l[6]) return;
    if(subs && !subs.has(l[2]) && !(dlId && l[3]===dlId)) return;
    if(!inRange(dayKey(new Date(l[0]*60000)), from, to)) return;
    secs += l[1]*60; qs += l[6];
  });
  return qs ? Math.round(secs/qs) : null;
}

/* ============================================================
   18. ANALYSIS
   Folders of tests. Marks live here and in the Marks tab, kept in
   step by name so editing either updates the other.
   ============================================================ */
const AN_SUBS = ["P","C","M"];
function newSubMark(tot){ return {tot: tot===undefined?100:tot, sc:0, wr:0, time:0}; }
/* a declaration, not a const: the initial state is built before this file's
   consts have been evaluated */
function DEFAULT_CFG(){ return {marks:{P:100,C:100,M:100}, qs:{P:25,C:25,M:25}}; }
function folderCfg(f){
  if(!f.cfg) f.cfg = DEFAULT_CFG();
  if(!f.cfg.marks) f.cfg.marks = DEFAULT_CFG().marks;
  if(!f.cfg.qs) f.cfg.qs = DEFAULT_CFG().qs;
  return f.cfg;
}
function newTest(name, cfg){
  const c = cfg || DEFAULT_CFG();
  return {id:"x"+Math.random().toString(36).slice(2,8), name,
          subs:{P:newSubMark(c.marks.P), C:newSubMark(c.marks.C), M:newSubMark(c.marks.M)},
          ranks:{all:"", batch:"", P:"", C:"", M:""}, agg:"", qs:[], notes:""};
}
/* the series decides how big every paper in it is */
function applySeries(f){
  const c = folderCfg(f);
  f.tests.forEach(t=>AN_SUBS.forEach(s=>{ t.subs[s].tot = +c.marks[s]||0; }));
}
/* partial credit used to be tracked separately; fold any old values into scored */
function migrateAnalysis(){
  (S.an && S.an.folders || []).forEach(f=>{
    folderCfg(f);
    f.tests.forEach(t=>{
      if(t.agg === undefined) t.agg = "";
      AN_SUBS.forEach(s=>{
        const m = t.subs[s];
        if(m && m.pt){ m.sc = (+m.sc||0) + (+m.pt||0); }
        if(m) delete m.pt;
      });
    });
  });
}
function newAnalysis(){
  /* map passes the index as a second argument, which newTest now reads as a
     config, so name each one explicitly */
  const mk = names => names.map(n=>newTest(n, DEFAULT_CFG()));
  return {folders:[
    {id:"btest", name:"BTest",  mark:"btest", cfg:DEFAULT_CFG(), tests:mk(["MOT","BTest 1","BTest 2","BTest 3","BTest 4"])},
    {id:"alt",   name:"ALT",    mark:"alt",   cfg:DEFAULT_CFG(), tests:mk(["ALT 1"])},
    {id:"cet",   name:"MHTCET", mark:"cet",   cfg:DEFAULT_CFG(), tests:mk(["MHTCET 1","MHTCET 2","MHTCET 3"])}
  ]};
}
const anFolder = id => (S.an.folders||[]).find(f=>f.id===id);
const anTest = (f,id) => f ? f.tests.find(t=>t.id===id) : null;
const anLeft = m => Math.max(0, (+m.tot||0) - Math.max(0, +m.sc||0) - (+m.wr||0));
const anTotal = t => AN_SUBS.reduce((a,s)=>a+(+t.subs[s].tot||0), 0);
const anScored = t => AN_SUBS.reduce((a,s)=>a+(+t.subs[s].sc||0), 0);
const anTime = t => AN_SUBS.reduce((a,s)=>a+(+t.subs[s].time||0), 0);

/* ---- keeping Analysis and Marks in step ---------------------- */
const MARK_COL = {P:"p", C:"c", M:"m"};
function markRowFor(folder, test, make){
  const tbl = S.marks.tables.find(t=>t.id===folder.mark) || S.marks.tables.find(t=>t.n===folder.name);
  if(!tbl) return null;
  let row = tbl.rows.find(r=>(r.v.name||"").trim() === test.name.trim());
  if(!row && make){ row = {v:{name:test.name}}; tbl.rows.push(row); }
  return row ? {tbl, row} : null;
}
/* Analysis is the more detailed of the two, so it writes into Marks */
function pushToMarks(folder, test){
  const hit = markRowFor(folder, test, true); if(!hit) return;
  const v = hit.row.v;
  v.name = test.name;
  v.tot = String(anTotal(test));
  v.sc  = String(anScored(test));
  AN_SUBS.forEach(s=>{ v[MARK_COL[s]] = String(+test.subs[s].sc||0); });
  v.agg = String(test.agg || "");
  /* write these even when blank, otherwise clearing one here leaves the old
     value in Marks and the next read syncs it straight back */
  v.rb = String(test.ranks.batch || "");
  v.rt = String(test.ranks.all || "");
}
/* and reads back whatever was typed on the Marks side */
function pullFromMarks(folder, test){
  const hit = markRowFor(folder, test, false); if(!hit) return false;
  const v = hit.row.v;
  let changed = false;
  AN_SUBS.forEach(s=>{
    const n = parseFloat(v[MARK_COL[s]]);
    if(isFinite(n) && (+test.subs[s].sc||0) !== n){ test.subs[s].sc = n; changed = true; }
  });
  const rb = v.rb, rt = v.rt;
  if(rb && String(test.ranks.batch)!==String(rb)){ test.ranks.batch = rb; changed = true; }
  if(rt && String(test.ranks.all)!==String(rt)){ test.ranks.all = rt; changed = true; }
  if(v.agg && String(test.agg)!==String(v.agg)){ test.agg = v.agg; changed = true; }
  return changed;
}
function syncAllFromMarks(){
  let changed = false;
  (S.an.folders||[]).forEach(f=>f.tests.forEach(t=>{ if(pullFromMarks(f,t)) changed = true; }));
  return changed;
}

      <span class="lbl">${esc(subjOf(s)?subjOf(s).name:s)}</span>

      <span class="blabel" style="margin:0">marks</span>

    <div class="msg warn" id="cfgMsg"></div>

  modal.querySelector("#cfgNo").onclick = ()=>{ closeModal(); viewAnFolder(f); };
  modal.querySelector("#cfgYes").onclick = ()=>{
    const num = id=>Math.max(0, parseInt(modal.querySelector("#"+id).value,10)||0);
    /* a smaller paper than someone has already scored on would be nonsense */
    const over = [];
    AN_SUBS.forEach(s=>{
      const tot = num("cm_"+s);
      f.tests.forEach(t=>{ if((+t.subs[s].sc||0)+(+t.subs[s].wr||0) > tot) over.push(t.name); });
    });
    if(over.length){ modal.querySelector("#cfgMsg").textContent =
      "That is fewer marks than already recorded in " + [...new Set(over)].join(", ") + "."; return; }
    snapshot("series settings");
    AN_SUBS.forEach(s=>{ c.marks[s] = num("cm_"+s); c.qs[s] = num("cq_"+s); });
    applySeries(f);
    f.tests.forEach(t=>pushToMarks(f,t));
    markDirty(); closeModal(); viewAnFolder(f); toastUndo("Settings applied to " + f.tests.length + " tests");
  };
}
function anDonut(sub, m, qs){
  const size = 168, tot = Math.max(1, +m.tot||0);
  const net = +m.sc||0;
  const parts = [
    {v:net, ring:Math.max(0,net), c:"var(--ok)",   n:"Scored"},
    {v:+m.wr||0, c:"var(--no)",   n:"Wrong"},
    {v:anLeft(m), c:"var(--ink-3)", n:"Left"}
  ];
  const shown = parts.filter(p=>(p.ring!==undefined?p.ring:p.v) > 0);
  const r = size/2 - 2;
  let arcs = "";
  if(shown.length === 1){
    /* full marks, or nothing but blanks — one solid ring rather than an empty one */
    arcs = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="${shown[0].c}"/>`;
  } else {
    let a0 = -Math.PI/2;
    shown.forEach(p=>{
      const a1 = a0 + ((p.ring!==undefined?p.ring:p.v)/tot)*Math.PI*2;
      arcs += `<path d="${arcPath(size/2,size/2,r,a0,a1)}" fill="${p.c}" stroke="var(--ink-2)" stroke-width="2"/>`;
      a0 = a1;
    });
  }
  const got = +m.sc||0;
  return `<button class="card" style="cursor:pointer;text-align:center" data-anedit="${sub}">
    <div class="card-top" style="justify-content:center"><span class="card-title">${esc(subjOf(sub)?subjOf(sub).name:sub)}</span></div>

function editSubMark(f, t, s){
  const m = t.subs[s];
  onEsc = ()=>viewAnTest(f,t);
  const row = (id,label,val,hint)=>`<div class="setrow"><span class="lbl">${label}${hint?`<br><span class="hint" style="margin:0">${hint}</span>`:""}</span>
    <input class="numin" type="number" id="${id}" value="${val}"></div>`;
  openModal(`<h3>${esc(subjOf(s)?subjOf(s).name:s)} — ${esc(t.name)}</h3>
    ${row("mTot","Marks in the paper","" + (+m.tot||0))}
    ${row("mSc","Marks scored","" + (+m.sc||0),"your net after negative marking — it can go below zero")}
    ${row("mWr","Marks lost to wrong answers","" + (+m.wr||0))}
    ${row("mTime","Minutes spent","" + (+m.time||0))}
    <div class="msg bad" id="mMsg"></div>
    <div class="acts"><button class="btn" id="mNo2">Cancel</button>
    <button class="btn primary" id="mYes2">Save</button></div>`);
  modal.querySelector("#mNo2").onclick = ()=>{ closeModal(); viewAnTest(f,t); };
  modal.querySelector("#mYes2").onclick = ()=>{
    const g = id=>Math.max(0, parseFloat(modal.querySelector("#"+id).value)||0);
    /* a net score is the one number here that is allowed to be negative */
    const gs = id=>parseFloat(modal.querySelector("#"+id).value)||0;
    const tot = g("mTot"), scv = gs("mSc"), wr = g("mWr");
    if(scv > tot){ modal.querySelector("#mMsg").textContent =
      "That is more than the paper is worth."; return; }
    if(Math.max(0,scv)+wr > tot){ modal.querySelector("#mMsg").textContent =
      "Scored and wrong add up to more than the paper is worth."; return; }
    snapshot("edit marks");
    m.tot = tot; m.sc = scv; m.wr = wr; m.time = g("mTime");
    pushToMarks(f, t);
    markDirty(); closeModal(); viewAnTest(f,t); toastUndo("Marks saved");
  };
}

function editAnQ(f, t, idx, kind){
  const q = idx===null ? {s:"P", q:"", kind, t:[], note:""} : t.qs[idx];
  const picked = new Set(q.t||[]);
  onEsc = ()=>viewAnTest(f,t);
  const draw = ()=>{
    openModal(`<h3>${q.kind==="wrong"?"A question you got wrong":"One you could have done better"}</h3>

          <div class="opt ${picked.has(x.id)?"on":""}" data-aqt="${esc(x.id)}" role="checkbox" aria-checked="${picked.has(x.id)}" tabindex="0">
            <span class="bx">✓</span>${esc(x.n)}</div>`).join("")}</div>
        <div class="hwrow" style="margin-top:10px">

          <button class="btn" id="aqAdd">Add</button></div></div>
      <div class="acts"><button class="btn" id="aqNo">Cancel</button>
      <button class="btn primary" id="aqYes">${idx===null?"Add":"Save"}</button></div>`);
    wireMathPreview("aqN", "aqPrev");
    modal.querySelectorAll("[data-aqt]").forEach(el=>{
      const toggle = ()=>{ const id2 = el.dataset.aqt;
        picked.has(id2) ? picked.delete(id2) : picked.add(id2); el.classList.toggle("on"); };
      el.onclick = toggle;
      el.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } };
    });
    const add = ()=>{
      const v = modal.querySelector("#aqNew").value.trim(); if(!v) return;
      const id2 = "u"+Date.now().toString(36);
      S.x.tags.push({id:id2, n:v}); picked.add(id2);
      q.s = modal.querySelector("#aqS").value;
      q.q = modal.querySelector("#aqQ").value;
      q.note = modal.querySelector("#aqN").value;
      markDirty(); draw();

      q.note = modal.querySelector("#aqN").value;
      q.t = [...picked];
      if(idx===null) t.qs.push(q);
      markDirty(); closeModal(); viewAnTest(f,t); toastUndo("Saved");
    };
  };
  draw();
}

/* ============================================================
   20. MANUAL — everything the app does, in one place
   ============================================================ */
function svgFlow(steps){
  const W = 150, H = 64, gap = 26, total = steps.length*W + (steps.length-1)*gap;
  let x = 0, out = "";
  steps.forEach((s,i)=>{
    out += `<rect x="${x}" y="0" width="${W}" height="${H}" rx="10" fill="var(--ink-3)" stroke="var(--rule)"/>
      <text x="${x+W/2}" y="${H/2-4}" text-anchor="middle" fill="var(--text)" font-size="12.5" font-family="ui-sans-serif">${esc(s[0])}</text>
      ${s[1]?`<text x="${x+W/2}" y="${H/2+14}" text-anchor="middle" fill="var(--text-3)" font-size="10.5" font-family="ui-monospace,monospace">${esc(s[1])}</text>`:""}`;
    if(i < steps.length-1){
      out += `<line x1="${x+W+4}" y1="${H/2}" x2="${x+W+gap-4}" y2="${H/2}" stroke="var(--accent)" stroke-width="2"/>
        <polygon points="${x+W+gap-4},${H/2-5} ${x+W+gap+3},${H/2} ${x+W+gap-4},${H/2+5}" fill="var(--accent)"/>`;
    }
    x += W + gap;
  });
  return `<div class="diagram"><svg viewBox="0 0 ${total} ${H}" style="width:100%;max-width:${total}px;height:auto;display:block">${out}</svg></div>`;
}
function svgTree(){
  const rows = [
    [0, "Subject", "Physics, Chemistry, Maths"],
    [1, "Module", "1 – 6, or your own"],
    [2, "Chapter", "numbered within its module"],
    [3, "Exercise", "Intext, Ex1–4, PYQs, or your own"],
    [4, "Question", "the row you actually tick"]
  ];
  const rowH = 34, indent = 26;
  const H = rows.length*rowH + 10;
  let out = "";
  rows.forEach(([depth,name,note],i)=>{
    const y = i*rowH + 18, x = depth*indent;
    if(i>0) out += `<line x1="${x-indent+7}" y1="${y-rowH+8}" x2="${x-indent+7}" y2="${y}" stroke="var(--rule)"/>`;
    out += `<circle cx="${x+7}" cy="${y}" r="4" fill="var(--accent)"/>
      <text x="${x+18}" y="${y+4}" fill="var(--text)" font-size="12.5" font-family="ui-sans-serif">${esc(name)}</text>
      <text x="${x+18+name.length*7.2+14}" y="${y+4}" fill="var(--text-3)" font-size="10.5" font-family="ui-monospace,monospace">${esc(note)}</text>`;
  });
  return `<div class="diagram"><svg viewBox="0 0 480 ${H}" style="width:100%;max-width:480px;height:auto;display:block">${out}</svg></div>`;
}
function manFaq(items){
  return items.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${a}</p></details>`).join("");
}
/* ============================================================
   21. REVISION
   A checklist of chapters whose "freshness" fades from green to
   red the longer it has been since you last pressed +.
   ============================================================ */
function newRevision(){ return {items:{}, decayDays:14}; }
function revKey(sc, no){ return sc+":"+no; }
function revFreshness(it, decayDays){
  if(!it.last) return 1;                       /* never revised: fully red */
  const days = (Date.now() - it.last) / 86400000;
  return Math.max(0, Math.min(1, days / (decayDays||14)));
}
function revColor(frac){
  /* green (62,207,142) fading to red (255,95,109) */
  const g = [62,207,142], r = [255,95,109];
  const mix = k => Math.round(g[k] + (r[k]-g[k])*frac);
  return `rgb(${mix(0)},${mix(1)},${mix(2)})`;
}
function revItemsFor(dlId){
  const d = dlId ? S.dl.find(x=>x.id===dlId) : null;
  const subs = d && d.subs && d.subs.length ? new Set(d.subs) : null;
  return Object.keys(S.rev.items).filter(k=>!subs || subs.has(k.split(":")[0]));
}
let revPick = {dl:"", open:false, chosen:new Set(), weight:1};

function viewRevision(){
  crumbs([{label:"Home",href:"#/"},{label:"Revision"}]);
  const decayDays = S.rev.decayDays || 14;
  const keys = revItemsFor(null);
  const dueToday = keys.filter(k=>{
    const it = S.rev.items[k];
    return it.remindDate && it.remindDate <= todayKey() && !it.remindDone;
  });

  /* group by subject > module for the checklist */
  const bySub = {};
  keys.forEach(k=>{
    const [sc,no] = k.split(":");
    const ch = chapOf(sc, no); if(!ch) return;
    ((bySub[sc]=bySub[sc]||{})[ch.mod]=bySub[sc][ch.mod]||[]).push({k, ch});
  });
  const totalW = keys.reduce((a,k)=>a+(+S.rev.items[k].weight||1),0);
  const avgFresh = totalW ? keys.reduce((a,k)=>a+revFreshness(S.rev.items[k],decayDays)*(+S.rev.items[k].weight||1),0)/totalW : 0;

  let tree = "";
  Object.keys(bySub).forEach(sc=>{
    const sub = subjOf(sc); if(!sub) return;
    const sk = "rs:"+sc;
    tree += `<div class="node">
      <button class="twisty" data-scl="${sk}">${S.closed[sk]?"▸":"▾"}</button>
      <span class="lv">Subject</span><span class="nm">${esc(sub.name)}</span></div>`;
    if(S.closed[sk]) return;
    tree += `<div class="branch">`;
    Object.keys(bySub[sc]).forEach(m=>{
      const mo = sub.modules[m]; if(!mo) return;
      const mk = "rm:"+sc+":"+m;
      tree += `<div class="node"><button class="twisty" data-scl="${mk}">${S.closed[mk]?"▸":"▾"}</button>
        <span class="lv">Module</span><span class="nm">${esc(mo.name)}</span></div>`;
      if(!S.closed[mk]){
        tree += `<div class="branch">`;
        bySub[sc][m].sort((a,b)=>chLabel(a.ch)-chLabel(b.ch)).forEach(({k,ch})=>{
          const it = S.rev.items[k], frac = revFreshness(it, decayDays), col = revColor(frac);
          const rem = it.remindDate ? (it.remindDate<=todayKey() && !it.remindDone ? "due" : "set") : "";
          tree += `<div class="hwitem" style="border-left:3px solid ${col}">
            <div class="hwhead">
              <span class="loc">${esc(chTitle(ch))}</span>
              <span class="rng">weight ${it.weight||1}</span>
              ${it.last?`<span class="rng">revised ${new Date(it.last).toLocaleDateString()}</span>`:`<span class="rng">never revised</span>`}
              ${rem?`<span class="due ${rem==="due"?"over":""}">${rem==="due"?"reminder due":"reminder set"}</span>`:""}
              <span style="flex:1"></span>
              <button class="tbtn" data-revrem="${esc(k)}" title="Set a reminder">🔔</button>
              <button class="tbtn primary" data-revbump="${esc(k)}" title="I revised this">+</button>
              <button class="x" data-revdel="${esc(k)}" title="Remove from the list">×</button></div>
            <div class="rail"><i style="width:${Math.round((1-frac)*100)}%;background:${col}"></i></div>
            ${it.note?`<div class="dltext" style="margin-top:8px">${mathText(it.note)}</div>`:""}</div>`;
        });
        tree += `</div>`;
      }
    });
    tree += `</div>`;
  });

  app.innerHTML = recBanner() + `<div class="pagehead"><div class="eyebrow">Revision</div><h1>Keep everything fresh</h1>
      <p class="sub">Press + on a chapter each time you go back over it. The longer you leave one, the redder it gets.</p>
      <div class="stats"><span><span class="k">chapters tracked</span> <b>${keys.length}</b></span>
      <span><span class="k">overall freshness</span> <b>${Math.round((1-avgFresh)*100)}%</b></span></div></div>

    ${dueToday.length ? `<div class="banner" style="border-color:rgba(255,176,58,.45);background:rgba(255,176,58,.1)">

/* an acknowledged reminder that repeats rolls its date forward rather than
   vanishing, so "once a month" keeps coming back */
function rollRevisionReminders(){
  let changed = false;
  Object.values(S.rev.items).forEach(it=>{
    if(it.remindDate && it.remindDate < todayKey() && it.remindEvery){
      const d = new Date(it.remindDate+"T00:00:00");
      if(it.remindEvery==="week") d.setDate(d.getDate()+7); else d.setMonth(d.getMonth()+1);
      it.remindDate = dayKey(d); delete it.remindDone;
      changed = true;
    }
  });
  if(changed) markDirty();
}

/* ============================================================
   27. REVISION ROULETTE
   Picks a random chapter to revise, weighted so the staler (redder)
   ones come up more often than ones just revised — genuinely random,
   but biased towards what actually needs attention.
   ============================================================ */
function openRevRoulette(){
  const keys = Object.keys(S.rev.items);
  if(!keys.length){ toast("Add some chapters to Revision first"); return; }
  spinRoulette();
}
function pickRouletteChapter(){
  const decayDays = S.rev.decayDays || 14;
  const keys = Object.keys(S.rev.items);
  /* a small base weight so even a freshly-revised chapter can still come
     up occasionally, just far less often than an overdue one */
  const weights = keys.map(k=>0.08 + revFreshness(S.rev.items[k], decayDays));
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<keys.length;i++){ r -= weights[i]; if(r<=0) return keys[i]; }
  return keys[keys.length-1];
}
function spinRoulette(){
  const k = pickRouletteChapter();
  const [sc, no] = k.split(":");
  const ch = chapOf(sc, no);
  if(!ch){
    /* the chapter behind this entry was deleted at some point; drop it and try again */
    delete S.rev.items[k]; markDirty();
    if(Object.keys(S.rev.items).length) return spinRoulette();
    closeModal(); toast("Nothing left to pick from"); return;
  }
  const it = S.rev.items[k];
  const decayDays = S.rev.decayDays || 14;
  const frac = revFreshness(it, decayDays), col = revColor(frac);
  onEsc = ()=>{};
  openModal(`<h3>Revision roulette</h3>
    <div class="panel" style="text-align:center;border-color:${col}">
      <div class="eyebrow">${esc(subjOf(sc)?subjOf(sc).name:sc)}</div>
      <h2 style="margin:6px 0">${esc(chTitle(ch))}</h2>
      <div class="rail" style="margin:14px 0"><i style="width:${Math.round((1-frac)*100)}%;background:${col}"></i></div>
      <p class="sub" style="margin:0">${it.last ? "Last revised "+new Date(it.last).toLocaleDateString() : "Never revised"}</p>
    </div>
    <div class="acts" style="margin-top:16px">
      <button class="btn" id="rouAgain">Spin again</button>
      <button class="btn" id="rouDone">I revised this</button>
      <button class="btn primary" id="rouGo">Go to it</button>
    </div>`);
  modal.querySelector("#rouAgain").onclick = spinRoulette;
  modal.querySelector("#rouDone").onclick = ()=>{
    it.last = Date.now(); markDirty(); closeModal(); viewRevision(); toast("Marked fresh");
  };
  modal.querySelector("#rouGo").onclick = ()=>{
    closeModal(); location.hash = `#/${sc}/${ch.mod}/${no}`;
  };
}

/* ============================================================
   22. MERGE CHAPTERS
   For folding a chapter you recorded before this syllabus update
   into the newly-added official one (or any two chapters together).
   Progress is appended, never overwritten, so nothing is lost.
   ============================================================ */
let MERGE = {picked:new Set(), step:1, target:"", codes:{}, mapTo:{}};
function openMergePicker(){
  MERGE = {picked:new Set(), step:1, target:"", codes:{}, mapTo:{}};
  drawMergeStep1();
}
function mergeCountFor(k){
  const parts = k.split(":");
  let n = 0;
  MERGE.picked.forEach(pk=>{
    const [sc,no] = pk.split(":");
    if(sc !== parts[1]) return;
    if(parts[0]==="s"){ n++; return; }
    const ch = chapOf(sc,no);
    if(ch && String(ch.mod)===parts[2]) n++;
  });
  return n;
}
function paintMergeCounts(){
  modal.querySelectorAll("[data-mrgcount]").forEach(el=>{
    const n = mergeCountFor(el.dataset.mrgcount);
    el.textContent = n ? n+" picked" : "";
    el.hidden = !n;
  });
}
function drawMergeStep1(){
  if(!MERGE.open) MERGE.open = {};
  let body = "";
  TREE.order.forEach(sc=>{
    const sub = subjOf(sc);
    const chapters = allChapters(sc);
    if(!chapters.length) return;
    const skey = "s:"+sc;
    const sOpen = MERGE.open[skey] !== false;          /* subjects start open */
    body += `<div class="node"><button class="twisty" data-mrgopen="${esc(skey)}">${sOpen?"▾":"▸"}</button>
      <span class="lv">Subject</span><span class="nm">${esc(sub.name)}</span>
      <span class="tagx" data-mrgcount="${esc(skey)}" hidden></span></div>`;
    body += `<div class="branch" data-mrgbody="${esc(skey)}"${sOpen?"":" hidden"}>`;
    sub.order.forEach(m=>{
      const mo = sub.modules[m];
      if(!mo || !mo.chapters.length) return;
      const mkey = "m:"+sc+":"+m;
      const picked = mo.chapters.some(ch=>MERGE.picked.has(sc+":"+ch.no));
      /* a module holding something you already picked opens itself */
      const mOpen = MERGE.open[mkey]===true || (MERGE.open[mkey]===undefined && picked);
      body += `<div class="node"><button class="twisty" data-mrgopen="${esc(mkey)}">${mOpen?"▾":"▸"}</button>
        <span class="lv">${mo.custom?"Book":"Module"}</span><span class="nm">${esc(mo.name)}</span>
        <span class="tagx">${mo.chapters.length}</span>
        <span class="tagx" data-mrgcount="${esc(mkey)}" hidden></span></div>`;
      body += `<div class="branch" data-mrgbody="${esc(mkey)}"${mOpen?"":" hidden"}><div class="opts">`;
      mo.chapters.forEach(ch=>{
        const k = sc+":"+ch.no;
        body += `<div class="opt ${MERGE.picked.has(k)?"on":""}" data-mergech="${esc(k)}" role="checkbox" tabindex="0">
          <span class="bx">✓</span>${esc(chTitle(ch))}${ch.custom?' <span class="tagx">yours</span>':""}</div>`;
      });
      body += `</div></div>`;
    });
    body += `</div>`;
  });
  onEsc = ()=>{};
  paintModal("merge1", `<h3>Merge chapters</h3>
    <p>Pick two or more chapters to combine — useful for folding a chapter you were already using into one that was just added. Open a module or reference book to see its chapters. You'll choose which to keep, and which exercises to bring across, next.</p>
    <div class="block" style="max-height:360px;overflow:auto"><div id="mrgList">${body}</div></div>
    <div class="acts"><button class="btn" id="mrgNo">Cancel</button>
    <button class="btn primary" id="mrgNext" ${MERGE.picked.size<2?"disabled":""}>Next — ${MERGE.picked.size} picked</button></div>`);
  paintMergeCounts();
  modal.querySelectorAll("[data-mrgopen]").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.mrgopen;
      const box = [...modal.querySelectorAll("[data-mrgbody]")].find(x=>x.dataset.mrgbody===k);
      if(!box) return;
      const open = box.hidden;
      box.hidden = !open; MERGE.open[k] = open; b.textContent = open ? "▾" : "▸";
    };
  });
  modal.querySelectorAll("[data-mergech]").forEach(el=>{
    const toggle = ()=>{
      const k = el.dataset.mergech;
      MERGE.picked.has(k) ? MERGE.picked.delete(k) : MERGE.picked.add(k);
      el.classList.toggle("on");
      const nx = modal.querySelector("#mrgNext");
      nx.disabled = MERGE.picked.size < 2;
      nx.textContent = "Next — " + MERGE.picked.size + " picked";
      paintMergeCounts();

    el.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } };
  });
  modal.querySelector("#mrgNo").onclick = closeModal;
  modal.querySelector("#mrgNext").onclick = ()=>{ if(MERGE.picked.size>=2) drawMergeStep2(); };
}
function drawMergeStep2(){
  const list = [...MERGE.picked];
  if(!MERGE.target || !MERGE.picked.has(MERGE.target)) MERGE.target = list[0];
  const label = k=>{ const [sc,no]=k.split(":"); const ch=chapOf(sc,no); return (subjOf(sc)?subjOf(sc).short:sc)+" · "+chTitle(ch); };
  const [tsc0] = MERGE.target.split(":");

  /* every exercise of every picked chapter starts out selected; unticking one
     leaves it where it is instead of bringing it across */
  list.forEach(k=>{
    const [sc,no] = k.split(":"); const ch = chapOf(sc,no);
    if(!MERGE.codes[k]) MERGE.codes[k] = new Set(exList(sc,ch).filter(e=>qCount(sc,ch,e.code)>0).map(e=>e.code));
  });
  if(!MERGE.mapTo) MERGE.mapTo = {};

  /* name and number default to whichever chapter you are keeping */
  const tgtCh = chapOf(...MERGE.target.split(":"));
  if(MERGE.nameFrom===undefined) MERGE.nameFrom = MERGE.target;
  if(MERGE.numFrom===undefined) MERGE.numFrom = MERGE.target;
  if(MERGE.destMod===undefined) MERGE.destMod = String(tgtCh.mod);

  const sub = subjOf(tsc0);
  const nameOf = k=>{ const [s,n]=k.split(":"); return chapOf(s,n).name; };
  const numOf  = k=>{ const [s,n]=k.split(":"); return chLabel(chapOf(s,n)); };

  /* one column per chapter, side by side, so the two sets of exercises can be
     compared directly and kept or dropped individually */
  const cols = list.map(k=>{
    const [sc,no] = k.split(":"); const ch = chapOf(sc,no);

      <div class="opts">${exs.length ? exs.map(e=>{
        const mapKey = k+"|"+e.code;
        if(MERGE.mapTo[mapKey]===undefined) MERGE.mapTo[mapKey] = "__new__";
        const on = MERGE.codes[k].has(e.code);
        /* you can only pour into an exercise the kept chapter is keeping */
        const targetExs = isTarget ? []
          : exList(tsc0, chapOf(...MERGE.target.split(":"))).filter(te=>MERGE.codes[MERGE.target].has(te.code));
        return `<div class="opt" style="align-items:center;cursor:default;flex-wrap:wrap">
          <span data-mergeex="${esc(mapKey)}" role="checkbox" tabindex="0" style="display:flex;align-items:center;gap:9px;flex:1;cursor:pointer;${on?"":"opacity:.55"}">
            <span class="bx" style="border-color:${on?"var(--ok)":"var(--rule)"};background:${on?"var(--ok)":"transparent"};color:${on?"#04220f":"transparent"}">✓</span>
            <span>${esc(e.name)} <span class="tagx">${qCount(sc,ch,e.code)} questions</span><span class="tagx" style="color:var(--ok);border-color:var(--ok)">${exDataCount(sc,ch.no,e.code)} with data</span></span></span>
          ${on && !isTarget ? `<select data-mergemap="${esc(mapKey)}" style="width:100%;margin-top:6px">
            <option value="__new__"${MERGE.mapTo[mapKey]==="__new__"?" selected":""}>Keep as its own exercise</option>
            ${targetExs.map(te=>`<option value="${esc(te.code)}"${MERGE.mapTo[mapKey]===te.code?" selected":""}>Combine into "${esc(te.name)}"</option>`).join("")}
          </select>`:""}
        </div>`;
      }).join("") : `<div class="hint" style="margin:0">Nothing recorded here.</div>`}</div>
    </div>`;
  }).join("");

  onEsc = ()=>{};
  paintModal("merge2", `<h3>Merge chapters</h3>
    <p>Pick which chapter is kept, then choose what comes across from each. Only ticked exercises end up in the merged chapter: on a chapter being merged in, an unticked exercise stays where it is; on the chapter you are keeping, an unticked exercise is removed along with its recorded work. "Keep as its own exercise" always adds a separate exercise, even when the name matches one already there.</p>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px">${cols}</div>

    <h3 class="sec">The merged chapter</h3>
    <div class="block"><div class="blabel">Name it</div>
      <div class="opts">
        ${list.map(k=>`<div class="opt ${MERGE.nameFrom===k?"on":""}" data-mergename="${esc(k)}" role="radio" tabindex="0">
          <span class="bx">●</span>${esc(nameOf(k))}</div>`).join("")}
        <div class="opt ${MERGE.nameFrom==="__own__"?"on":""}" data-mergename="__own__" role="radio" tabindex="0">
          <span class="bx">●</span>Something else</div>
      </div>
      ${MERGE.nameFrom==="__own__"?`<input type="text" id="mrgName" value="${esc(MERGE.ownName||"")}" placeholder="New chapter name" style="margin-top:8px">`:""}
    </div>
    <div class="block"><div class="blabel">Number it</div>
      <div class="opts">
        ${list.map(k=>`<div class="opt ${MERGE.numFrom===k?"on":""}" data-mergenum="${esc(k)}" role="radio" tabindex="0">
          <span class="bx">●</span>${numOf(k)} <span class="hint" style="margin:0">(from ${esc(nameOf(k))})</span></div>`).join("")}
        <div class="opt ${MERGE.numFrom==="__own__"?"on":""}" data-mergenum="__own__" role="radio" tabindex="0">
          <span class="bx">●</span>Something else</div>
      </div>
      ${MERGE.numFrom==="__own__"?`<input type="number" id="mrgNum" min="1" max="999" value="${esc(MERGE.ownNum||"")}" placeholder="Number" style="margin-top:8px">`:""}
    </div>
    <div class="block"><div class="blabel">Put it in</div>
      <select id="mrgMod">${sub.order.map(m=>`<option value="${m}"${String(m)===String(MERGE.destMod)?" selected":""}>${esc(sub.modules[m].name)}</option>`).join("")}</select>
    </div>
    <div class="msg bad" id="mrgMsg"></div>
    <div class="acts"><button class="btn" id="mrgBack">Back</button>
    <button class="btn primary" id="mrgGo">Merge</button></div>`);

  modal.querySelectorAll("[data-mergetarget]").forEach(el=>{
    el.onclick = ()=>{ MERGE.target = el.dataset.mergetarget; MERGE.mapTo = {}; drawMergeStep2(); };
  });
  modal.querySelectorAll("[data-mergeex]").forEach(el=>{
    const mapKey = el.dataset.mergeex;
    const toggle = ()=>{
      const k = mapKey.slice(0,mapKey.lastIndexOf("|")), code = mapKey.slice(mapKey.lastIndexOf("|")+1);
      MERGE.codes[k].has(code) ? MERGE.codes[k].delete(code) : MERGE.codes[k].add(code);
      drawMergeStep2();
    };
    el.onclick = toggle;
    el.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } };
  });
  modal.querySelectorAll("[data-mergemap]").forEach(sel=>{
    sel.onchange = ()=>{ MERGE.mapTo[sel.dataset.mergemap] = sel.value; };
  });
  modal.querySelectorAll("[data-mergename]").forEach(el=>{
    el.onclick = ()=>{ MERGE.nameFrom = el.dataset.mergename; drawMergeStep2(); };
