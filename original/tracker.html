function srRing(frac, colour, big, mid, size){
  const R = size||70, C = 2*Math.PI*R, box = R*2+26;
  return `<div class="ring" style="width:${box}px;height:${box}px;margin:0 auto">
    <svg viewBox="0 0 ${box} ${box}"><circle cx="${box/2}" cy="${box/2}" r="${R}" fill="none" stroke="var(--ink-3)" stroke-width="11"/>
      <circle cx="${box/2}" cy="${box/2}" r="${R}" fill="none" stroke="${colour}" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.max(0,Math.min(1,frac)))}"/></svg>
    <div class="mid"><div><div class="clock" style="font-size:${size?26:22}px">${esc(big)}</div>
      <div class="lbl">${esc(mid)}</div></div></div></div>`;
}
function srRunHTML(){
  const sr = TIMER.sr;
  const el = Math.min(sr.minutes*60, (Date.now()-sr.startAt)/1000);
  const left = Math.max(0, sr.minutes*60 - el);
  const pace = Math.min(sr.target, Math.round(sr.target * (el/(sr.minutes*60))));
  const ratio = pace>0 ? Math.round(sr.done/pace*100) : (sr.done?100:100);
  const good = ratio>=100;
  const label = sr.order.length ? "questions" : "cells";
  const cells = sr.order.length
    ? sr.order.map((qk,i)=>{
        const q = qkInfo(qk);
        return `<button class="chip ${i<sr.done?"c":""}" data-srcell="${i}" ${sr.clicker?"":"disabled"} title="${esc(chTitle(q.ch))} · Q${q.i+1}">${q.i+1}</button>`;
      }).join("")
    : Array.from({length: Math.min(sr.target,300)}, (_,i)=>
        `<button class="chip ${i<sr.done?"c":""}" data-srcell="${i}" ${sr.clicker?"":"disabled"}>${i+1}</button>`).join("");
  return `<div class="timerwrap" style="align-items:flex-start">
    <div style="text-align:center">
      <div class="eyebrow">Speedrun</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:8px 0">
        ${srRing(left/(sr.minutes*60), "var(--flag)", fmtClock(left), "time left", 78)}
        ${srRing(sr.target?pace/sr.target:0, "var(--hw)", String(pace), "should be at")}
        ${srRing(sr.target?sr.done/sr.target:0, good?"var(--ok)":"var(--no)", String(sr.done), "you have done")}
      </div>
      <div class="clock" style="font-size:26px;color:${good?"var(--ok)":"var(--no)"}">${ratio}%</div>
      <div class="hint">${good?"ahead of the pace":"behind the pace"} · ${sr.done} of ${pace} expected by now</div>
      <div class="hwrow" style="justify-content:center;margin-top:14px">
        <button class="btn danger" id="srStop">Stop &amp; log</button></div>
    </div>
    <div class="panel" style="flex:1;min-width:240px;max-width:420px">
      <div class="blabel">Your ${label} · ${sr.done}/${sr.order.length||sr.target}</div>
      <div class="chips" style="margin-top:10px">${cells}</div>
      <div class="hint">${sr.clicker ? "Tap one the moment you finish it — it turns white and, if it is a real question, gets ticked for you."
                                     : "You will pick which of these you finished when you stop."}</div>
    </div></div>`;
}
function srTick(){
  const sr = TIMER.sr;
  if(sr.phase !== "run") return;
  const el = Math.min(sr.minutes*60, (Date.now()-sr.startAt)/1000);
  if(el >= sr.minutes*60 || sr.done >= sr.target){ srStop(); return; }
  if(VIEW.name==="study") viewStudy();
}
function wireSrRun(){
  const sr = TIMER.sr;
  document.querySelectorAll("[data-srcell]").forEach(b=>b.onclick = ()=>{
    if(!sr.clicker) return;
    const i = Number(b.dataset.srcell);
    if(i !== sr.done) return;                 /* fill in order, left to right */
    const qk = sr.order[i];
    if(qk){
      const q = qkInfo(qk);
      const arr = arrFor(q.s,q.c,q.e,qCount(q.s,q.ch,q.e));
      if(!isDone(arr[q.i]||0)){ arr[q.i] = setDone(arr[q.i]||0,1); bumpStat(q.s,1); markDirty(); }
    }
    sr.done++;
    if(sr.done >= sr.target || sr.done >= (sr.order.length||sr.target)) srStop();
    else viewStudy();
  });
  document.getElementById("srStop").onclick = srStop;
}
/* stopping without the clicker needs to ask what actually got finished */
function srStop(){
  const sr = TIMER.sr;
  clearInterval(sr.tick); sr.tick = null;
  if(sr.clicker || sr.done > 0){ srLog(sr.done); return; }
  if(sr.order.length){
    let picked = new Set();
    const draw = ()=>{
      openModal(`<h3>What did you finish?</h3><p>Pick every question you completed during the run.</p>
        <div class="chips" style="margin-bottom:14px">${sr.order.map((qk,i)=>{
          const q = qkInfo(qk);
          return `<button class="chip ${picked.has(i)?"c":""}" data-pick="${i}">${q.i+1}</button>`;
        }).join("")}</div>
        <div class="acts"><button class="btn" id="srCancel">Keep going</button>
        <button class="btn primary" id="srConfirm">Log ${picked.size} done</button></div>`);
      modal.querySelectorAll("[data-pick]").forEach(b=>b.onclick = ()=>{
        const i = Number(b.dataset.pick);
        picked.has(i) ? picked.delete(i) : picked.add(i);
        draw();
      });
      modal.querySelector("#srCancel").onclick = ()=>{ closeModal();
        clearInterval(sr.tick); sr.tick = setInterval(srTick, 500); viewStudy(); };
      modal.querySelector("#srConfirm").onclick = ()=>{
        picked.forEach(i=>{
          const q = qkInfo(sr.order[i]);
          const arr = arrFor(q.s,q.c,q.e,qCount(q.s,q.ch,q.e));
          if(!isDone(arr[q.i]||0)){ arr[q.i] = setDone(arr[q.i]||0,1); bumpStat(q.s,1); }
        });
        markDirty(); closeModal(); srLog(picked.size);
      };
    };
    onEsc = ()=>{ clearInterval(sr.tick); sr.tick = setInterval(srTick, 500); viewStudy(); };
    draw();
  } else {
    openModal(`<h3>How many did you finish?</h3>
      <div class="block"><input class="numin" type="number" id="srHow" min="0" max="${sr.target}" value="0"></div>
      <div class="acts"><button class="btn" id="srCancel">Keep going</button>
      <button class="btn primary" id="srConfirm">Log it</button></div>`);
    document.getElementById("srCancel").onclick = ()=>{ closeModal();
      clearInterval(sr.tick); sr.tick = setInterval(srTick, 500); viewStudy(); };
    document.getElementById("srConfirm").onclick = ()=>{
      const n = Math.max(0, Math.min(sr.target, parseInt(document.getElementById("srHow").value,10)||0));
      closeModal(); srLog(n);
    };
    onEsc = ()=>{ clearInterval(sr.tick); sr.tick = setInterval(srTick, 500); viewStudy(); };
  }
}
function srLog(done){
  const sr = TIMER.sr;
  clearInterval(sr.tick); sr.tick = null;
  const mins = Math.max(1, Math.round((Date.now()-sr.startAt)/60000));
  const startMin = Math.floor(sr.startAt/60000);
  /* the trailing 1 marks a speedrun; the two numbers after are target and done,
     which is also how the average-time-per-question statistic is derived */
  S.log.push([startMin, mins, TIMER.act || "rev", TIMER.dl || null, 1, sr.target, done]);
  markDirty(); sweepFinishedHomework();
  TIMER.sr = newSR();
  statView.mode = "day"; statView.anchor = new Date();
  if(location.hash.indexOf("#/stats") === 0){ viewStats(); paintTabs(); }
  else location.hash = "#/stats";
  toast("Speedrun logged — "+done+" of "+sr.target+" in "+mins+" min");
}
/* time per question, averaged over every speedrun in a date range */
function avgQuestionTime(from, to, subs, dlId){
  let secs = 0, qs = 0;
  S.log.forEach(l=>{
    if(!isSpeedrun(l) || !l[6]) return;
    if(subs && !subs.has(l[2]) && !(dlId && l[3]===dlId)) return;
    if(!inRange(dayKey(new Date(l[0]*60000)), from, to)) return;
    secs += l[1]*60; qs += l[6];
  });
  return qs ? Math.round(secs/qs) : null;
}

/* ============================================================
   18. ANALYSIS
   Folders of tests. Marks live here and in the Marks tab, kept in
   step by name so editing either updates the other.
   ============================================================ */
const AN_SUBS = ["P","C","M"];
function newSubMark(tot){ return {tot: tot===undefined?100:tot, sc:0, wr:0, time:0}; }
/* a declaration, not a const: the initial state is built before this file's
   consts have been evaluated */
function DEFAULT_CFG(){ return {marks:{P:100,C:100,M:100}, qs:{P:25,C:25,M:25}}; }
function folderCfg(f){
  if(!f.cfg) f.cfg = DEFAULT_CFG();
  if(!f.cfg.marks) f.cfg.marks = DEFAULT_CFG().marks;
  if(!f.cfg.qs) f.cfg.qs = DEFAULT_CFG().qs;
  return f.cfg;
}
function newTest(name, cfg){
  const c = cfg || DEFAULT_CFG();
  return {id:"x"+Math.random().toString(36).slice(2,8), name,
          subs:{P:newSubMark(c.marks.P), C:newSubMark(c.marks.C), M:newSubMark(c.marks.M)},
          ranks:{all:"", batch:"", P:"", C:"", M:""}, agg:"", qs:[], notes:""};
}
/* the series decides how big every paper in it is */
function applySeries(f){
  const c = folderCfg(f);
  f.tests.forEach(t=>AN_SUBS.forEach(s=>{ t.subs[s].tot = +c.marks[s]||0; }));
}
/* partial credit used to be tracked separately; fold any old values into scored */
function migrateAnalysis(){
  (S.an && S.an.folders || []).forEach(f=>{
    folderCfg(f);
    f.tests.forEach(t=>{
      if(t.agg === undefined) t.agg = "";
      AN_SUBS.forEach(s=>{
        const m = t.subs[s];
        if(m && m.pt){ m.sc = (+m.sc||0) + (+m.pt||0); }
        if(m) delete m.pt;
      });
    });
  });
}
function newAnalysis(){
  /* map passes the index as a second argument, which newTest now reads as a
     config, so name each one explicitly */
  const mk = names => names.map(n=>newTest(n, DEFAULT_CFG()));
  return {folders:[
    {id:"btest", name:"BTest",  mark:"btest", cfg:DEFAULT_CFG(), tests:mk(["MOT","BTest 1","BTest 2","BTest 3","BTest 4"])},
    {id:"alt",   name:"ALT",    mark:"alt",   cfg:DEFAULT_CFG(), tests:mk(["ALT 1"])},
    {id:"cet",   name:"MHTCET", mark:"cet",   cfg:DEFAULT_CFG(), tests:mk(["MHTCET 1","MHTCET 2","MHTCET 3"])}
  ]};
}
const anFolder = id => (S.an.folders||[]).find(f=>f.id===id);
const anTest = (f,id) => f ? f.tests.find(t=>t.id===id) : null;
const anLeft = m => Math.max(0, (+m.tot||0) - (+m.sc||0) - (+m.wr||0));
const anTotal = t => AN_SUBS.reduce((a,s)=>a+(+t.subs[s].tot||0), 0);
const anScored = t => AN_SUBS.reduce((a,s)=>a+(+t.subs[s].sc||0), 0);
const anTime = t => AN_SUBS.reduce((a,s)=>a+(+t.subs[s].time||0), 0);

/* ---- keeping Analysis and Marks in step ---------------------- */
const MARK_COL = {P:"p", C:"c", M:"m"};
function markRowFor(folder, test, make){
  const tbl = S.marks.tables.find(t=>t.id===folder.mark) || S.marks.tables.find(t=>t.n===folder.name);
  if(!tbl) return null;
  let row = tbl.rows.find(r=>(r.v.name||"").trim() === test.name.trim());
  if(!row && make){ row = {v:{name:test.name}}; tbl.rows.push(row); }
  return row ? {tbl, row} : null;
}
/* Analysis is the more detailed of the two, so it writes into Marks */
function pushToMarks(folder, test){
  const hit = markRowFor(folder, test, true); if(!hit) return;
  const v = hit.row.v;
  v.name = test.name;
  v.tot = String(anTotal(test));
  v.sc  = String(anScored(test));
  AN_SUBS.forEach(s=>{ v[MARK_COL[s]] = String(+test.subs[s].sc||0); });
  v.agg = String(test.agg || "");
  /* write these even when blank, otherwise clearing one here leaves the old
     value in Marks and the next read syncs it straight back */
  v.rb = String(test.ranks.batch || "");
  v.rt = String(test.ranks.all || "");
}
/* and reads back whatever was typed on the Marks side */
function pullFromMarks(folder, test){
  const hit = markRowFor(folder, test, false); if(!hit) return false;
  const v = hit.row.v;
  let changed = false;
  AN_SUBS.forEach(s=>{
    const n = parseFloat(v[MARK_COL[s]]);
    if(isFinite(n) && (+test.subs[s].sc||0) !== n){ test.subs[s].sc = n; changed = true; }
  });
  const rb = v.rb, rt = v.rt;
  if(rb && String(test.ranks.batch)!==String(rb)){ test.ranks.batch = rb; changed = true; }
  if(rt && String(test.ranks.all)!==String(rt)){ test.ranks.all = rt; changed = true; }
  if(v.agg && String(test.agg)!==String(v.agg)){ test.agg = v.agg; changed = true; }
  return changed;
}
function syncAllFromMarks(){
  let changed = false;
  (S.an.folders||[]).forEach(f=>f.tests.forEach(t=>{ if(pullFromMarks(f,t)) changed = true; }));
  return changed;
}

      <span class="blabel" style="margin:0">questions</span></div>`).join("")}
    <div class="msg warn" id="cfgMsg"></div>

    <button class="btn primary" id="cfgYes">Save for the whole series</button></div>`);
  modal.querySelector("#cfgNo").onclick = ()=>{ closeModal(); viewAnFolder(f); };
  modal.querySelector("#cfgYes").onclick = ()=>{
    const num = id=>Math.max(0, parseInt(modal.querySelector("#"+id).value,10)||0);
    /* a smaller paper than someone has already scored on would be nonsense */
    const over = [];
    AN_SUBS.forEach(s=>{
      const tot = num("cm_"+s);
      f.tests.forEach(t=>{ if((+t.subs[s].sc||0)+(+t.subs[s].wr||0) > tot) over.push(t.name); });
    });
    if(over.length){ modal.querySelector("#cfgMsg").textContent =
      "That is fewer marks than already recorded in " + [...new Set(over)].join(", ") + "."; return; }
    snapshot("series settings");
    AN_SUBS.forEach(s=>{ c.marks[s] = num("cm_"+s); c.qs[s] = num("cq_"+s); });
    applySeries(f);
    f.tests.forEach(t=>pushToMarks(f,t));
    markDirty(); closeModal(); viewAnFolder(f); toastUndo("Settings applied to " + f.tests.length + " tests");
  };
}
function anDonut(sub, m, qs){
  const size = 168, tot = Math.max(1, +m.tot||0);
  const parts = [
    {v:+m.sc||0, c:"var(--ok)",   n:"Scored"},
    {v:+m.wr||0, c:"var(--no)",   n:"Wrong"},
    {v:anLeft(m), c:"var(--ink-3)", n:"Left"}
  ];
  const shown = parts.filter(p=>p.v > 0);
  const r = size/2 - 2;
  let arcs = "";
  if(shown.length === 1){
    /* full marks, or nothing but blanks — one solid ring rather than an empty one */
    arcs = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="${shown[0].c}"/>`;
  } else {
    let a0 = -Math.PI/2;
    shown.forEach(p=>{
      const a1 = a0 + (p.v/tot)*Math.PI*2;
      arcs += `<path d="${arcPath(size/2,size/2,r,a0,a1)}" fill="${p.c}" stroke="var(--ink-2)" stroke-width="2"/>`;
      a0 = a1;
    });
  }
  const got = +m.sc||0;
  return `<button class="card" style="cursor:pointer;text-align:center" data-anedit="${sub}">
    <div class="card-top" style="justify-content:center"><span class="card-title">${esc(subjOf(sub)?subjOf(sub).name:sub)}</span></div>
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="margin:10px auto;display:block">
      ${arcs || `<circle cx="${size/2}" cy="${size/2}" r="${size/2-2}" fill="var(--ink-3)"/>`}
      <circle cx="${size/2}" cy="${size/2}" r="${size*0.3}" fill="var(--ink-2)"/>
      <text x="${size/2}" y="${size/2+3}" text-anchor="middle" fill="var(--text)" font-size="20" font-family="ui-monospace,monospace">${got}</text>
      <text x="${size/2}" y="${size/2+20}" text-anchor="middle" fill="var(--text-3)" font-size="11" font-family="ui-monospace,monospace">of ${+m.tot||0}</text></svg>
    <div class="lg" style="text-align:left">${parts.map(p=>`<div><i style="background:${p.c}"></i>${p.n}<b>${p.v}</b></div>`).join("")}</div>
    <div class="hint" style="text-align:center">Click to edit${qs?` · ${qs} questions`:""}${m.time?` · ${m.time} min`:""}</div></button>`;
}

function editRanks(f, t){
  onEsc = ()=>viewAnTest(f,t);
  const fields = [["all","Rank overall"],["batch","Rank in batch"],
                  ["P","Rank in Physics"],["C","Rank in Chemistry"],["M","Rank in Maths"]];
  openModal(`<h3>Ranks — ${esc(t.name)}</h3>
    ${fields.map(([k,l])=>`<div class="setrow"><span class="lbl">${l}</span>
      <input class="numin" type="text" id="rk_${k}" value="${esc(String(t.ranks[k]||""))}"></div>`).join("")}
    <div class="setrow"><span class="lbl">Aggregate<br><span class="hint" style="margin:0">Leave blank and no average is shown. Average is your marks divided by this.</span></span>
      <input class="numin" type="text" id="rk_agg" value="${esc(String(t.agg||""))}"></div>
    <div class="acts"><button class="btn" id="rNo2">Cancel</button>
    <button class="btn primary" id="rYes2">Save</button></div>`);
  modal.querySelector("#rNo2").onclick = ()=>{ closeModal(); viewAnTest(f,t); };
  modal.querySelector("#rYes2").onclick = ()=>{
    snapshot("edit ranks");
    fields.forEach(([k])=>{ t.ranks[k] = modal.querySelector("#rk_"+k).value.trim(); });
    t.agg = modal.querySelector("#rk_agg").value.trim();
    pushToMarks(f, t);
    markDirty(); closeModal(); viewAnTest(f,t); toastUndo("Ranks saved");
  };
}
function editAnQ(f, t, idx, kind){
  const q = idx===null ? {s:"P", q:"", kind, t:[], note:""} : t.qs[idx];
  const picked = new Set(q.t||[]);
  onEsc = ()=>viewAnTest(f,t);
  const draw = ()=>{
    openModal(`<h3>${q.kind==="wrong"?"A question you got wrong":"One you could have done better"}</h3>
      <div class="hwrow" style="margin-bottom:16px">
        <span class="blabel" style="margin:0">Subject</span>
        <select id="aqS">${AN_SUBS.map(s=>`<option value="${s}"${q.s===s?" selected":""}>${esc(subjOf(s)?subjOf(s).name:s)}</option>`).join("")}</select>
        <span class="blabel" style="margin:0">Question</span>
        <input class="numin" type="text" id="aqQ" value="${esc(String(q.q||""))}" placeholder="e.g. 14">
      </div>
      <div class="block"><div class="blabel">${q.kind==="wrong"?"What went wrong":"How you could have done it better"}</div>
        <textarea id="aqN" rows="3" style="font-family:inherit;font-size:14px">${esc(q.note||"")}</textarea>
        <div class="mprev" id="aqPrev" hidden></div>
        <div class="mhint">${MATH_HINT}</div></div>
      <div class="block"><div class="blabel">Tags</div>
        <div class="opts">${tagList().map(x=>`
          <div class="opt ${picked.has(x.id)?"on":""}" data-aqt="${esc(x.id)}" role="checkbox" aria-checked="${picked.has(x.id)}" tabindex="0">
            <span class="bx">✓</span>${esc(x.n)}</div>`).join("")}</div>
        <div class="hwrow" style="margin-top:10px">
          <input class="tin" id="aqNew" placeholder="Add your own reason" style="flex:1">
          <button class="btn" id="aqAdd">Add</button></div></div>
      <div class="acts"><button class="btn" id="aqNo">Cancel</button>
      <button class="btn primary" id="aqYes">${idx===null?"Add":"Save"}</button></div>`);
    wireMathPreview("aqN", "aqPrev");
    modal.querySelectorAll("[data-aqt]").forEach(el=>{
      const toggle = ()=>{ const id2 = el.dataset.aqt;
        picked.has(id2) ? picked.delete(id2) : picked.add(id2); el.classList.toggle("on"); };
      el.onclick = toggle;
      el.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } };
    });
    const add = ()=>{
      const v = modal.querySelector("#aqNew").value.trim(); if(!v) return;
      const id2 = "u"+Date.now().toString(36);
      S.x.tags.push({id:id2, n:v}); picked.add(id2);
      q.s = modal.querySelector("#aqS").value;
      q.q = modal.querySelector("#aqQ").value;
      q.note = modal.querySelector("#aqN").value;
      markDirty(); draw();
    };
    modal.querySelector("#aqAdd").onclick = add;
    modal.querySelector("#aqNew").onkeydown = e=>{ if(e.key==="Enter") add(); };
    modal.querySelector("#aqNo").onclick = ()=>{ closeModal(); viewAnTest(f,t); };
    modal.querySelector("#aqYes").onclick = ()=>{
      snapshot(idx===null?"add a question":"edit a question");
      q.s = modal.querySelector("#aqS").value;
      q.q = modal.querySelector("#aqQ").value.trim();
      q.note = modal.querySelector("#aqN").value;
      q.t = [...picked];
      if(idx===null) t.qs.push(q);
      markDirty(); closeModal(); viewAnTest(f,t); toastUndo("Saved");
    };
  };
  draw();
}

/* renaming folders and tests, same ✎ affordance as elsewhere */
const penBtn2 = (k,label) => `<button class="pen" data-anren="${esc(k)}" title="Rename ${esc(label)}">✎</button>`;
function wireAnPens(){
  app.querySelectorAll("[data-anren]").forEach(b=>b.onclick = async e=>{
    e.preventDefault(); e.stopPropagation();
    const p = b.dataset.anren.split(":");
    if(p[0]==="f"){
      const f = anFolder(p[1]); if(!f) return;
      const n = await prompt2("Rename test type","","Name",f.name,{ok:"Rename"});
      if(!n) return;
      snapshot("rename test type"); f.name = n; markDirty(); render();
    } else {
      const f = anFolder(p[1]), t = anTest(f, p[2]); if(!t) return;
      const n = await prompt2("Rename test","The Marks tab follows this name.","Name",t.name,{ok:"Rename"});
      if(!n) return;
      snapshot("rename test");
      const hit = markRowFor(f, t, false);
      t.name = n;
      if(hit) hit.row.v.name = n;
      markDirty(); render();
    }
  });
}
async function addAnFolder(){
  const n = await prompt2("New test type","A folder for a series of tests, like BTest.","Name","",{ok:"Create"});
  if(!n) return;
  snapshot("add test type");
  const id = "f"+Date.now().toString(36);
  S.an.folders.push({id, name:n, mark:id, cfg:DEFAULT_CFG(), tests:[]});
  /* give it somewhere to live in the Marks tab too */
  if(!S.marks.tables.some(t=>t.id===id)){
    const base = newMarks().tables[0];
    S.marks.tables.push({id, n, cols:JSON.parse(JSON.stringify(base.cols)), rows:[]});
  }
  markDirty(); location.hash = "#/an/"+id; render(); toastUndo("Test type added");
}
async function addAnTest(f){
  const n = await prompt2("New test","","Name", f.name+" "+(f.tests.length+1), {ok:"Create"});
  if(!n) return;
  snapshot("add test");
  const t = newTest(n, folderCfg(f));
  f.tests.push(t);
  pushToMarks(f, t);
  markDirty(); render(); toastUndo("Test added");
}
async function deleteAnFolder(f){
  if(!await ask("Delete "+f.name+"?","Its tests and their analysis go too. The Marks table stays.","Delete",true)) return;
  snapshot("delete test type");
  S.an.folders = S.an.folders.filter(x=>x!==f);
  markDirty(); location.hash = "#/an"; render(); toastUndo("Test type deleted");
}
async function deleteAnTest(f, t){
  if(!await ask("Delete "+t.name+"?","Its marks, notes and question list go too.","Delete",true)) return;
  snapshot("delete test");
  f.tests = f.tests.filter(x=>x!==t);
  markDirty(); location.hash = "#/an/"+f.id; render(); toastUndo("Test deleted");
}

function svgFlow(steps){
  const W = 150, H = 64, gap = 26, total = steps.length*W + (steps.length-1)*gap;
  let x = 0, out = "";
  steps.forEach((s,i)=>{
    out += `<rect x="${x}" y="0" width="${W}" height="${H}" rx="10" fill="var(--ink-3)" stroke="var(--rule)"/>
      <text x="${x+W/2}" y="${H/2-4}" text-anchor="middle" fill="var(--text)" font-size="12.5" font-family="ui-sans-serif">${esc(s[0])}</text>
      ${s[1]?`<text x="${x+W/2}" y="${H/2+14}" text-anchor="middle" fill="var(--text-3)" font-size="10.5" font-family="ui-monospace,monospace">${esc(s[1])}</text>`:""}`;
    if(i < steps.length-1){
      out += `<line x1="${x+W+4}" y1="${H/2}" x2="${x+W+gap-4}" y2="${H/2}" stroke="var(--accent)" stroke-width="2"/>
        <polygon points="${x+W+gap-4},${H/2-5} ${x+W+gap+3},${H/2} ${x+W+gap-4},${H/2+5}" fill="var(--accent)"/>`;
    }
    x += W + gap;
  });
  return `<div class="diagram"><svg viewBox="0 0 ${total} ${H}" style="width:100%;max-width:${total}px;height:auto;display:block">${out}</svg></div>`;
}
function svgTree(){
  const rows = [
    [0, "Subject", "Physics, Chemistry, Maths"],
    [1, "Module", "1 – 6, or your own"],
    [2, "Chapter", "numbered within its module"],
    [3, "Exercise", "Intext, Ex1–4, PYQs, or your own"],
    [4, "Question", "the row you actually tick"]
  ];
  const rowH = 34, indent = 26;
  const H = rows.length*rowH + 10;
  let out = "";
  rows.forEach(([depth,name,note],i)=>{
    const y = i*rowH + 18, x = depth*indent;
    if(i>0) out += `<line x1="${x-indent+7}" y1="${y-rowH+8}" x2="${x-indent+7}" y2="${y}" stroke="var(--rule)"/>`;
    out += `<circle cx="${x+7}" cy="${y}" r="4" fill="var(--accent)"/>
      <text x="${x+18}" y="${y+4}" fill="var(--text)" font-size="12.5" font-family="ui-sans-serif">${esc(name)}</text>
      <text x="${x+18+name.length*7.2+14}" y="${y+4}" fill="var(--text-3)" font-size="10.5" font-family="ui-monospace,monospace">${esc(note)}</text>`;
  });
  return `<div class="diagram"><svg viewBox="0 0 480 ${H}" style="width:100%;max-width:480px;height:auto;display:block">${out}</svg></div>`;
}
function manFaq(items){
  return items.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${a}</p></details>`).join("");
}

/* ============================================================
   21. REVISION
   A checklist of chapters whose "freshness" fades from green to
   red the longer it has been since you last pressed +.
   ============================================================ */
function newRevision(){ return {items:{}, decayDays:14}; }
function revKey(sc, no){ return sc+":"+no; }
function revFreshness(it, decayDays){
  if(!it.last) return 1;                       /* never revised: fully red */
  const days = (Date.now() - it.last) / 86400000;
  return Math.max(0, Math.min(1, days / (decayDays||14)));
}
function revColor(frac){
  /* green (62,207,142) fading to red (255,95,109) */
  const g = [62,207,142], r = [255,95,109];
  const mix = k => Math.round(g[k] + (r[k]-g[k])*frac);
  return `rgb(${mix(0)},${mix(1)},${mix(2)})`;
}
function revItemsFor(dlId){
  const d = dlId ? S.dl.find(x=>x.id===dlId) : null;
  const subs = d && d.subs && d.subs.length ? new Set(d.subs) : null;
  return Object.keys(S.rev.items).filter(k=>!subs || subs.has(k.split(":")[0]));
}
let revPick = {dl:"", open:false, chosen:new Set(), weight:1};

function viewRevision(){
  crumbs([{label:"Home",href:"#/"},{label:"Revision"}]);
  const decayDays = S.rev.decayDays || 14;
  const keys = revItemsFor(null);
  const dueToday = keys.filter(k=>{
    const it = S.rev.items[k];
    return it.remindDate && it.remindDate <= todayKey() && !it.remindDone;
  });

  /* group by subject > module for the checklist */
  const bySub = {};
  keys.forEach(k=>{
    const [sc,no] = k.split(":");
    const ch = chapOf(sc, no); if(!ch) return;
    ((bySub[sc]=bySub[sc]||{})[ch.mod]=bySub[sc][ch.mod]||[]).push({k, ch});
  });
  const totalW = keys.reduce((a,k)=>a+(+S.rev.items[k].weight||1),0);
  const avgFresh = totalW ? keys.reduce((a,k)=>a+revFreshness(S.rev.items[k],decayDays)*(+S.rev.items[k].weight||1),0)/totalW : 0;

  let tree = "";
  Object.keys(bySub).forEach(sc=>{
    const sub = subjOf(sc); if(!sub) return;

    tree += `<div class="node">

    if(S.closed[sk]) return;
    tree += `<div class="branch">`;
    Object.keys(bySub[sc]).forEach(m=>{
      const mo = sub.modules[m]; if(!mo) return;
      const mk = "rm:"+sc+":"+m;
      tree += `<div class="node"><button class="twisty" data-scl="${mk}">${S.closed[mk]?"▸":"▾"}</button>
        <span class="lv">Module</span><span class="nm">${esc(mo.name)}</span></div>`;
      if(!S.closed[mk]){
        tree += `<div class="branch">`;
        bySub[sc][m].sort((a,b)=>chLabel(a.ch)-chLabel(b.ch)).forEach(({k,ch})=>{
          const it = S.rev.items[k], frac = revFreshness(it, decayDays), col = revColor(frac);
          const rem = it.remindDate ? (it.remindDate<=todayKey() && !it.remindDone ? "due" : "set") : "";
          tree += `<div class="hwitem" style="border-left:3px solid ${col}">
            <div class="hwhead">
              <span class="loc">${esc(chTitle(ch))}</span>
              <span class="rng">weight ${it.weight||1}</span>
              ${it.last?`<span class="rng">revised ${new Date(it.last).toLocaleDateString()}</span>`:`<span class="rng">never revised</span>`}
              ${rem?`<span class="due ${rem==="due"?"over":""}">${rem==="due"?"reminder due":"reminder set"}</span>`:""}
              <span style="flex:1"></span>
              <button class="tbtn" data-revrem="${esc(k)}" title="Set a reminder">🔔</button>
              <button class="tbtn primary" data-revbump="${esc(k)}" title="I revised this">+</button>
              <button class="x" data-revdel="${esc(k)}" title="Remove from the list">×</button></div>
            <div class="rail"><i style="width:${Math.round((1-frac)*100)}%;background:${col}"></i></div>
            ${it.note?`<div class="dltext" style="margin-top:8px">${mathText(it.note)}</div>`:""}</div>`;
        });
        tree += `</div>`;
      }
    });
    tree += `</div>`;
  });

  app.innerHTML = recBanner() + `<div class="pagehead"><div class="eyebrow">Revision</div><h1>Keep everything fresh</h1>
      <p class="sub">Press + on a chapter each time you go back over it. The longer you leave one, the redder it gets.</p>
      <div class="stats"><span><span class="k">chapters tracked</span> <b>${keys.length}</b></span>
      <span><span class="k">overall freshness</span> <b>${Math.round((1-avgFresh)*100)}%</b></span></div></div>

    ${dueToday.length ? `<div class="banner" style="border-color:rgba(255,176,58,.45);background:rgba(255,176,58,.1)">
      <b>${dueToday.length} reminder${dueToday.length>1?"s":""} due today.</b>
      ${dueToday.map(k=>{ const it=S.rev.items[k], ch=chapOf(k.split(":")[0],k.split(":")[1]);
        return `<span class="due over" style="margin-left:8px">${esc(ch?chTitle(ch):k)}</span>`; }).join("")}
      </div>` : ""}

    <div class="panel" style="margin-bottom:20px">
      <div class="hwrow">
        <span class="blabel" style="margin:0">Fade to red over</span>
        <input class="numin" type="number" id="revDecay" min="1" max="180" value="${decayDays}">
        <span class="blabel" style="margin:0">days</span>
        <span class="spacer"></span>
        <button class="btn" id="revAdd">+ Add chapters</button>
      </div>
    </div>

    <div class="hint" style="margin-bottom:14px">Weighted by how much you said each chapter matters — a heavier chapter pulls the overall freshness figure more.</div>
    ${keys.length ? tree : `<div class="empty">Nothing tracked yet. Press <strong>+ Add chapters</strong> to start.</div>`}`;

  document.getElementById("revDecay").onchange = e=>{
    const v = Math.max(1, Math.min(180, parseInt(e.target.value,10)||14));
    S.rev.decayDays = v; markDirty(); viewRevision();
  };
  document.getElementById("revAdd").onclick = openRevAdd;
  app.querySelectorAll("[data-scl]").forEach(b=>b.onclick = ()=>{ S.closed[b.dataset.scl]=!S.closed[b.dataset.scl]; viewRevision(); });
  app.querySelectorAll("[data-revbump]").forEach(b=>b.onclick = ()=>{
    const k = b.dataset.revbump; S.rev.items[k].last = Date.now();
    markDirty(); viewRevision(); toast("Marked fresh");
  });
  app.querySelectorAll("[data-revdel]").forEach(b=>b.onclick = ()=>{
    snapshot("remove from revision"); delete S.rev.items[b.dataset.revdel];
    markDirty(); viewRevision(); toastUndo("Removed");
  });
  app.querySelectorAll("[data-revrem]").forEach(b=>b.onclick = ()=>editRevReminder(b.dataset.revrem));
}
function openRevAdd(){

      revPick.chosen.forEach(k=>{

        else S.rev.items[k].weight = revPick.weight;
      });
      markDirty(); closeModal(); viewRevision(); toastUndo("Added to your revision list");
    };
  };
  draw();
}
function editRevReminder(k){

/* an acknowledged reminder that repeats rolls its date forward rather than
   vanishing, so "once a month" keeps coming back */
function rollRevisionReminders(){
  let changed = false;
  Object.values(S.rev.items).forEach(it=>{
    if(it.remindDate && it.remindDate < todayKey() && it.remindEvery){
      const d = new Date(it.remindDate+"T00:00:00");
      if(it.remindEvery==="week") d.setDate(d.getDate()+7); else d.setMonth(d.getMonth()+1);
      it.remindDate = dayKey(d); delete it.remindDone;
      changed = true;
    }
  });
  if(changed) markDirty();
}

/* ============================================================
   27. REVISION ROULETTE
   Picks a random chapter to revise, weighted so the staler (redder)
   ones come up more often than ones just revised — genuinely random,
   but biased towards what actually needs attention.
   ============================================================ */
function openRevRoulette(){
  const keys = Object.keys(S.rev.items);
  if(!keys.length){ toast("Add some chapters to Revision first"); return; }
  spinRoulette();
}
function pickRouletteChapter(){
  const decayDays = S.rev.decayDays || 14;
  const keys = Object.keys(S.rev.items);
  /* a small base weight so even a freshly-revised chapter can still come
     up occasionally, just far less often than an overdue one */
  const weights = keys.map(k=>0.08 + revFreshness(S.rev.items[k], decayDays));
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<keys.length;i++){ r -= weights[i]; if(r<=0) return keys[i]; }
  return keys[keys.length-1];
}
function spinRoulette(){
  const k = pickRouletteChapter();
  const [sc, no] = k.split(":");
  const ch = chapOf(sc, no);
  if(!ch){
    /* the chapter behind this entry was deleted at some point; drop it and try again */
    delete S.rev.items[k]; markDirty();
    if(Object.keys(S.rev.items).length) return spinRoulette();
    closeModal(); toast("Nothing left to pick from"); return;
  }
  const it = S.rev.items[k];
  const decayDays = S.rev.decayDays || 14;
  const frac = revFreshness(it, decayDays), col = revColor(frac);
  onEsc = ()=>{};
  openModal(`<h3>Revision roulette</h3>
    <div class="panel" style="text-align:center;border-color:${col}">
      <div class="eyebrow">${esc(subjOf(sc)?subjOf(sc).name:sc)}</div>
      <h2 style="margin:6px 0">${esc(chTitle(ch))}</h2>
      <div class="rail" style="margin:14px 0"><i style="width:${Math.round((1-frac)*100)}%;background:${col}"></i></div>
      <p class="sub" style="margin:0">${it.last ? "Last revised "+new Date(it.last).toLocaleDateString() : "Never revised"}</p>
    </div>
    <div class="acts" style="margin-top:16px">
      <button class="btn" id="rouAgain">Spin again</button>
      <button class="btn" id="rouDone">I revised this</button>
      <button class="btn primary" id="rouGo">Go to it</button>
    </div>`);
  modal.querySelector("#rouAgain").onclick = spinRoulette;
  modal.querySelector("#rouDone").onclick = ()=>{
    it.last = Date.now(); markDirty(); closeModal(); viewRevision(); toast("Marked fresh");
  };
  modal.querySelector("#rouGo").onclick = ()=>{
    closeModal(); location.hash = `#/${sc}/${ch.mod}/${no}`;
  };
}

/* ============================================================
   22. MERGE CHAPTERS
   For folding a chapter you recorded before this syllabus update
   into the newly-added official one (or any two chapters together).
   Progress is appended, never overwritten, so nothing is lost.
   ============================================================ */
let MERGE = {picked:new Set(), step:1, target:"", codes:{}, mapTo:{}};
function openMergePicker(){
  MERGE = {picked:new Set(), step:1, target:"", codes:{}, mapTo:{}};
  drawMergeStep1();
}
function mergeCountFor(k){
  const parts = k.split(":");
  let n = 0;
  MERGE.picked.forEach(pk=>{
    const [sc,no] = pk.split(":");
    if(sc !== parts[1]) return;
    if(parts[0]==="s"){ n++; return; }
    const ch = chapOf(sc,no);
    if(ch && String(ch.mod)===parts[2]) n++;
  });
  return n;
}
function paintMergeCounts(){
  modal.querySelectorAll("[data-mrgcount]").forEach(el=>{
    const n = mergeCountFor(el.dataset.mrgcount);
    el.textContent = n ? n+" picked" : "";
    el.hidden = !n;
  });
}
function drawMergeStep1(){
  if(!MERGE.open) MERGE.open = {};
  let body = "";
  TREE.order.forEach(sc=>{
    const sub = subjOf(sc);
    const chapters = allChapters(sc);
    if(!chapters.length) return;
    const skey = "s:"+sc;
    const sOpen = MERGE.open[skey] !== false;          /* subjects start open */
    body += `<div class="node"><button class="twisty" data-mrgopen="${esc(skey)}">${sOpen?"▾":"▸"}</button>
      <span class="lv">Subject</span><span class="nm">${esc(sub.name)}</span>
      <span class="tagx" data-mrgcount="${esc(skey)}" hidden></span></div>`;
    body += `<div class="branch" data-mrgbody="${esc(skey)}"${sOpen?"":" hidden"}>`;
    sub.order.forEach(m=>{
      const mo = sub.modules[m];
      if(!mo || !mo.chapters.length) return;
      const mkey = "m:"+sc+":"+m;
      const picked = mo.chapters.some(ch=>MERGE.picked.has(sc+":"+ch.no));
      /* a module holding something you already picked opens itself */
      const mOpen = MERGE.open[mkey]===true || (MERGE.open[mkey]===undefined && picked);
      body += `<div class="node"><button class="twisty" data-mrgopen="${esc(mkey)}">${mOpen?"▾":"▸"}</button>
        <span class="lv">${mo.custom?"Book":"Module"}</span><span class="nm">${esc(mo.name)}</span>
        <span class="tagx">${mo.chapters.length}</span>
        <span class="tagx" data-mrgcount="${esc(mkey)}" hidden></span></div>`;
      body += `<div class="branch" data-mrgbody="${esc(mkey)}"${mOpen?"":" hidden"}><div class="opts">`;
      mo.chapters.forEach(ch=>{
        const k = sc+":"+ch.no;
        body += `<div class="opt ${MERGE.picked.has(k)?"on":""}" data-mergech="${esc(k)}" role="checkbox" tabindex="0">
          <span class="bx">✓</span>${esc(chTitle(ch))}${ch.custom?' <span class="tagx">yours</span>':""}</div>`;
      });
      body += `</div></div>`;
    });
    body += `</div>`;
  });
  onEsc = ()=>{};
  paintModal("merge1", `<h3>Merge chapters</h3>
    <p>Pick two or more chapters to combine — useful for folding a chapter you were already using into one that was just added. Open a module or reference book to see its chapters. You'll choose which to keep, and which exercises to bring across, next.</p>
    <div class="block" style="max-height:360px;overflow:auto"><div id="mrgList">${body}</div></div>
    <div class="acts"><button class="btn" id="mrgNo">Cancel</button>
    <button class="btn primary" id="mrgNext" ${MERGE.picked.size<2?"disabled":""}>Next — ${MERGE.picked.size} picked</button></div>`);
  paintMergeCounts();
  modal.querySelectorAll("[data-mrgopen]").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.mrgopen;
      const box = [...modal.querySelectorAll("[data-mrgbody]")].find(x=>x.dataset.mrgbody===k);
      if(!box) return;
      const open = box.hidden;
      box.hidden = !open; MERGE.open[k] = open; b.textContent = open ? "▾" : "▸";
    };
  });
  modal.querySelectorAll("[data-mergech]").forEach(el=>{
    const toggle = ()=>{
      const k = el.dataset.mergech;
      MERGE.picked.has(k) ? MERGE.picked.delete(k) : MERGE.picked.add(k);
      el.classList.toggle("on");
      const nx = modal.querySelector("#mrgNext");
      nx.disabled = MERGE.picked.size < 2;
      nx.textContent = "Next — " + MERGE.picked.size + " picked";
      paintMergeCounts();

    el.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } };
  });
  modal.querySelector("#mrgNo").onclick = closeModal;
  modal.querySelector("#mrgNext").onclick = ()=>{ if(MERGE.picked.size>=2) drawMergeStep2(); };
}
function drawMergeStep2(){
  const list = [...MERGE.picked];
  if(!MERGE.target || !MERGE.picked.has(MERGE.target)) MERGE.target = list[0];
  const label = k=>{ const [sc,no]=k.split(":"); const ch=chapOf(sc,no); return (subjOf(sc)?subjOf(sc).short:sc)+" · "+chTitle(ch); };
  const [tsc0] = MERGE.target.split(":");

  /* every exercise of every picked chapter starts out selected; unticking one
     leaves it where it is instead of bringing it across */
  list.forEach(k=>{
    const [sc,no] = k.split(":"); const ch = chapOf(sc,no);
    if(!MERGE.codes[k]) MERGE.codes[k] = new Set(exList(sc,ch).filter(e=>qCount(sc,ch,e.code)>0).map(e=>e.code));
  });
  if(!MERGE.mapTo) MERGE.mapTo = {};

  /* name and number default to whichever chapter you are keeping */
  const tgtCh = chapOf(...MERGE.target.split(":"));
  if(MERGE.nameFrom===undefined) MERGE.nameFrom = MERGE.target;
  if(MERGE.numFrom===undefined) MERGE.numFrom = MERGE.target;
  if(MERGE.destMod===undefined) MERGE.destMod = String(tgtCh.mod);

  const sub = subjOf(tsc0);
  const nameOf = k=>{ const [s,n]=k.split(":"); return chapOf(s,n).name; };
  const numOf  = k=>{ const [s,n]=k.split(":"); return chLabel(chapOf(s,n)); };

  /* one column per chapter, side by side, so the two sets of exercises can be
     compared directly and kept or dropped individually */
  const cols = list.map(k=>{
    const [sc,no] = k.split(":"); const ch = chapOf(sc,no);
    const exs = exList(sc,ch).filter(e=>qCount(sc,ch,e.code)>0);
    const isTarget = k===MERGE.target;
    return `<div style="flex:1;min-width:230px">
      <div class="opt ${isTarget?"on":""}" data-mergetarget="${esc(k)}" role="radio" tabindex="0" style="margin-bottom:10px">
        <span class="bx">●</span><span><b>${esc(nameOf(k))}</b><br>
        <span class="hint" style="margin:0">${isTarget?"kept — others merge into this":"merges into the kept one"}</span></span></div>
      <div class="opts">${exs.length ? exs.map(e=>{
        const mapKey = k+"|"+e.code;
        if(MERGE.mapTo[mapKey]===undefined) MERGE.mapTo[mapKey] = "__new__";
        const on = MERGE.codes[k].has(e.code);
        /* you can only pour into an exercise the kept chapter is keeping */
        const targetExs = isTarget ? []
          : exList(tsc0, chapOf(...MERGE.target.split(":"))).filter(te=>MERGE.codes[MERGE.target].has(te.code));
        return `<div class="opt" style="align-items:center;cursor:default;flex-wrap:wrap">
          <span data-mergeex="${esc(mapKey)}" role="checkbox" tabindex="0" style="display:flex;align-items:center;gap:9px;flex:1;cursor:pointer;${on?"":"opacity:.55"}">
            <span class="bx" style="border-color:${on?"var(--ok)":"var(--rule)"};background:${on?"var(--ok)":"transparent"};color:${on?"#04220f":"transparent"}">✓</span>
            <span>${esc(e.name)} <span class="tagx">${qCount(sc,ch,e.code)}</span></span></span>
          ${on && !isTarget ? `<select data-mergemap="${esc(mapKey)}" style="width:100%;margin-top:6px">

/* everything written about a single question lives under its key, so a move
   carries the lot: the note, the mistake record, the bookmarks and the
   collections that point at it */
function moveQuestionRecords(oldKey, newKey){
  if(oldKey === newKey) return;
  if(S.n[oldKey]!==undefined){ S.n[newKey]=S.n[oldKey]; delete S.n[oldKey]; }
  if(S.r[oldKey]!==undefined){ S.r[newKey]=S.r[oldKey]; delete S.r[oldKey]; }
  if(S.bm[oldKey]!==undefined){ S.bm[newKey]=S.bm[oldKey]; delete S.bm[oldKey]; }
  (S.col||[]).forEach(c=>{
    if(!Array.isArray(c.qs)) return;
    let hit = false;
    c.qs = c.qs.map(q=>{ if(q===oldKey){ hit = true; return newKey; } return q; });
    if(hit) c.qs = [...new Set(c.qs)];
  });
}
/* one chapter's revision record folded into another's, keeping the heavier
   weight, the more recent revision and any reminder that comes first */
function mergeRevisionRecord(sc, fromNo, toNo){
  if(!S.rev || !S.rev.items) return;
  const fk = revKey(sc, fromNo), tk = revKey(sc, toNo);
  if(fk === tk) return;
  const from = S.rev.items[fk]; if(!from) return;
  const cur = S.rev.items[tk];
  if(!cur) S.rev.items[tk] = from;
  else{
    cur.weight = Math.max(+cur.weight||1, +from.weight||1);
    cur.last = Math.max(cur.last||0, from.last||0) || null;
    if(from.note) cur.note = cur.note ? cur.note+"\n"+from.note : from.note;
    if(from.remindDate && (!cur.remindDate || from.remindDate < cur.remindDate)){
      cur.remindDate = from.remindDate; cur.remindDone = from.remindDone;
    }
  }
  delete S.rev.items[fk];
}
/* an exercise left out of a merge on the chapter being kept: the exercise and
   everything recorded in it go, since the merged chapter is not to carry it */
function purgeExercise(sc, no, code){
  const base = key(sc, no, code);
  delete S.d[base];
  [S.n, S.r, S.bm].forEach(store=>Object.keys(store).forEach(k=>{
    if(k.slice(0, k.lastIndexOf("."))===base) delete store[k];
  }));
  (S.col||[]).forEach(c=>{
    if(Array.isArray(c.qs)) c.qs = c.qs.filter(q=>q.slice(0, q.lastIndexOf("."))!==base);
  });
  const hits = it => it.s===sc && String(it.c)===String(no) && it.e===code;
  S.h = S.h.filter(it=>!hits(it));
  S.hd = S.hd.filter(it=>!hits(it));
  const ch = chapOf(sc, no), ex = ch && exOf(sc, ch, code);
  if(ex && ex.custom){
    S.x.exs[sc+"|"+no] = (S.x.exs[sc+"|"+no]||[]).filter(e=>e.code!==code);
    delete S.x.cnt[base];
  } else {
    S.x.cnt[base] = 0;
  }
}
/* the number you give a chapter is its alone: anything else sitting on it, and
   anything that would then collide in turn, is nudged up one */
function reserveChapterNumber(sc, targetNo, num){
  num = Number(num);
  if(!(num > 0)) return;
  S.x.num["c:"+sc+":"+targetNo] = num;
  buildTree();
  const tgt = chapOf(sc, targetNo); if(!tgt) return;
  /* modules 1-6 share one running set of numbers; a module or reference book of
     your own counts from 1 on its own, so only its own chapters can clash */
  const inSyllabus = Number(tgt.mod) <= 6;
  const peers = allChapters(sc).filter(c=>Number(c.no)!==Number(targetNo) &&
    (inSyllabus ? Number(c.mod)<=6 : Number(c.mod)===Number(tgt.mod)));
  const taken = new Set([num]);
  peers.sort((a,b)=>chLabel(a)-chLabel(b)).forEach(c=>{
    const was = Number(chLabel(c)) || 1;
    let lab = was;
    while(taken.has(lab)) lab++;
    if(lab !== was) S.x.num["c:"+sc+":"+c.no] = lab;
    taken.add(lab);
  });
  buildTree();
}
function performMerge(sc, targetNo, sources, finish){
  targetNo = Number(targetNo);
  sources = sources.map(s=>({sc:s.sc, no:Number(s.no), codes:s.codes}));
  snapshot("merge chapters");
  /* anything unticked on the chapter being kept goes before anything arrives */
  if(finish && finish.drop && finish.drop.length){
    finish.drop.forEach(code=>purgeExercise(sc, targetNo, code));
    buildTree();
  }
  /* source chapter -> which code each of its exercises landed on in the target */
  const landed = {};
  sources.forEach(src=>{
    const map = landed[src.no] = landed[src.no] || {};
    src.codes.forEach(({code:srcCode, to})=>{
      const nSrc = qCount(sc, chapOf(sc,src.no), srcCode);
      if(!nSrc) return;
      let targetCh = chapOf(sc, targetNo);
      let destCode = to;
      if(to==="__new__" || !exOf(sc, targetCh, to)){
        /* a separate exercise of its own, even when an exercise of the same name
           is already there — only "Combine into" pours into an existing one */
        const srcEx = exOf(sc, chapOf(sc,src.no), srcCode);
        destCode = exOf(sc, targetCh, srcCode) ? freeExCode(targetCh) : srcCode;
        if(!destCode){
          let n = 1; destCode = srcCode+"x"+n;
          while(exOf(sc, targetCh, destCode)) destCode = srcCode+"x"+(++n);
        }
        (S.x.exs[sc+"|"+targetNo] = S.x.exs[sc+"|"+targetNo]||[]).push({code:destCode, name:srcEx.name});
        buildTree(); targetCh = chapOf(sc, targetNo);
      }
      map[srcCode] = destCode;
      const nBefore = qCount(sc, targetCh, destCode);
      const tArr = arrFor(sc, targetNo, destCode, nBefore + nSrc);
      const sArr = arrFor(sc, src.no, srcCode, nSrc);
      for(let i=0;i<nSrc;i++){
        tArr[nBefore+i] = sArr[i];       /* done, result, review flag and stars */
        moveQuestionRecords(key(sc,src.no,srcCode)+"."+i,
                            key(sc,targetNo,destCode)+"."+(nBefore+i));
      }
      S.x.cnt[key(sc,targetNo,destCode)] = nBefore + nSrc;
      S.h.concat(S.hd).forEach(it=>{
        if(it.kind || it.s!==sc || String(it.c)!==String(src.no) || it.e!==srcCode) return;
        const idx = parseRange(it.r, nSrc).list;
        it.c = Number(targetNo); it.e = destCode; it.r = toRange(idx.map(i=>i+nBefore));
      });
      /* the questions have moved, so the source keeps no copy of them and
         stops counting them against your progress */
      delete S.d[key(sc,src.no,srcCode)];
      S.x.cnt[key(sc,src.no,srcCode)] = 0;
      /* a custom exercise that has fully moved away no longer needs a home on the source */
      const ch = chapOf(sc, src.no);
      if(ch.custom || exOf(sc,ch,srcCode).custom){
        S.x.exs[sc+"|"+src.no] = (S.x.exs[sc+"|"+src.no]||[]).filter(e=>e.code!==srcCode);
        delete S.x.cnt[key(sc,src.no,srcCode)];
      }
    });
  });
  buildTree();
  const emptied = new Set();
  sources.forEach(src=>{
    const ch = chapOf(sc, src.no);
    const empty = !ch || exList(sc,ch).every(e=>qCount(sc,ch,e.code)===0);
    if(empty){
      emptied.add(Number(src.no));
      mergeRevisionRecord(sc, src.no, targetNo);   /* revision history comes along */
    }
    if(ch && ch.custom && empty){
      S.x.chs[sc+"|"+ch.mod] = (S.x.chs[sc+"|"+ch.mod]||[]).filter(c=>String(c.no)!==String(src.no));
    }
  });
  /* homework kept as a whole exercise, backlog rows and tasks are pinned to a
     place rather than a range, so they follow whatever they were pinned to */
  S.h.concat(S.hd).forEach(it=>{
    if(!it.kind || it.s!==sc || it.c===undefined || it.c===null) return;
    const map = landed[Number(it.c)]; if(!map) return;
    if(it.e){
      if(map[it.e]===undefined) return;
      it.e = map[it.e];
    } else if(!emptied.has(Number(it.c))) return;
    it.c = Number(targetNo);
  });
  /* the merged chapter's own identity: name, displayed number, and home */
  if(finish){
    if(finish.name){
      let rec = null;
      Object.keys(S.x.chs).forEach(k=>{
        if(k.split("|")[0]!==sc) return;
        (S.x.chs[k]||[]).forEach(c=>{ if(Number(c.no)===targetNo) rec = c; });
      });
      if(rec) rec.name = finish.name; else S.x.ren["c:"+sc+":"+targetNo] = finish.name;
    }
    if(finish.mod !== undefined && finish.mod !== null && String(finish.mod) !== ""){
      let moved = false;
      Object.keys(S.x.chs).forEach(k=>{
        if(k.split("|")[0]!==sc) return;
        const at = (S.x.chs[k]||[]).findIndex(c=>Number(c.no)===targetNo);
        if(at>=0){
          const rec = S.x.chs[k][at]; S.x.chs[k].splice(at,1);
          (S.x.chs[sc+"|"+finish.mod] = S.x.chs[sc+"|"+finish.mod]||[]).push(rec);
          moved = true;
        }
      });
      if(!moved){ S.x.mod = S.x.mod||{}; S.x.mod["c:"+sc+":"+targetNo] = Number(finish.mod); }
    }
    buildTree();
    /* the merged chapter's number is held for it alone, whether you chose a new
       one or kept the one it already had */
    const tgt = chapOf(sc, targetNo);
    reserveChapterNumber(sc, targetNo, finish.num || (tgt ? chLabel(tgt) : 0));
  }
  buildTree(); markDirty(); render();
}

/* shown once, only to people who already have recorded progress, so a
   fresh install is never nagged about a merge it has no use for */
/* ============================================================
   29. CHAPTER NUMBER COLLISION REPAIR
   Custom chapters used to be numbered from the highest built-in
   number upward. Modules 3-6 then added built-in chapters into
   that same range, so an older save can have a custom chapter
   sharing a number with a new built-in one — chapOf() then finds
   the built-in and the custom chapter's work becomes unreachable.
   Custom numbers now start at 1000 so this cannot happen again.
   ============================================================ */
const CUSTOM_NO_BASE = 1000;
function builtinChapterNos(sc){
  const set = new Set();
  const b = BUILTIN[sc]; if(!b) return set;
  Object.keys(b.modules).forEach(m=>b.modules[m].forEach(row=>set.add(row[0])));
  return set;
}
/* moves one chapter to a different number, carrying every reference with it */
function renumberChapter(sc, oldNo, newNo){
  if(String(oldNo)===String(newNo)) return;
  const oldS = String(oldNo), newS = String(newNo);
  const remapQk = qk=>{
    const dot = qk.lastIndexOf(".");
    const k = qk.slice(0,dot), i = qk.slice(dot+1);
    if(k[0]!==sc || k.slice(1,-1)!==oldS) return null;
    return sc+newS+k.slice(-1)+"."+i;
  };
  /* progress arrays */
  Object.keys(S.d).forEach(k=>{
    if(k[0]!==sc || k.slice(1,-1)!==oldS) return;
    S.d[sc+newS+k.slice(-1)] = S.d[k]; delete S.d[k];
  });
  /* notes, mistake reasons, bookmarks */
  [["n",S.n],["r",S.r],["bm",S.bm]].forEach(([,map])=>{
    Object.keys(map).forEach(qk=>{
      const nk = remapQk(qk);
      if(nk){ map[nk] = map[qk]; delete map[qk]; }
    });
  });
  /* collections point at question keys too */
  (S.col||[]).forEach(c=>{ c.qs = (c.qs||[]).map(qk=>remapQk(qk)||qk); });
  /* homework, finished homework */
  S.h.concat(S.hd).forEach(it=>{
    if(it.s===sc && String(it.c)===oldS) it.c = Number(newNo);
  });
  /* revision list is keyed "subject:chapter" */
  if(S.rev && S.rev.items && S.rev.items[sc+":"+oldS]){
    S.rev.items[sc+":"+newS] = S.rev.items[sc+":"+oldS];
    delete S.rev.items[sc+":"+oldS];
  }
  /* the chapter's own definition, its exercises and counts */
  Object.keys(S.x.chs).forEach(k=>{
    if(k.split("|")[0]!==sc) return;
    (S.x.chs[k]||[]).forEach(c=>{ if(String(c.no)===oldS) c.no = Number(newNo); });
  });
  if(S.x.exs[sc+"|"+oldS]){ S.x.exs[sc+"|"+newS] = S.x.exs[sc+"|"+oldS]; delete S.x.exs[sc+"|"+oldS]; }
  Object.keys(S.x.cnt).forEach(k=>{
    if(k[0]!==sc || k.slice(1,-1)!==oldS) return;
    S.x.cnt[sc+newS+k.slice(-1)] = S.x.cnt[k]; delete S.x.cnt[k];
  });
  [["num",S.x.num],["ren",S.x.ren]].forEach(([,map])=>{
    if(!map) return;
    const ok = "c:"+sc+":"+oldS, nk = "c:"+sc+":"+newS;
    if(map[ok]!==undefined){ map[nk] = map[ok]; delete map[ok]; }
  });
  if(S.x.mod){
    const ok = "c:"+sc+":"+oldS, nk = "c:"+sc+":"+newS;
    if(S.x.mod[ok]!==undefined){ S.x.mod[nk] = S.x.mod[ok]; delete S.x.mod[ok]; }
  }
}
let REPAIRED_CHAPTERS = 0;
function migrateChapterCollisions(){
  let moved = 0;
  Object.keys(BUILTIN).forEach(sc=>{
    const builtins = builtinChapterNos(sc);
    /* the numbers already spoken for, so a repair never lands on another one */
    const taken = new Set(builtins);
    Object.keys(S.x.chs).forEach(k=>{
      if(k.split("|")[0]===sc) (S.x.chs[k]||[]).forEach(c=>taken.add(Number(c.no)));
    });
    let next = CUSTOM_NO_BASE;
    const clashes = [];
    Object.keys(S.x.chs).forEach(k=>{
      if(k.split("|")[0]!==sc) return;
      (S.x.chs[k]||[]).forEach(c=>{ if(builtins.has(Number(c.no))) clashes.push(Number(c.no)); });
    });
    clashes.forEach(oldNo=>{
      while(taken.has(next)) next++;
      renumberChapter(sc, oldNo, next);
      taken.add(next); moved++;
    });
  });
  if(moved){ markDirty(); REPAIRED_CHAPTERS += moved; }
  return moved;
}

/* total question count in a range spec like "1-53, 63-66, 110, 378-379(a)" —
   the (a)/(b) suffixes label a sub-part of one problem, not an extra one */
function parseRangeSpecCount(spec){
  let total = 0;
  spec.split(",").forEach(part=>{
    part = part.trim().replace(/\(.*?\)/g,"").trim();
    if(!part) return;
    const m = part.match(/^(\d+)(?:-(\d+))?$/);
    if(!m) return;
    const a = parseInt(m[1],10), bEnd = m[2]?parseInt(m[2],10):a;
    total += Math.max(0, bEnd-a+1);
  });
  return total;
}
function refBookTotal(book){
  if(book.kind==="ranges") return book.chapters.reduce((a,[,spec])=>a+parseRangeSpecCount(spec),0);
  if(book.kind==="sbt") return book.chapters.reduce((a,[,n])=>a+n,0);
  return book.chapters.reduce((a,[,counts])=>a+counts.reduce((x,y)=>x+y,0),0);
}
function refBookFor(id){
  for(const sc of Object.keys(REF_BOOKS)) for(const b of REF_BOOKS[sc]) if(b.id===id) return {sc, book:b};
  return null;
}
function openRefBookPicker(){
  const added = S.x.refAdded||{};
  const draw = ()=>{
    let body = "";
    Object.keys(REF_BOOKS).forEach(sc=>{
      body += `<div class="node"><span class="lv">Subject</span><span class="nm">${esc(subjOf(sc)?subjOf(sc).name:sc)}</span></div><div class="branch">`;
      REF_BOOKS[sc].forEach(bk=>{
        const isAdded = !!added[bk.id];
        body += `<div class="card" style="margin-bottom:8px" data-refbook="${esc(bk.id)}">
          <div class="card-top"><span class="card-title">${esc(bk.name)}</span>
            ${isAdded?'<span class="tagx">added</span>':""}</div>
          <div class="card-note">${bk.chapters.length} chapters · ${refBookTotal(bk)} questions${bk.groups?" · "+refBookGroups(bk).length+" parts":""}${bk.kind==="sbt"?" · comes with a recommended set":""}</div>
        </div>`;
      });
      body += `</div>`;
    });
    onEsc = ()=>{};
    openModal(`<h3>Reference books</h3>
      <p>Adding one creates a module for it under its subject — one per part for a book that comes in parts — with a chapter per topic. Nothing is added until you pick it.</p>
      <div class="block" style="max-height:420px;overflow:auto">${body}</div>
      <div class="acts"><button class="btn" id="rbNo">Close</button></div>`);
    modal.querySelectorAll("[data-refbook]").forEach(el=>{
      el.onclick = ()=>{
        const id = el.dataset.refbook;
        if(added[id]) confirmOpenRefBook(id); else confirmAddRefBook(id);
      };
    });
    modal.querySelector("#rbNo").onclick = closeModal;
  };
  draw();
}
function confirmOpenRefBook(id){
  const loc = refBookFor(id); if(!loc) return;
  const modId = (S.x.refAdded||{})[id];
  closeModal();
  location.hash = `#/${loc.sc}/${modId}`;
}
function confirmAddRefBook(id){
  const loc = refBookFor(id); if(!loc) return;
  const {sc, book} = loc;
  onEsc = openRefBookPicker;
  openModal(`<h3>Add ${esc(book.name)}?</h3>
    <p>This creates ${book.groups?refBookGroups(book).length+" new modules":"a new module"} under ${esc(subjOf(sc).name)}${book.groups?" — one per part ("+esc(refBookGroups(book).join(", "))+")":""}, with ${book.chapters.length} chapters and about ${refBookTotal(book)} questions in total. You can remove them later like any other module.</p>

/* builds the module exactly like any hand-made custom one, just with a
   lot of chapters and exercises created in one pass */
function refBookGroups(book){
  if(!book.groups) return [null];
  const seen = [];
  book.chapters.forEach(row=>{ const g = row[2]||""; if(!seen.includes(g)) seen.push(g); });
  return seen;
}

  if(book.kind==="sbt"){
    sbtCol = S.col.find(c=>c.n==="SBT Recommended Questions");
    if(!sbtCol){ sbtCol = {id:"k"+Date.now().toString(36), n:"SBT Recommended Questions", qs:[]}; S.col.push(sbtCol); }
  }

  book.chapters.forEach(row=>{
    const mId = book.groups ? modOf[row[2]||""] : modId;
    const no = nextChapterNo(sc);
    (S.x.chs[sc+"|"+mId] = S.x.chs[sc+"|"+mId]||[]).push({no, name:row[0]});
    buildTree();   /* so nextChapterNo() sees this one on the next pass */
    /* codes come straight from EX_CODES rather than freeExCode(), which reads
       the built tree — that tree does not refresh between pushes within one
       chapter, so every exercise would otherwise be handed the same code */
    let codeIdx = 0;
    const takeCode = () => EX_CODES[codeIdx++];

    if(book.kind==="std"){
      const counts = row[1];
      book.exCols.forEach((exName,i)=>{
        if(!counts[i]) return;                 /* a 0-count exercise is just left out */
        const code = takeCode();
        (S.x.exs[sc+"|"+no] = S.x.exs[sc+"|"+no]||[]).push({code, name:exName});
        S.x.cnt[key(sc,no,code)] = counts[i];
      });
    } else if(book.kind==="sbt"){
      const [,n,rec] = row;
      if(n){
        const code = takeCode();
        (S.x.exs[sc+"|"+no] = S.x.exs[sc+"|"+no]||[]).push({code, name:"Questions"});
        S.x.cnt[key(sc,no,code)] = n;
        (rec||[]).forEach(num=>{
          const i = num-1; if(i<0 || i>=n) return;
          const qk = key(sc,no,code)+"."+i;
          if(sbtCol.qs.indexOf(qk)<0) sbtCol.qs.push(qk);
          S.bm[qk] = (S.bm[qk]||[]).concat(sbtCol.id).filter((v,idx,a)=>a.indexOf(v)===idx);
        });
      }
    } else if(book.kind==="ranges"){
      const spec = row[1], n = parseRangeSpecCount(spec);
      if(n){
        const code = takeCode();
        (S.x.exs[sc+"|"+no] = S.x.exs[sc+"|"+no]||[]).push({code, name:"Problems"});
        S.x.cnt[key(sc,no,code)] = n;
      }
    }
  });

  S.x.refAdded = S.x.refAdded || {};
  S.x.refAdded[book.id] = modId;
  buildTree(); markDirty();
  location.hash = `#/${sc}/${modId}`;
  render();
  toastUndo(book.name+" added");
}

/* ============================================================
   23. BULK SELECT — delete / move / copy+paste chapters or exercises
   ============================================================ */
let BULK = {kind:"", v:null, sel:new Set()};
let CLIPBOARD = null;

function startBulkPick(kind, v){ BULK = {kind, v, sel:new Set()}; drawBulkPicker(); }
function bulkItems(){
  if(BULK.kind==="chapter"){
    return modOf(BULK.v.s, BULK.v.m).chapters.map(ch=>({key:String(ch.no), label:chTitle(ch), custom:ch.custom}));
  }
  if(BULK.kind==="exercise"){
    const ch = chapOf(BULK.v.s, BULK.v.c);
    return exList(BULK.v.s, ch).map(e=>({key:e.code, label:e.name+" ("+qCount(BULK.v.s,ch,e.code)+" questions)", custom:e.custom}));
  }
  return [];
}
function drawBulkPicker(){
  const items = bulkItems();
  const body = items.map(it=>`<div class="opt ${BULK.sel.has(it.key)?"on":""}" data-bulkpick="${esc(it.key)}" role="checkbox" tabindex="0">
    <span class="bx">✓</span>${esc(it.label)}${it.custom?' <span class="tagx">yours</span>':""}</div>`).join("");
  const nCustom = items.filter(it=>BULK.sel.has(it.key) && it.custom).length;
  const nMovable = BULK.kind==="chapter" ? BULK.sel.size : nCustom;
  onEsc = ()=>{};
  openModal(`<h3>Select ${BULK.kind==="chapter"?"chapters":"exercises"}</h3>
    <p>${BULK.kind==="chapter"
      ? "Any chapter can be moved or copied. Delete only applies to ones you added yourself — built-in chapters in the selection are skipped."
      : "Delete and move only apply to exercises you added yourself — built-in ones in the selection are skipped. Copy works on any of them."}</p>
    <div class="block" style="max-height:360px;overflow:auto"><div class="opts">${body||`<div class="hint" style="margin:0">Nothing here yet.</div>`}</div></div>
    <div class="acts">
      <button class="btn" id="bkNo">Close</button>
      <button class="btn" id="bkCopy" ${BULK.sel.size?"":"disabled"}>Copy</button>
      <button class="btn" id="bkMove" ${nMovable?"":"disabled"}>Move…</button>
      <button class="btn danger" id="bkDel" ${nCustom?"":"disabled"}>Delete</button>
    </div>`);
  modal.querySelectorAll("[data-bulkpick]").forEach(el=>{
    const toggle = ()=>{ const k=el.dataset.bulkpick; BULK.sel.has(k)?BULK.sel.delete(k):BULK.sel.add(k); drawBulkPicker(); };
    el.onclick = toggle;
    el.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } };
  });
  modal.querySelector("#bkNo").onclick = ()=>{ closeModal(); render(); };
  modal.querySelector("#bkCopy").onclick = bulkCopy;
  modal.querySelector("#bkMove").onclick = bulkMoveDialog;
  modal.querySelector("#bkDel").onclick = bulkDelete;
}
function bulkCopy(){
  const items = bulkItems().filter(it=>BULK.sel.has(it.key));
  CLIPBOARD = {kind:BULK.kind, sc:BULK.v.s, items:items.map(it=>it.key), fromChapter:BULK.v.c};
  closeModal(); render();
  toast(items.length+" "+(BULK.kind==="chapter"?"chapter":"exercise")+(items.length>1?"s":"")+" copied — open where you want them and press +, Paste");
}
async function bulkDelete(){
  const items = bulkItems().filter(it=>BULK.sel.has(it.key) && it.custom);
  if(!items.length) return;
  const noun = BULK.kind==="chapter"?"chapter":"exercise";
  if(!await ask("Delete "+items.length+" "+noun+(items.length>1?"s":"")+"?",
      "Everything recorded in them goes too. Built-in ones in your selection were left alone.", "Delete", true)) return;
  snapshot("bulk delete");
  items.forEach(it=>{
    if(BULK.kind==="chapter") deleteChapterSilently(BULK.v.s, it.key);
    else deleteExerciseSilently(BULK.v.s, BULK.v.c, it.key);
  });
  buildTree(); markDirty(); closeModal(); render();
  toastUndo(items.length+" "+noun+(items.length>1?"s":"")+" deleted");
}
function deleteChapterSilently(sc, no){
  const ch = chapOf(sc, no); if(!ch) return;
  Object.keys(S.x.chs).forEach(k=>{ if(k.split("|")[0]===sc) S.x.chs[k] = S.x.chs[k].filter(c=>String(c.no)!==String(no)); });
  delete S.x.exs[sc+"|"+no];
  dropKeys(keysOfChapter(sc, no));
  S.h = S.h.filter(it=>!(it.s===sc && String(it.c)===String(no)));
  S.hd = S.hd.filter(it=>!(it.s===sc && String(it.c)===String(no)));
}
function deleteExerciseSilently(sc, cno, code){
  S.x.exs[sc+"|"+cno] = (S.x.exs[sc+"|"+cno]||[]).filter(e=>e.code!==code);
  dropKeys([key(sc,cno,code)]);
  delete S.x.cnt[key(sc,cno,code)];
  S.h = S.h.filter(it=>!(it.s===sc && String(it.c)===String(cno) && it.e===code));
  S.hd = S.hd.filter(it=>!(it.s===sc && String(it.c)===String(cno) && it.e===code));
}
function bulkMoveDialog(){
  /* moving is safe for built-in chapters too — only their module changes,
     never their number, so nothing recorded against them is disturbed */
  const items = bulkItems().filter(it=>BULK.sel.has(it.key) && (BULK.kind==="chapter" || it.custom));
  if(!items.length) return;
  const sc = BULK.v.s, sub = subjOf(sc);
  onEsc = drawBulkPicker;
  if(BULK.kind==="chapter"){
    openModal(`<h3>Move ${items.length} chapter${items.length>1?"s":""}</h3>
      <p>They keep everything recorded in them — only which module they sit under changes.</p>
      <div class="block"><div class="blabel">Move to</div>
        <select id="mvMod">${sub.order.map(m=>`<option value="${m}"${String(m)===String(BULK.v.m)?" selected":""}>${esc(sub.modules[m].name)}</option>`).join("")}</select></div>
      <div class="acts"><button class="btn" id="mvNo">Cancel</button><button class="btn primary" id="mvGo">Move</button></div>`);
    modal.querySelector("#mvNo").onclick = drawBulkPicker;
    modal.querySelector("#mvGo").onclick = ()=>{
      const destMod = modal.querySelector("#mvMod").value;
      snapshot("move chapters");
      items.forEach(it=>{
        const no = it.key;
        /* a custom chapter's record physically moves; a built-in one keeps its
           place in the syllabus data and just gets a module override */
        let rec = null;
        Object.keys(S.x.chs).forEach(k=>{
          if(k.split("|")[0]!==sc) return;
          const at = S.x.chs[k].findIndex(c=>String(c.no)===String(no));
          if(at>=0){ rec = S.x.chs[k][at]; S.x.chs[k].splice(at,1); }
        });
        if(rec) (S.x.chs[sc+"|"+destMod] = S.x.chs[sc+"|"+destMod]||[]).push(rec);
        else { S.x.mod = S.x.mod||{}; S.x.mod["c:"+sc+":"+no] = Number(destMod); }
      });
      buildTree(); markDirty(); closeModal(); render();
      toastUndo(items.length+" chapter"+(items.length>1?"s":"")+" moved");
    };
  } else {
    const chapChoices = allChapters(sc).filter(c=>String(c.no)!==String(BULK.v.c));
    openModal(`<h3>Move ${items.length} exercise${items.length>1?"s":""}</h3>
      <p>Their questions and everything recorded on them move too.</p>
      <div class="block"><div class="blabel">Move to</div>
        <select id="mvChap">${chapChoices.map(c=>`<option value="${c.no}">${esc(chTitle(c))}</option>`).join("")}</select></div>
      <div class="acts"><button class="btn" id="mvNo">Cancel</button><button class="btn primary" id="mvGo">Move</button></div>`);
    modal.querySelector("#mvNo").onclick = drawBulkPicker;
    modal.querySelector("#mvGo").onclick = ()=>{
      const destNo = Number(modal.querySelector("#mvChap").value);
      snapshot("move exercises");
      items.forEach(it=>moveExercise(sc, BULK.v.c, it.key, destNo));
      buildTree(); markDirty(); closeModal(); render();
      toastUndo(items.length+" exercise"+(items.length>1?"s":"")+" moved");
    };
  }
}
/* relocates one exercise's definition and every bit of recorded data to a
   different chapter, picking a fresh code if the destination already uses it */
function moveExercise(sc, fromNo, code, toNo){
  const fromCh = chapOf(sc, fromNo), toCh = chapOf(sc, toNo);
  const ex = exOf(sc, fromCh, code); if(!ex) return;
  const n = qCount(sc, fromCh, code);
  let destCode = code, k=1;
  while(exOf(sc, toCh, destCode)) destCode = code+(k++);
  (S.x.exs[sc+"|"+toNo] = S.x.exs[sc+"|"+toNo]||[]).push({code:destCode, name:ex.name});
  if(n){
    const arr = arrFor(sc, fromNo, code, n);
    const dest = arrFor(sc, toNo, destCode, n);
    for(let i=0;i<n;i++){
      dest[i] = arr[i];
      const oldKey = key(sc,fromNo,code)+"."+i, newKey = key(sc,toNo,destCode)+"."+i;
      if(S.n[oldKey]!==undefined){ S.n[newKey]=S.n[oldKey]; delete S.n[oldKey]; }
      if(S.r[oldKey]!==undefined){ S.r[newKey]=S.r[oldKey]; delete S.r[oldKey]; }
      if(S.bm[oldKey]!==undefined){ S.bm[newKey]=S.bm[oldKey]; delete S.bm[oldKey];
        S.col.forEach(c=>{ const at=c.qs.indexOf(oldKey); if(at>=0) c.qs[at]=newKey; }); }
    }
    if(S.x.cnt[key(sc,fromNo,code)]!==undefined) S.x.cnt[key(sc,toNo,destCode)] = S.x.cnt[key(sc,fromNo,code)];
  }
  S.h.concat(S.hd).forEach(it=>{
    if(it.kind || it.s!==sc || String(it.c)!==String(fromNo) || it.e!==code) return;
    it.c = Number(toNo); it.e = destCode;
  });
  deleteExerciseSilently(sc, fromNo, code);
}
/* clones whatever is on the clipboard into the chapter/module you're
   looking at, with fresh chapter numbers or exercise codes as needed */
function pasteClipboard(v){
  if(!CLIPBOARD) return;
  snapshot("paste");
  if(CLIPBOARD.kind==="chapter"){
    CLIPBOARD.items.forEach(no=>{
      const src = chapOf(v.s, no); if(!src) return;
      const newNo = nextChapterNo(v.s);
      (S.x.chs[v.s+"|"+v.m] = S.x.chs[v.s+"|"+v.m]||[]).push({no:newNo, name:src.name+" (copy)"});
      exList(v.s, src).forEach(e=>{
        const n = qCount(v.s, src, e.code);
        (S.x.exs[v.s+"|"+newNo] = S.x.exs[v.s+"|"+newNo]||[]).push({code:e.code, name:e.name});
        if(n){
          const from = arrFor(v.s, no, e.code, n), to = arrFor(v.s, newNo, e.code, n);
          for(let i=0;i<n;i++){
            to[i] = from[i];
            const oldKey = key(v.s,no,e.code)+"."+i, newKey = key(v.s,newNo,e.code)+"."+i;
            if(S.n[oldKey]!==undefined) S.n[newKey]=S.n[oldKey];
            if(S.r[oldKey]!==undefined) S.r[newKey]=S.r[oldKey];
          }
          if(S.x.cnt[key(v.s,no,e.code)]!==undefined) S.x.cnt[key(v.s,newNo,e.code)] = S.x.cnt[key(v.s,no,e.code)];
        }
      });
    });
  } else {
    /* exercises are copied from wherever they were selected (recorded at copy time) */
    const destCh = chapOf(v.s, v.c);
    CLIPBOARD.items.forEach(code=>{
      const src = CLIPBOARD.fromChapter;
      const fromCh = chapOf(v.s, src); if(!fromCh) return;
      const ex = exOf(v.s, fromCh, code); if(!ex) return;
      let destCode = code, k=1;
      while(exOf(v.s, destCh, destCode)) destCode = code+(k++);
      const n = qCount(v.s, fromCh, code);
      (S.x.exs[v.s+"|"+v.c] = S.x.exs[v.s+"|"+v.c]||[]).push({code:destCode, name:ex.name});
      if(n){
        const from = arrFor(v.s, src, code, n), to = arrFor(v.s, v.c, destCode, n);
        for(let i=0;i<n;i++){
          to[i] = from[i];
          const oldKey = key(v.s,src,code)+"."+i, newKey = key(v.s,v.c,destCode)+"."+i;
          if(S.n[oldKey]!==undefined) S.n[newKey]=S.n[oldKey];
          if(S.r[oldKey]!==undefined) S.r[newKey]=S.r[oldKey];
        }
        if(S.x.cnt[key(v.s,src,code)]!==undefined) S.x.cnt[key(v.s,v.c,destCode)] = S.x.cnt[key(v.s,src,code)];
      }
    });
  }
  CLIPBOARD = null;
  buildTree(); markDirty(); render();
  toastUndo("Pasted");
}


const SUB_CODES = "abcdefghijklmnopqrstuvwxyz";
const EX_CODES  = "BDEFGHJKLNOPQRSTUVWXYZbcdefghijklmnopqrstuvwxyz";
function freeSubjectCode(){ for(const c of SUB_CODES) if(!TREE.subjects[c]) return c; return null; }
function freeExCode(ch){ const used = new Set(ch.exs.map(e=>e.code)); for(const c of EX_CODES) if(!used.has(c)) return c; return null; }
/* custom chapters live at 1000+ so a future syllabus update adding more
   built-in chapters can never collide with one the user already made */
const nextChapterNo = sc => Math.max(CUSTOM_NO_BASE, allChapters(sc).reduce((m,c)=>Math.max(m,c.no),0)+1);
const nextModuleId  = sc => subjOf(sc).order.reduce((m,x)=>Math.max(m,Number(x)),0)+1;

/* exact match so chapter 1 never sweeps up chapter 12 */
function keysOfChapter(sc,no){ const p=String(no); return Object.keys(S.d).filter(k=>k[0]===sc && k.slice(1,-1)===p); }
function dropKeys(keys){
  keys.forEach(k=>{ delete S.d[k];
    [S.n,S.r].forEach(store=>Object.keys(store).forEach(nk=>{ if(nk.slice(0,nk.lastIndexOf("."))===k) delete store[nk]; })); });
}
