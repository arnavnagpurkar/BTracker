/* a list whose questions are all ticked moves to Finished, with an undo offer */
function sweepFinishedHomework(){
  /* anything no longer complete becomes sweepable again */
  S.h.forEach(it=>{ const s=hwStats(it); if(s.done < s.total) delete it.keep; });
  const finished = S.h.filter(it=>{ const s=hwStats(it); return !it.keep && s.total>0 && s.done===s.total; });
  if(!finished.length) return false;
  finished.forEach(it=>{ it.fin = Date.now(); S.hd.unshift(it); });
  S.h = S.h.filter(it=>!finished.includes(it));
  const names = finished.map(it=>(it.kind==="task"||it.kind==="back") ? (it.title || (hwResolve(it).ex||{}).name || "backlog") : ((hwResolve(it).ex||{}).name || "homework"));
  const ids = finished.map(it=>it.id);
  /* a targeted undo: put the list back and keep it there, rather than
     rewinding the tick that completed it and letting it sweep straight out again */
  toastUndo("Finished " + names.join(", ") + " — moved out of homework", ()=>{
    S.hd = S.hd.filter(x=>ids.indexOf(x.id) < 0);
    finished.forEach(it=>{ delete it.fin; it.keep = true; S.h.push(it); });
    markDirty();
    if(typeof VIEW !== "undefined" && VIEW.name==="hw") viewHomework();
    else if(typeof ctx !== "undefined" && ctx) drawSheet();
    paintTabs(); toast("Put back into homework");
  });
  return true;
}
function dueState(d){
  if(!d) return "";
  const today = todayKey();
  if(d < today) return "over";
  const t = new Date(); t.setDate(t.getDate()+2);
  if(d <= dayKey(t)) return "soon";
  return "";
}
function prettyDue(d){
  const today = todayKey();
  if(d === today) return "due today";
  const t = new Date(); t.setDate(t.getDate()+1);
  if(d === dayKey(t)) return "due tomorrow";
  if(d < today) return "overdue " + d;
  return "due " + d;
}

/* ============================================================
   6. SAVE CODE — v3, still reads v1 and v2
   ============================================================ */
const A64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!#$%&()*+,-.";
function fingerprint(str){ let h=5381; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))>>>0; return h.toString(36); }
function metaObject(){ return {x:S.x, h:S.h, hd:S.hd, r:S.r, log:S.log, stat:S.stat, marks:S.marks, pom:S.pom, dl:S.dl, norec:S.norec, hwSort:S.hwSort, goals:S.goals, col:S.col, bm:S.bm, notes:S.notes, an:S.an, rev:S.rev, theme:S.theme, fs:S.fs, todo:S.todo, look:S.look, ig:S.ig, asy:plannerState()}; }
function makeCode(){
  const segs=[];
  Object.keys(S.d).sort().forEach(k=>{
    const a=S.d[k]; if(!a.some(v=>v)) return;
    let out="",i=0;
    while(i<a.length){ let j=i; while(j<a.length && a[j]===a[i]) j++;
      const run=j-i; out += A64[a[i]] + (run>1?run:""); i=j; }
    segs.push(k+":"+out);
  });
  const notes=[];
  Object.keys(S.n).sort().forEach(k=>{ const v=S.n[k]; if(v&&v.trim()) notes.push(k+"="+encodeURIComponent(v)); });
  const body = "v3|"+Date.now().toString(36)+"|"+segs.join(";")+"|"+notes.join(";")+"|"+encodeURIComponent(JSON.stringify(metaObject()));
  return "JEE-"+btoa(body+"|"+fingerprint(body));
}
function readCode(raw){
  let code = (raw||"").trim().replace(/\s+/g,"");
  if(!code) throw new Error("Paste a code first.");
  if(code.startsWith("JEE-")) code = code.slice(4);
  let body;
  try{ body = atob(code); }catch(e){ throw new Error("That is not a valid code. Check that you copied all of it."); }
  const cut = body.lastIndexOf("|");
  if(cut<0) throw new Error("That is not a valid code.");
  const payload = body.slice(0,cut), sum = body.slice(cut+1);
  if(fingerprint(payload)!==sum) throw new Error("This code is damaged or was cut off. Paste the whole code, with nothing added.");
  const f = payload.split("|");
  if(!["v1","v2","v3"].includes(f[0])) throw new Error("This code was made by a different version of the tracker.");
  const d={}, n={};
  if(f[2]) f[2].split(";").forEach(seg=>{
    const p=seg.indexOf(":"); if(p<0) return;
    const k=seg.slice(0,p), bd=seg.slice(p+1), arr=[]; let i=0;
    while(i<bd.length){
      const val = A64.indexOf(bd[i]); i++;
      if(val<0) throw new Error("This code is damaged.");
      let num=""; while(i<bd.length && bd[i]>="0" && bd[i]<="9"){ num+=bd[i]; i++; }
      const run = num?parseInt(num,10):1;
      if(!(run>0)||run>100000) throw new Error("This code is damaged.");
      for(let r=0;r<run;r++) arr.push(val);
    }
    d[k]=arr;
  });
  if(f[3]) f[3].split(";").forEach(seg=>{
    const p=seg.indexOf("="); if(p<0) return;
    n[seg.slice(0,p)] = decodeURIComponent(seg.slice(p+1));
  });
  const out = {d, n, x:newCustom(), h:[], hd:[], r:{}, log:[], stat:{}, marks:newMarks(),
               dl:[], norec:false, hwSort:"loc", goals:newGoals(), col:[], bm:{}, notes:[], an:newAnalysis(), rev:newRevision(), theme:"dark",
               fs:null, look:null, ig:null, asy:null,
               pom:Object.assign({}, POM_DEFAULT), at:new Date(parseInt(f[1],36))};
  if(f[0]!=="v1" && f[4]){
    try{
      const meta = JSON.parse(decodeURIComponent(f[4]));
      if(meta.x) out.x = Object.assign(newCustom(), meta.x);
      if(Array.isArray(meta.h)) out.h = meta.h;
      if(Array.isArray(meta.hd)) out.hd = meta.hd;
      if(meta.r) out.r = meta.r;
      if(Array.isArray(meta.log)) out.log = meta.log;
      if(meta.stat) out.stat = meta.stat;
      if(meta.marks && meta.marks.tables) out.marks = meta.marks;
      if(meta.pom) out.pom = Object.assign(out.pom, meta.pom);
      if(Array.isArray(meta.dl)) out.dl = meta.dl;
      if(typeof meta.norec === "boolean") out.norec = meta.norec;
      if(meta.hwSort) out.hwSort = meta.hwSort;
      if(meta.goals) out.goals = Object.assign(newGoals(), meta.goals);
      if(Array.isArray(meta.col)) out.col = meta.col;
      if(meta.bm) out.bm = meta.bm;
      if(Array.isArray(meta.notes)) out.notes = meta.notes;
      if(meta.an && Array.isArray(meta.an.folders)) out.an = meta.an;
      if(meta.rev && meta.rev.items) out.rev = meta.rev;
      if(meta.theme && ["dark","red","green","light"].indexOf(meta.theme)>=0) out.theme = meta.theme;
      if(meta.fs && Array.isArray(meta.fs.files) && Array.isArray(meta.fs.folders)) out.fs = meta.fs;
      if(meta.look && typeof meta.look==="object") out.look = meta.look;
      if(meta.todo && Array.isArray(meta.todo.items)) out.todo = meta.todo;
      if(meta.ig && typeof meta.ig==="object") out.ig = meta.ig;
      if(meta.asy && typeof meta.asy==="object") out.asy = meta.asy;
      if(Array.isArray(meta.col)) out.col = meta.col;
      if(meta.bm) out.bm = meta.bm;
      if(Array.isArray(meta.notes)) out.notes = meta.notes;
      if(meta.an && Array.isArray(meta.an.folders)) out.an = meta.an;
      if(meta.rev && meta.rev.items) out.rev = meta.rev;
      if(meta.bm) out.bm = meta.bm;
      if(Array.isArray(meta.notes)) out.notes = meta.notes;
      if(meta.an && Array.isArray(meta.an.folders)) out.an = meta.an;
      if(meta.rev && meta.rev.items) out.rev = meta.rev;
    }catch(e){ throw new Error("This code is damaged."); }
  }
  return out;
}
function adoptCode(p){
  S.d=p.d; S.n=p.n; S.r=p.r; S.x=p.x; S.h=p.h; S.hd=p.hd;
  S.log=p.log; S.stat=p.stat; S.marks=p.marks; S.pom=p.pom;
  S.dl=p.dl; S.norec=p.norec; S.hwSort=p.hwSort; S.goals=p.goals; S.col=p.col; S.bm=p.bm; S.notes=p.notes; S.an=p.an; S.rev=p.rev; S.theme=p.theme||"dark"; S.savedAt=p.at; applyTheme();
  /* a code made before the planner joined carries no files list, appearance or
     planner links: this device keeps its own rather than being blanked */
  const boot = !ASYAPI;
  S.fs = p.fs || (boot ? newFs() : (S.fs || newFs()));
  S.look = p.look ? Object.assign(lookDefault(), p.look) : (boot || !S.look ? lookDefault() : S.look);
  if(p.ig) S.ig = Object.assign(igDefault(), p.ig);
  else if(boot || !S.ig) S.ig = igDefault();
  else S.ig = Object.assign(igDefault(), S.ig, {revMigrated:false});   /* its old revision list still comes across */
  S.todo = p.todo || (boot ? newTodo() : (S.todo || newTodo()));
  S.asy = p.asy || null;
  if(ASYAPI && S.asy){ JOIN_NEXT = true; try{ ASYAPI.importState(S.asy, true, false); } finally{ JOIN_NEXT = false; } S.asy = null; }
  if(ASYAPI) setTimeout(afterCodeLoaded, 0);
  fillCustom();
  migrateMarks(); migrateAnalysis();
  if(!S.pom.kind) S.pom.kind = S.pom.endless ? "endless" : "pomo";
  TIMER.endless = S.pom.kind==="endless";
  migrateChapterCollisions();
}

/* the page settles in when you arrive somewhere new; a repaint of the page you
   are already on (a running timer, a filter) is left alone so nothing blinks */
function flashIn(){
  const here = location.hash || "#/";
  if(app.dataset.route === here) return;
  app.dataset.route = here;
  app.classList.add("anim");
  clearTimeout(flashIn.t);
  flashIn.t = setTimeout(()=>app.classList.remove("anim"), 430);

function render(){
  if(!TREE) buildTree();
  flashIn();
  ctx = null; hsel = new Set();     /* no exercise sheet and no chips are open yet */
  clearSelection(true); closeFabMenu();
  const r = route();
  window.scrollTo(0,0);
  if(r.s==="rev"){ location.replace("#/asy/revision"); return; }
  plannerShow(r.s==="asy" ? (r.m || "overview") : null);
  if(r.s==="asy"){
    const v = r.m || "overview";
    VIEW={name:"asy", v}; setAccent(null); paintTabs(); fab.hidden=true;
    crumbs([{label:"Asymptote",href:"#/asy/overview"},{label:PLANNER_TITLES[v]||"Planner"}]);
    return;
  }
  if(r.s==="ov"){ VIEW={name:"ov"}; setAccent(null); paintTabs(); fab.hidden=true; return viewOverview(); }
  if(r.s==="files"){ VIEW={name:"files", f:r.m||null}; setAccent(null); paintTabs(); fab.hidden=false; return viewFiles(r.m||null); }
  if(r.s==="settings"){ VIEW={name:"settings"}; setAccent(null); paintTabs(); fab.hidden=true; return viewSettings(r.m||""); }

  if(r.s==="hw"){ VIEW={name:"hw"}; setAccent(null); paintTabs(); fab.hidden=false; return viewHomework(); }
  if(r.s==="study"){ VIEW={name:"study"}; setAccent(null); paintTabs(); fab.hidden=true; return viewStudy(); }
  if(r.s==="stats"){ VIEW={name:"stats"}; setAccent(null); paintTabs(); fab.hidden=false; return viewStats(); }
  if(r.s==="coll"){ VIEW={name:"coll"}; setAccent(null); paintTabs(); fab.hidden=true; return viewCollections(); }
  if(r.s==="an"){
    setAccent(null); paintTabs(); fab.hidden=false;
    const f = r.m ? anFolder(r.m) : null;
    if(!f){ VIEW={name:"an"}; return viewAnalysis(); }
    const t = r.c ? anTest(f, r.c) : null;
    if(!t){ VIEW={name:"anFolder", f:f.id}; return viewAnFolder(f); }
    VIEW={name:"anTest", f:f.id, t:t.id};
    return viewAnTest(f, t);
  }
  if(r.s==="goals"){ VIEW={name:"goals"}; setAccent(null); paintTabs(); fab.hidden=true; return viewGoals(); }
  if(r.s==="manual"){ location.replace("#/ov"); return; }
  if(r.s==="marks"){ VIEW={name:"marks"}; setAccent(null); paintTabs(); fab.hidden=false; return viewMarks(); }

  paintTabs(); fab.hidden=false;
  if(!r.s || !subjOf(r.s)){ VIEW={name:"home"}; setAccent(null); return viewHome(); }
  setAccent(r.s);
  if(!r.m || !modOf(r.s,r.m)){ VIEW={name:"subject", s:r.s}; return viewSubject(r.s); }
  if(!r.c){ VIEW={name:"module", s:r.s, m:Number(r.m)}; return viewModule(r.s, Number(r.m)); }
  const ch = chapOf(r.s, r.c);
  if(!ch){ VIEW={name:"subject", s:r.s}; return viewSubject(r.s); }
  if(!r.e || !exOf(r.s,ch,r.e)){ VIEW={name:"chapter", s:r.s, m:Number(r.m), c:ch.no}; return viewChapter(r.s, Number(r.m), ch); }
  VIEW={name:"exercise", s:r.s, m:Number(r.m), c:ch.no, e:r.e};
  return viewExercise(r.s, Number(r.m), ch, r.e);
}

function computeOrder(){

  let idx=[]; for(let i=0;i<n;i++) idx.push(i);
  idx = idx.filter(i=>{
    const v=arr[i]||0, r=result(v);
    if(filter.status==="todo" && isDone(v)) return false;
    if(filter.status==="done" && !isDone(v)) return false;
    if(filter.status==="correct" && r!==1) return false;
    if(filter.status==="wrong" && r!==2) return false;
    if(filter.status==="cant" && r!==3) return false;
    if(filter.status==="flag" && !isFlag(v)) return false;
    if(filter.status==="hw" && !hw.has(i)) return false;
    if(filter.star!=="all" && stars(v)!==Number(filter.star)) return false;
    return true;
  });
  if(filter.sort==="starDesc") idx.sort((x,y)=>stars(arr[y]||0)-stars(arr[x]||0)||x-y);

}

let drag = null;
document.addEventListener("pointerdown", e=>{

  const row = e.target.closest(".row:not(.head)"); if(!row) return;
  drag = {anchor:Number(row.dataset.i), active:false, timer:null, x:e.clientX, y:e.clientY, cx:e.clientX, cy:e.clientY};
  if(e.pointerType!=="mouse") drag.timer = setTimeout(()=>{ if(drag) startDrag(); }, 350);
});
function startDrag(){
  drag.active = true; sel = new Set([drag.anchor]);
  const sh = document.getElementById("sheet");
  sh.style.touchAction="none"; sh.classList.add("dragging");
  drawSheet(); paintSelbar(); requestAnimationFrame(dragLoop);
}
function extendTo(x,y){
  const el = document.elementFromPoint(x,y);
  const row = el && el.closest && el.closest(".row:not(.head)");
  if(!row) return;
  const a = order.indexOf(drag.anchor), b = order.indexOf(Number(row.dataset.i));
  if(a<0||b<0) return;
  const next = new Set(order.slice(Math.min(a,b), Math.max(a,b)+1));
  if(next.size===sel.size && [...next].every(i=>sel.has(i))) return;
  sel = next;
  document.querySelectorAll("#sheet .row:not(.head)").forEach(r=>r.classList.toggle("sel", sel.has(+r.dataset.i)));
  paintSelbar();
}
function dragLoop(){
  if(!drag||!drag.active) return;
  const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--topbar-h"))||86;
  const h = window.innerHeight, edge = 56;
  let d = 0;
  if(drag.cy < top+edge) d = -Math.ceil((top+edge-drag.cy)/8);
  else if(drag.cy > h-edge) d = Math.ceil((drag.cy-(h-edge))/8);
  if(d){ window.scrollBy(0,d); extendTo(drag.cx, drag.cy); }
  requestAnimationFrame(dragLoop);
}
document.addEventListener("pointermove", e=>{
  if(!drag||!ctx) return;
  drag.cx=e.clientX; drag.cy=e.clientY;
  if(!drag.active){
    if(Math.abs(e.clientY-drag.y)+Math.abs(e.clientX-drag.x) < 6) return;
    if(e.pointerType==="mouse" && (e.buttons&1)) startDrag();
    else { clearTimeout(drag.timer); drag=null; }
    if(!drag||!drag.active) return;
  }
  e.preventDefault(); extendTo(e.clientX, e.clientY);
}, {passive:false});
function endDrag(){
  if(!drag) return;
  clearTimeout(drag.timer);
  const sh = document.getElementById("sheet");
  if(sh){ sh.style.touchAction=""; sh.classList.remove("dragging"); }
  drag = null;
}

function taskWhere(it){
  const bits = [];
  const sub = it.s && subjOf(it.s); if(sub) bits.push(sub.short);
  const mo = it.s && it.m && modOf(it.s, it.m); if(mo) bits.push(mo.name);
  const ch = it.s && it.c && chapOf(it.s, it.c); if(ch) bits.push(chTitle(ch));
  const ex = ch && it.e && exOf(it.s, ch, it.e); if(ex) bits.push(ex.name);
  return bits.join(" · ");
}

function splitQk(qk){
  const dot = qk.lastIndexOf(".");
  const k = qk.slice(0,dot), i = Number(qk.slice(dot+1));
  return {s:k[0], c:k.slice(1,-1), e:k.slice(-1), i};
}
/* due date first, then whichever has more left to do */
function hwPriority(a,b){
  if(a.due && !b.due) return -1;
  if(!a.due && b.due) return 1;
  if(a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  const la = hwStats(a), lb = hwStats(b);
  return (lb.total-lb.done) - (la.total-la.done);
}

                  s:hwForm.s, c:Number(hwForm.c), e:hwForm.e, r:toRange(p.list)};
      if(hwForm.due) it.due = hwForm.due;

function drawHwTree(){
  const mount = document.getElementById("hwTree"); if(!mount) return;
  let html = "";
  if(!S.h.length){
    html = `<div class="empty">Nothing outstanding. Add a question range above, or switch to <strong>Something else</strong> for anything that is not questions.</div>`;
  } else if(S.hwSort === "pri"){
    html = S.h.slice().sort((a,b)=>((b.kind==="task")-(a.kind==="task")) || hwPriority(a,b))
      .map(it=>hwItemHTML(it,false,true)).join("");
  } else {
    /* anything that is not questions sits at the top, wherever it belongs */
    const backs = S.h.filter(it=>it.kind==="back")
      .sort((a,b)=>(a.due?0:1)-(b.due?0:1) || String(a.due||"").localeCompare(String(b.due||"")));
    if(backs.length) html += `<h3 class="sec" style="margin-top:0">Backlog (${backs.length})</h3>`
      + backs.map(it=>hwItemHTML(it,false)).join("");
    const tasks = S.h.filter(it=>it.kind==="task")
      .sort((a,b)=>(a.due?0:1)-(b.due?0:1) || String(a.due||"").localeCompare(String(b.due||"")));
    if(tasks.length) html += `<h3 class="sec"${backs.length?"":' style="margin-top:0"'}>To do (${tasks.length})</h3>`
      + tasks.map(it=>hwItemHTML(it,false)).join("");
    const qItems = S.h.filter(it=>it.kind!=="task" && it.kind!=="back");
    const tree = {};
    qItems.forEach(it=>{
      const r = hwResolve(it);
      const sK = it.s, mK = r.missing ? "?" : String(r.ch.mod), cK = String(it.c);
      ((((tree[sK]=tree[sK]||{})[mK]=tree[sK][mK]||{})[cK]=tree[sK][mK][cK]||[])).push(it);
    });
    if(qItems.length && (tasks.length || backs.length)) html += `<h3 class="sec">Questions</h3>`;
    const tw = k=>`<button class="twisty" data-t="${esc(k)}">${S.closed[k]?"▸":"▾"}</button>`;
    const order = Object.keys(tree).sort((a,b)=>a==="~"?-1:b==="~"?1:0);
    for(const sc of order){
      const sub = sc==="~" ? null : subjOf(sc), sk = "s:"+sc;
      let closed = false;
      if(sc !== "~"){
        html += `<div class="node">${tw(sk)}<span class="lv">Subject</span><span class="nm">${esc(sub?sub.name:"(removed)")}</span></div>`;
        if(S.closed[sk]) continue;
        html += `<div class="branch">`;
        closed = true;
      }
      for(const mk of Object.keys(tree[sc])){
        const mo = sub && sub.modules[mk], mkey = "m:"+sc+":"+mk;
        let mOpen = false;
        if(mk !== "~"){
          html += `<div class="node">${tw(mkey)}<span class="lv">Module</span><span class="nm">${esc(mo?mo.name:"Unknown module")}</span></div>`;
          if(S.closed[mkey]) continue;
          html += `<div class="branch">`; mOpen = true;
        }
        for(const ck of Object.keys(tree[sc][mk])){
          const ch = sc==="~" ? null : chapOf(sc,ck), ckey = "c:"+sc+":"+ck;
          let cOpen = false;
          if(ck !== "~"){
            const cst = ch ? chapterHwStats(sc, ck) : null;
            html += `<div class="node">${tw(ckey)}<span class="lv">Chapter</span><span class="nm">${esc(ch?chTitle(ch):"Chapter "+ck+" (removed)")}</span>
              ${cst&&cst.total?`<span class="rng" style="margin-left:auto">${cst.done}/${cst.total} homework done · ${cst.pct}%</span>`:""}</div>`;
            if(S.closed[ckey]) continue;
            html += `<div class="branch">`; cOpen = true;
          }
          /* anything that is not a question list reads first */
          tree[sc][mk][ck].slice().sort((a,b)=>(b.kind==="task")-(a.kind==="task"))
            .forEach(it=>{ html += hwItemHTML(it,false); });
          if(cOpen) html += `</div>`;
        }
        if(mOpen) html += `</div>`;
      }
      if(closed) html += `</div>`;
    }
  }
  if(S.hd.length){
    const fk = "fin";
    html += `<h3 class="sec"><button class="twisty" data-t="${fk}" style="margin-right:8px">${S.closed[fk]?"▸":"▾"}</button>Finished (${S.hd.length})</h3>`;
    if(!S.closed[fk]) html += S.hd.slice(0,40).map(it=>hwItemHTML(it,true)).join("");
  }
  mount.innerHTML = html;
}
function hwItemHTML(it, finished, showLoc){
  if(it.kind==="back"){
    const st = hwStats(it), r = st.r;
    const tracked = !!r.ex;
    const pct = st.total ? Math.round(st.done/st.total*100) : 0;
    const ds = it.due ? dueState(it.due) : "";
    const where = taskWhere(it);
    const label = it.title || (r.ex ? r.ex.name : "Backlog");
    return `<div class="hwitem ${finished||(!tracked&&it.done)?"fin":""} ${ds==="over"&&!finished?"late":""}">
      <div class="hwhead">
        ${tracked?`<span class="tagx" style="margin:0">Backlog</span>`
                 :`<button class="check ${it.done?"on":""}" data-task="${esc(it.id)}" aria-pressed="${!!it.done}" title="Mark done">✓</button>`}
        ${r.ex?`<a class="loc" href="#/${it.s}/${r.ch.mod}/${it.c}/${it.e}">${esc(label)}</a>`
              :`<span class="loc">${esc(label)}</span>`}
        ${where?`<span class="rng">${esc(where)}</span>`:""}
        ${it.due?`<span class="due ${finished?"":ds}">${esc(prettyDue(it.due))}</span>`:""}
        <span class="prog">${tracked?`${st.total-st.done} of ${st.total} left`:(it.done?"done":"to do")}</span>
        <button class="tbtn" data-hedit="${esc(it.id)}">Edit</button>
        ${finished?`<button class="x" data-restore="${it.id}" title="Put back">↩</button>`:""}
        <button class="x" data-del="${it.id}" title="Remove">×</button></div>
      ${tracked?`<div class="rail"><i style="width:${pct}%"></i></div>`:""}</div>`;
  }
  if(it.kind==="task"){
    const ds = it.due ? dueState(it.due) : "";
    const where = taskWhere(it);
    return `<div class="hwitem ${finished||it.done?"fin":""} ${ds==="over"&&!it.done?"late":""}">
      <div class="hwhead">
        <button class="check ${it.done?"on":""}" data-task="${esc(it.id)}" aria-pressed="${!!it.done}" title="Mark done">✓</button>
        <span class="loc" style="${it.done?"text-decoration:line-through;opacity:.7":""}">${esc(it.title)}</span>
        ${where?`<span class="rng">${esc(where)}</span>`:`<span class="rng">no location</span>`}
        ${it.due?`<span class="due ${finished?"":ds}">${esc(prettyDue(it.due))}</span>`:""}
        <span class="prog">${it.done?"done":"to do"}</span>
        <button class="tbtn" data-hedit="${esc(it.id)}">Edit</button>
        ${finished?`<button class="x" data-restore="${it.id}" title="Put back">↩</button>`:""}
        <button class="x" data-del="${it.id}" title="Remove">×</button></div></div>`;
  }
  const st = hwStats(it), r = st.r;
  if(r.missing) return `<div class="hwitem warnbox"><div class="hwhead">
    <span class="loc">This homework points somewhere that no longer exists</span>
    <button class="x" data-del="${it.id}" title="Remove">×</button></div>
    <div class="warntext">Questions ${esc(it.r)} — the chapter or exercise was removed.</div></div>`;
  const a = S.d[key(it.s,it.c,it.e)]||[];
  const chips = r.list.map(i=>{
    const v = a[i]||0, res = result(v);
    let cls = res===1?"c":res===2?"w":res===3?"x":isDone(v)?"d":"";
    if(hsel.has(qkOf(it,i))) cls += " sel";
    return `<button class="chip ${cls}" data-hw="${it.id}" data-i="${i}" data-qk="${qkOf(it,i)}"
      title="${isFlag(v)?"marked for review · ":""}${stars(v)?stars(v)+"★ · ":""}click to tick, double-click to edit">${i+1}</button>`;
  }).join("");
  const ds = it.due ? dueState(it.due) : "";
  const where = showLoc ? `${esc(subjOf(it.s)?subjOf(it.s).short:it.s)} · ${esc(r.ch.name)} · ` : "";
  return `<div class="hwitem ${finished?"fin":""} ${r.over?"warnbox":""} ${ds==="over"&&!finished?"late":""}">
    <div class="hwhead">
      <a class="loc" href="#/${it.s}/${r.ch.mod}/${it.c}/${it.e}">${where}${esc(r.ex.name)}</a>
      <span class="rng">Q ${esc(it.r)}</span>
      ${it.due?`<span class="due ${finished?"":ds}">${esc(prettyDue(it.due))}</span>`:""}
      ${finished?'<span class="due">finished</span>':""}
      <span class="prog">${st.done}/${st.total} done</span>
      <button class="tbtn" data-hedit="${esc(it.id)}">Edit</button>
      ${finished?`<button class="x" data-restore="${it.id}" title="Put back">↩</button>`:""}
      <button class="x" data-del="${it.id}" title="Remove">×</button></div>
    <div class="chips">${chips}</div>
    ${r.over?`<div class="warntext">${r.over} question${r.over>1?"s":""} in this range no longer exist — ${esc(r.ex.name)} now has ${r.n}.</div>`:""}</div>`;
}

/* toggling one question from a homework chip */
function toggleFromChip(qk){
  const q = splitQk(qk);
  const arr = arrFor(q.s, q.c, q.e, qCount(q.s, chapOf(q.s,q.c), q.e));
  const now = !isDone(arr[q.i]||0);
  arr[q.i] = setDone(arr[q.i]||0, now);
  if(!now){ arr[q.i] = setResult(arr[q.i],0); delete S.r[qk]; }
  bumpStat(q.s, now?1:-1);
  markDirty(); sweepFinishedHomework(); viewHomework(); paintTabs();
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-t]");
  if(t){ S.closed[t.dataset.t] = !S.closed[t.dataset.t]; drawHwTree(); return; }
  const del = e.target.closest("[data-del]");
  if(del){
    snapshot("remove homework");
    S.h = S.h.filter(x=>x.id!==del.dataset.del);
    S.hd = S.hd.filter(x=>x.id!==del.dataset.del);
    markDirty(); viewHomework(); paintTabs(); toastUndo("Homework removed"); return;
  }
  const res = e.target.closest("[data-restore]");
  if(res){
    snapshot("restore homework");
    const it = S.hd.find(x=>x.id===res.dataset.restore);
    if(it){ delete it.fin; it.keep = true; if(it.kind==="task") it.done = false; S.hd = S.hd.filter(x=>x!==it); S.h.push(it); }
    markDirty(); viewHomework(); paintTabs(); toastUndo("Put back into homework"); return;
  }
  const tk = e.target.closest("[data-task]");
  if(tk){
    const it = S.h.concat(S.hd).find(x=>x.id===tk.dataset.task); if(!it) return;
    it.done = !it.done;
    markDirty(); sweepFinishedHomework(); viewHomework(); paintTabs(); return;
  }
  const ed = e.target.closest("[data-hedit]");
  if(ed){ editHomework(ed.dataset.hedit); return; }
  const chip = e.target.closest("[data-hw]");
  if(chip){
    if(hsel.size){ const qk = chip.dataset.qk; hsel.has(qk)?hsel.delete(qk):hsel.add(qk); drawHwTree(); paintSelbar(); return; }
    /* held briefly so a double-click can cancel it and open the editor instead.
       A click on a different chip flushes the waiting one straight away, so
       ticking several chips quickly never drops any of them. */
    const qk = chip.dataset.qk;
    if(pendingTick){
      clearTimeout(pendingTick.timer);
      const prev = pendingTick; pendingTick = null;
      if(prev.qk !== qk) toggleFromChip(prev.qk);
    }
    pendingTick = {qk, timer:setTimeout(()=>{ pendingTick = null; toggleFromChip(qk); }, 230)};
  }
});
document.addEventListener("dblclick", e=>{
  const chip = e.target.closest("[data-hw]"); if(!chip) return;
  if(pendingTick){ clearTimeout(pendingTick.timer); pendingTick = null; }
  openQuestionEditor(chip.dataset.qk);
});

/* change what a homework item covers, and when it is due */
function editHomework(id){
  const it = S.h.concat(S.hd).find(x=>x.id===id); if(!it) return;
  const isQ = !it.kind;
  const r = hwResolve(it);
  const max = isQ && !r.missing ? r.n : 0;
  const label = isQ ? ((r.ex||{}).name || "homework")
              : it.kind==="back" ? (it.title || (r.ex||{}).name || "backlog")
              : it.title;
  onEsc = ()=>{};
  openModal(`<h3>Edit</h3><p>${esc(label)}</p>
    ${isQ?`<div class="block"><div class="blabel">Questions</div>
      <input type="text" id="ehr" value="${esc(it.r)}" placeholder="20-30, or 20-30, 45">
      <div class="hint">This exercise has ${max} questions.</div></div>`
     :`<div class="block"><div class="blabel">Name</div>
      <input type="text" id="ehTitle" value="${esc(it.title||"")}" ${it.kind==="back"&&r.ex?'placeholder="Leave blank to use the exercise name"':""}></div>`}
    <div class="block"><div class="blabel">Due date</div>
      <div class="hwrow">
        <input class="tin" type="date" id="ehDue" value="${esc(it.due||"")}">
        ${it.due?`<button class="tbtn" id="ehClear">Remove the due date</button>`:""}
      </div>
      <div class="hint">${it.due?"":"None set — pick one from the calendar if you want."}</div></div>
    <div class="msg bad" id="ehMsg"></div>
    <div class="acts"><button class="btn" id="ehNo">Cancel</button>
    <button class="btn primary" id="ehYes">Save</button></div>`);
  const clear = modal.querySelector("#ehClear");
  if(clear) clear.onclick = ()=>{ modal.querySelector("#ehDue").value = ""; };
  modal.querySelector("#ehNo").onclick = ()=>{ closeModal(); viewHomework(); };
  modal.querySelector("#ehYes").onclick = ()=>{
    const msg = modal.querySelector("#ehMsg");
    if(isQ){
      const parsed = parseRange(modal.querySelector("#ehr").value, max);
      if(parsed.error){ msg.textContent = parsed.error; return; }
      snapshot("edit homework");
      it.r = toRange(parsed.list);
    } else {
      const t = modal.querySelector("#ehTitle").value.trim();
      if(!t && !(it.kind==="back" && r.ex)){ msg.textContent = "Give it a name."; return; }
      snapshot("edit homework");
      if(t) it.title = t; else delete it.title;
    }
    const due = modal.querySelector("#ehDue").value;
    if(due) it.due = due; else delete it.due;
    delete it.keep;
    markDirty(); closeModal(); sweepFinishedHomework(); viewHomework(); paintTabs(); toastUndo("Homework updated");
  };
}

/* full editor for one question, reachable from homework */

        ${r===2?`<div class="hwrow" style="margin-top:10px">
          <button class="tbtn" id="qWhy">${rec&&rec.t.length?esc(rec.t.map(tagName).join(", ")):"Say what went wrong"}</button></div>`:""}
      </div>

        <div class="hwrow">
          <button class="tbtn ${isDone(v)?"on":""}" data-q="done">${isDone(v)?"Solved":"Not solved"}</button>
          <button class="tbtn ${isFlag(v)?"on":""}" data-q="flag">Retry / review</button>
          <span class="stars" style="margin-left:6px">${[1,2,3].map(k=>`<button class="${stars(v)>=k?"on":""}" data-star="${k}">★</button>`).join("")}</span>
        </div></div>
      <div class="block"><div class="blabel">Note</div>
        <input type="text" id="qNote" value="${esc(S.n[qk]||"")}" placeholder="Add a note">
        <div class="mprev" id="qNotePrev" hidden></div>
        <div class="mhint">${MATH_HINT}</div></div>
      <div class="block"><button class="tbtn" id="qBm">${bmIcon((S.bm[qk]||[]).length)} Save to a collection</button></div>
      <div class="block"><div class="blabel">Collections</div>
        <button class="tbtn" id="qBm">${bmIcon((S.bm[qk]||[]).length)} ${(S.bm[qk]||[]).length?"Saved in "+(S.bm[qk]||[]).length:"Save to a collection"}</button></div>
      <div class="acts"><button class="btn primary" id="qDone">Done</button></div>`);
    modal.querySelectorAll("[data-q]").forEach(b=>b.onclick = ()=>{
      let v = arr[q.i]||0; const was = isDone(v);
      const a = b.dataset.q;
      if(a==="done"){ const now=!isDone(v); v=setDone(v,now); if(!now){ v=setResult(v,0); delete S.r[qk]; } }
      else if(a==="flag") v = setFlag(v,!isFlag(v));
      else{
        const w = Number(a);
        v = w===0 ? setResult(v,0) : setResult(setDone(v, w===3?0:1), w);
        if(w===2) S.r[qk] = S.r[qk]||{d:todayKey(), t:[]}; else delete S.r[qk];
      }
      arr[q.i]=v;
      if(!was && isDone(v)) bumpStat(q.s,1);
      if(was && !isDone(v)) bumpStat(q.s,-1);
      markDirty(); draw();
    });
    modal.querySelectorAll("[data-star]").forEach(b=>b.onclick = ()=>{
      const w = Number(b.dataset.star);
      arr[q.i] = setStars(arr[q.i]||0, stars(arr[q.i]||0)===w?0:w);
      markDirty(); draw();
    });
    wireMathPreview("qNote", "qNotePrev");
    const bmb = modal.querySelector("#qBm");
    if(bmb) bmb.onclick = ()=>openBookmark(qk, draw);
    const why = modal.querySelector("#qWhy");
    if(why) why.onclick = ()=>{ openReasons(qk, draw); };
    modal.querySelector("#qNote").oninput = e=>{
      if(e.target.value) S.n[qk] = e.target.value; else delete S.n[qk];
      markDirty();
    };
    modal.querySelector("#qDone").onclick = ()=>{
      closeModal(); sweepFinishedHomework();
      if(ctx) drawSheet(); else viewHomework();
      paintTabs();
    };
  };
  onEsc = ()=>{ sweepFinishedHomework(); if(ctx) drawSheet(); else viewHomework(); paintTabs(); };
  draw();
}

/* drag across chips */
document.addEventListener("pointerdown", e=>{
  if(ctx) return;
  const chip = e.target.closest("[data-hw]"); if(!chip) return;
  const box = chip.closest(".chips");
  hdrag = {box, anchor:chip.dataset.qk, active:false, timer:null, x:e.clientX, y:e.clientY};
  if(e.pointerType!=="mouse") hdrag.timer = setTimeout(()=>{ if(hdrag) startHDrag(); }, 350);
});
function startHDrag(){
  hdrag.active = true;
  if(pendingTick){ clearTimeout(pendingTick.timer); pendingTick = null; }
  hsel = new Set([hdrag.anchor]);
  hdrag.box.style.touchAction = "none";
  /* paint the chips directly rather than redrawing the tree, which would
     detach the container the drag is tracking */
  hdrag.box.querySelectorAll("[data-hw]").forEach(c=>c.classList.toggle("sel", hsel.has(c.dataset.qk)));
  paintSelbar();
}
function hExtend(x,y){
  const el = document.elementFromPoint(x,y);
  const chip = el && el.closest && el.closest("[data-hw]");
  if(!chip || chip.closest(".chips") !== hdrag.box) return;
  const all = [...hdrag.box.querySelectorAll("[data-hw]")].map(c=>c.dataset.qk);
  const a = all.indexOf(hdrag.anchor), b = all.indexOf(chip.dataset.qk);
  if(a<0||b<0) return;
  const next = new Set(all.slice(Math.min(a,b), Math.max(a,b)+1));
  if(next.size===hsel.size && [...next].every(k=>hsel.has(k))) return;
  hsel = next;
  hdrag.box.querySelectorAll("[data-hw]").forEach(c=>c.classList.toggle("sel", hsel.has(c.dataset.qk)));
  paintSelbar();
}
document.addEventListener("pointermove", e=>{
  if(!hdrag || ctx) return;
  if(!hdrag.active){
    if(Math.abs(e.clientY-hdrag.y)+Math.abs(e.clientX-hdrag.x) < 6) return;
    if(e.pointerType==="mouse" && (e.buttons&1)) startHDrag();
    else { clearTimeout(hdrag.timer); hdrag=null; }
    if(!hdrag||!hdrag.active) return;
  }
  e.preventDefault(); hExtend(e.clientX, e.clientY);
}, {passive:false});
function endHDrag(){
  if(!hdrag) return;
  clearTimeout(hdrag.timer);
  if(hdrag.box) hdrag.box.style.touchAction = "";
  hdrag = null;
}
document.addEventListener("pointerup", endHDrag);
document.addEventListener("pointercancel", endHDrag);

function paintHwBar(bar){
  bar.hidden = false;
  bar.innerHTML = `<span class="n">${hsel.size} selected</span>
    <button class="tbtn" data-s="done">Mark solved</button>
    <button class="tbtn" data-s="correct">Correct</button>
    <button class="tbtn" data-s="wrong">Wrong</button>
    <button class="tbtn" data-s="cant">Stuck</button>
    <button class="tbtn" data-s="flag">Review</button>
    <button class="tbtn" data-s="undone">Not solved</button>
    <button class="tbtn" data-s="unhw">Remove from homework</button>
    <button class="tbtn" data-s="clear">Clear</button>`;
}
function hwBarAction(act){
  if(act==="clear"){ hsel = new Set(); drawHwTree(); paintSelbar(); return; }
  if(act==="unhw"){
    snapshot("remove from homework");
    const n = removeQsFromHomework([...hsel]);
    hsel = new Set(); markDirty(); viewHomework(); paintTabs();
    toastUndo(n ? "Taken out of "+n+" homework list"+(n>1?"s":"") : "None of those were in homework");
    return;
  }
  if(act==="unhw"){
    snapshot("remove from homework");
    const res = removeFromHomework([...hsel]);
    hsel = new Set();
    markDirty(); viewHomework(); paintTabs();
    toastUndo(res.touched+" questions taken out of homework");
    return;
  }
  snapshot(hsel.size+" questions changed");
  [...hsel].forEach(qk=>{
    const q = splitQk(qk);
    const arr = arrFor(q.s,q.c,q.e,qCount(q.s,chapOf(q.s,q.c),q.e));
    let v = arr[q.i]||0; const was = isDone(v);
    if(act==="done") v = setDone(v,1);
    if(act==="undone"){ v = setResult(setDone(v,0),0); delete S.r[qk]; }
    if(act==="correct"){ v = setResult(setDone(v,1),1); delete S.r[qk]; }
    if(act==="wrong"){ v = setResult(setDone(v,1),2); S.r[qk] = S.r[qk]||{d:todayKey(), t:[]}; }
    if(act==="cant"){ v = setResult(setDone(v,0),3); delete S.r[qk]; }
    if(act==="flag") v = setFlag(v,1);
    arr[q.i]=v;
    if(!was && isDone(v)) bumpStat(q.s,1);
    if(was && !isDone(v)) bumpStat(q.s,-1);
  });
  const n = hsel.size;
  hsel = new Set();
  markDirty(); sweepFinishedHomework(); viewHomework(); paintTabs();
  toastUndo(n+" questions updated");
}

/* ============================================================
   12. STUDY LOG
   ============================================================ */
const HARD_STOP = 20*3600;         /* the timer gives up after 20 hours */
const NUDGE = 2*3600;              /* endless mode suggests a break every 2 hours */
/* Elapsed time is read from the clock, never counted in ticks: background tabs
   get their timers throttled, so tick counting loses minutes. acc holds the
   seconds banked before the current run, since is when the current run began. */
const TIMER = {running:false, mode:"focus", endless:false, left:25*60, total:25*60,
               up:0, nudged:0, acc:0, since:null, phaseStart:null,
               act:null, dl:null, tick:null};
function elapsedSec(){
  return Math.floor(TIMER.acc + (TIMER.running && TIMER.since ? (Date.now()-TIMER.since)/1000 : 0));
}
function beginPhase(seconds){
  TIMER.total = seconds; TIMER.acc = 0; TIMER.since = null;
  TIMER.up = 0; TIMER.nudged = 0; TIMER.left = seconds; TIMER.phaseStart = null;
}
function fmtClock(s){
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return h ? h+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")
           : m+":"+String(sec).padStart(2,"0");
}
function activityColor(id){
  const sub = subjOf(id); if(sub) return sub.accent;
  const a = actList().find(a=>a.id===id); if(a) return a.c;
  return id==="sr" ? "#ff5f6d" : "#7aa2ff";
}
function activityName(id){
  const sub = subjOf(id); if(sub) return sub.name;
  const a = actList().find(a=>a.id===id); if(a) return a.n;
  return id==="sr" ? "Speedrun" : "Study";   /* sessions logged before it was removed */
}
function allActivities(){
  return everyActivity().filter(a=>!actHidden(a.id));
}
/* subjects and activities you have hidden stay out of the study log's pickers
   and charts; nothing already logged against them is touched */
function everyActivity(){
  return TREE.order.map(sc=>({id:sc, n:subjOf(sc).name, c:subjOf(sc).accent, kind:"subject"}))
    .concat(actList().map(a=>({id:a.id, n:a.n, c:a.c, kind:"activity",
      custom:(S.x.acts||[]).some(x=>x.id===a.id)})));
}
const actHidden = id => !!((S.x.hideAct||{})[id]);
let audioCtx = null;
function chime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    [880,1320].forEach((f,k)=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      const t0 = audioCtx.currentTime + k*0.18;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0+0.55);
    });
  }catch(e){}
}
function logSession(actId, minutes, dlId, whenMin, speedrun){
  if(!actId || minutes < 1) return;
  const row = [whenMin!==undefined?whenMin:Math.floor(Date.now()/60000) - minutes, minutes, actId];
  if(dlId || speedrun) row.push(dlId||null);
  if(speedrun) row.push(1);
  S.log.push(row); markDirty();
}
/* recompute from the clock; safe to call as often as we like */
function syncTimer(){
  const e = elapsedSec();
  if(TIMER.endless){
    TIMER.up = e; TIMER.left = 0;
    if(!TIMER.running) return;
    if(e >= HARD_STOP){ toast("20 hours — stopping and logging"); stopTimer(); return; }
    if(e - TIMER.nudged >= NUDGE){
      TIMER.nudged = Math.floor(e/NUDGE)*NUDGE;
      if(S.pom.chime!=="never") chime();
      toast("That is "+Math.floor(e/3600)+" hours straight — worth a break");
    }
    return;
  }
  TIMER.up = e;
  TIMER.left = Math.max(0, TIMER.total - e);
  if(TIMER.running && TIMER.left <= 0) phaseEnd();
}
function phaseEnd(){
  const wasFocus = TIMER.mode==="focus";
  const started = TIMER.phaseStart;
  if(wasFocus) logSession(TIMER.act, Math.round(TIMER.total/60), TIMER.dl,
                          started ? Math.floor(started/60000) : undefined);
  const ch = S.pom.chime;
  if(ch==="both" || (wasFocus&&ch==="focus") || (!wasFocus&&ch==="break")) chime();
  TIMER.mode = wasFocus ? "brk" : "focus";
  beginPhase((TIMER.mode==="focus" ? S.pom.focus : S.pom.brk)*60);
  const carryOn = wasFocus ? S.pom.autoBrk : S.pom.autoFocus;
  if(carryOn){ TIMER.since = Date.now(); TIMER.phaseStart = Date.now(); }
  else { TIMER.running = false; clearInterval(TIMER.tick); TIMER.tick = null; }
  if(VIEW.name==="study") viewStudy();
  paintTabs();
  toast(wasFocus ? (carryOn?"Focus done — break started":"Focus done — take a break")
                 : (carryOn?"Break over — focus started":"Break over — back to it"));
}
function timerTick(){ if(!TIMER.running) return; syncTimer(); paintClock(); }
/* coming back to the tab catches up immediately rather than waiting for a tick */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState !== "visible" || !TIMER.running) return;
  syncTimer();
  if(VIEW.name==="study") viewStudy(); else paintClock();
});
window.addEventListener("focus", ()=>{ if(TIMER.running){ syncTimer(); paintClock(); } });
function startTimer(){
  if(!TIMER.act){ toast("Pick what you are studying first"); return; }
  if(TIMER.running) return;
  TIMER.running = true;
  TIMER.since = Date.now();
  if(!TIMER.phaseStart) TIMER.phaseStart = Date.now() - TIMER.acc*1000;
  try{ (audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)()).resume(); }catch(e){}
  clearInterval(TIMER.tick);
  TIMER.tick = setInterval(timerTick, 1000);
  viewStudy(); paintTabs();
}
function pauseTimer(){
  TIMER.acc = elapsedSec(); TIMER.since = null;
  TIMER.running = false; clearInterval(TIMER.tick); TIMER.tick = null;
  viewStudy(); paintTabs();
}
function stopTimer(){
  const spentSec = elapsedSec();
  const spent = Math.round(spentSec/60);
  const wasFocus = TIMER.endless || TIMER.mode==="focus";
  const started = TIMER.phaseStart;
  TIMER.running = false; TIMER.since = null;
  clearInterval(TIMER.tick); TIMER.tick = null;
  if(wasFocus && spent>=1){
    logSession(TIMER.act, spent, TIMER.dl, started ? Math.floor(started/60000) : undefined);
    toast("Logged "+spent+" min");
  }
  TIMER.mode = "focus";
  beginPhase(S.pom.focus*60);
  viewStudy(); paintTabs();
}
function paintClock(){
  syncTimer();
  const el = document.getElementById("clock");
  if(el){
    el.textContent = fmtClock(TIMER.endless ? TIMER.up : TIMER.left);
    const arc = document.getElementById("arc");
    if(arc){
      const c = 2*Math.PI*150;
      const frac = TIMER.endless ? (TIMER.up % NUDGE)/NUDGE : TIMER.left/TIMER.total;
      arc.setAttribute("stroke-dashoffset", c*(1-frac));
    }
  }
  const badge = document.querySelector('.tab[href^="#/study"] .badge');
  if(badge) badge.textContent = fmtClock(TIMER.endless?TIMER.up:TIMER.left);
}
function viewStudy(){
  crumbs([{label:"Home",href:"#/"},{label:"Study log"}]);
  const kind = S.pom.kind || "pomo";
  TIMER.endless = kind==="endless";
  if(kind!=="speed" && !TIMER.running && TIMER.acc===0 && TIMER.mode==="focus" && TIMER.total!==S.pom.focus*60 && !TIMER.endless)
    beginPhase(S.pom.focus*60);
  if(kind!=="speed") syncTimer();
  const today = S.log.filter(l=>dayKey(new Date(l[0]*60000))===todayKey()).reduce((a,l)=>a+l[1],0);
  const dueHw = S.h.filter(h=>h.due).sort((a,b)=>a.due<b.due?-1:1);
  const modeLabel = kind==="speed" ? "Speedrun" : kind==="endless" ? "Endless" : "Pomodoro";

  const modeBar = `<div class="toolbar" style="margin-bottom:16px">

      <button class="tbtn ${kind==="pomo"?"on":""}" data-kind="pomo">Pomodoro</button>
      <button class="tbtn ${kind==="endless"?"on":""}" data-kind="endless">Endless</button>
      <button class="tbtn ${kind==="speed"?"on":""}" data-kind="speed">Speedrun</button>
    </div>
    <span class="spacer"></span>
    <button class="tbtn" id="mgAct">Subjects &amp; activities</button>
    ${kind!=="speed"?`<button class="tbtn" id="tSet">⚙ Settings</button>`:""}
  </div>`;

  let body;
  if(kind === "speed"){
    const sr = TIMER.sr;
    body = sr.phase==="setup" ? srSetupHTML() : sr.phase==="ready" ? srReadyHTML() : srRunHTML();
  } else {
    const c = 2*Math.PI*150;
    const col = TIMER.mode==="focus" ? (TIMER.act?activityColor(TIMER.act):"var(--accent)") : "var(--ok)";
    const frac = TIMER.endless ? (TIMER.up % NUDGE)/NUDGE : TIMER.left/TIMER.total;
    const live = S.dl.filter(d=>d.date >= todayKey() && !d.hidden).sort((a,b)=>a.date<b.date?-1:1);
    body = `<div class="panel">
      <div class="timerwrap">
        <div class="ring"><svg width="330" height="330" viewBox="0 0 330 330">
          <circle cx="165" cy="165" r="150" fill="none" stroke="var(--ink-3)" stroke-width="14"/>
          <circle id="arc" cx="165" cy="165" r="150" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="${c}" stroke-dashoffset="${c*(1-frac)}"/></svg>
          <div class="mid"><div><div class="clock ${TIMER.mode==="focus"?"":"brk"}" id="clock">${fmtClock(TIMER.endless?TIMER.up:TIMER.left)}</div>
            <div class="lbl">${TIMER.endless?"Endless":(TIMER.mode==="focus"?"Focus":"Break")}${TIMER.act?" · "+esc(activityName(TIMER.act)):""}</div></div></div></div>
        <div style="flex:1;min-width:260px">
          <div class="blabel">What are you studying?</div>
          <div class="acts">${allActivities().map(a=>`<button class="actbtn ${TIMER.act===a.id?"on":""}" data-act-pick="${esc(a.id)}">
            <i style="background:${a.c}"></i>${esc(a.n)}</button>`).join("")}
            <button class="actbtn" id="addAct">+ Add</button></div>
          ${live.length?`<div class="blabel" style="margin-top:16px">Working towards</div>
            <div class="acts">${live.map(d=>`<button class="actbtn ${TIMER.dl===d.id?"on":""}" data-dl-pick="${esc(d.id)}">
              <i style="background:var(--flag)"></i>${esc(d.name)}</button>`).join("")}
              ${TIMER.dl?`<button class="actbtn" data-dl-pick="">Clear</button>`:""}</div>`:""}
          <div class="hwrow" style="margin-top:20px">
            ${TIMER.running?`<button class="btn" id="tPause">Pause</button>`
                           :`<button class="btn primary" id="tStart">${TIMER.acc>0?"Resume":"Start"}</button>`}
            <button class="btn" id="tStop">Stop &amp; log</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  app.innerHTML = recBanner() + `<div class="pagehead"><div class="eyebrow">Study log</div><h1>Focus timer</h1>
      <div class="stats"><span><span class="k">today</span> <b>${today}</b> min</span>
      <span><span class="k">sessions</span> <b>${S.log.length}</b></span>
      <span><span class="k">mode</span> <b>${modeLabel}</b></span></div></div>
    ${modeBar}${body}
    <h3 class="sec">Homework with a due date</h3>
    ${dueHw.length ? dueHw.map(it=>{
        const st = hwStats(it), r = st.r; if(r.missing) return "";
        if(it.kind==="task") return `<div class="hwitem ${dueState(it.due)==="over"?"late":""}"><div class="hwhead">
          <span class="loc">${esc(it.title)}</span>
          <span class="rng">${esc(taskWhere(it)||"task")}</span>

          <span class="prog">${it.done?"done":"to do"}</span></div></div>`;
        return `<div class="hwitem ${dueState(it.due)==="over"?"late":""}"><div class="hwhead">

          <span class="rng">Q ${esc(it.r)}</span>

      : `<div class="empty">No homework has a due date yet. Add one from the Homework tab.</div>`}`;

  document.querySelectorAll("[data-kind]").forEach(b=>b.onclick = ()=>{
    if(TIMER.running || TIMER.sr.phase!=="setup"){ toast("Stop the current session first"); return; }
    S.pom.kind = b.dataset.kind; markDirty();

    const sr = TIMER.sr;

let statView = {mode:"month", anchor:new Date(), from:"", to:"", dl:"",
  heat:{days:30, subs:null, metric:"time"}, line:{days:30, hidden:new Set(), dl:"", metric:"time"},
  spider:{mode:"subjects", subj:"", chapters:null, metric:"pct", subs:null},
  scatter:{subs:null, min:5}, chap:{subs:null},
  cmp:{aMode:"dates", aFrom:"", aTo:"", aDl:"", bMode:"prev", bFrom:"", bTo:"", bDl:""}};
function periodRange(){
  const a = new Date(statView.anchor); a.setHours(0,0,0,0);
  if(statView.mode==="day") return {from:a, to:a, label:a.toDateString()};
  if(statView.mode==="week"){
    const s = new Date(a); s.setDate(a.getDate()-((a.getDay()+6)%7));
    const e = new Date(s); e.setDate(s.getDate()+6);
    return {from:s, to:e, label:"Week of "+s.toDateString()};
  }
  if(statView.mode==="range"){
    const f = statView.from ? new Date(statView.from+"T00:00:00") : a;
    const t = statView.to ? new Date(statView.to+"T00:00:00") : a;
    return f<=t ? {from:f, to:t, label:dayKey(f)+" to "+dayKey(t)}
                : {from:t, to:f, label:dayKey(t)+" to "+dayKey(f)};
  }
  if(statView.mode==="deadline") return deadlineRange(statView.dl, a);
  const s = new Date(a.getFullYear(), a.getMonth(), 1), e = new Date(a.getFullYear(), a.getMonth()+1, 0);
  return {from:s, to:e, label:s.toLocaleString(undefined,{month:"long", year:"numeric"})};
}
function dlStart(d){ return d.start || d.made || d.date; }
function deadlineRange(id, fallback){
  const a = fallback || new Date();
  const d = S.dl.find(x=>x.id===id);
  if(!d) return {from:a, to:a, label:"No deadline chosen"};
  const f = new Date(dlStart(d)+"T00:00:00");
  let t = new Date(d.date+"T00:00:00");
  if(t < f) t = f;
  return {from:f, to:t, label:d.name, subs:d.subs&&d.subs.length?new Set(d.subs):null, dlId:id};
}
/* the equivalent stretch immediately before this one, for change-over-time */
function prevRange(R, mode){
  if(mode==="month"){
    const f = new Date(R.from); f.setMonth(f.getMonth()-1);
    return {from:new Date(f.getFullYear(),f.getMonth(),1), to:new Date(f.getFullYear(),f.getMonth()+1,0)};
  }
  const days = Math.round((R.to-R.from)/86400000)+1;
  const t = new Date(R.from); t.setDate(t.getDate()-1);
  const f = new Date(t); f.setDate(t.getDate()-days+1);
  return {from:f, to:t};
}
const inRange = (k,from,to) => k >= dayKey(from) && k <= dayKey(to);
/* the first day anything at all was recorded */
function firstEntryDay(){
  let best = null;
  S.log.forEach(l=>{ const k = dayKey(new Date(l[0]*60000)); if(!best || k < best) best = k; });
  Object.keys(S.stat).forEach(k=>{ if(!best || k < best) best = k; });
  Object.keys(S.r).forEach(qk=>{ const d = S.r[qk].d; if(d && (!best || d < best)) best = d; });
  return best;
}
/* averages should not be spread over days that predate the app */
function clampFrom(from){
  const f = firstEntryDay(); if(!f) return from;
  const fd = new Date(f+"T00:00:00");
  return from < fd ? fd : from;
}
/* averages should not be diluted by days before you ever opened the app */
function firstDataDay(){
  let first = null;
  const see = k => { if(k && (!first || k < first)) first = k; };
  S.log.forEach(l=>see(dayKey(new Date(l[0]*60000))));
  Object.keys(S.stat).forEach(see);
  Object.keys(S.r).forEach(qk=>see(S.r[qk].d));
  return first;
}

/* one place that turns a date range into numbers, shared by Statistics and Goals */
function computeMetrics(from, to, subs, dlId){
  const mins = {};
  const sessions = S.log.filter(l=>{
    if(subs && !subs.has(l[2]) && !(dlId && l[3]===dlId)) return false;
    return inRange(dayKey(new Date(l[0]*60000)), from, to);
  });
  sessions.forEach(l=>{ mins[l[2]] = (mins[l[2]]||0) + l[1]; });
  const solved = {};
  Object.keys(S.stat).forEach(k=>{ if(!inRange(k,from,to)) return;
    Object.keys(S.stat[k]).forEach(s=>{ if(subs && !subs.has(s)) return; solved[s]=(solved[s]||0)+S.stat[k][s]; }); });
  const wrongTags = {}; let wrongCount = 0;
  Object.keys(S.r).forEach(qk=>{
    const rec = S.r[qk];
    if(!rec.d || !inRange(rec.d,from,to)) return;
    if(subs && !subs.has(qk[0])) return;
    wrongCount++;
    if(!rec.t.length) wrongTags["__none"]=(wrongTags["__none"]||0)+1;
    rec.t.forEach(t=>wrongTags[t]=(wrongTags[t]||0)+1);
  });
  const totalMin = Object.values(mins).reduce((a,b)=>a+b,0);
  const totalQ = Object.values(solved).reduce((a,b)=>a+b,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const endReal = to > today ? today : to;
  const first = firstDataDay();
  let startReal = from;
  if(first){ const f = new Date(first+"T00:00:00"); if(f > startReal) startReal = f; }
  const spanDays = Math.max(1, Math.round((endReal-startReal)/86400000)+1);
  const dayHas = {};
  sessions.forEach(l=>{ dayHas[dayKey(new Date(l[0]*60000))] = true; });
  return {mins, solved, sessions, totalMin, totalQ, wrongCount, wrongTags, spanDays,
          activeDays: Object.keys(dayHas).length,
          longest: sessions.reduce((m,l)=>Math.max(m,l[1]),0),
          avgSession: sessions.length ? Math.round(totalMin/sessions.length) : 0,
          missRate: totalQ ? Math.round(wrongCount/totalQ*1000)/10 : 0};
}
const hm = m => Math.floor(m/60)+"h "+Math.round(m%60)+"m";
function minutesByDay(subs){
  const m = {};
  S.log.forEach(l=>{
    if(subs && !subs.has(l[2]) && !(l[3] && l[3]===statView.dl)) return;
    const k = dayKey(new Date(l[0]*60000));
    (m[k] = m[k]||{})[l[2]] = (m[k][l[2]]||0) + l[1];
  });
  return m;
}
function arcPath(cx,cy,r,a0,a1){
  const p = a=>[cx+r*Math.cos(a), cy+r*Math.sin(a)];
  const [x0,y0]=p(a0), [x1,y1]=p(a1);
  return `M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1} Z`;
}
function bars(data, unit){
  if(!data.length) return `<div class="empty" style="padding:18px">Nothing recorded in this period.</div>`;
  const max = Math.max.apply(null, data.map(d=>d.v)) || 1;
  return `<div class="chartrow"><div class="lg" style="width:100%">${data.map(d=>`
    <div style="display:block">
      <div style="display:flex;align-items:center;gap:8px"><i style="background:${d.c}"></i>${esc(d.n)}<b>${d.v}${unit||""}</b></div>
      <div class="rail" style="margin-top:5px"><i style="width:${Math.round(d.v/max*100)}%;background:${d.c}"></i></div>
    </div>`).join("")}</div></div>`;
}
function pie(data, size, unit){
  const shown = data.filter(d=>d.v > 0);
  const total = shown.reduce((a,d)=>a+d.v,0);
  if(!total) return `<div class="empty" style="padding:18px">Nothing recorded in this period.</div>`;
  const r = size/2 - 2;
  let body;
  if(shown.length === 1){
    /* a single slice is the whole circle — an arc from a point back to itself
       draws nothing, so use a plain circle instead */
    body = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="${shown[0].c}"/>`;
  } else {
    let a0 = -Math.PI/2; body = "";
    shown.forEach(d=>{
      const a1 = a0 + (d.v/total)*Math.PI*2;
      body += `<path d="${arcPath(size/2,size/2,r,a0,a1)}" fill="${d.c}" stroke="var(--ink-2)" stroke-width="2"/>`;
      a0 = a1;
    });
  }
  const hole = size*0.28;
  return `<div class="chartrow">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">${body}
      <circle cx="${size/2}" cy="${size/2}" r="${hole}" fill="var(--ink-2)"/>
      <text x="${size/2}" y="${size/2+5}" text-anchor="middle" fill="var(--text)" font-size="15" font-family="ui-monospace,monospace">${total}${unit||""}</text></svg>
    <div class="lg">${shown.map(d=>`<div><i style="background:${d.c}"></i>${esc(d.n)}<b>${d.v}${unit||""} · ${Math.round(d.v/total*100)}%</b></div>`).join("")}</div></div>`;
}

  app.querySelectorAll("[data-dldel]").forEach(b=>b.onclick = async ()=>{
    const d = S.dl.find(x=>x.id===b.dataset.dldel);
    if(!await ask("Delete "+d.name+"?","The deadline goes and stops appearing in the study log and in Add a session. Every hour logged towards it stays exactly where it is.","Delete",true)) return;
    snapshot("delete deadline");
    S.dl = S.dl.filter(x=>x.id!==d.id);

       that no longer exists */
    S.log.forEach(l=>{ if(l[3]===d.id) l[3] = null; });
    if(TIMER.dl===d.id) TIMER.dl = null;
    if(statView.line.dl===d.id) statView.line.dl = "";
    if(goalView.dl===d.id) goalView.dl = "";
    if(statView.dl===d.id){ statView.dl=""; statView.mode="month"; }
    markDirty(); viewStats(); toastUndo("Deadline deleted"); });
  app.querySelectorAll("[data-dlstats]").forEach(b=>b.onclick = ()=>{

  app.querySelectorAll("[data-dlfin]").forEach(b=>b.onclick = ()=>{

  wireHeatmap(); wireLineGraph(); wireSpider();
}

/* ============================================================
   24. STUDY HEATMAP
   ============================================================ */
function heatmapDays(){
  const chosen = statView.heat.subs || new Set(allActivities().map(a=>a.id));
  const n = Math.max(7, Math.min(365, statView.heat.days||30));
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const k = dayKey(d);
    let mins = 0;
    if(statView.heat.metric==="q"){
      /* questions solved that day, per subject, from the daily tally */
      const rec = S.stat[k] || {};
      Object.keys(rec).forEach(sc=>{ if(chosen.has(sc)) mins += rec[sc]; });
    } else {
      S.log.forEach(l=>{ if(chosen.has(l[2]) && dayKey(new Date(l[0]*60000))===k) mins += l[1]; });
    }
    days.push({k, d, mins});
  }
  return days;
}
/* bright green for the most-studied days in the period, fading through to
   bright red for the least — a plain hollow cell means nothing at all */
function heatColor(mins, max){
  if(mins<=0) return "var(--ink-3)";
  const frac = max ? Math.max(0, Math.min(1, mins/max)) : 0;
  const red=[255,80,90], green=[58,214,140];
  const mix = k => Math.round(red[k] + (green[k]-red[k])*frac);
  return `rgb(${mix(0)},${mix(1)},${mix(2)})`;
}
function heatmapHTML(){
  const days = heatmapDays();
  const max = Math.max(1, ...days.map(d=>d.mins));
  const first = days[0].d;
  const lead = (first.getDay()+6)%7;
  const cells = new Array(lead).fill(null).concat(days);
  const weeks = [];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  const dows = ["M","T","W","T","F","S","S"];
  let grid = `<div style="display:flex;gap:3px;overflow-x:auto;padding-bottom:6px">
    <div style="display:flex;flex-direction:column;gap:3px;margin-right:3px">${dows.map(d=>
      `<div style="height:15px;font-family:var(--mono);font-size:9px;color:var(--text-3);display:flex;align-items:center">${d}</div>`).join("")}</div>`;
  weeks.forEach(week=>{
    grid += `<div style="display:flex;flex-direction:column;gap:3px">`;
    week.forEach(day=>{
      grid += !day ? `<div style="width:15px;height:15px"></div>`
        : `<div style="width:15px;height:15px;border-radius:3px;background:${heatColor(day.mins,max)}" title="${day.k} · ${day.mins}${statView.heat.metric==="q"?" questions":" min"}"></div>`;
    });
    grid += `</div>`;
  });
  grid += `</div>`;
  const acts = statView.heat.metric==="q" ? allActivities().filter(a=>subjOf(a.id)) : allActivities();
  const chosen = statView.heat.subs || new Set(allActivities().map(a=>a.id));
  return `<div class="panel">
    <div class="hwrow" style="margin-bottom:14px">
      <span class="blabel" style="margin:0">Last</span>
      <input class="numin" type="number" id="heatDays" min="7" max="365" value="${statView.heat.days}">
      <span class="blabel" style="margin:0">days</span>
      <span class="spacer"></span>
      <button class="tbtn ${statView.heat.metric==="time"?"on":""}" data-heatmetric="time">Time studied</button>
      <button class="tbtn ${statView.heat.metric==="q"?"on":""}" data-heatmetric="q">Questions done</button></div>
    <div class="hwrow" style="margin-bottom:16px;flex-wrap:wrap">${acts.map(a=>`
      <button class="actbtn ${chosen.has(a.id)?"on":""}" data-heatsub="${esc(a.id)}"><i style="background:${a.c}"></i>${esc(a.n)}</button>`).join("")}</div>
    ${grid}
    <div class="legend" style="margin-top:12px">
      <span>less</span>
      ${[0,0.25,0.5,0.75,1].map(f=>`<i style="background:${heatColor(f||0.001, 1)};width:12px;height:12px"></i>`).join("")}
      <span>more</span></div>
  </div>`;
}

/* ============================================================
   25. STUDY TIME LINE GRAPH — smooth, per-subject, toggleable
   ============================================================ */
/* Catmull-Rom through the points, turned into cubic bezier segments so
   the line reads as a smooth curve instead of straight joins */
function smoothPath(pts){
  if(pts.length<2) return "";
  if(pts.length===2) return `M ${pts[0].x} ${pts[0].y} L ${pts[1].x} ${pts[1].y}`;
  let d = `M ${pts[0].x} ${pts[0].y} `;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d += `C ${c1x} ${c1y} ${c2x} ${c2y} ${p2.x} ${p2.y} `;
  }
  return d;
}
function lineGraphData(){
  const dlObj = statView.line.dl ? S.dl.find(d=>d.id===statView.line.dl) : null;
  let from, to = new Date(); to.setHours(0,0,0,0);
  if(dlObj){
    from = new Date(dlStart(dlObj)+"T00:00:00");
    const end = new Date(dlObj.date+"T00:00:00");
    if(end < to) to = end;
    if(to < from) to = from;
  } else {
    const days = Math.max(2, Math.min(180, statView.line.days||30));
    from = new Date(to); from.setDate(to.getDate()-(days-1));
  }
  const cap = Math.min(180, Math.max(2, Math.round((to-from)/86400000)+1));
  const subs = dlObj && dlObj.subs && dlObj.subs.length ? new Set(dlObj.subs) : null;
  const labels = [], perAct = {}, total = [];
  for(let i=0;i<cap;i++){
    const d = new Date(from); d.setDate(from.getDate()+i);
    const k = dayKey(d);
    labels.push(k);
    let dayTotal = 0;
    if(statView.line.metric==="q"){
      const rec = S.stat[k] || {};
      Object.keys(rec).forEach(sc=>{
        if(dlObj && subs && !subs.has(sc)) return;
        perAct[sc] = perAct[sc] || new Array(cap).fill(0);
        perAct[sc][i] += rec[sc];
        dayTotal += rec[sc];
      });
    } else {
      S.log.forEach(l=>{
        if(dayKey(new Date(l[0]*60000))!==k) return;
        if(dlObj){ const match = (subs && subs.has(l[2])) || l[3]===dlObj.id; if(!match) return; }
        perAct[l[2]] = perAct[l[2]] || new Array(cap).fill(0);
        perAct[l[2]][i] += l[1];
        dayTotal += l[1];
      });
    }
    total.push(dayTotal);
  }
  return {labels, perAct, total};
}
function lineGraphHTML(){
  const {labels, perAct, total} = lineGraphData();
  const W=760, H=260, padL=44, padR=14, padT=14, padB=32;
  const maxV = Math.max(1, ...total, ...Object.values(perAct).reduce((a,v)=>a.concat(v),[]));
  const x = i => padL + (labels.length<2?0:i/(labels.length-1))*(W-padL-padR);
  const y = v => padT + (1-v/maxV)*(H-padT-padB);
  const series = [{id:"__total", n:"Total", c:"var(--accent)", vals:total}]
    .concat(Object.keys(perAct).map(id=>({id, n:activityName(id), c:activityColor(id), vals:perAct[id]})));
  const hidden = statView.line.hidden;
  const live = series.filter(s=>!hidden.has(s.id));
  const paths = live.map(s=>{
    const pts = s.vals.map((v,i)=>({x:x(i), y:y(v)}));
    return `<path d="${smoothPath(pts)}" fill="none" stroke="${s.c}" stroke-width="${s.id==="__total"?3:2}" stroke-linecap="round" opacity="${s.id==="__total"?1:0.85}"/>`;
  }).join("");
  /* a dot on every day of every line you can click for that day in full */
  const unit = statView.line.metric==="q" ? "questions" : "minutes";
  const dots = live.map(s=>s.vals.map((v,i)=>
    `<circle cx="${x(i)}" cy="${y(v)}" r="${s.id==="__total"?3.5:2.8}" fill="${s.c}" stroke="var(--ink-2)" stroke-width="1"
      data-lineday="${esc(labels[i])}" style="cursor:pointer"><title>${esc(labels[i])} · ${esc(s.n)}: ${v} ${unit} — click for the day</title></circle>`).join("")).join("");
  const ticks = [0,0.25,0.5,0.75,1].map(f=>Math.round(maxV*f));
  const every = Math.max(1, Math.ceil(labels.length/6));
  const liveDl = S.dl.filter(d=>!d.hidden);
  return `<div class="panel">
    <div class="hwrow" style="margin-bottom:10px;flex-wrap:wrap">
      <span class="blabel" style="margin:0">Last</span>
      <input class="numin" type="number" id="lineDays" min="2" max="180" value="${statView.line.days}" ${statView.line.dl?"disabled":""}>
      <span class="blabel" style="margin:0">days</span>
      ${liveDl.length?`<span class="blabel" style="margin:0">or for</span>
        <select id="lineDl"><option value="">— pick a deadline —</option>${liveDl.map(d=>`<option value="${esc(d.id)}"${statView.line.dl===d.id?" selected":""}>${esc(d.name)}</option>`).join("")}</select>`:""}
      <span class="spacer"></span>
      <button class="tbtn ${statView.line.metric==="time"?"on":""}" data-linemetric="time">Time studied</button>
      <button class="tbtn ${statView.line.metric==="q"?"on":""}" data-linemetric="q">Questions done</button>
    </div>
    <div class="hwrow" style="margin-bottom:12px;flex-wrap:wrap">${series.map(s=>`
      <button class="actbtn ${hidden.has(s.id)?"":"on"}" data-lineseries="${esc(s.id)}" style="${hidden.has(s.id)?"opacity:.45":""}"><i style="background:${s.c}"></i>${esc(s.n)}</button>`).join("")}</div>
    ${labels.length<2 ? `<div class="empty">Not enough days in range.</div>` : `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${ticks.map(t=>`<line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--rule-soft)"/>
        <text x="${padL-8}" y="${y(t)+4}" text-anchor="end" fill="var(--text-3)" font-size="10" font-family="ui-monospace,monospace">${t}</text>`).join("")}
      ${paths}${dots}
      ${labels.map((l,i)=>i%every?"":`<text x="${x(i)}" y="${H-padB+18}" text-anchor="middle" fill="var(--text-3)" font-size="10" font-family="ui-monospace,monospace">${l.slice(5)}</text>`).join("")}
    </svg>`}
  </div>`;
}
function wireLineGraph(){

/* everything one day holds, from a point on the line */
function dayDetail(k){
  const sessions = S.log.filter(l=>dayKey(new Date(l[0]*60000))===k).sort((a,b)=>a[0]-b[0]);
  const mins = {};
  sessions.forEach(l=>{ mins[l[2]] = (mins[l[2]]||0) + l[1]; });
  const rec = S.stat[k] || {};
  const total = sessions.reduce((a,l)=>a+l[1],0);
  const qTotal = Object.values(rec).reduce((a,b)=>a+b,0);
  const hhmm = d => d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  const bar = (n,c,v,max) => `<div class="opt" style="cursor:default;align-items:center">
      <span style="flex:1">${esc(n)}</span>
      <span class="rail" style="flex:2;margin:0 10px"><i style="width:${max?Math.round(v/max*100):0}%;background:${c}"></i></span>
      <b style="font-family:var(--mono)">${v}</b></div>`;
  const maxMin = Math.max(1, ...Object.values(mins));
  const maxQ = Math.max(1, ...Object.values(rec));
  onEsc = ()=>{};
  openModal(`<h3>${esc(new Date(k+"T00:00:00").toDateString())}</h3>
    <div class="block"><div class="stats" style="margin:0">
      <span><span class="k">time</span> <b>${Math.floor(total/60)}h ${total%60}m</b></span>
      <span><span class="k">questions</span> <b>${qTotal}</b></span>
      <span><span class="k">sessions</span> <b>${sessions.length}</b></span>
    </div></div>
    ${Object.keys(mins).length?`<div class="block"><div class="blabel">Minutes by activity</div><div class="opts">
      ${Object.keys(mins).sort((a,b)=>mins[b]-mins[a]).map(a=>bar(activityName(a), activityColor(a), mins[a], maxMin)).join("")}</div></div>`:""}
    ${Object.keys(rec).length?`<div class="block"><div class="blabel">Questions by subject</div><div class="opts">
      ${Object.keys(rec).sort((a,b)=>rec[b]-rec[a]).map(sc=>bar(subjOf(sc)?subjOf(sc).name:sc, activityColor(sc), rec[sc], maxQ)).join("")}</div></div>`:""}
    ${sessions.length?`<div class="block" style="max-height:240px;overflow:auto"><div class="blabel">Sessions</div>
      <div class="opts">${sessions.map(l=>{ const st=new Date(l[0]*60000), en=new Date((l[0]+l[1])*60000);
        const d = l[3] && S.dl.find(x=>x.id===l[3]);
        return `<div class="opt" style="cursor:default"><span style="flex:1">${hhmm(st)} – ${hhmm(en)} · ${esc(activityName(l[2]))}${d?" · "+esc(d.name):""}</span><b>${l[1]}m</b></div>`;
      }).join("")}</div></div>`:`<div class="empty">Nothing logged on this day.</div>`}
    <div class="acts"><button class="btn" id="ddOpen">Open this day in the log</button>
      <button class="btn primary" id="ddDone">Close</button></div>`);
  modal.querySelector("#ddDone").onclick = closeModal;
  modal.querySelector("#ddOpen").onclick = ()=>{
    closeModal(); statView.anchor = new Date(k+"T00:00:00"); statView.mode = "day"; viewStats();
  };
}

/* ============================================================
   25b. THE SECTIONS OF THE STATISTICS PAGE — which are shown, in what order
   ============================================================ */
const STAT_SECTIONS = ["kpi","time","perday","qsolved","wrong","heat","line","spider","scatter","compare","chapters"];
function statOrder(){
  const saved = (S.x.secOrder||[]).filter(id=>STAT_SECTIONS.includes(id));
  return saved.concat(STAT_SECTIONS.filter(id=>!saved.includes(id)));
}
const secHidden = id => !!((S.x.secHide||{})[id]);
function statSectionsHTML(SEC){
  return statOrder().filter(id=>SEC[id] && !secHidden(id)).map(id=>
    (id==="kpi" ? "" : `<h3 class="sec">${esc(SEC[id].name)}</h3>`) + SEC[id].html).join("");
}
function openSectionManager(){
  onEsc = ()=>viewStats();
  const draw = ()=>{
    const order = statOrder();
    const rows = order.map((id,i)=>{
      const off = secHidden(id);
      const name = SECTION_NAMES[id] || id;
      return `<div class="opt" style="align-items:center;cursor:default">
        <span data-secshow="${esc(id)}" role="checkbox" tabindex="0" style="display:flex;align-items:center;gap:9px;flex:1;cursor:pointer;${off?"opacity:.5":""}">
          <span class="bx" style="border-color:${off?"var(--rule)":"var(--ok)"};background:${off?"transparent":"var(--ok)"};color:${off?"transparent":"#04220f"}">✓</span>
          <span>${esc(name)}</span></span>
        <button class="pen" data-secup="${esc(id)}" ${i===0?"disabled":""} title="Move up">▲</button>
        <button class="pen" data-secdown="${esc(id)}" ${i===order.length-1?"disabled":""} title="Move down">▼</button>
      </div>`;
    }).join("");
    paintModal("secmg", `<h3>Graphs on this page</h3>
      <p>Untick anything you do not want to see — it can be ticked back on here at any time — and use the arrows to put them in the order you want. Everything above the calendar stays where it is.</p>
      <div class="block" style="max-height:360px;overflow:auto"><div class="opts">${rows}</div></div>
      <div class="acts"><button class="btn" id="smReset">Back to default order</button>
        <button class="btn primary" id="smDone">Done</button></div>`);
    modal.querySelectorAll("[data-secshow]").forEach(el=>{
      const toggle = ()=>{
        const id = el.dataset.secshow;
        if(secHidden(id)) delete S.x.secHide[id]; else S.x.secHide[id] = true;
        markDirty(); draw();
      };
      el.onclick = toggle;
      el.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } };
    });
    const move = (id, by)=>{
      const cur = statOrder();
      const i = cur.indexOf(id), j = i + by;
      if(i<0 || j<0 || j>=cur.length) return;
      cur.splice(j, 0, cur.splice(i,1)[0]);
      S.x.secOrder = cur; markDirty(); draw();
    };
    modal.querySelectorAll("[data-secup]").forEach(b=>b.onclick = ()=>move(b.dataset.secup, -1));
    modal.querySelectorAll("[data-secdown]").forEach(b=>b.onclick = ()=>move(b.dataset.secdown, 1));
    modal.querySelector("#smReset").onclick = ()=>{ S.x.secOrder = []; S.x.secHide = {}; markDirty(); draw(); };
    modal.querySelector("#smDone").onclick = ()=>{ closeModal(); viewStats(); };
  };
  draw();
}
const SECTION_NAMES = {kpi:"The numbers", time:"Time studied, by subject",
  perday:"Average minutes per day, by subject", qsolved:"Questions solved, by subject",
  wrong:"What went wrong", heat:"Study heatmap", line:"Study time over time",
  spider:"Syllabus covered", scatter:"Completion against accuracy",
  compare:"Period comparison", chapters:"Chapter wise analysis"};

/* ============================================================
   25c. COMPLETION AGAINST ACCURACY — one dot per chapter
   ============================================================ */
function chapterRows(){
  const out = [];
  TREE.order.forEach(sc=>{
    allChapters(sc).forEach(ch=>{
      const st = chapStats(sc, ch);
      if(!st.done) return;
      const mo = subjOf(sc).modules[ch.mod];
      out.push({sc, no:ch.no, ch, st, mod: mo?mo.name:"", c:subjOf(sc).accent,
                done:pct(st), acc: acc(st)===null ? 0 : acc(st), attempts: st.correct+st.wrong});
    });
  });
  return out;
}
function scatterHTML(){
  const shown = statView.scatter.subs;
  const min = statView.scatter.min;
  const rows = chapterRows().filter(r=>(!shown || shown.includes(r.sc)) && r.st.done >= min);
  const W=760, H=460, padL=54, padR=20, padT=18, padB=48;
  const x = v => padL + v/100*(W-padL-padR);
  const y = v => padT + (1-v/100)*(H-padT-padB);
  const grid = [0,25,50,75,100].map(v=>`
    <line x1="${x(v)}" x2="${x(v)}" y1="${padT}" y2="${H-padB}" stroke="var(--rule-soft)"/>
    <line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule-soft)"/>

      <span class="blabel" style="margin:0">at least</span>
      <input class="numin" type="number" id="scatMin" min="1" max="500" value="${min}">
      <span class="blabel" style="margin:0">questions done</span>
    </div>
    ${rows.length ? `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${grid}
      <line x1="${padL}" x2="${W-padR}" y1="${y(50)}" y2="${y(50)}" stroke="var(--rule)" stroke-dasharray="4 4"/>
      <line x1="${x(50)}" x2="${x(50)}" y1="${padT}" y2="${H-padB}" stroke="var(--rule)" stroke-dasharray="4 4"/>
