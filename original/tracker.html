.rscore{ font-size:12.5px; font-variant-numeric:tabular-nums; width:34px; text-align:right; }
.queue{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px; }
.qday{ flex:none; min-width:190px; max-width:240px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:rgba(12,17,30,.7); }
.qday h4{ margin:0 0 6px; font-size:13px; font-weight:500; color:var(--mute); }
.qday h4.today{ color:var(--rev); }
.qday .qi{ font-size:13.5px; display:flex; gap:7px; align-items:center; padding:2px 0; }

/* ---------- time grid ---------- */
.cal-nav{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.cal-nav h2{ margin:0 8px 0 4px; font-size:18px; font-weight:600; }
.tg{ --h:46px; border:1px solid var(--line); border-radius:var(--r2); background:rgba(10,15,27,.8); overflow:hidden; }
.tg-scroll{ overflow:auto; max-height:calc(100vh - 230px); min-height:380px; }
.tg-head{ display:grid; grid-template-columns:54px repeat(var(--n),minmax(110px,1fr)); position:sticky; top:0; z-index:5; background:#0B1120; border-bottom:1px solid var(--line); }
.tg-head > div{ padding:8px 8px; font-size:13px; color:var(--mute); border-left:1px solid var(--line); cursor:pointer; }
.tg-head > div:first-child{ border-left:0; cursor:default; }
.tg-head > div b{ display:block; color:var(--ink); font-size:16px; font-weight:600; }
.tg-head > div.today b{ color:var(--acc); text-shadow:0 0 10px rgba(var(--acc-rgb),.6); }
.tg-head .hflags{ display:flex; gap:4px; margin-top:3px; flex-wrap:wrap; }
.tg-body{ display:grid; grid-template-columns:54px repeat(var(--n),minmax(110px,1fr)); position:relative; }
.tg-hours div{ height:var(--h); font-size:11.5px; color:var(--dim); text-align:right; padding-right:8px; transform:translateY(-7px); font-variant-numeric:tabular-nums; }
.tg-col{ position:relative; border-left:1px solid var(--line);
  background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px);
  background-size:100% var(--h), 100% calc(var(--h)/2); cursor:copy; }
.tg-col.today{ background-color:rgba(var(--acc-rgb),.025); }
.it{ position:absolute; border-radius:7px; padding:4px 7px; font-size:12.5px; line-height:1.3; overflow:hidden; cursor:pointer; border:1px solid; min-height:18px; transition:filter .15s; }
.it:hover{ filter:brightness(1.2); z-index:3; }
.it b{ font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.it .tm{ opacity:.75; font-size:11.5px; font-variant-numeric:tabular-nums; }
.it.ev{ background:color-mix(in srgb, var(--c) 16%, #0b1120); border-color:color-mix(in srgb, var(--c) 60%, transparent); color:color-mix(in srgb, var(--c) 30%, #fff); box-shadow:0 0 14px color-mix(in srgb, var(--c) 14%, transparent); }
.it.bl{ background:color-mix(in srgb, var(--c) 6%, transparent); border-style:dashed; border-color:color-mix(in srgb, var(--c) 45%, transparent); color:#cfd8ea; }
.it.bl.done{ opacity:.62; }
.it.bl.done b{ text-decoration:line-through; }
.it .bchk{ float:right; width:14px; height:14px; border-radius:50%; border:1.5px solid color-mix(in srgb, var(--c) 70%, transparent); margin:1px 0 0 4px; }
.it.bl.done .bchk{ background:var(--c); }
.now-line{ position:absolute; left:0; right:0; height:0; border-top:1.5px solid var(--warn); z-index:4; pointer-events:none; }
.now-line::before{ content:""; position:absolute; left:-4px; top:-4.5px; width:7px; height:7px; border-radius:50%; background:var(--warn); box-shadow:0 0 8px var(--warn); }

.day-wrap{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:18px; align-items:start; }
@media (max-width:1000px){ .day-wrap{ grid-template-columns:1fr; } }
.facts{ display:flex; flex-direction:column; gap:10px; }
.fchip{ display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:4px 11px; border-radius:99px; border:1px solid var(--line2); background:none; color:var(--mute); }
.fchip.on{ color:var(--ink); border-color:var(--c, var(--acc)); background:color-mix(in srgb, var(--c, var(--acc)) 12%, transparent); }
.fchip.auto{ cursor:default; }
.branch-note{ font-size:13.5px; color:var(--mute); }
.branch-note .bn{ display:flex; gap:8px; padding:3px 0; }
.branch-note .bn i{ font-style:normal; width:14px; flex:none; }
.branch-note .bn.on{ color:var(--ink); }
.branch-note .bn.on i{ color:var(--ok); }

/* ---------- month ---------- */
.mg{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border:1px solid var(--line); border-radius:var(--r2); overflow:hidden; background:rgba(10,15,27,.8); }
.mg .wd{ padding:8px 10px; font-size:12.5px; color:var(--dim); border-bottom:1px solid var(--line); }
.mc{ min-height:112px; padding:6px 7px; border-top:1px solid var(--line); border-left:1px solid var(--line); cursor:pointer; display:flex; flex-direction:column; gap:3px; min-width:0; }
.mc:nth-child(7n+1){ border-left:0; }
.mc:hover{ background:rgba(255,255,255,.02); }
.mc.out{ opacity:.38; }
.mc .d{ font-size:13px; color:var(--mute); display:flex; justify-content:space-between; align-items:center; }
.mc.today .d b{ color:#041018; background:var(--acc); border-radius:99px; padding:0 7px; box-shadow:0 0 10px rgba(var(--acc-rgb),.6); }
.mc.test{ box-shadow:inset 0 0 0 1px rgba(255,198,107,.5); background:rgba(255,198,107,.04); }
.mc .me{ font-size:11.5px; padding:1px 6px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:color-mix(in srgb, var(--c) 15%, transparent); color:color-mix(in srgb, var(--c) 35%, #fff); border-left:2px solid var(--c); }
.mc .more{ font-size:11.5px; color:var(--dim); }
@media (max-width:720px){ .mc{ min-height:64px; } .mc .me{ font-size:0; padding:0; height:4px; } .mc .more{ display:none; } }

/* ---------- routines ---------- */
.wd-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.wd-tabs button{ background:none; border:1px solid var(--line); border-radius:10px; padding:7px 14px; color:var(--mute); min-width:64px; text-align:left; }
.wd-tabs button b{ display:block; font-weight:600; color:inherit; font-size:14.5px; }
.wd-tabs button small{ font-size:11.5px; color:var(--dim); }
.wd-tabs button.on{ color:var(--ink); border-color:rgba(var(--acc-rgb),.5); background:rgba(var(--acc-rgb),.06); }
.branches{ display:flex; flex-direction:column; gap:14px; position:relative; }
.br{ position:relative; margin-left:26px; }
.br::before{ content:""; position:absolute; left:-18px; top:-14px; bottom:50%; width:14px; border-left:1.5px solid var(--line2); border-bottom:1.5px solid var(--line2); border-bottom-left-radius:8px; }
.br-h{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.br-h .if{ font-family:var(--math-f); font-style:italic; color:var(--acc); font-size:17px; }
.blk{ display:grid; grid-template-columns:122px 122px minmax(120px,1fr) 130px 140px 28px; gap:8px; padding:6px 12px; align-items:center; }
.blk .inp{ padding:5px 8px; font-size:13.5px; width:100%; }
.blk-h{ font-size:12px; color:var(--dim); padding-top:8px; }
@media (max-width:820px){ .blk{ grid-template-columns:1fr 1fr 28px; } .blk .t{ grid-column:1/3; } .blk-h{ display:none; } .blk{ border-bottom:1px dashed var(--line); padding:10px 12px; } }
.root-node{ display:flex; align-items:center; gap:10px; font-size:14px; color:var(--mute); }
.root-node .m{ font-size:20px; color:var(--ink); }

/* ---------- files ---------- */
.files{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
.file{ padding:14px; display:flex; flex-direction:column; gap:10px; cursor:pointer; }
.file:hover{ border-color:var(--line2); }
.file .fi{ height:120px; border-radius:8px; background:rgba(0,0,0,.35); border:1px solid var(--line); display:grid; place-items:center; overflow:hidden; }
.file .fi canvas, .file .fi img{ max-width:100%; max-height:100%; }
.file .fn{ font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.drop{ border:1.5px dashed var(--line2); border-radius:var(--r2); padding:26px; text-align:center; color:var(--mute); transition:all .15s; margin-bottom:18px; }
.drop.over{ border-color:var(--acc); background:rgba(var(--acc-rgb),.05); color:var(--ink); }
.viewer{ position:fixed; inset:0; z-index:80; background:rgba(3,5,10,.94); display:flex; flex-direction:column; }
.viewer-h{ display:flex; align-items:center; gap:10px; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--line); }
.viewer-b{ flex:1; overflow:auto; padding:18px; display:flex; flex-direction:column; align-items:center; gap:14px; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px)); }
.viewer-b canvas{ max-width:none; box-shadow:0 0 0 1px var(--line), 0 10px 40px rgba(0,0,0,.6); border-radius:4px; background:#fff; }

/* ---------- modal & toast ---------- */
.modal-bg{ position:fixed; inset:0; z-index:70; background:rgba(2,4,9,.7); backdrop-filter:blur(3px); display:grid; place-items:center; padding:16px; }
.modal{ width:min(520px,100%); max-height:calc(100% - 20px); overflow:auto; background:#0D1323; border:1px solid var(--line2); border-radius:14px; box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(var(--acc-rgb),.05); animation:pop .16s ease-out; }
@keyframes pop{ from{ transform:translateY(6px) scale(.985); opacity:0; } }
.modal-h{ display:flex; align-items:center; padding:16px 18px 6px; }
.modal-h h3{ margin:0; font-size:17px; font-weight:600; flex:1; }
.modal-b{ padding:10px 18px; display:grid; gap:12px; }
.modal-f{ display:flex; gap:8px; justify-content:flex-end; padding:10px 18px 16px; flex-wrap:wrap; }
.g2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.g3{ display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:10px; }
@media (max-width:520px){ .g3{ grid-template-columns:1fr 1fr; } .g3 > :first-child{ grid-column:1/-1; } }
.typepick{ display:flex; gap:6px; flex-wrap:wrap; }
.typepick button{ border:1px solid var(--line2); background:none; color:var(--mute); padding:5px 11px; border-radius:99px; font-size:13px; display:inline-flex; gap:7px; align-items:center; }
.typepick button i{ width:8px; height:8px; border-radius:50%; background:var(--c); }
.typepick button.on{ color:var(--ink); border-color:var(--c); background:color-mix(in srgb, var(--c) 12%, transparent); }
.toast{ position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:90; background:#111a2d; border:1px solid var(--line2); color:var(--ink); padding:9px 16px; border-radius:10px; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.5); animation:pop .16s; }
.set-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
/* ---------- v2 additions ---------- */
.datebtn{ text-align:left; min-width:190px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
.datebtn::before{ content:""; width:14px; height:14px; flex:none; border:1.5px solid var(--mute); border-radius:3px; border-top-width:4px; }
.datebtn:hover{ border-color:#3a4766; }
.dp{ position:fixed; z-index:100; width:278px; background:#0E1526; border:1px solid var(--line2); border-radius:12px; padding:10px; box-shadow:0 20px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(var(--acc-rgb),.06); animation:pop .14s ease-out; }
.dp-h{ display:flex; align-items:center; gap:2px; margin-bottom:6px; }
.dp-h b{ flex:1; text-align:center; font-weight:600; font-size:14px; }
.dp button{ background:none; border:0; color:var(--ink); border-radius:6px; padding:5px 0; font-size:13.5px; }
.dp-h button{ width:28px; color:var(--mute); }
.dp button:hover{ background:rgba(255,255,255,.06); }
.dp-g{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
.dp-g span{ font-size:11.5px; color:var(--dim); padding:3px 0; }
.dp-g button.out{ color:var(--dim); }
.dp-g button.td{ box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.5); }
.dp-g button.on{ background:var(--acc); color:#041018; font-weight:600; box-shadow:0 0 12px rgba(var(--acc-rgb),.5); }
.dp-f{ display:flex; justify-content:space-between; margin-top:6px; border-top:1px solid var(--line); padding-top:6px; }
.dp-f button{ padding:4px 10px; color:var(--acc); }
.modal.wide{ width:min(640px,100%); }
.fld-l{ font-size:13px; color:var(--mute); display:flex; align-items:center; gap:8px; margin-bottom:-4px; }
.fld-l b{ color:var(--ink); font-weight:600; }
.linkbtn{ background:none; border:0; color:var(--acc); font-size:12.5px; padding:0; margin-left:auto; }
.linkbtn:hover{ text-decoration:underline; }
.pick{ display:flex; flex-wrap:wrap; gap:6px; }
.pick button{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line2); background:rgba(0,0,0,.25); color:var(--mute); border-radius:8px; padding:6px 11px; font-size:13.5px; }
.pick button i{ width:8px; height:8px; border-radius:50%; background:var(--c); flex:none; }
.pick button:hover{ color:var(--ink); }
.pick button.on{ color:var(--ink); border-color:var(--c); background:color-mix(in srgb, var(--c) 13%, transparent); box-shadow:0 0 14px color-mix(in srgb, var(--c) 18%, transparent); }
.pick.big button{ padding:9px 14px; font-size:14.5px; font-weight:500; }
.timebox{ display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:start; }
@media (max-width:520px){ .timebox{ grid-template-columns:1fr; } }
.wheel{ position:relative; display:flex; align-items:center; gap:2px; height:180px; padding:0 10px; margin-top:10px; border:1px solid var(--line2); border-radius:12px; background:rgba(0,0,0,.35); width:max-content; }
.wcol{ height:180px; width:58px; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; padding:72px 0; outline:none;
  -webkit-mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.wcol::-webkit-scrollbar{ display:none; }
.wcol:focus-visible{ box-shadow:inset 0 0 0 1px var(--acc); border-radius:8px; }
.wi{ height:36px; display:grid; place-items:center; scroll-snap-align:center; font-size:21px; color:var(--dim); font-variant-numeric:tabular-nums; cursor:pointer; transition:color .1s, font-size .1s; }
.wi.sel{ color:var(--ink); font-size:24px; font-weight:600; text-shadow:0 0 12px rgba(var(--acc-rgb),.55); }
.wsep{ font-size:22px; color:var(--mute); }
.wband{ position:absolute; left:6px; right:6px; top:72px; height:36px; border-radius:8px; border:1px solid rgba(var(--acc-rgb),.35); background:rgba(var(--acc-rgb),.05); pointer-events:none; }
.durs{ display:flex; flex-direction:column; gap:12px; }
.sl{ display:grid; grid-template-columns:78px 1fr 60px; gap:10px; align-items:center; font-size:13.5px; color:var(--mute); }
.sl b{ color:var(--ink); font-weight:500; text-align:right; }
.ends{ font-size:14px; color:var(--mute); padding:8px 12px; border:1px dashed var(--line2); border-radius:8px; }
.ends b{ color:var(--acc); font-weight:600; }
.neon-range{ -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:4px; background:var(--line2); outline:none; }
.neon-range::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#0A0F1B; border:2px solid var(--acc); box-shadow:0 0 10px rgba(var(--acc-rgb),.6); cursor:pointer; }
.neon-range::-moz-range-thumb{ width:14px; height:14px; border-radius:50%; background:#0A0F1B; border:2px solid var(--acc); box-shadow:0 0 10px rgba(var(--acc-rgb),.6); cursor:pointer; }
.neon-range:focus-visible{ box-shadow:0 0 0 3px rgba(var(--acc-rgb),.2); }

/* routine tree */
.tree-wrap{ overflow-x:auto; padding:18px 4px 40px; margin:0 -4px; }
.tree{ display:flex; justify-content:center; min-width:max-content; }
.seq{ display:flex; flex-direction:column; align-items:center; }
.vline{ width:0; height:16px; border-left:1.5px solid rgba(var(--acc-rgb),.35); }
.vline.short{ height:10px; }
.rblk{ width:250px; display:flex; flex-direction:column; align-items:flex-start; gap:1px; text-align:left; padding:12px 16px 10px 18px; border-radius:12px;
  border:1px solid color-mix(in srgb, var(--c) 45%, transparent); background:linear-gradient(135deg, color-mix(in srgb, var(--c) 13%, #0B1120), #0B1120 70%);
  position:relative; color:var(--ink); transition:box-shadow .15s, transform .15s; }
.rblk::before{ content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:0 3px 3px 0; background:var(--bar, var(--c)); box-shadow:0 0 10px var(--c); }
.rblk:hover{ box-shadow:0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent), 0 0 24px color-mix(in srgb, var(--c) 20%, transparent); }
.rblk .rt{ font-size:17px; font-weight:600; letter-spacing:-.005em; }
.rblk .rs{ font-size:13.5px; color:var(--mute); }
.rblk .rn{ font-size:12.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.rblk .rtime{ margin-top:6px; font-size:14px; color:#cfe0f5; }
.seq-acts{ display:flex; flex-direction:column; align-items:center; }
.seq-acts .btn{ opacity:.7; } .seq-acts .btn:hover{ opacity:1; }
.fork{ display:flex; flex-direction:column; align-items:center; }
.fork-node{ display:flex; align-items:center; gap:4px; padding:2px 4px 2px 10px; border:1px solid rgba(var(--acc-rgb),.35); border-radius:99px; background:rgba(var(--acc-rgb),.05); }
.fork-node .m{ color:var(--acc); font-size:17px; }
.brs{ display:flex; align-items:flex-start; margin-top:16px; }
.bcol{ position:relative; padding:20px 18px 0; display:flex; flex-direction:column; align-items:center; }
.bcol::before{ content:""; position:absolute; top:0; left:0; right:0; border-top:1.5px solid rgba(var(--acc-rgb),.35); }
.bcol:first-child::before{ left:50%; } .bcol:last-child::before{ right:50%; } .bcol:only-child::before{ display:none; }
.bcol::after{ content:""; position:absolute; top:0; left:50%; height:20px; border-left:1.5px solid rgba(var(--acc-rgb),.35); }
.brs::before{ content:""; }
.fork > .brs{ position:relative; }
.fork > .brs::after{ content:""; position:absolute; top:-16px; left:50%; height:16px; border-left:1.5px solid rgba(var(--acc-rgb),.35); }
.bhead{ display:flex; flex-direction:column; align-items:center; gap:2px; }
.cond{ background:#0D1528; border:1px solid var(--line2); color:var(--ink); border-radius:99px; padding:5px 14px; font-size:13.5px; white-space:nowrap; }
.cond .m{ color:var(--acc); margin-right:3px; }
.cond.else .m{ color:var(--rev); }
.cond:hover{ border-color:rgba(var(--acc-rgb),.5); }
.bmenu{ display:flex; gap:0; opacity:.55; } .bcol:hover > .bhead .bmenu{ opacity:1; }
.bmenu .icon-btn{ width:24px; height:22px; font-size:14px; }
.bmenu .icon-btn[disabled]{ opacity:.25; }
.daychecks{ display:flex; flex-wrap:wrap; gap:6px; }
.daychecks .fchip{ cursor:pointer; }

/* day */
.it .isub{ display:block; font-size:11.5px; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.it .inote{ display:block; font-size:11.5px; opacity:.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.it.bl{ border-left-width:3px; border-left-style:solid; }
.dprod{ display:flex; align-items:center; gap:16px; }
.dprod .big{ font-size:34px; font-weight:600; min-width:84px; letter-spacing:-.02em; }
.stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px; }
.stats div{ border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:rgba(0,0,0,.2); }
.stats b{ display:block; font-size:17px; font-weight:600; }
.stats span{ font-size:12.5px; color:var(--mute); }
.done-btn{ min-width:150px; justify-content:center; }
.done-btn.on{ color:#041018; background:var(--ok); border-color:var(--ok); box-shadow:0 0 16px rgba(125,255,176,.4); font-weight:600; }
.slog{ display:grid; gap:12px; padding:14px; border:1px solid var(--line2); border-radius:12px; background:rgba(0,0,0,.2); }
.slog[hidden]{ display:none; }
.tchips{ display:flex; flex-wrap:wrap; gap:6px; }
.tchips .chip{ color:var(--ink); border-color:rgba(125,255,176,.4); background:rgba(125,255,176,.07); padding-right:2px; }
.tchips .chip .icon-btn{ width:18px; height:18px; font-size:13px; }
.tp-subs{ max-height:190px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:4px 10px; }
.tp-subs .sub{ font-size:13.5px; cursor:pointer; }
.tp-subs .sub.done span{ color:var(--dim); }
.mlist{ display:flex; flex-direction:column; gap:6px; }
.mrow{ display:flex; align-items:center; gap:8px; }

/* ================= v7: readable dropdowns ================= */

/* ================= v7: more neon ================= */
:root{ --glow-c: 77,227,255; --ease: cubic-bezier(.22,.8,.26,1); --ease-spring: cubic-bezier(.34,1.56,.64,1); }
::selection{ background:rgba(var(--acc-rgb),.28); color:#fff; }
*{ scrollbar-width:thin; scrollbar-color:rgba(var(--acc-rgb),.35) transparent; }
::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:linear-gradient(180deg, rgba(var(--acc-rgb),.45), rgba(var(--acc2-rgb),.45)); border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:linear-gradient(180deg, var(--acc), var(--acc2)); }
body::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(600px 300px at var(--mx,70%) var(--my,10%), rgba(var(--acc-rgb),.05), transparent 70%); transition:background .3s; }
.app{ position:relative; z-index:1; }
.top h1{ background:linear-gradient(90deg, #E4EBF8, #9FF1FF 55%, #D9C2FF); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; filter:drop-shadow(0 0 12px rgba(var(--acc-rgb),.25)); }
.top{ box-shadow:0 1px 0 rgba(var(--acc-rgb),.08), 0 10px 30px rgba(0,0,0,.25); }
.top::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:linear-gradient(90deg, transparent, rgba(var(--acc-rgb),.7), rgba(var(--acc2-rgb),.7), transparent); background-size:200% 100%; animation:scan 6s linear infinite; opacity:.7; }
@keyframes scan{ from{ background-position:200% 0; } to{ background-position:-200% 0; } }
.brand svg path:first-child{ stroke-dasharray:60; stroke-dashoffset:60; animation:drawIn 1.4s var(--ease) .2s forwards, pulseGlow 3.5s ease-in-out 1.6s infinite; }
@keyframes drawIn{ to{ stroke-dashoffset:0; } }
@keyframes pulseGlow{ 0%,100%{ filter:drop-shadow(0 0 3px var(--acc)); } 50%{ filter:drop-shadow(0 0 9px var(--acc)); } }
.side{ box-shadow:1px 0 0 rgba(var(--acc-rgb),.06), 10px 0 40px rgba(0,0,0,.35); }
.nav button{ transition:color .25s var(--ease), background .25s var(--ease), transform .25s var(--ease); }
.nav button:hover{ transform:translateX(3px); }
.nav button:hover .g{ color:#9FF1FF; text-shadow:0 0 10px rgba(var(--acc-rgb),.6); }
.nav button.on{ background:linear-gradient(90deg, rgba(var(--acc-rgb),.14), rgba(var(--acc-rgb),.02)); box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.18), 0 0 18px rgba(var(--acc-rgb),.08); }
.nav button.on::before{ animation:barGlow 2.4s ease-in-out infinite; }
@keyframes barGlow{ 0%,100%{ box-shadow:0 0 6px var(--acc); } 50%{ box-shadow:0 0 16px var(--acc), 0 0 30px rgba(var(--acc-rgb),.5); } }
.panel{ transition:border-color .35s var(--ease), box-shadow .35s var(--ease), transform .35s var(--ease);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 0 0 1px rgba(var(--acc-rgb),.02); }
.panel:hover{ border-color:rgba(var(--acc-rgb),.28); box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 0 0 1px rgba(var(--acc-rgb),.08), 0 0 28px rgba(var(--acc-rgb),.08); }
.hero{ border-color:rgba(var(--acc-rgb),.25); }
.hero::before{ content:""; position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg, transparent, var(--acc), var(--acc2), #7DFFB0, transparent); background-size:200% 100%; animation:scan 5s linear infinite; }
.hero h2{ text-shadow:0 0 18px rgba(var(--acc-rgb),.35); }
.count .ci .v{ text-shadow:0 0 16px rgba(var(--acc-rgb),.45); color:#DDF9FF; }
.btn, .icon-btn, .seg button, .fchip, .chip, .pick button, .typepick button, .subj-tabs button, .wd-tabs button, .cond, .add-sp, .add-ch, .dp button, .rchip{
  transition:color .22s var(--ease), background .22s var(--ease), border-color .22s var(--ease), box-shadow .25s var(--ease), transform .18s var(--ease), opacity .2s; }
.btn:hover, .icon-btn:hover{ border-color:rgba(var(--acc-rgb),.55); box-shadow:0 0 0 1px rgba(var(--acc-rgb),.18), 0 0 16px rgba(var(--acc-rgb),.18); }
.btn:active, .icon-btn:active, .fchip:active, .pick button:active, .seg button:active{ transform:scale(.96); }
.btn.pri{ background:linear-gradient(135deg, rgba(var(--acc-rgb),.18), rgba(var(--acc2-rgb),.12)); box-shadow:0 0 14px rgba(var(--acc-rgb),.15); }
.btn.pri:hover{ box-shadow:0 0 0 1px rgba(var(--acc-rgb),.45), 0 0 24px rgba(var(--acc-rgb),.35); }
.btn.danger:hover{ border-color:var(--warn); box-shadow:0 0 16px rgba(255,111,142,.3); }
.btn.ghost:hover{ box-shadow:none; border-color:transparent; }
.seg button.on{ box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.45), 0 0 14px rgba(var(--acc-rgb),.15); color:#DDF9FF; }
.inp{ transition:border-color .2s var(--ease), box-shadow .25s var(--ease), background .2s; }
.inp:hover{ border-color:#3a4766; }
.chk{ transition:all .22s var(--ease-spring); }
.chk:checked{ animation:tickPop .32s var(--ease-spring); }
@keyframes tickPop{ 0%{ transform:scale(.7); } 60%{ transform:scale(1.18); } 100%{ transform:scale(1); } }
.fchip.on{ box-shadow:0 0 14px color-mix(in srgb, var(--c, var(--acc)) 35%, transparent); }
.subj-tabs button:hover{ transform:translateY(-2px); }
.subj-tabs button.on .sg{ text-shadow:0 0 12px var(--c); }
.ch{ transition:background .25s var(--ease); }
.ch.open{ background:linear-gradient(90deg, rgba(var(--acc-rgb),.035), transparent 60%); }
.subs{ animation:none; } .ch.open .subs{ animation:unfold .3s var(--ease); }
@keyframes unfold{ from{ opacity:0; transform:translateY(-6px); } }
.caret{ transition:transform .3s var(--ease); }
.bar i{ transform-origin:left; animation:grow .9s var(--ease) both; }
@keyframes grow{ from{ transform:scaleX(0); } }
.pips i{ transition:background .3s var(--ease), box-shadow .3s; }
.rate .val .v b{ transition:color .3s; text-shadow:0 0 10px currentColor; }
.draw-line{ stroke-dasharray:1; stroke-dashoffset:1; animation:drawLine 1.6s var(--ease) .15s forwards; }
@keyframes drawLine{ to{ stroke-dashoffset:0; } }
.field circle{ animation:dotPulse 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes dotPulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.6); opacity:.7; } }
.now-line{ animation:nowGlow 2s ease-in-out infinite; }
.now-line::before{ animation:dotPulse 2s ease-in-out infinite; }
@keyframes nowGlow{ 0%,100%{ box-shadow:0 0 4px var(--warn); } 50%{ box-shadow:0 0 12px var(--warn), 0 0 24px rgba(255,111,142,.4); } }
.it{ transition:filter .2s, transform .2s var(--ease), box-shadow .25s var(--ease), opacity .25s; }
.it:hover{ transform:translateY(-1px) scale(1.01); box-shadow:0 0 18px color-mix(in srgb, var(--c) 40%, transparent) !important; z-index:4; }
.it.ev{ box-shadow:0 0 16px color-mix(in srgb, var(--c) 22%, transparent), inset 0 0 12px color-mix(in srgb, var(--c) 10%, transparent); }
.bchk{ transition:background .25s, box-shadow .25s, transform .2s var(--ease-spring); }
.bchk:hover{ transform:scale(1.2); box-shadow:0 0 10px var(--c); }
.it.bl.done .bchk{ box-shadow:0 0 10px var(--c); }
.tg-head > div.today{ background:linear-gradient(180deg, rgba(var(--acc-rgb),.08), transparent); }
.mc{ transition:background .25s var(--ease), box-shadow .25s var(--ease); }
.mc:hover{ box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.3), inset 0 0 20px rgba(var(--acc-rgb),.06); }
.mc.today{ box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.35); }
.mc .me{ transition:transform .2s var(--ease); } .mc:hover .me{ transform:translateX(2px); }
.rblk{ transition:box-shadow .3s var(--ease), transform .25s var(--ease), border-color .3s; box-shadow:0 0 18px color-mix(in srgb, var(--c) 12%, transparent); }
.rblk:hover{ transform:translateY(-2px); }
.vline, .bcol::before, .bcol::after, .fork > .brs::after{ border-color:rgba(var(--acc-rgb),.5) !important; filter:drop-shadow(0 0 3px rgba(var(--acc-rgb),.6)); }
.fork-node{ box-shadow:0 0 16px rgba(var(--acc-rgb),.2); animation:pulseNode 3s ease-in-out infinite; }
@keyframes pulseNode{ 0%,100%{ box-shadow:0 0 10px rgba(var(--acc-rgb),.15); } 50%{ box-shadow:0 0 22px rgba(var(--acc-rgb),.35); } }
.cond:hover{ box-shadow:0 0 14px rgba(var(--acc-rgb),.25); }
.part, .dp-item, .qday, .file, .stats div, .prow{ transition:border-color .25s var(--ease), box-shadow .25s var(--ease), transform .25s var(--ease), background .25s; }

.dprod .big{ text-shadow:0 0 18px currentColor; transition:color .3s; }

.neon-range:active::-webkit-slider-thumb{ transform:scale(1.25); box-shadow:0 0 18px rgba(var(--acc-rgb),.9); }

/* modals, pop-ups, toasts */
.modal-bg{ animation:fadeIn .22s ease both; }
@keyframes fadeIn{ from{ opacity:0; } }
.modal{ animation:modalIn .32s var(--ease-spring) both; box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(var(--acc-rgb),.12), 0 0 40px rgba(var(--acc-rgb),.1); }
@keyframes modalIn{ from{ opacity:0; transform:translateY(14px) scale(.96); } }
.modal-h h3{ text-shadow:0 0 14px rgba(var(--acc-rgb),.3); }
.dp, .daypop{ animation:popIn .22s var(--ease-spring) both; box-shadow:0 20px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(var(--acc-rgb),.14), 0 0 26px rgba(var(--acc-rgb),.12); }
@keyframes popIn{ from{ opacity:0; transform:translateY(-6px) scale(.97); } }
.toast{ animation:toastIn .35s var(--ease-spring) both; border-color:rgba(var(--acc-rgb),.35); box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 20px rgba(var(--acc-rgb),.2); }
@keyframes toastIn{ from{ opacity:0; transform:translate(-50%, 16px) scale(.96); } }
.viewer{ animation:fadeIn .25s ease both; }

const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [a,b,c] = s.split('-').map(Number); return new Date(a,b-1,c); };

/* ---------- undo / redo: snapshots of everything except uploaded files ---------- */
const HIST = { u:[], r:[], pend:false, last:null };
const snap = () => JSON.stringify({ syl:S.syl, plan:S.plan, rev:S.rev, cfg:S.cfg });
function histReset(){ HIST.u = []; HIST.r = []; HIST.last = snap(); updUndo(); }
function histPush(){
  if (HIST.pend || HIST.last == null) return;
  HIST.pend = true; HIST.u.push(HIST.last); if (HIST.u.length > 80) HIST.u.shift(); HIST.r = [];
  queueMicrotask(() => { HIST.pend = false; HIST.last = snap(); updUndo(); });
}
function restoreSnap(str){
  const o = JSON.parse(str), col = S.cfg.collapsed;
  ['syl','plan','rev','cfg'].forEach(d => S[d] = o[d]); S.cfg.collapsed = col;
  HIST.last = str; touchQuiet('syl','plan','rev','cfg');
  if (typeof closeModal === 'function') closeModal(true);
  render(); updUndo();
}
function undo(){ if (!HIST.u.length) return; HIST.r.push(snap()); restoreSnap(HIST.u.pop()); toast('Undone'); }
function redo(){ if (!HIST.r.length) return; HIST.u.push(snap()); restoreSnap(HIST.r.pop()); toast('Redone'); }
function updUndo(){ const u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn'); if (u) u.disabled = !HIST.u.length; if (r) r.disabled = !HIST.r.length; }
function touch(...docs){ histPush(); touchQuiet(...docs); }
function touchQuiet(...docs){
  const t = Date.now();
  docs.forEach(d => { S[d]._u = t; dirty.add(d); });
  saveLocal();
  clearTimeout(saveT); saveT = setTimeout(flush, 800);
}
async function flush(){
  if (!DB || dbBroken) return;
  let failed = false;
  for (const d of [...dirty]) {
    if (writing[d]) continue;
    dirty.delete(d); writing[d] = true;
    try { await DB.doc(`data/users/${UID}/${d}`).set(clone(S[d])); }
    catch(e){
      if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { dbBroken = true; setSync('local'); }
      else { dirty.add(d); failed = true; }
    }
    writing[d] = false;
  }
  if (!dbBroken) setSync(failed ? 'err' : 'ok');
  if (dirty.size && !dbBroken) { clearTimeout(saveT); saveT = setTimeout(flush, failed ? 10000 : 1200); }
}
function setSync(s){
  const el = $('#sync'); el.className = 'sync ' + (s==='ok'?'ok':s==='err'?'err':'');
  el.querySelector('span').textContent = s==='ok' ? 'Synced to your account' : s==='err' ? 'Sync retrying…' : 'Saved on this device';
}
async function initCloud(){
  if (!window.claude || !window.claude.use) { setSync('local'); return; }
  try {
    const [db, user, assets, dl] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets'), claude.use('downloads')]);
    ASSETS = assets; DL = dl;
    if (!db || !user) { setSync('local'); render(); return; }
    const id = await user.id();
    if (!id) { setSync('local'); render(); return; }
    DB = db; UID = id;
    for (const d of DOCS) {
      try {
        const snap = await db.doc(`data/users/${UID}/${d}`).get();
        if (snap.exists) {
          const rd = clone(snap.data());
          if ((rd._u||0) >= (S[d]._u||0)) S[d] = Object.assign(defaults()[d], rd);
          else dirty.add(d);
        } else if (S[d]._u) dirty.add(d);
      } catch(e){}
    }
    if (migrate()) { dirty.add('plan'); dirty.add('rev'); }
    if (migrateSyllabus()) { dirty.add('syl'); dirty.add('rev'); }
    saveLocal(); setSync('ok'); histReset(); render(); flush();
  } catch(e){ setSync('local'); }
}

/* ================= IndexedDB (local file fallback) ================= */
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('asymptote-files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('f', mode); const q = fn(t.objectStore('f')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return {
    put: (k,v) => tx('readwrite', s => s.put(v,k)),
    get: k => tx('readonly', s => s.get(k)),
    del: k => tx('readwrite', s => s.delete(k)),
  };
})();

/* ================= syllabus model ================= */
function parseSub(chId, s, custom){
  let tag = 'both', name = s;
  if (s.startsWith('A:')) { tag = 'adv'; name = s.slice(2); }
  else if (s.startsWith('M:')) { tag = 'main'; name = s.slice(2); }
  return { id: chId + ':' + slug(name), name, tag, custom: !!custom };
}
function chapters(subj){
  const out = [];
  const add = (id, name, exam, subs, custom) => {
    const list = subs.map(s => parseSub(id, s, false));
    (S.syl.custom.subs[id] || []).forEach(s => list.push(parseSub(id, s, true)));
    out.push({ id, name, exam, subj, subs:list, custom });
  };
  RAW[subj].forEach(([id,name,exam,subs]) => add(id,name,exam,subs,false));
  S.syl.custom.chapters.filter(c => c.subj === subj).forEach(c => add(c.id, c.name, c.exam, [], true));
  return out;
}
function allChapters(){ return [...chapters('phy'), ...chapters('chem'), ...chapters('math')]; }
function chapterById(id){ return allChapters().find(c => c.id === id); }
const inExam = (ch, ex) => ex === 'all' || ch.exam === 'both' || ch.exam === ex;
const subIn = (sb, ex) => ex === 'all' || sb.tag === 'both' || sb.tag === ex;
function prog(id){ return S.syl.prog[id] || (S.syl.prog[id] = { done:false, subs:{}, h:[] }); }
function chFrac(ch, ex){
  const p = S.syl.prog[ch.id]; if (!p) return 0;
  const subs = ch.subs.filter(s => subIn(s, ex));
  if (p.done) return 1;
  if (!subs.length) return 0;
  return subs.filter(s => p.subs && p.subs[s.id]).length / subs.length;
}
function coverage(subj, ex){
  const chs = chapters(subj).filter(c => inExam(c, ex));
  if (!chs.length) return { frac:0, done:0, total:0 };
  const fr = chs.reduce((a,c) => a + chFrac(c, ex), 0) / chs.length;
  return { frac:fr, done: chs.filter(c => chFrac(c, ex) >= 1).length, total: chs.length };
}
/* rating with exponential decay: r(t) = r0 · 2^(−t/τ) */
/* each history entry: [time, value, doneAtThatTime]. Decay only runs while the chapter is ticked. */
function rEntry(id, T){
  const p = S.syl.prog[id], h = p?.h; if (!h || !h.length) return null;
  let last = null; for (const e of h) { if (e[0] <= T) last = e; else break; }
  return last;
}
/* chapter ids are plain; subtopic ids are "chapterId:slug" and count as ticked when the subtopic or its chapter is ticked */
function isTickedAny(id){ if (id.includes(':')) { const p = S.syl.prog[id.split(':')[0]]; return !!(p && (p.done || p.subs?.[id])); } return isTicked(id); }
/* a chapter counts as ticked when it is ticked itself or at least one of its subtopics is */
function isTicked(id){ const p = S.syl.prog[id]; return !!(p && (p.done || Object.values(p.subs || {}).some(Boolean))); }
function rDoneFlag(id, e){ return e.length > 2 ? !!e[2] : isTickedAny(id); }
/* run a change to a chapter's ticks, freezing/unfreezing any rated subtopics whose ticked state flips */
function withSubFreeze(chId, mutate){
  const ch = chapterById(chId), rated = [{ id:chId }, ...(ch ? ch.subs : [])].filter(s => S.syl.prog[s.id]?.h?.length);
  const before = rated.map(s => [s.id, isTickedAny(s.id), rAt(s.id)]);
  mutate();
  const t = Date.now();
  before.forEach(([sid, was, v]) => { const now = isTickedAny(sid); if (was !== now && v != null) { const p = S.syl.prog[sid]; p.h.push([t, Math.round(v * 100) / 100, now]); p.h = p.h.slice(-60); } });
}
function rAt(id, T = Date.now()){
  const e = rEntry(id, T); if (!e) return null;
  if (!rDoneFlag(id, e)) return e[1];
  return e[1] * Math.pow(2, -(T - e[0]) / (S.cfg.half * 864e5));
}
/* value used in averages: unticked chapters at 0 are left out */
function rEff(id, T = Date.now()){
  const e = rEntry(id, T); if (!e) return null;
  if (!rDoneFlag(id, e) && !e[1]) return null;
  return rAt(id, T);
}
const rPaused = id => { const e = rEntry(id, Date.now()); return !!e && !rDoneFlag(id, e); };
function setDone(id, val){
  const p = prog(id); val = !!val;
  if (!!p.done === val) return;
  const before = isTickedAny(id), v = rAt(id);
  p.done = val;
  const after = isTickedAny(id);
  if (before !== after && p.h && p.h.length) { p.h.push([Date.now(), Math.round(v * 100) / 100, after]); p.h = p.h.slice(-60); }
}
function bump(id, d){
  const p = prog(id);
  const raw = rAt(id);
  if (d < 0 && (raw == null || raw < 0.05)) { p.h = []; touch('syl'); return; }  /* minus at 0 clears the grade back to "—" */
  const cur = raw ?? 0, step = +S.cfg.step || 1;
  const v = clamp(Math.round((cur + d * step) * 100) / 100, 0, 10);
  p.h = (p.h || []).concat([[Date.now(), v, isTickedAny(id)]]).slice(-60);
  touch('syl');
}
/* ticked + rated (lowest first), then ticked + unrated, then unticked */
function weakSort(list){
  return list.slice().sort((a, b) => {
    const ta = isTicked(a.id), tb = isTicked(b.id); if (ta !== tb) return ta ? -1 : 1;
    const va = rAt(a.id), vb = rAt(b.id);
    if ((va == null) !== (vb == null)) return va == null ? 1 : -1;
    return (va ?? 0) - (vb ?? 0);
  });
}
const rCol = v => v == null ? 'var(--dim)' : `hsl(${Math.round(348 + (v/10)*(152-348+360) ) % 360} 95% 68%)`;
function readiness(subj, T){
  const vals = chapters(subj).map(c => rEff(c.id, T)).filter(v => v != null);
  return vals.length ? vals.reduce((a,b) => a + b, 0) / vals.length : 0;
}

/* ================= plan model ================= */
function migrate(){
  const p = S.plan; let changed = false;
  if (!p.tree) { p.tree = emptyTree(); changed = true; }
  for (let i=0;i<7;i++) if (!p.tree[i]) p.tree[i] = emptyNode();
  if (!Array.isArray(p.types) || !p.types.length) { p.types = defaultTypes(); changed = true; }
  if (!Array.isArray(p.rsubj)) { p.rsubj = defaultRS(); changed = true; }
  ['ov','extra','log','dayLog','dayFlags','dayRoutine','dplan'].forEach(k => { if (!p[k]) p[k] = {}; });
  if (Array.isArray(p.flags)) { const seen = new Set(); const f = p.flags.map(x => String(x).trim()).filter(x => { const k = x.toLowerCase(); if (!x || seen.has(k)) return false; seen.add(k); return true; }); if (f.length !== p.flags.length) changed = true; p.flags = f; }
  if (!Array.isArray(p.special)) p.special = [];
  if (!Array.isArray(p.tagRoutes)) p.tagRoutes = [];
  if (!Array.isArray(p.tagAuto)) p.tagAuto = [];
  if (!S.cfg.startDate) { const ds = [...Object.keys(p.log || {}), ...Object.keys(p.ov || {}), ...Object.keys(p.extra || {}), ...Object.keys(p.dplan || {}), ...Object.keys(p.dayLog || {})].sort();
    S.cfg.startDate = ds[0] && ds[0] < today() ? ds[0] : today(); }
  if (!p._partsV2) {
    Object.entries(p.log || {}).forEach(([date, L]) => Object.entries(L).forEach(([bid, lg]) => {
      if (!lg || !lg.segs || bid.includes('~')) return;
      lg.segs.forEach((sg, k) => { if (sg.id == null) sg.id = 's' + k; });
      if (lg.done) lg.segs.forEach(sg => { if (sg.gap) return; const cid = bid + '~' + sg.id; if (!L[cid]) L[cid] = { done:true, prod:lg.prod ?? null, topics:sg.topics || [], subs:sg.subs || [] }; });
      (S.rev.items || []).forEach(r => { if (r.date === date && r.blk && r.blk.startsWith(bid + '~')) { const k = r.blk.split('~')[1]; if (/^\d+$/.test(k) && lg.segs[+k]) r.blk = bid + '~' + lg.segs[+k].id; } });
    }));
    Object.entries(p.dplan || {}).forEach(([date, P]) => Object.entries(P).forEach(([bid, arr]) => {
      arr.forEach(x => { if (!x.id) x.id = uid(); });
      (S.rev.items || []).forEach(r => { if (r.date === date && r.blk && r.blk.startsWith(bid + '~')) { const k = r.blk.split('~')[1]; if (/^\d+$/.test(k) && arr[+k] && !((p.log[date] || {})[bid]?.segs)) r.blk = bid + '~' + arr[+k].id; } });
    }));
    p._partsV2 = true; changed = true;
  }
  if (p.routines) {
    const kmap = { study:'t_self', practice:'t_prac', revision:'t_rev', lecture:'t_lec', break:'t_brk', other:'t_self' };
    const conv = bl => { const s = bl.start || '06:00'; const e = mins(bl.end); return { id: bl.id || uid(), type: kmap[bl.kind] || 't_self', subj: bl.subject || 'any', note: bl.title || '', start: s, dur: e != null && e > mins(s) ? e - mins(s) : 60 }; };
    for (let i=0;i<7;i++) {
      const brs = p.routines[i] || [], t = p.tree[i];
      if (!brs.length || t.blocks.length || t.fork) continue;
      brs.filter(b => b.when === 'always').forEach(b => b.blocks.forEach(bl => t.blocks.push(conv(bl))));
      t.blocks.sort((a,b) => mins(a.start) - mins(b.start));
      const others = brs.filter(b => b.when !== 'always');
      if (others.length) t.fork = { branches: others.map(b => ({ id:uid(), when:b.when, flag:b.flag || '', node:{ blocks:b.blocks.map(conv), fork:null } })) };
    }
    delete p.routines; delete p.blockDone; changed = true;
  }
  return changed;
}
const bTypes = b => (b.types && b.types.length) ? b.types : [b.type];
const bSubjs = b => (b.subjs && b.subjs.length) ? b.subjs.filter(s => s && s !== 'any') : ((b.subj && b.subj !== 'any') ? [b.subj] : []);
const typeNames = b => bTypes(b).map(t => typeOf(t).name).join(' + ');
const subjNames = b => { const s = bSubjs(b).map(rsOf).filter(Boolean); return s.length ? s.map(x => x.name).join(' + ') : 'Any subject'; };
const typeOf = id => S.plan.types.find(t => t.id === id) || { id:'', name:'Untitled', c:'#7C88A3' };
const rsOf = id => (!id || id === 'any') ? null : (S.plan.rsubj.find(s => s.id === id) || null);
const bEnd = b => mins(b.start) + (+b.dur || 0);
const durTxt = d => { d = +d || 0; const h = Math.floor(d/60), m = d % 60; return (h ? h + 'h' : '') + (h && m ? ' ' : '') + (m || !h ? m + 'm' : ''); };

function eventsOn(date){
  return S.plan.events.filter(e => {
    if (e.repeat === 'weekly') return date >= e.date && (!e.until || date <= e.until) && dow(date) === dow(e.date) && !(e.skip || []).includes(date);
    return e.date === date;
  });
}
/* automatic tag schedules: every N weeks on chosen weekdays, or every N days, from a start date */
function autoTagsOn(date){
  const out = [];
  (S.plan.tagAuto || []).forEach(a => {
    if (!a.tag || (a.from && date < a.from) || (a.until && date > a.until)) return;
    const from = a.from || '2000-01-03';
    if (a.kind === 'days') { const n = Math.max(1, +a.every || 1); if (daysBetween(from, date) % n === 0) out.push(a.tag); return; }
    const wk = Math.floor(daysBetween(weekStart(from), weekStart(date)) / 7), n = Math.max(1, +a.every || 1);
    if (wk % n === 0 && (a.days || []).includes(dow(date))) out.push(a.tag);
  });
  return out;
}
/* the day's tags: automatic ones plus ones you switched on, minus ones you switched off (stored as "!tag") */
function dayTags(date){
  const man = S.plan.dayFlags[date] || [], off = man.filter(x => x.startsWith('!')).map(x => x.slice(1));
  return [...new Set([...autoTagsOn(date), ...man.filter(x => !x.startsWith('!'))])].filter(x => !off.includes(x));
}
function dayFacts(date){
  const ev = eventsOn(date), fl = dayTags(date);
  return {
    lecture: ev.some(e => e.type === 'lecture') || fl.includes('#lecture'),
    test: ev.some(e => e.type === 'test') || fl.includes('#test'),
    lectureAuto: ev.some(e => e.type === 'lecture'), testAuto: ev.some(e => e.type === 'test'),
    flags: fl,
  };
}
function branchApplies(b, f){
  switch (b.when) {
    case 'else': return true;
    case 'lecture': return f.lecture; case 'nolecture': return !f.lecture;
    case 'test': return f.test; case 'notest': return !f.test;
    case 'flag': return f.flags.includes(b.flag); case 'noflag': return !f.flags.includes(b.flag);
    case 'custom': { const rs = (b.rules || []).filter(r => r.when); if (!rs.length) return false;
      return b.match === 'any' ? rs.some(r => branchApplies(r, f)) : rs.every(r => branchApplies(r, f)); }
  }
  return false;
}
function ruleShort(r){
  return { lecture:'lecture', nolecture:'no lecture', test:'test', notest:'no test' }[r.when] || (r.when === 'flag' ? `“${r.flag}”` : r.when === 'noflag' ? `not “${r.flag}”` : '?');
}
function condLabel(b){
  if (b.when === 'custom') return b.label ? b.label : 'If ' + ((b.rules || []).map(ruleShort).join(b.match === 'any' ? ' or ' : ' and ') || '…');
  if (b.when === 'flag') return `If “${b.flag || '—'}” is on`;
  if (b.when === 'noflag') return `If “${b.flag || '—'}” is off`;
  return CONDS[b.when] || 'Otherwise';
}
/* walk the fork tree: first matching branch wins (if / else-if / else) */
function routineFrom(){ return S.cfg.startDate ? addDays(S.cfg.startDate, -7) : '0000-00-00'; }
function routePath(date){
  const f = dayFacts(date), blocks = [], forks = [];
  if (date < routineFrom()) return { blocks, forks };
  let n = treeFor(routineKey(date));
  while (n) {
    n.blocks.forEach(b => blocks.push(b));

    `<button class="${V.view===n[0]?'on':''}" data-go="${n[0]}" title="${n[2]}"><span class="g">${n[1]}</span><span>${n[2]}</span></button>`).join('');
  const parts = [];
  if (S.cfg.mainDate) parts.push(`<b>${Math.max(0,daysBetween(today(), S.cfg.mainDate))}</b> days to Main`);
  if (S.cfg.advDate) parts.push(`<b>${Math.max(0,daysBetween(today(), S.cfg.advDate))}</b> days to Advanced`);
  const nt = nextTest(); if (nt) parts.push(`Next test <b>${nt.date===today()?'today':fmtD(nt.date,{day:'numeric',month:'short'})}</b>`);
  $('#sfCount').innerHTML = parts.length ? parts.join('<br>') : 'Add your exam dates in Settings to see a countdown.';
  $('#sfCount').hidden = S.cfg.cdOn === false;
  $('#sfCount').style.display = '';
}
function applyTheme(){
  const h = document.documentElement;
  h.dataset.accent = S.cfg.theme || 'cyan';
  h.classList.toggle('fs-sm', S.cfg.fs === 'sm'); h.classList.toggle('fs-lg', S.cfg.fs === 'lg');
  h.classList.toggle('no-grid', S.cfg.grid === false); h.classList.toggle('no-motion', S.cfg.motion === false); h.classList.toggle('glow-subtle', S.cfg.glow === 'subtle');
}
function render(){
  applyTheme();
  $('#app').classList.toggle('collapsed', !!S.cfg.collapsed);
  renderNav();
  const [t, s] = TITLES[V.view]; $('#title').textContent = t; $('#subtitle').textContent = s;
  $('#topActions').innerHTML = topActions();
  const fn = { overview:vOverview, syllabus:vSyllabus, revision:vRevision, day:vDay, week:vWeek, month:vMonth, routines:vRoutines, plan:vPlan, manual:vManual, files:vFiles, settings:vSettings }[V.view];
  $('#page').innerHTML = fn();

function topActions(){
  if (['day','week','month'].includes(V.view)) return `<button class="btn pri" data-act="newEvent">＋ Add event</button>`;
  if (V.view === 'files') return `<button class="btn pri" data-act="upload">＋ Upload</button>`;

  return '';
}
let afterFns = [];
function after(){ const f = afterFns; afterFns = []; f.forEach(fn => fn()); }

/* ================= overview ================= */
function fieldSVG(){
  const W = 640, H = 230, L = 34, R = 14, T = 14, B = 26, days = 30;
  const x = d => L + (d + days) / (2*days) * (W - L - R);
  const y = v => T + (1 - v/10) * (H - T - B);
  let g = '';
  for (let v=0; v<=10; v+=2) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1A2236" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" fill="#566281" font-size="11" text-anchor="end">${v}</text>`;
  for (let d=-30; d<=30; d+=10) g += `<line x1="${x(d)}" x2="${x(d)}" y1="${T}" y2="${H-B}" stroke="${d===0?'#3a4766':'#141b2c'}" stroke-width="1" ${d===0?'stroke-dasharray="3 3"':''}/><text x="${x(d)}" y="${H-8}" fill="${d===0?'#8A97B1':'#566281'}" font-size="11" text-anchor="middle">${d===0?'now':(d>0?'+':'−')+Math.abs(d)+'d'}</text>`;
  const now = Date.now(); let lines = '';
  const cols = { phy:'#4DE3FF', chem:'#7DFFB0', math:'#C39DFF' };
  for (const s of ['phy','chem','math']) {
    const past = [], fut = [];
    for (let d=-days; d<=days; d++) {
      const v = readiness(s, now + d*864e5);
      (d <= 0 ? past : fut).push(`${x(d).toFixed(1)},${y(v).toFixed(1)}`);
      if (d === 0) fut.push(`${x(d).toFixed(1)},${y(v).toFixed(1)}`);
    }
    lines += `<polyline points="${past.join(' ')}" fill="none" stroke="${cols[s]}" stroke-width="2" stroke-linejoin="round" pathLength="1" class="draw-line" style="filter:drop-shadow(0 0 6px ${cols[s]}aa)"/>`;
    lines += `<polyline points="${fut.join(' ')}" fill="none" stroke="${cols[s]}" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/>`;
    const v0 = readiness(s, now);
    lines += `<circle cx="${x(0)}" cy="${y(v0)}" r="3.5" fill="${cols[s]}"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Average preparation rating per subject, past 30 days and projected decay for the next 30">${g}${lines}</svg>`;
}
function vOverview(){
  const t = today(), nt = nextTest();
  const cd = [];
  const cdItem = (label, date, sub) => {
    const n = daysBetween(t, date);
    return `<div class="ci"><div class="l"><b>${label}</b>${sub}</div><div class="v num">${Math.max(0,n)}<small>${n===1?'day':'days'}</small></div></div>`;
  };
  if (S.cfg.mainDate) cd.push(cdItem('JEE Main', S.cfg.mainDate, fmtD(S.cfg.mainDate,{day:'numeric',month:'long',year:'numeric'})));
  if (S.cfg.advDate) cd.push(cdItem('JEE Advanced', S.cfg.advDate, fmtD(S.cfg.advDate,{day:'numeric',month:'long',year:'numeric'})));
  if (nt) cd.push(cdItem('Next test', nt.date, esc(nt.ev.title || 'Test') + (nt.ev.start ? ' · ' + nt.ev.start : '')));
  if (!S.cfg.mainDate && !S.cfg.advDate) cd.push(`<div class="ci"><div class="l">Set your JEE Main and Advanced dates to start the countdown.</div><button class="btn sm" data-go="settings">Set dates</button></div>`);

  const items = itemsFor(t);
  const untimed = revOn(t).filter(i => !i.start);
  const agenda = items.length || untimed.length ? items.map(i => `<div class="ag"><span class="t">${i.start}${i.end?'–'+i.end:''}</span><span><i class="dot" style="background:${i.c}"></i>${esc(i.title)}</span></div>`).join('') +
    untimed.map(i => `<div class="ag"><span class="t">any time</span><span><i class="dot" style="background:var(--rev)"></i>Revise · ${esc(chapterById(i.ch)?.name || '')}</span></div>`).join('')
    : `<div class="empty" style="padding:18px"><p>Nothing planned for today.</p><button class="btn sm" data-go="routines">Build a routine</button></div>`;

  const cov = ['phy','chem','math'].map(s => {
    const m = coverage(s,'main'), a = coverage(s,'adv');
    return `<div class="cov-row"><div class="h"><span><span class="sg" style="color:${SUBJ[s].c}">${SUBJ[s].g}</span> ${SUBJ[s].name}</span><span class="mute num">${m.done}/${m.total} ch</span></div>
      <div class="bar2"><div class="bar"><i style="width:${m.frac*100}%;background:${SUBJ[s].c};box-shadow:0 0 8px ${SUBJ[s].c}"></i></div><div class="bar-l"><span>Main</span><span class="num">${Math.round(m.frac*100)}%</span></div>
      <div class="bar"><i style="width:${a.frac*100}%;background:${SUBJ[s].c};opacity:.6"></i></div><div class="bar-l"><span>Advanced</span><span class="num">${Math.round(a.frac*100)}%</span></div></div></div>`;
  }).join('');

  const rated = weakSort(allChapters().filter(c => isTicked(c.id))).map(c => ({ c, v: rAt(c.id) }));
  const weak = rated.slice(0,7).map(({c,v}) => `<div class="w"><span class="sg" style="color:${SUBJ[c.subj].c}">${SUBJ[c.subj].g}</span><span class="n">${esc(c.name)}</span>
    <span class="rscore" style="color:${rCol(v)}">${v==null?'—':v.toFixed(1)}</span><button class="icon-btn" title="Rate up" data-bump="${c.id}" data-d="1">+</button><button class="btn sm" data-revset="${c.id}">Revise</button></div>`).join('')
    || `<div class="empty" style="padding:18px"><p>Tick chapters as coaching finishes them and rate them. Your weakest ticked chapters show up here.</p><button class="btn sm" data-go="syllabus">Open syllabus</button></div>`;

  const over = S.rev.items.filter(i => !i.done && i.date < t).length;
  const leg = ['phy','chem','math'].map(s => `<span><i style="background:${SUBJ[s].c}"></i>${SUBJ[s].name} <b class="num">${readiness(s, Date.now()).toFixed(2)}</b></span>`).join('');
  return `<div class="ov">
    <section class="panel hero"><div class="row" style="align-items:flex-start"><div class="grow"><h2>Preparation field</h2>
      <div class="formula">r(t) = r<sub>0</sub> · 2<sup>−t/τ</sup>, &nbsp; τ = <b>${S.cfg.half}</b> days</div></div></div>
      <div class="field" style="margin-top:6px">${fieldSVG()}</div>
      <div class="legend">${leg}<span class="dim">mean prep of rated chapters (unticked chapters don’t decay), dashed = projected if you don’t revise</span></div></section>
    <section class="panel count">${cd.join('')}</section>
    <div class="full ov3">
      <section class="panel"><div class="panel-h"><h3>Today</h3><span class="grow"></span>${(() => { const st = dayStats(t); return st.effKnown ? `<span class="chip" style="color:var(--ok)" title="Duration × productivity of logged sessions">${durTxt(st.effMin)} effective</span>` : ''; })()}<button class="btn sm ghost" data-go="day">Open day</button></div><div class="panel-b agenda">${agenda}</div></section>
      <section class="panel"><div class="panel-h"><h3>Syllabus covered</h3></div><div class="panel-b cov">${cov}</div></section>
      <section class="panel"><div class="panel-h"><h3>Weakest chapters</h3><span class="grow"></span>${over?`<span class="rchip over">${over} overdue</span>`:''}</div><div class="panel-b weak">${weak}</div></section>
    </div></div>`;
}

/* ================= syllabus ================= */
function rateCtl(id){
  const v = rAt(id);
  const n = v == null ? 0 : v;
  const pips = Array.from({length:10}, (_,i) => { const f = clamp(n - i, 0, 1); return `<i style="${f>0?`background:linear-gradient(90deg, ${rCol(v)} ${f*100}%, rgba(255,255,255,.07) ${f*100}%);box-shadow:0 0 4px ${rCol(v)}55`:''}"></i>`; }).join('');
  const h = S.syl.prog[id]?.h; const last = h && h.length ? h[h.length-1] : null;
  const paused = rPaused(id);
  const tip = last ? (paused ? `Paused at ${last[1]} until you tick this chapter` : `Set to ${last[1]} on ${new Date(last[0]).toLocaleDateString()}, now decaying`) : 'Not rated yet';
  return `<div class="rate" title="${tip}"><button class="icon-btn" aria-label="Lower rating" data-bump="${id}" data-d="-1">−</button>
    <div class="val"><div class="v"><span>${paused?'paused':'prep'}</span><b class="num" style="color:${rCol(v)}">${v==null?'—':v.toFixed(1)}</b></div><div class="pips">${pips}</div></div>
    <button class="icon-btn" aria-label="Raise rating" data-bump="${id}" data-d="1">+</button></div>`;
}
function vSyllabus(){
  const tabs = ['phy','chem','math'].map(s => { const c = coverage(s, V.exam);
    return `<button class="${V.subj===s?'on':''}" style="--c:${SUBJ[s].c}" data-subj="${s}"><span class="sg">${SUBJ[s].g}</span><span>${SUBJ[s].name}<br><small class="num">${Math.round(c.frac*100)}% · ${c.done}/${c.total}</small></span></button>`; }).join('');
  const q = V.q.trim().toLowerCase();
  let chs = chapters(V.subj).filter(c => inExam(c, V.exam));
  if (V.tick === 'ticked') chs = chs.filter(c => isTicked(c.id)); else if (V.tick === 'unticked') chs = chs.filter(c => !isTicked(c.id));
  if (q) chs = chs.filter(c => c.name.toLowerCase().includes(q) || c.subs.some(s => s.name.toLowerCase().includes(q)));
  const col = SUBJ[V.subj].c;
  const cov = coverage(V.subj, V.exam);
  const allSubs = chapters(V.subj).filter(c => inExam(c,V.exam)).flatMap(c => c.subs.filter(s => subIn(s,V.exam)).map(s => ({c,s})));
  const subsDone = allSubs.filter(({c,s}) => S.syl.prog[c.id]?.done || S.syl.prog[c.id]?.subs?.[s.id]).length;
  const rated = chapters(V.subj).map(c => rEff(c.id)).filter(v => v != null);
  const rows = chs.map(c => {
    const p = S.syl.prog[c.id] || {}; const subs = c.subs.filter(s => subIn(s, V.exam));
    const dn = subs.filter(s => p.done || p.subs?.[s.id]).length;
    const open = V.open.has(c.id) || (q && c.subs.some(s => s.name.toLowerCase().includes(q)));
    const tags = (c.exam==='main'?'<span class="tag M">Main only</span>':c.exam==='adv'?'<span class="tag A">Adv only</span>':'') + (c.custom?'<span class="chip">coaching</span>':'');
    const subsHtml = subs.map(s => { const on = !!(p.done || p.subs?.[s.id]), sv = rAt(s.id), sp = rPaused(s.id);
      return `<div class="sub ${on?'done':''}"><input type="checkbox" class="chk" style="--c:${col}" id="s_${s.id}" data-sub="${c.id}|${s.id}" ${on?'checked':''}><label for="s_${s.id}">${esc(s.name)} ${s.tag==='adv'?'<span class="tag A">A</span>':s.tag==='main'?'<span class="tag M">M</span>':''}</label>
        <span class="srate" title="${sv==null?'Subtopic prep: not rated':sp?'Paused until ticked':'Subtopic prep, decays while ticked'}"><button class="icon-btn ghost" data-bump="${s.id}" data-d="-1" aria-label="Lower subtopic prep">−</button><b class="num" style="color:${rCol(sv)}">${sv==null?'—':sv.toFixed(1)}</b><button class="icon-btn ghost" data-bump="${s.id}" data-d="1" aria-label="Raise subtopic prep">+</button></span>
        ${s.custom?`<button class="icon-btn ghost x" title="Remove subtopic" data-delsub="${c.id}|${esc(s.name)}">×</button>`:''}</div>`; }).join('');
    return `<div class="ch ${open?'open':''} ${chFrac(c,V.exam)>=1?'done':''}">
      <div class="ch-h"><input type="checkbox" class="chk" style="--c:${col}" data-chdone="${c.id}" ${p.done?'checked':''} aria-label="Mark ${esc(c.name)} complete">
        <div class="ch-name" data-toggle="${c.id}"><span class="t">${esc(c.name)}</span>${tags}</div>
        <span class="ch-prog">${dn}/${subs.length}</span>${rateCtl(c.id)}
        <button class="icon-btn ghost" data-toggle="${c.id}" aria-label="Show subtopics"><svg class="caret" width="14" height="14" viewBox="0 0 14 14"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
      <div class="subs">${subsHtml || '<div class="dim" style="font-size:13.5px;padding:4px 0">No subtopics yet.</div>'}
        <div class="add-sub"><input class="inp" placeholder="Add a subtopic from your coaching notes" data-addsub-in="${c.id}"><button class="btn sm" data-addsub="${c.id}">Add</button>
        ${c.custom?`<button class="btn sm" data-editch="${c.id}">Edit chapter</button><button class="btn sm danger" data-delch="${c.id}">Delete chapter</button>`:''}</div></div></div>`;
  }).join('');
  return `<div class="subj-tabs">${tabs}</div>
    <div class="syl-tools"><div class="seg">${[['all','Main + Advanced'],['main','JEE Main'],['adv','JEE Advanced']].map(([k,l]) => `<button class="${V.exam===k?'on':''}" data-exam="${k}">${l}</button>`).join('')}</div>
      <input class="inp" style="flex:1;min-width:180px;max-width:340px" placeholder="Search chapters and subtopics" value="${esc(V.q)}" id="sylQ">
      <div class="seg">${[['all','All chapters'],['ticked','Ticked'],['unticked','Not ticked']].map(([k,l]) => `<button class="${V.tick===k?'on':''}" data-tick="${k}">${l}</button>`).join('')}</div>
      <span class="grow"></span><button class="btn sm ghost" data-act="expandAll">${V.open.size?'Collapse all':'Expand all'}</button></div>
    <div class="syl-sum"><span><b class="num">${Math.round(cov.frac*100)}%</b>covered</span><span><b class="num">${cov.done}/${cov.total}</b>chapters complete</span><span><b class="num">${subsDone}/${allSubs.length}</b>subtopics</span><span><b class="num">${rated.length?(rated.reduce((a,b)=>a+b,0)/rated.length).toFixed(1):'—'}</b>avg prep of rated chapters</span></div>
    <div class="chs">${rows || '<div class="empty" style="border:0">No chapters match.</div>'}<button class="add-ch" data-addch="${V.subj}">＋ Add a chapter from your coaching to ${SUBJ[V.subj].name}</button></div>
    <p class="dim" style="font-size:13px;margin-top:14px">Chapters follow your coaching’s list. M and A tags mark topics that appear only in JEE Main or only in JEE Advanced. Ratings of ticked chapters lose half their value every ${S.cfg.half} days. Unticked chapters keep their rating frozen.</p>`;
}

/* ================= revision ================= */
function pendingRev(ch, exam){ return S.rev.items.find(i => i.ch === ch && !i.done && (i.exam === exam || i.exam === 'both')); }
function vRevision(){
  const t = today(), ex = V.revExam;
  const pend = S.rev.items.filter(i => !i.done).sort((a,b) => a.date.localeCompare(b.date) || (a.start||'').localeCompare(b.start||''));
  const byDate = {}; pend.forEach(i => (byDate[i.date] ||= []).push(i));
  const queue = Object.keys(byDate).slice(0,14).map(d => `<div class="qday"><h4 class="${d===t?'today':''}">${d<t?'Overdue · ':''}${d===t?'Today':fmtD(d)}</h4>${byDate[d].map(i => { const c = chapterById(i.ch);
    return `<div class="qi"><input type="checkbox" class="chk" style="--c:var(--rev)" data-revdone="${i.id}" title="Mark revised"><span class="sg" style="color:${c?SUBJ[c.subj].c:''}">${c?SUBJ[c.subj].g:''}</span><span class="grow" style="cursor:pointer" data-revgo="${i.id}" title="Open this day">${esc(c?.name||'Removed chapter')}${i.start?` <span class="dim">${i.start}</span>`:''}</span><button class="icon-btn ghost" data-revcancel="${i.id}" title="Cancel this revision" aria-label="Cancel revision">×</button></div>`; }).join('')}</div>`).join('');
  const cols = ['phy','chem','math'].map(s => {
    let chs = chapters(s).filter(c => inExam(c, ex));
    if (V.revTicked) chs = chs.filter(c => isTicked(c.id));
    if (V.revSort === 'weak') chs = weakSort(chs);
    const rows = chs.map(c => { const it = pendingRev(c.id, ex), v = rAt(c.id), fr = chFrac(c, ex);
      /* every pending revision of this chapter, plus a button to add another */
      const pend = S.rev.items.filter(i => i.ch === c.id && !i.done && (i.exam === ex || i.exam === 'both' || !i.exam)).sort((x,y) => (x.date + (x.start||'')).localeCompare(y.date + (y.start||'')));
      const one = i0 => `<span class="rchip-w"><button class="rchip ${i0.date<t?'over':''}" data-revgo="${i0.id}" title="Open this day in the Day planner">${i0.date===t?'Today':fmtD(i0.date,{day:'numeric',month:'short'})}${i0.start?' · '+i0.start:''}</button><button class="icon-btn ghost" data-revcancel="${i0.id}" title="Cancel this revision" aria-label="Cancel revision">×</button></span>`;
      const chip = pend.length
        ? `<span class="rv-chips"><button class="rv-mark ${pend.some(i0 => i0.date < t) ? 'late' : ''}" data-revlist="${c.id}" title="Marked for revision ${pend.length}× — click to see the days">↺ ${pend.length}</button><button class="btn sm ghost" data-revset="${c.id}" title="Schedule another revision of this chapter">＋</button></span>`
        : `<span class="rv-chips"><button class="btn sm ghost" data-revset="${c.id}" title="Schedule a revision">＋ Revise</button></span>`;
      return `<div class="rv ${isTicked(c.id)?'':'unt'}"><div class="n">${esc(c.name)}<small>${isTicked(c.id)?'✓ ticked':Math.round(fr*100)+'% covered'}${S.rev.items.filter(i=>i.ch===c.id&&i.done).length?` · revised ${S.rev.items.filter(i=>i.ch===c.id&&i.done).length}×`:''}</small></div><span class="rscore" style="color:${rCol(v)}">${v==null?'—':v.toFixed(1)}</span><button class="icon-btn ghost rb-trk ${(rvMetaGet(c.id)||{}).track?'on':''}" data-rbtrack="${c.id}" title="${(rvMetaGet(c.id)||{}).track?'On the revision board — click to take it off':'Put it on the revision board'}" aria-label="Revision board">${(rvMetaGet(c.id)||{}).track?'◉':'◎'}</button>${chip}</div>`; }).join('');
    return `<section class="panel rev-col" style="--c:${SUBJ[s].c}"><h3><span class="sg">${SUBJ[s].g}</span>${SUBJ[s].name}<span class="grow"></span><span class="chip">${chs.filter(c=>pendingRev(c.id,ex)).length} set</span></h3>${rows||`<div class="empty" style="margin:14px">${V.revTicked?'No ticked chapters yet.':'No chapters here yet.'}</div>`}<button class="add-ch" data-addch="${s}">＋ Add coaching chapter</button></section>`;
  }).join('');
  return `${rvBoardHTML()}<div class="row" style="margin-bottom:16px"><div class="seg">${[['main','JEE Main'],['adv','JEE Advanced']].map(([k,l]) => `<button class="${ex===k?'on':''}" data-revexam="${k}">${l}</button>`).join('')}</div>
      <div class="seg">${[['order','Syllabus order'],['weak','Weakest first']].map(([k,l]) => `<button class="${V.revSort===k?'on':''}" data-revsort="${k}">${l}</button>`).join('')}</div>
      <label class="row" style="gap:8px;font-size:13.5px;color:var(--mute)"><input type="checkbox" class="chk" id="revTicked" ${V.revTicked?'checked':''}> Only ticked chapters</label>
      <span class="grow"></span></div>
    ${pend.length ? `<div class="queue">${queue}</div>` : `<div class="empty" style="margin-bottom:18px"><p>No revisions scheduled. Pick chapters below and they’ll appear in your day, week and month planners.</p></div>`}
    <div class="rev-cols">${cols}</div>
    <p class="dim" style="font-size:13px;margin-top:14px">Weakest first lists ticked chapters from lowest prep up, then ticked chapters with no rating, then unticked ones. A chapter counts as ticked once any of its subtopics is ticked. Click a scheduled date to open that day; × cancels it.</p>`;
}

<script>
/* ================= date picker ================= */
function dateBtn(id, val, extra = '', ph = 'Pick a date'){
  return `<button type="button" class="inp datebtn" id="${id}" data-datepick data-value="${val || ''}" data-ph="${esc(ph)}" ${extra}>${val ? fmtD(val, { weekday:'short', day:'numeric', month:'short', year:'numeric' }) : esc(ph)}</button>`;
}
function setDateBtn(btn, v){ btn.dataset.value = v; btn.textContent = v ? fmtD(v, { weekday:'short', day:'numeric', month:'short', year:'numeric' }) : btn.dataset.ph; }
let DP = null;
function closeDP(){ if (DP) { DP.pop.remove(); DP = null; } }
function openDP(btn){
  if (DP && DP.btn === btn) return closeDP();
  closeDP();
  let cur = (btn.dataset.value || today()).slice(0,7);
  const pop = document.createElement('div'); pop.className = 'dp'; document.body.appendChild(pop); DP = { pop, btn };
  const draw = () => {
    const [y, m] = cur.split('-').map(Number), first = `${y}-${pad(m)}-01`, st = weekStart(first), t = today();

/* ================= time grid ================= */
function layout(items){
  const out = []; let cluster = [], cEnd = -1;
  const flushC = () => { const lanes = [];
    cluster.forEach(it => { let l = lanes.findIndex(e => e <= it.s); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = it.e; it.lane = l; });
    cluster.forEach(it => { it.lanes = lanes.length; out.push(it); }); cluster = []; };
  items.map(i => { const s = mins(i.start); let e = mins(i.end); if (e == null || e <= s) e = s + 45; return { ...i, s, e }; })
    .sort((a,b) => a.s - b.s || b.e - a.e)
    .forEach(it => { if (cluster.length && it.s >= cEnd) flushC(); cluster.push(it); cEnd = Math.max(cEnd, it.e); });
  flushC(); return out;
}
/* columns: plain dates (planned) or { date, mode:'plan'|'actual', label } */
function timeGrid(colsIn, H = 46){
  const cols = colsIn.map(c => typeof c === 'string' ? { date:c, mode:'plan' } : c);
  const t = today(), dates = [...new Set(cols.map(c => c.date))], multiDay = dates.length > 1;
  const itemsOf = c => c.mode === 'actual' ? actualItemsFor(c.date) : itemsFor(c.date);
  const colItems = cols.map(itemsOf), all = colItems.flat();
  const gs = Math.min(S.cfg.gStart, ...all.map(i => Math.floor(mins(i.start)/60)));
  const ge = Math.min(24, Math.max(S.cfg.gEnd, ...all.map(i => Math.ceil((mins(i.end) ?? mins(i.start)+60)/60))));
  const head = cols.map(c => { const d = c.date, f = dayFacts(d), dl = S.plan.dayLog[d];
    const fl = [f.lecture?'<span class="tag M">Lecture</span>':'', f.test?'<span class="tag" style="color:var(--test);background:rgba(255,198,107,.12)">Test</span>':'', dl && dl.prod != null ? `<span class="tag" style="color:var(--ok);background:rgba(125,255,176,.1)">${dl.prod}%</span>` : '', ...f.flags.filter(x => !x.startsWith('#')).slice(0,2).map(x => `<span class="tag" style="color:#ffd9a0;background:rgba(255,198,107,.1)">${esc(x)}</span>`)].join('');
    const rk = S.plan.dayRoutine[d] ? routineKey(d) : null, selOn = V.selMode && V.sel.has(d);
    const modeTag = `<span class="mode-tag ${c.mode}">${c.label || (c.mode === 'actual' ? 'Actual' : 'Planned')}</span>`;
    if (!multiDay) return `<div class="${d===t?'today':''} colhead ${c.mode}">${modeTag}<b>${c.mode === 'actual' ? 'What you did' : 'What you planned'}</b><div class="hflags">${c.mode==='actual' ? (() => { const st = dayStats(d); return `<span class="tag" style="color:var(--ok);background:rgba(125,255,176,.1)">${durTxt(st.doneMin)} studied</span>${st.effKnown ? `<span class="tag" style="color:#bff5d6;background:rgba(125,255,176,.08)">${durTxt(st.effMin)} effective</span>` : ''}`; })() : fl}</div></div>`;
    return `<div class="${d===t?'today':''} ${selOn?'selected':''}" data-daypop="${d}" title="${V.selMode ? 'Click to select' : 'Options for this day'}">${WD[dow(d)]}${rk!=null?` <span class="dim" title="Routine changed">· ${esc(keyShort(rk))}</span>`:''}<b class="num">${pd(d).getDate()}</b>${modeTag}<div class="hflags">${fl}</div></div>`; }).join('');
  const hours = Array.from({ length: ge-gs }, (_,i) => `<div style="height:${H}px">${i ? pad((gs+i)%24)+':00' : ''}</div>`).join('');
  const body = cols.map((c, ci) => { const d = c.date, isAct = c.mode === 'actual';
    const its = layout(colItems[ci]).map(it => {
      if (it.e <= gs*60 || it.s >= ge*60) return '';
      const top = (Math.max(it.s, gs*60) - gs*60) / 60 * H, h = Math.max(22, (Math.min(it.e, ge*60) - Math.max(it.s, gs*60)) / 60 * H - 2);
      const w = 100 / it.lanes, left = it.lane * w, hh = (it.e - it.s) / 60 * H;
      let wk = { name:true, details:true, time:true };
      if (multiDay && it.kind === 'bl') wk = it.wk || (it.brk ? { name:false, details:false, time:false } : wk);
      const showName = wk.name && hh >= 16, showTime = wk.time && hh >= (showName ? 34 : 18), showDet = wk.details && hh >= (showName ? 22 : 6) + (showTime ? 16 : 0) + 18;
      const bare = !showName && !showTime && !showDet;
      const tip = [it.title + (it.part ? ' · part ' + it.part : ''), `${it.start}–${it.end}`, it.kind==='bl' ? it.sub : '', it.note || '', it.plannedMin != null ? `planned ${durTxt(it.plannedMin)}` : '', it.studied != null ? `studied ${durTxt(it.studied)}` : '', it.over > 0 ? `${durTxt(it.over)} past the plan` : '', it.eff != null ? `effective ${durTxt(it.eff)}` : ''].filter(Boolean).join(' · ');
      const fire = it.kind !== 'ev' && it.done && it.plannedMin && !it.brk && hh >= 18 ? fireHTML(it.studied ?? it.plannedMin, it.plannedMin) : '';
      const ctl = !isAct && it.kind!=='ev' && hh >= 18 && !bare ? `<span class="bctl">${fire}${!multiDay && !it.free ? `<span class="bdel" data-bdel="${it.kind}|${it.id}|${d}" title="${it.kind==='rv'?'Cancel this revision':'Remove this session from the day'}" role="button" aria-label="Remove session">×</span>` : ''}<span class="bchk" data-bdone="${it.kind}|${it.id}|${d}" title="${it.done?'Mark not done':'Mark complete'}"></span></span>` : (isAct && fire ? `<span class="bctl">${fire}</span>` : '');
      const op = isAct && it.kind !== 'ev' && it.ratio != null ? (0.1 + 0.9 * clamp(it.ratio, 0, 1)).toFixed(2) : '';
      const pct = it.prod != null ? ` · <span style="color:var(--ok)" title="Productivity and effective study time">${it.prod}%${it.eff!=null?' → '+durTxt(it.eff):''}</span>` : '';
      /* the stretch studied beyond the plan: a dashed line where the plan ended, and the extra time */
      const overMark = isAct && it.over > 0 && it.planLen ? `<span class="overline" style="top:${Math.min(h - 2, it.planLen / 60 * H)}px" title="Planned to stop here"></span>` : '';
      const overTxt = isAct && it.over > 0 ? ` · <span class="overtxt" title="Studied past the planned length">+${durTxt(it.over)}</span>` : '';
      return `<div class="it ${it.kind==='bl'?'bl':'ev'} ${it.done && !isAct?'done':''} ${isAct?'act':''} ${isAct && it.over > 0?'over':''} ${it.planned?'planned':''} ${bare?'bare':''}" style="--c:${it.c};top:${top}px;height:${h}px;left:calc(${left}% + 3px);width:calc(${w}% - 6px)${op ? `;--op:${op}` : ''}" data-item="${it.kind}|${it.id}|${d}" title="${esc(tip)}">
        ${overMark}${ctl}${showName?`<b>${esc(it.title)}${it.part?` <span class="dim" title="Part of a split block">· ${it.part}</span>`:''}${it.ov?' <span class="dim" title="Changed for this day">✎</span>':''}</b>`:''}${showTime?`<span class="tm">${it.start}–${it.end}${overTxt}${pct}</span>`:''}
        ${showDet && it.kind==='bl'?`<span class="isub" style="${it.subC?`color:${it.subC}`:''}">${esc(it.sub)}</span>`:''}${showDet && it.note?`<span class="inote">${esc(it.note)}</span>`:''}</div>`;
    }).join('');
    let now = '';
    if (d === t) { const n = new Date(), m = n.getHours()*60 + n.getMinutes(); if (m >= gs*60 && m <= ge*60) now = `<div class="now-line" style="top:${(m-gs*60)/60*H}px"></div>`; }
    const empty = isAct && !colItems[ci].some(i => i.kind !== 'ev') ? `<div class="act-empty">${d > t ? 'This day hasn’t happened yet' : 'Nothing logged yet. Tick blocks in the planned column, or click here to log a session.'}</div>` : '';
    return `<div class="tg-col ${d===t?'today':''} ${isAct?'actual':''}" data-col="${d}" data-mode="${c.mode}" data-h="${H}" data-gs="${gs}" style="height:${(ge-gs)*H}px;--h:${H}px">${its}${now}${empty}</div>`;
  }).join('');
  afterFns.push(() => { const sc = document.querySelector('.tg-scroll'); if (sc && !sc.dataset.kept) { const n = new Date(); const m = dates.includes(t) ? n.getHours()*60+n.getMinutes() : 8*60; sc.scrollTop = Math.max(0, (m - gs*60)/60*H - 120); } });
  return `<div class="tg ${multiDay?'':'split'}" style="--n:${cols.length}"><div class="tg-scroll"><div class="tg-head">${'<div></div>'+head}</div>
    <div class="tg-body"><div class="tg-hours">${hours}</div>${body}</div></div></div>`;
}

/* ================= daily plan ================= */
function vPlan(){
  const d = V.planDay, blocks = dayBlocks(d, false).filter(x => !x.actual), plans = S.plan.dplan[d] || {};
  const hOpts = v => Array.from({ length:7 }, (_,i) => `<option value="${i}" ${i===v?'selected':''}>${i} h</option>`).join('');
  const mOpts = v => { const set = new Set([...Array.from({ length:12 }, (_,i) => i*5), v]); return [...set].sort((a,b)=>a-b).map(m => `<option value="${m}" ${m===v?'selected':''}>${pad(m)} m</option>`).join(''); };
  const tOpts = v => S.plan.types.map(t => `<option value="${t.id}" ${t.id===v?'selected':''}>${esc(t.name)}</option>`).join('');
  const sOpts = v => `<option value="any">Any subject</option>` + S.plan.rsubj.map(s => `<option value="${s.id}" ${s.id===v?'selected':''}>${esc(s.name)}</option>`).join('');

  const revs = revOn(d), allIds = new Set(dayBlocks(d).map(x => x.id).concat(blocks.map(x => x.id)));
  const revLine = i => { const c = chapterById(i.ch);
    return `<div class="dp-rev ${i.done?'done':''}"><input type="checkbox" class="chk" style="--c:var(--rev)" data-revdone="${i.id}" ${i.done?'checked':''} title="Mark revised"><span class="sg" style="color:${c?SUBJ[c.subj].c:''}">${c?SUBJ[c.subj].g:''}</span>
      <span class="grow" data-revlog="${i.id}" title="Log it like a study block">↺ Revise <b>${esc(c?.name || 'chapter')}</b>${i.done && i.log?.prod != null ? ` <span style="color:var(--ok)">${i.log.prod}%</span>` : ''}</span>${i.done ? fireHTML(revTimes(i).studied, revTimes(i).planned, 'sm') : ''}<span class="num dim">${i.start ? i.start + '–' + (i.end || '') : 'any time'}</span><button class="icon-btn ghost" data-revcancel="${i.id}" aria-label="Cancel revision" title="Cancel this revision">×</button></div>`; };
  const inBlock = bid => revs.filter(i => i.blk && i.blk.split('~')[0] === bid && allIds.has(i.blk));
  const loose = revs.filter(i => !(i.blk && allIds.has(i.blk)));
  const rows = blocks.map(b => {
    const t = typeOf(b.type), items = plans[b.id] || [], lg = (S.plan.log[d] || {})[b.id], logged = !!(lg && lg.segs && lg.segs.length);
    const used = items.reduce((a, x) => a + (+x.dur || 0), 0), free = +b.dur - used;
    let cur = mins(b.start);
    const its = items.map((x, k) => { const st = hm(cur); cur += +x.dur || 0; const h = Math.floor((+x.dur||0)/60), m = (+x.dur||0) % 60;
      if (x.gap) return `<div class="dp-item gap" data-pi="${b.id}|${k}"><span></span><span class="dp-it-time num">${st}</span><span class="dim" style="grid-column:3/6">Empty · ${durTxt(x.dur)} (part removed from the day)</span><button class="btn sm ghost" data-pclose="${b.id}|${k}" title="Remove the empty time so later items move up">Close gap</button><span></span></div>`;
      return `<div class="dp-item" data-pi="${b.id}|${k}" style="--c:${typeOf(x.type).c}"><span class="grip" title="Drag to reorder" aria-label="Drag to reorder">⋮⋮</span><span class="dp-it-time num">${st}</span>
        <select class="inp" data-pf="type" aria-label="Type">${tOpts(x.type)}</select><select class="inp" data-pf="subj" aria-label="Subject">${sOpts(x.subj)}</select>
        <input class="inp dp-note" data-pf="note" list="chapList" value="${esc(x.note||'')}" placeholder="What exactly? e.g. Rotational motion, HCV Ch 10 Q1–20">
        <span class="dp-dur"><select class="inp" data-pf="h" aria-label="Hours">${hOpts(h)}</select><select class="inp" data-pf="m" aria-label="Minutes">${mOpts(m)}</select></span>
