/* ================= month ================= */
function vMonth(){
  const [y, m] = V.month.split('-').map(Number), first = `${y}-${pad(m)}-01`, start = weekStart(first), t = today();
  const cells = Array.from({length:42}, (_,i) => addDays(start, i));
  V.viewDates = cells.filter(d => d.slice(0,7) === V.month);
  const body = cells.map(d => {
    const ev = eventsOn(d).sort((a,b)=>(a.start||'').localeCompare(b.start||'')), rv = revOn(d).sort((a,b)=>(a.start||'').localeCompare(b.start||'')), f = dayFacts(d), dl = S.plan.dayLog[d];
    const tags = f.flags.filter(x => !x.startsWith('#'));
    const rtag = (() => { const v = S.plan.dayRoutine[d]; if (!v) return ''; if (v.startsWith('wd:')) return `<span class="mtag rt">↻ ${WD[+v.slice(3)]}</span>`; const sp = S.plan.special.find(x => x.id === v); return sp ? `<span class="mtag rt" style="--c:${sp.c}">★ ${esc(sp.name)}</span>` : ''; })();
    const evs = ev.map(e => `<div class="me" style="--c:${TYPES[e.type].c}">${e.start?`<span class="num">${e.start}</span> `:''}${esc(e.title||TYPES[e.type].name)}</div>`);
    const rvs = rv.map(i => `<div class="me rvm ${i.done?'done':''}" style="--c:var(--rev)" title="Revision${i.start?' '+i.start+'–'+(i.end||''):''}">${i.done?'✓':'↺'} ${esc(chapterById(i.ch)?.name || 'chapter')}${i.start?` <span class="num dim">${i.start}</span>`:''}</div>`);
    const lines = [...rvs, ...evs], shown = lines.slice(0, 4);
    const sel = V.selMode && V.sel.has(d);
    return `<div class="mc ${d.slice(0,7)!==V.month?'out':''} ${d===t?'today':''} ${f.test?'test':''} ${sel?'selected':''} ${V.selMode?'selmode':''}" data-daypop="${d}">
      <div class="d"><b class="num">${pd(d).getDate()}</b>${V.selMode ? `<span class="selbox">${sel?'✓':''}</span>` : (dl&&dl.prod!=null?`<span class="num" style="color:var(--ok);font-size:11.5px">${dl.prod}%</span>`:(dayBlocks(d).length?'<span class="dim" title="Routine planned">λ</span>':''))}</div>
      ${tags.length || rtag || f.lecture ? `<div class="mtags">${rtag}${f.lecture && !f.lectureAuto ? '<span class="mtag lec">Lecture</span>' : ''}${tags.map(x => `<span class="mtag">${esc(x)}</span>`).join('')}</div>` : ''}
      ${shown.join('')}${lines.length > 4 ? `<div class="more">+${lines.length-4} more</div>` : ''}</div>`;
  }).join('');
  const monthEv = V.viewDates;
  const tests = monthEv.reduce((a,d) => a + eventsOn(d).filter(e => e.type==='test').length, 0);
  const lecs = monthEv.reduce((a,d) => a + eventsOn(d).filter(e => e.type==='lecture').length, 0);
  const revs = S.rev.items.filter(i => i.date.startsWith(V.month)).length;
  const dot = c => `<i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${c}"></i>`;
  return `<div class="cal-nav"><button class="icon-btn" data-mnav="-1" aria-label="Previous month">‹</button><button class="icon-btn" data-mnav="1" aria-label="Next month">›</button>
    <h2>${pd(first).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="btn sm" data-mnav="0">This month</button><span class="grow"></span>
    ${selToggle()}</div>
    <div class="mg">${MON_FIRST.map(i => `<div class="wd">${WD[i]}</div>`).join('')}${body}</div>${selBar()}`;
}

/* ================= routines (fork tree) ================= */
function rblkHTML(b, path, i){
  const t = typeOf(b.type), ss = bSubjs(b).map(rsOf).filter(Boolean);
  const tc = bTypes(b).map(id => typeOf(id).c), bar = tc.length > 1 ? `;--bar:linear-gradient(180deg, ${tc.join(', ')})` : '';
  return `<div class="rblk" role="button" tabindex="0" style="--c:${t.c}${bar}" data-rblk="${path}|${i}" title="Click to edit · drag to reorder (press and hold on touch)"><span class="rt">${esc(typeNames(b))}</span>
    <span class="rs">${ss.length ? ss.map(s => `<span style="color:${s.c}">${esc(s.name)}</span>`).join(' + ') : 'Any subject'}</span>${b.note?`<span class="rn">${esc(b.note)}</span>`:''}
    <span class="rtime num">${b.start} – ${hm(bEnd(b))}<span class="dim"> · ${durTxt(b.dur)}</span></span></div>`;
}
function seqHTML(node, path){
  const blocks = node.blocks.map((b,i) => (i ? '<div class="vline"></div>' : '') + rblkHTML(b, path, i)).join('');
  const acts = `<div class="seq-acts" data-dropseq="${path}">${node.blocks.length?'<div class="vline short"></div>':''}<div class="row" style="gap:6px;justify-content:center"><button class="btn sm" data-radd="${path}">＋ Block</button>${node.fork?'':`<button class="btn sm" data-rfork="${path}" title="Split into branches, e.g. lecture / no lecture">⑂ Fork</button>`}</div></div>`;
  const fork = node.fork ? `<div class="fork"><div class="vline"></div><div class="fork-node"><span class="m">⑂</span><button class="btn sm ghost" data-rbadd="${path}">＋ Branch</button></div>
    <div class="brs">${node.fork.branches.map((br, bi) => `<div class="bcol"><div class="bhead">
        <button class="cond ${br.when==='else'?'else':''} ${br.when==='custom'?'custom':''}" data-rcond="${path}|${bi}" title="Change condition"><span class="m">${br.when==='else'?'else':'if'}</span> ${esc(condLabel(br).replace(/^If /,''))}</button>
        <div class="bmenu"><button class="icon-btn ghost" title="Move left" data-rbmove="${path}|${bi}|-1" ${bi===0?'disabled':''}>‹</button><button class="icon-btn ghost" title="Copy this branch to other days" data-rbcopy="${path}|${bi}">⧉</button><button class="icon-btn ghost" title="Delete branch" data-rbdel="${path}|${bi}">×</button><button class="icon-btn ghost" title="Move right" data-rbmove="${path}|${bi}|1" ${bi===node.fork.branches.length-1?'disabled':''}>›</button></div></div>
        <div class="vline short"></div>${seqHTML(br.node, path + '.' + bi)}</div>`).join('')}</div></div>` : '';
  return `<div class="seq">${blocks}${acts}${fork}</div>`;
}
function tagRulesPanel(){
  const rules = S.plan.tagRoutes || [];
  const keys = [...MON_FIRST, ...S.plan.special.map(x => 'sp:' + x.id)];
  const opts = k => keys.map(x => `<option value="${x}" ${String(x)===String(k)?'selected':''}>${esc(isSp(x) ? '★ ' + keyName(x) : keyName(x) + '’s routine')}</option>`).join('');
  return `<details class="panel tag-rules" ${V.tagRulesOpen ? 'open' : ''}><summary><b>Tag rules</b> <span class="mute">· a tagged day switches to another routine automatically</span></summary><div class="panel-b">
    ${rules.map((r, i) => `<div class="row rule-row"><span class="mute">When a day is tagged</span><select class="inp" data-trtag="${i}">${S.plan.flags.map(f => `<option ${f===r.tag?'selected':''}>${esc(f)}</option>`).join('')}</select><span class="mute">use</span><select class="inp" data-trkey="${i}">${opts(r.key)}</select><button class="icon-btn ghost" data-trdel="${i}" aria-label="Remove rule">×</button></div>`).join('') || '<p class="dim" style="font-size:13px;margin:0 0 8px">No rules yet. Example: when a day is tagged “Holiday”, use Sunday’s routine.</p>'}
    <div class="row" style="gap:6px"><button class="btn sm" data-tradd ${S.plan.flags.length ? '' : 'disabled'}>＋ Add rule</button><button class="btn sm ghost" data-tagrange>Tag a range of days…</button><button class="btn sm ghost" data-act="autotags">Automatic tags…</button><span class="dim" style="font-size:12.5px">Rules are checked top to bottom. Choosing a routine for a specific date overrides them. Branch conditions can also check tags.</span></div></div></details>`;
}
function vRoutines(){
  if (isSp(V.rtDay) && !spOf(V.rtDay)) V.rtDay = new Date().getDay();
  const di = V.rtDay, root = treeFor(di), sp = isSp(di) ? spOf(di) : null;
  const tab = (k, name, n, fork, c) => `<button class="${di===k?'on':''}" data-rtday="${k}" ${c?`style="--sc:${c}"`:''}><b>${esc(name)}</b><small>${n?`${n} block${n>1?'s':''}${fork?' · ⑂':''}`:'empty'}</small></button>`;
  const tabs = MON_FIRST.map(i => tab(i, WD[i], treeSize(S.plan.tree[i]), S.plan.tree[i].fork)).join('');
  const sTabs = S.plan.special.map(x => tab('sp:' + x.id, x.name, treeSize(x.tree), x.tree.fork, x.c)).join('');
  const empty = !root.blocks.length && !root.fork;
  afterFns.push(() => { const w = document.querySelector('.tree-wrap'); if (w && w.scrollWidth > w.clientWidth) w.scrollLeft = (w.scrollWidth - w.clientWidth) / 2; });
  const dates = sp ? Object.entries(S.plan.dayRoutine).filter(([, v]) => v === sp.id).map(([d]) => d).sort() : [];
  const spHead = sp ? `<section class="panel sp-head" style="--sc:${sp.c}"><div class="panel-b row">
      <span class="sp-dot"></span><input class="inp sp-name" value="${esc(sp.name)}" data-spname="${sp.id}" aria-label="Special day name">
      <span class="mute" style="font-size:13.5px">Used on</span>${dates.length ? dates.map(d => `<span class="chip" style="color:var(--ink)">${fmtD(d,{day:'numeric',month:'short',year:'numeric'})}<button class="icon-btn ghost" style="width:18px;height:18px" data-spundate="${d}" aria-label="Remove date">×</button></span>`).join('') : '<span class="dim" style="font-size:13.5px">no dates yet</span>'}
      ${dateBtn('spAddDate', '', `data-sp="${sp.id}"`, 'Add a date')}<span class="grow"></span><button class="btn sm danger" data-spdel="${sp.id}">Delete special day</button></div></section>` : '';
  return `<div class="wd-tabs">${tabs}<span class="wd-sep"></span>${sTabs}<button class="add-sp" data-spnew>＋ Special day</button></div>
    ${spHead}
    ${tagRulesPanel()}
    <div class="row" style="margin:6px 0"><div class="root-node"><span class="m">λ</span><span><b style="color:var(--ink);font-weight:600">${esc(keyName(di))}</b> reads top to bottom. At a fork, the first branch whose condition is true is followed. Drag blocks to reorder.</span></div>
      <span class="grow"></span><button class="btn sm" data-act="manage">Block types & subjects</button><button class="btn sm" data-rtcopyday>Copy whole routine…</button>${empty?'':'<button class="btn sm danger" data-rtclear>Clear</button>'}</div>
    ${empty ? `<div class="empty" style="margin-top:14px"><p>${sp ? `No blocks for “${esc(sp.name)}” yet. Build it from scratch or start from one of your weekday routines.` : `No routine for ${WDL[di]} yet. Add blocks for the part of the day that never changes, then fork where lecture and non-lecture days split.`}</p>
        <div class="row" style="justify-content:center"><button class="btn pri" data-radd="r">＋ First block</button>${sp ? MON_FIRST.filter(i => treeSize(S.plan.tree[i])).map(i => `<button class="btn" data-spfrom="${i}">Copy ${WD[i]}</button>`).join('') : '<button class="btn" data-rtexample>Load an example day</button>'}</div></div>`
      : `<div class="tree-wrap"><div class="tree">${seqHTML(root, 'r')}</div></div>`}`;
}

<script>
/* ================= modal / toast ================= */
function toast(msg, action){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  if (action) { const b = document.createElement('button'); b.className = 'toast-act'; b.textContent = action.label; b.onclick = () => { t.remove(); action.fn(); }; t.appendChild(b); }
  document.body.appendChild(t); setTimeout(() => t.remove(), action ? 5000 : 2400);
}
let modalOnClose = null;
function closeModal(silent){
  closeDP();
  const had = document.querySelector('.modal-bg');
  document.querySelectorAll('.modal-bg').forEach(m => m.remove());
  const f = modalOnClose; modalOnClose = null;
  if (had && f && !silent) f();
}
function modal(title, body, foot, mount, cls = '', onClose = null){
  closeModal(true);
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn ghost" data-close aria-label="Close">×</button></div><div class="modal-b">${body}</div><div class="modal-f">${foot}</div></div>`;
  bg.addEventListener('mousedown', e => { if (e.target === bg) closeModal(); });
  bg.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
  document.body.appendChild(bg);
  modalOnClose = onClose;
  mount && mount(bg);
  return bg;
}
function confirmBox(title, msg, label, fn){
  modal(title, `<p style="margin:0;color:var(--mute)">${msg}</p>`, `<button class="btn ghost" data-close>Cancel</button><button class="btn danger" id="okBtn">${label}</button>`,
    r => r.querySelector('#okBtn').onclick = () => { closeModal(true); fn(); });
}
function dayChecks(exclude){ const keys = [...MON_FIRST, ...S.plan.special.map(x => 'sp:' + x.id)].filter(k => k !== exclude);
  return `<div class="daychecks">${keys.map(k => `<label class="fchip"><input type="checkbox" class="chk" value="${k}"> ${esc(keyShort(k))}</label>`).join('')}</div>`; }
const checkedDays = r => [...r.querySelectorAll('.daychecks input:checked')].map(x => parseKey(x.value));

/* ---------- event editor ---------- */
function openEvent(ev, preset = {}, occDate){
  const isNew = !ev;
  const e = ev ? clone(ev) : { id:uid(), type: preset.type || 'lecture', title:'', subject:'', date: preset.date || V.day || today(), start: preset.start || '', end: preset.end || '', repeat:'none', until:'', notes:'' };
  const body = `<input class="inp" id="evTitle" placeholder="Title, e.g. Rotational motion lecture, AITS-4" value="${esc(e.title)}">
    <div class="typepick" id="evType">${Object.entries(TYPES).map(([k,t]) => `<button type="button" style="--c:${t.c}" data-t="${k}" class="${e.type===k?'on':''}"><i></i>${t.name}</button>`).join('')}</div>
    <label class="fld">Subject<select class="inp" id="evSub"><option value="">Not subject specific</option>${Object.entries(SUBJ).map(([k,s]) => `<option value="${k}" ${e.subject===k?'selected':''}>${s.name}</option>`).join('')}</select></label>
    <div class="g3"><label class="fld">Date${dateBtn('evDate', e.date)}</label><label class="fld">Starts<input type="time" class="inp" id="evStart" value="${e.start}"></label><label class="fld">Ends<input type="time" class="inp" id="evEnd" value="${e.end}"></label></div>
    <div class="g2"><label class="fld">Repeats<select class="inp" id="evRep"><option value="none">Does not repeat</option><option value="weekly" ${e.repeat==='weekly'?'selected':''}>Every week on this day</option></select></label>
      <label class="fld" id="untilWrap" style="${e.repeat==='weekly'?'':'visibility:hidden'}">Until${dateBtn('evUntil', e.until, 'data-clearable', 'No end date')}</label></div>
    <label class="fld">Notes<textarea class="inp" id="evNotes" rows="3" placeholder="Test syllabus, room, faculty…">${esc(e.notes||'')}</textarea></label>`;
  const foot = `${isNew?'':`<button class="btn danger" id="evDel">${e.repeat==='weekly'?'Delete series':'Delete'}</button>`}${!isNew&&e.repeat==='weekly'&&occDate?`<button class="btn" id="evSkip">Skip ${fmtD(occDate,{day:'numeric',month:'short'})} only</button>`:''}
    <span class="grow"></span><button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="evSave">${isNew?'Add event':'Save changes'}</button>`;
  modal(isNew ? 'New event' : 'Edit event', body, foot, r => {
    r.querySelector('#evTitle').focus();
    r.querySelector('#evType').onclick = x => { const b = x.target.closest('[data-t]'); if (!b) return; e.type = b.dataset.t; r.querySelectorAll('#evType button').forEach(k => k.classList.toggle('on', k === b)); };
    r.querySelector('#evRep').onchange = x => r.querySelector('#untilWrap').style.visibility = x.target.value === 'weekly' ? '' : 'hidden';
    r.querySelector('#evSave').onclick = () => {
      Object.assign(e, { title:r.querySelector('#evTitle').value.trim(), subject:r.querySelector('#evSub').value, date:r.querySelector('#evDate').dataset.value || today(),
        start:r.querySelector('#evStart').value, end:r.querySelector('#evEnd').value, repeat:r.querySelector('#evRep').value, until:r.querySelector('#evUntil').dataset.value, notes:r.querySelector('#evNotes').value });
      if (e.end && e.start && mins(e.end) <= mins(e.start)) { toast('End time must be after the start time'); return; }
      const i = S.plan.events.findIndex(x => x.id === e.id);
      if (i >= 0) S.plan.events[i] = e; else S.plan.events.push(e);
      touch('plan'); closeModal(true); render(); toast(isNew ? 'Event added' : 'Event saved');
    };
    const del = r.querySelector('#evDel'); if (del) del.onclick = () => { S.plan.events = S.plan.events.filter(x => x.id !== e.id); touch('plan'); closeModal(true); render(); toast('Event deleted'); };
    const sk = r.querySelector('#evSkip'); if (sk) sk.onclick = () => { const o = S.plan.events.find(x => x.id === e.id); o.skip = [...(o.skip||[]), occDate]; touch('plan'); closeModal(true); render(); toast('Skipped for that date'); };
  });
}

/* ---------- revision editor ---------- */
/* Revision scheduler: pick a date, then a time on that day's schedule — a free slot, or inside a Revision block */
function revStrip(date, st, selfId){
  const H = 34, items = itemsFor(date).filter(i => !(i.kind === 'rv' && i.id === selfId));
  const starts = items.map(i => mins(i.start)), ends = items.map(i => mins(i.end) ?? mins(i.start) + 45);
  const gs = Math.min(S.cfg.gStart, ...starts.map(m => Math.floor(m/60)), st.start ? Math.floor(mins(st.start)/60) : 24);
  const ge = Math.min(24, Math.max(S.cfg.gEnd, ...ends.map(m => Math.ceil(m/60)), st.end ? Math.ceil(mins(st.end)/60) : 0));
  const y = m => (m - gs*60) / 60 * H;
  const rows = Array.from({ length: ge - gs }, (_, i) => `<div class="rs-h" style="top:${i*H}px">${pad((gs+i)%24)}:00</div>`).join('');
  const blocks = items.map(i => {
    const s0 = mins(i.start), e0 = mins(i.end) ?? s0 + 45;
    const blk = i.kind === 'bl' ? dayBlocks(date).find(b => b.id === i.id) : null;
    const rv = blk && isRevBlock(blk) && !i.brk, on = st.blk === i.id;
    return `<div class="rs-it ${i.kind} ${rv?'revblk':''} ${on?'on':''} ${i.brk?'brk':''}" style="--c:${i.c};top:${y(s0)}px;height:${Math.max(16, (e0-s0)/60*H - 2)}px" ${rv?`data-rassign="${i.id}" title="Revise inside this block"`:''}>
      <b>${esc(i.title)}</b><span>${i.start}–${i.end}</span>${rv ? `<em>${on ? '✓ Assigned here' : 'Assign here'}</em>` : ''}</div>`;
  }).join('');
  const sel = st.start && st.end && !st.blk ? `<div class="rs-sel" style="top:${y(mins(st.start))}px;height:${Math.max(14, (mins(st.end)-mins(st.start))/60*H)}px"><b>Revision</b> ${st.start}–${st.end}</div>` : '';
  return `<div class="rstrip-wrap"><div class="rstrip" data-gs="${gs}" data-h="${H}" style="height:${(ge-gs)*H}px">${rows}<div class="rs-lane">${blocks}${sel}</div></div></div>`;
}
function openRev(item, chId, queue){
  const isNew = !item;
  const it = item ? clone(item) : { id:uid(), ch:chId, exam: V.view === 'revision' ? V.revExam : 'both', date: addDays(today(),1), start:'', end:'', blk:'', done:false };
  const st = { date: it.date, start: it.start || '', end: it.end || '', blk: it.blk || '', dur: it.start && it.end ? mins(it.end) - mins(it.start) : 60 };
  const c = chapterById(it.ch);
  const draw = r => {
    const dayRev = dayBlocks(st.date).filter(b => isRevBlock(b) && !typeOf(b.type).brk);
    const sm = mins(st.start), em = mins(st.end);
    const study = st.start && st.end && !st.blk ? studyOverlaps(st.date, sm, em) : [];
    const studyIds = new Set(study.map(b => b.id));
    const clash = st.start && st.end && !st.blk ? itemsFor(st.date).filter(i => !(i.kind === 'rv' && i.id === it.id) && !i.brk && !studyIds.has(i.id) && !(i.kind === 'bl' && !countsStudy(dayBlocks(st.date).find(b => b.id === i.id) || {})) && mins(i.start) < em && (mins(i.end) ?? mins(i.start) + 45) > sm) : [];
    r.querySelector('#rvWhen').innerHTML = `
      <div class="row" style="gap:6px">${[['Today',0],['Tomorrow',1],['In 3 days',3],['In a week',7]].map(([l,n]) => `<button type="button" class="btn sm ${st.date===addDays(today(),n)?'pri':''}" data-quick="${n}">${l}</button>`).join('')}</div>
      <div class="rv-pick-help">${dayRev.length ? `This day has ${dayRev.length} revision block${dayRev.length>1?'s':''} (pink “Assign here”). Put the revision inside one, or click any empty time to use a free slot.` : 'Click an empty time on the schedule to pick a free slot.'}</div>
      ${revStrip(st.date, st, it.id)}
      <div class="row rv-time">${st.blk ? `<span class="chip on-rev">Inside the ${esc((itemsFor(st.date).find(i => i.id === st.blk) || {}).title || 'revision')} block · ${st.start}–${st.end}</span><button type="button" class="btn sm ghost" id="rvUnassign">Use a free slot instead</button>`
        : `<label class="fld">From<input type="time" class="inp" id="rvStart" value="${st.start}"></label><label class="fld">Length<select class="inp" id="rvDur">${[15,30,45,60,75,90,120,150,180].map(m => `<option value="${m}" ${m===st.dur?'selected':''}>${durTxt(m)}</option>`).join('')}</select></label><span class="mute" style="align-self:end;padding-bottom:8px">${st.start ? 'until <b style="color:var(--ink)">' + st.end + '</b>' : 'No time picked yet'}</span>`}</div>
      ${study.length ? `<div class="rv-warn study">⚠ This time is inside ${study.map(b => `“${esc(typeNames(b))}” (${b.start}–${hm(bEnd(b))})`).join(', ')}. Saving here splits ${study.length > 1 ? 'those study blocks' : 'that study block'} and <b>removes the overlapping ${durTxt(study.reduce((a, b) => a + Math.min(bEnd(b), em) - Math.max(mins(b.start), sm), 0))}</b> of study time, which becomes this revision.</div>` : ''}
      ${clash.length ? `<div class="rv-warn">Overlaps ${clash.map(i => esc(i.title)).slice(0,3).join(', ')}. Pick a free slot or assign it to a revision block.</div>` : ''}`;
    const strip = r.querySelector('.rstrip');
    if (strip && st.start) { const wrap = r.querySelector('.rstrip-wrap'); const top = (mins(st.start) - (+strip.dataset.gs)*60) / 60 * (+strip.dataset.h); wrap.scrollTop = Math.max(0, top - 60); }
    else if (strip) { const wrap = r.querySelector('.rstrip-wrap'); wrap.scrollTop = Math.max(0, (16 - (+strip.dataset.gs)) * (+strip.dataset.h) - 40); }
  };
  const body = `<div class="row"><span class="sg" style="color:${c?SUBJ[c.subj].c:''};font-size:20px">${c?SUBJ[c.subj].g:''}</span><b style="font-weight:600">${esc(c?.name||'Chapter')}</b><span class="grow"></span><span class="mute num">prep ${rAt(it.ch)==null?'—':rAt(it.ch).toFixed(1)}</span></div>
    <label class="fld">Day${dateBtn('rvDate', st.date)}</label>
    <div id="rvWhen" class="rv-when"></div>`;
  const foot = `${isNew?'':`<button class="btn danger" id="rvDel">Remove</button>${it.done?'':'<button class="btn" id="rvDone">Mark revised (+1 prep)</button>'}`}<span class="grow"></span>${queue && queue.length ? `<span class="dim" style="font-size:12.5px">${queue.length} more to schedule</span>` : ''}<button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="rvSave">${isNew?'Set for revision':'Save'}</button>`;
  modal(isNew ? 'Schedule a revision' : 'Revision', body, foot, r => {
    draw(r);
    r.addEventListener('datechange', e => { if (e.target.id === 'rvDate' && e.target.dataset.value) { st.date = e.target.dataset.value; st.blk = ''; st.start = ''; st.end = ''; draw(r); } });
    r.addEventListener('click', e => {
      const q1 = e.target.closest('[data-quick]'); if (q1) { st.date = addDays(today(), +q1.dataset.quick); setDateBtn(r.querySelector('#rvDate'), st.date); st.blk = ''; st.start = ''; st.end = ''; draw(r); return; }
      const as = e.target.closest('[data-rassign]'); if (as) { const i = itemsFor(st.date).find(x => x.id === as.dataset.rassign); if (!i) return; st.blk = i.id; st.start = i.start; st.end = i.end; draw(r); return; }
      if (e.target.closest('#rvUnassign')) { st.blk = ''; st.start = ''; st.end = ''; draw(r); return; }
      const lane = e.target.closest('.rs-lane'); if (lane && (e.target === lane || e.target.closest('.rs-sel') || e.target.closest('.rs-it:not([data-rassign])'))) {
        const strip = r.querySelector('.rstrip'), rc = lane.getBoundingClientRect();
        const m = Math.round(((+strip.dataset.gs) * 60 + (e.clientY - rc.top) / (+strip.dataset.h) * 60) / 15) * 15;
        st.blk = ''; st.start = hm(clamp(m, 0, 24*60 - 15)); st.end = hm(Math.min(24*60 - 1, mins(st.start) + st.dur)); draw(r); }
    });
    r.addEventListener('change', e => {
      if (e.target.id === 'rvStart' && e.target.value) { st.start = e.target.value; st.end = hm(Math.min(24*60 - 1, mins(st.start) + st.dur)); draw(r); }
      if (e.target.id === 'rvDur') { st.dur = +e.target.value; if (st.start) st.end = hm(Math.min(24*60 - 1, mins(st.start) + st.dur)); draw(r); }
    });
    r.querySelector('#rvSave').onclick = () => {
      if (!st.start || !st.end) { toast('Pick a time: click a free slot or a revision block on the schedule'); r.querySelector('.rstrip-wrap')?.classList.add('shake'); setTimeout(() => r.querySelector('.rstrip-wrap')?.classList.remove('shake'), 500); return; }
      Object.assign(it, { date:st.date, start:st.start, end:st.end, blk:st.blk || '' });
      const cut = !st.blk ? carveStudy(st.date, mins(st.start), mins(st.end)) : 0;
      if (cut) touch('plan');
      const i = S.rev.items.findIndex(x => x.id === it.id); if (i >= 0) S.rev.items[i] = it; else S.rev.items.push(it);
      touch('rev'); closeModal(true); render(); toast(`${isNew ? 'Revision set' : 'Revision saved'} · ${fmtD(st.date, { weekday:'short', day:'numeric', month:'short' })} ${st.start}${cut ? ` · split ${cut} study block${cut > 1 ? 's' : ''}` : ''}`, cut ? { label:'Undo', fn:undo } : null);
      if (queue && queue.length) { const [nx, ...rest] = queue; setTimeout(() => openRev(null, nx, rest), 250); }
    };
    const d = r.querySelector('#rvDel'); if (d) d.onclick = () => { S.rev.items = S.rev.items.filter(x => x.id !== it.id); touch('rev'); closeModal(true); render(); };
    const dn = r.querySelector('#rvDone'); if (dn) dn.onclick = () => { markRev(it.id, true); closeModal(true); render(); };
  }, 'wide');
}
function markRev(id, done){
  const it = S.rev.items.find(x => x.id === id); if (!it) return;
  if (done && !it.done) { it.done = true; it.doneAt = Date.now(); bump(it.ch, 1); toast('Revised. Prep rating +1'); }
  else if (!done) it.done = false;
  touch('rev');
}

/* ---------- chapter editor ---------- */
function openAddChapter(subjPreset, editId){
  const ex = editId ? S.syl.custom.chapters.find(c => c.id === editId) : null;
  const sj = ex ? ex.subj : (subjPreset || V.subj);
  modal(ex ? 'Edit chapter' : 'Add a coaching chapter', `<p class="mute" style="margin:0;font-size:13.5px">For chapters your coaching teaches that aren’t in the official syllabus. They work everywhere: ticking, prep grades, revision and session logs.</p>
    <label class="fld">Chapter name<input class="inp" id="chName" placeholder="e.g. Solid State" value="${esc(ex?.name || '')}"></label>
    <div class="g2"><label class="fld">Subject<select class="inp" id="chSubj">${Object.entries(SUBJ).map(([k,s]) => `<option value="${k}" ${sj===k?'selected':''}>${s.name}</option>`).join('')}</select></label>
    <label class="fld">Count it for<select class="inp" id="chEx">${[['both','Main and Advanced'],['main','JEE Main'],['adv','JEE Advanced']].map(([k,l]) => `<option value="${k}" ${(ex?.exam||'both')===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
    ${ex ? '<p class="dim" style="font-size:12.5px;margin:0">Add or remove subtopics inside the chapter in the Syllabus list.</p>' : '<label class="fld">Subtopics, one per line<textarea class="inp" id="chSubs" rows="5"></textarea></label>'}`,
    `<button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="chSave">${ex ? 'Save chapter' : 'Add chapter'}</button>`, r => {
      r.querySelector('#chName').focus();
      r.querySelector('#chSave').onclick = () => {
        const name = r.querySelector('#chName').value.trim(); if (!name) { toast('Give the chapter a name'); return; }
        const subj = r.querySelector('#chSubj').value, exam = r.querySelector('#chEx').value;
        if (ex) Object.assign(ex, { name, subj, exam });
        else {
          const id = 'x' + uid();
          S.syl.custom.chapters.push({ id, subj, name, exam });
          const subs = r.querySelector('#chSubs').value.split('\n').map(s => s.trim()).filter(Boolean);
          if (subs.length) S.syl.custom.subs[id] = subs;
          V.open.add(id);
        }
        if (V.view === 'syllabus') V.subj = subj;
        touch('syl'); closeModal(true); render(); toast(ex ? 'Chapter saved' : `Added to ${SUBJ[subj].name}`);
      };
    });
}

/* ================= block form: type, subject, time wheel, duration ================= */
const WI = 36;
function wheelHTML(t){
  const [h, m] = (t || '06:00').split(':').map(Number);
  const col = (n, sel, key, lab) => `<div class="wcol" tabindex="0" aria-label="${lab}" data-w="${key}" data-sel="${sel}">${Array.from({ length:n }, (_,i) => `<div class="wi ${i===sel?'sel':''}" data-i="${i}">${pad(i)}</div>`).join('')}</div>`;
  return `<div class="wheel">${col(24, (h||0)%24, 'h', 'Hour')}<span class="wsep">:</span>${col(60, (m||0)%60, 'm', 'Minute')}<div class="wband"></div></div>`;
}
function mountWheel(r, onChange){
  r.querySelectorAll('.wcol').forEach(c => {
    const n = c.children.length;
    c.scrollTop = +c.dataset.sel * WI;
    const setSel = i => { i = clamp(i, 0, n-1); if (+c.dataset.sel !== i) { c.dataset.sel = i; [...c.children].forEach((x,k) => x.classList.toggle('sel', k === i)); onChange && onChange(); } };
    let ready = false; requestAnimationFrame(() => { c.scrollTop = +c.dataset.sel * WI; ready = true; });
    c.addEventListener('scroll', () => { if (ready) setSel(Math.round(c.scrollTop / WI)); });
    c.addEventListener('click', e => { const it = e.target.closest('.wi'); if (it) { setSel(+it.dataset.i); c.scrollTo({ top:+it.dataset.i * WI, behavior:'smooth' }); } });
    c.addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const i = clamp(+c.dataset.sel + (e.key === 'ArrowDown' ? 1 : -1), 0, n-1); setSel(i); c.scrollTo({ top:i * WI, behavior:'smooth' }); } });
  });
}
const wheelVal = r => `${pad(+r.querySelector('[data-w=h]').dataset.sel)}:${pad(+r.querySelector('[data-w=m]').dataset.sel)}`;

/* ---------- routine block editor ---------- */
function openRBlock(path, i, draft){
  const day = V.rtDay, node = getNode(day, path), isNew = i == null;
  const b = draft || (isNew ? { id:uid(), type: node.blocks[node.blocks.length-1]?.type || S.plan.types[0]?.id, subj:'any', note:'', start: seqEnd(day, path), dur:60 } : clone(node.blocks[i]));
  const hasAfter = !isNew && (i < node.blocks.length - 1 || node.fork);
  modal(`${isNew ? 'New block' : 'Edit block'} · ${keyName(day)}`, blockFormHTML(b) + (hasAfter ? '<p class="dim" style="font-size:12.5px;margin:0">Blocks after this one shift to start when it ends.</p>' : ''),
    `${isNew?'':`<button class="btn danger" id="bfDel">Delete</button><button class="btn" id="bfUp" ${i===0?'disabled':''} title="Move earlier">↑</button><button class="btn" id="bfDn" ${i===node.blocks.length-1?'disabled':''} title="Move later">↓</button>`}<span class="grow"></span><button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="bfSave">${isNew?'Add block':'Save'}</button>`, r => {
    mountBlockForm(r);
    const mv = dir => { closeModal(true); moveBlock(path, i, path, dir < 0 ? i - 1 : i + 2); };
    if (r.querySelector('#bfUp')) { r.querySelector('#bfUp').onclick = () => mv(-1); r.querySelector('#bfDn').onclick = () => mv(1); }
    r.querySelector('[data-manage-in]').onclick = () => { const d = { ...b, ...readBlockForm(r) }; openManage(() => openRBlock(path, i, d)); };
    r.querySelector('#bfSave').onclick = () => {
      const v = readBlockForm(r); if (!v.dur) { toast('Set a duration longer than 0 minutes'); return; }
      Object.assign(b, v);
      if (isNew) { node.blocks.push(b); cascade(node, node.blocks.length - 1); } else { node.blocks[i] = b; cascade(node, i); }
      touch('plan'); closeModal(true); render();
    };
    const del = r.querySelector('#bfDel'); if (del) del.onclick = () => {
      node.blocks.splice(i, 1);
      if (node.blocks.length) { if (i === 0) { node.blocks[0].start = b.start; cascade(node, 0); } else cascade(node, i - 1); }
      touch('plan'); closeModal(true); render(); toast('Block deleted');
    };
  }, 'wide');
}

    const v = +q('#sProd').value, st = studiedNow(), pl = ctx.planned(), h = Math.min(8, Math.floor(st/60)), m = st % 60;

    q('#stH').value = h; q('#stM').value = m; q('#stHv').textContent = h + ' h'; q('#stMv').textContent = m + ' min'; q('#tStud').textContent = durTxt(st);

      return `<div class="prow ${sub?'psub':''}">${pre}<span class="grow">${esc(name)}</span><span class="num mute">${cur==null?'—':cur.toFixed(1)}</span><span class="dim">→</span><b class="num" style="color:${d?rCol(nv):'var(--mute)'}">${d?nv.toFixed(1):'same'}</b>
        <button type="button" class="icon-btn" data-pd="${id}|-1" aria-label="Lower">−</button><button type="button" class="icon-btn" data-pd="${id}|1" aria-label="Raise">+</button></div>`; };

  q('#prepAdd').onclick = () => { const cid = q('#tpCh').value; if (!extraCh.includes(cid)) extraCh.push(cid); deltas[cid] = deltas[cid] || 1; drawPrep(); };

const newLog = () => ({ done:false, prod:null, topics:[], subs:[] });

/* ---------- whole block (day only): details, cutting into parts, and its session when not split ---------- */
function openDayBlock(date, id, draft, logDraft){
  if (!draft && id.includes('~')) return openPartBlock(date, id);
  const eff = draft || dayBlocks(date, false).find(b => b.id === id); if (!eff) return;
  const b = clone(eff), isExtra = !!b._extra, isNewExtra = !!b._new;
  const saved = (S.plan.log[date] || {})[id];
  const lg = logDraft || clone(saved && !saved.segs ? saved : newLog());
  lg.topics = lg.topics || []; lg.subs = lg.subs || [];
  const wasDone = !!(saved && !saved.segs && saved.done);
  /* parts: a saved cut, or the Daily plan's items (same ids, so each part keeps its own log) */
  let segs = saved && saved.segs ? clone(saved.segs) : null, fromPlan = false;
  if (!segs && !isNewExtra) { const pl = getSegs(date, b); if (pl) { segs = pl.filter(x => !x._free).map(x => ({ id:x.id, type:x.type, types:x.types, subj:x.subj || 'any', subjs:x.subjs, dur:+x.dur, note:x.note || '', gap:!!x.gap })); fromPlan = true; } }
  const subjSel = bSubjs(b).find(s => SUBJ[s]) || 'phy';
  const partsSec = `<div id="partsSec" class="parts-sec"><div class="row"><div class="fld-l" style="margin:0">Studied more than one thing? Cut this block into separate blocks, each logged and ticked on its own.</div><span class="grow"></span>
      <div class="row cutrow" id="segOn"><span class="dim" style="font-size:13px">Cut into</span>${[2,3,4,5].map(n => `<button type="button" class="btn sm" data-cut="${n}">${n}</button>`).join('')}<span class="dim" style="font-size:13px">blocks</span></div></div><div id="segWrap"></div></div>`;
  const foot = `${isExtra ? (isNewExtra ? '' : '<button class="btn danger" id="dbDel">Delete</button>') : '<button class="btn danger" id="dbSkip">Skip today</button>'}${b._ov ? '<button class="btn" id="dbReset">Reset to routine</button>' : ''}
    <span class="grow"></span><button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="dbSave">${isNewExtra ? 'Add block' : 'Save for this day'}</button>`;
  modal(`${fmtD(date, { weekday:'short', day:'numeric', month:'short' })} · ${b.actual ? (isNewExtra ? 'Log what you did' : 'What you did') : (isNewExtra ? 'New block' : 'Block')}`, blockFormHTML(b) + `<p class="dim" style="font-size:12.5px;margin:0">${b.actual ? 'A record of what you did: it shows in the Actual column only, and your plan is left as it was.' : isExtra ? 'This block exists on this day only.' : 'Changes apply to this day only. Your routine stays the same.'}</p>` + partsSec + `<div id="sessSec">${sessHTML(lg, b, subjSel)}</div>`, foot, r => {
    mountBlockForm(r);
    const q = s => r.querySelector(s), total = () => +q('#bfH').value * 60 + +q('#bfM').value;
    r.querySelector('[data-manage-in]').onclick = () => { const d = { ...b, ...readBlockForm(r) }; openManage(() => openDayBlock(date, id, d, lg)); };
    const sess = mountSession(r, { lg, planned: () => { const pl = (S.plan.dplan[date] || {})[id]; return pl && pl.length ? pl.filter(x => !x.gap).reduce((a,x) => a + (+x.dur||0), 0) : total(); },
      plannedSrc: () => (((S.plan.dplan[date] || {})[id] || []).length ? 'from your Daily plan' : 'block length') });
    const L = S.plan.log[date] || {};
    const partStatus = sg => { const cl = L[id + '~' + sg.id]; if (!cl || !cl.done) return '<span class="dim">Not logged yet</span>';
      const st = cl.studied != null ? +cl.studied : +sg.dur; return `${fireHTML(st, +sg.dur, 'sm')} <span style="color:var(--ok)">✓ ${durTxt(st)} studied${cl.prod != null ? ' · ' + cl.prod + '%' : ''}</span>`; };
    const updTimes = () => {
      if (!segs) return;
      let cur = mins(wheelVal(r)); const tot = total(); let sum = 0;
      segs.forEach((sg, k) => { const el = q(`[data-segtime="${k}"]`); if (el) el.textContent = `${hm(cur)} – ${hm(cur + sg.dur)} · ${durTxt(sg.dur)}`; cur += sg.dur; sum += sg.dur; });
      const rem = tot - sum, el = q('#segRem');
      if (el) el.innerHTML = rem === 0 ? '<span style="color:var(--ok)">Adds up to the full block</span>' : rem > 0 ? `<span class="mute">${durTxt(rem)} not assigned</span>` : `<span style="color:var(--warn)">${durTxt(-rem)} over the block length</span>`;
    };
    const subjPick = (sg, k) => [`<button type="button" data-v="any" class="${!rsOf(sg.subj)?'on':''}" style="--c:#9DB2D6"><i></i>Any</button>`, ...S.plan.rsubj.map(x => `<button type="button" data-v="${x.id}" style="--c:${x.c}" class="${sg.subj===x.id?'on':''}"><i></i>${esc(x.name)}</button>`)].join('');
    const typeOpts = sg => S.plan.types.map(t => `<option value="${t.id}" ${(sg.type||b.type)===t.id?'selected':''}>${esc(t.name)}</option>`).join('');
    const drawSegs = () => {
      q('#segOn').hidden = !!segs; q('#sessSec').hidden = !!segs;
      if (!segs) { q('#segWrap').innerHTML = ''; return; }
      let vis = 0;
      q('#segWrap').innerHTML = `<p class="dim" style="font-size:12.5px;margin:0">Each part is its own block: tick it, log its time and productivity, and grade topics separately by clicking it in the Day planner.</p>
        <div class="segs">${segs.map((sg, k) => { if (sg.gap) return `<div class="part gap" data-seg="${k}"><div class="seg-h"><b>Empty</b><span class="num mute" data-segtime="${k}"></span><span class="grow"></span><button type="button" class="btn sm ghost" data-segclose="${k}" title="Remove the empty time so later parts move up">Close gap</button></div></div>`;
        vis++;
        return `<div class="part" data-seg="${k}">
          <div class="seg-h"><span class="grip" data-grip="${k}" title="Drag to reorder">⋮⋮</span><b>Block ${vis}</b><span class="num mute" data-segtime="${k}"></span><span class="grow"></span>
            <button type="button" class="icon-btn ghost" data-segmv="${k}|-1" ${k===0?'disabled':''} title="Earlier" aria-label="Move earlier">↑</button><button type="button" class="icon-btn ghost" data-segmv="${k}|1" ${k===segs.length-1?'disabled':''} title="Later" aria-label="Move later">↓</button>
            <button type="button" class="icon-btn ghost" data-segdel="${k}" aria-label="Remove">×</button></div>
          <div class="row" style="gap:8px"><select class="inp" data-segtype="${k}" aria-label="Type of study">${typeOpts(sg)}</select><input class="inp grow" data-segnote="${k}" value="${esc(sg.note||'')}" placeholder="What (optional)"></div>
          <div class="pick sm" data-segsubj="${k}">${subjPick(sg, k)}</div>
          <label class="sl"><span>Hours</span><input type="range" class="neon-range" min="0" max="6" data-segh="${k}" value="${Math.min(6, Math.floor(sg.dur/60))}"><b class="num" data-seghv="${k}">${Math.floor(sg.dur/60)} h</b></label>
          <label class="sl"><span>Minutes</span><input type="range" class="neon-range" min="0" max="59" data-segm="${k}" value="${sg.dur%60}"><b class="num" data-segmv="${k}">${sg.dur%60} min</b></label>
          <div class="seg-top">${partStatus(sg)}</div></div>`; }).join('')}</div>
        <div class="row"><button type="button" class="btn sm" id="segAdd">＋ Add block</button><span id="segRem" style="font-size:13px"></span><span class="grow"></span><button type="button" class="btn sm ghost" id="segOff">Merge back into one</button></div>`;
      updTimes();
    };
    q('#segOn').addEventListener('click', e => { const c = e.target.closest('[data-cut]'); if (!c) return;
      const n = +c.dataset.cut, tot = total() || 60, base = Math.max(5, Math.floor(tot / n / 5) * 5);
      const cur = readBlockForm(r), subs = bSubjs(cur);
      segs = Array.from({ length:n }, (_, k) => ({ id:uid(), type:cur.type, subj: subs.length ? subs[k % subs.length] : 'any', dur: k === n-1 ? Math.max(5, tot - base*(n-1)) : base, note:'' }));
      fromPlan = false; drawSegs(); });
    q('#segWrap').addEventListener('click', e => {
      const t = e.target;
      if (t.closest('#segAdd')) { const used = segs.reduce((a,x) => a + x.dur, 0); const last = segs[segs.length-1];
        segs.push({ id:uid(), type:last?.type || b.type, subj:'any', dur: Math.max(5, Math.min(360, total() - used || 30)), note:'' }); drawSegs(); return; }
      if (t.closest('#segOff')) { segs = null; drawSegs(); return; }
      const mvb = t.closest('[data-segmv]'); if (mvb) { const [k, dd] = mvb.dataset.segmv.split('|').map(Number); const j = k + dd; if (j < 0 || j >= segs.length) return; [segs[k], segs[j]] = [segs[j], segs[k]]; drawSegs(); return; }
      const cl = t.closest('[data-segclose]'); if (cl) { segs.splice(+cl.dataset.segclose, 1); drawSegs(); return; }
      const del = t.closest('[data-segdel]'); if (del) { const k = +del.dataset.segdel; segs[k] = { id:segs[k].id, gap:true, dur:segs[k].dur }; drawSegs(); return; }
      const sp = t.closest('[data-segsubj] [data-v]'); if (sp) { const k = +sp.closest('[data-segsubj]').dataset.segsubj; segs[k].subj = sp.dataset.v; segs[k].subjs = null; drawSegs(); return; }
    });
    q('#segWrap').addEventListener('input', e => {
      const t = e.target, k = t.dataset.segh ?? t.dataset.segm; if (k == null) { if (t.dataset.segnote != null) segs[+t.dataset.segnote].note = t.value; return; }
      const h = +q(`[data-segh="${k}"]`).value, m = +q(`[data-segm="${k}"]`).value;
      segs[+k].dur = h*60 + m; q(`[data-seghv="${k}"]`).textContent = h + ' h'; q(`[data-segmv="${k}"]`).textContent = m + ' min'; updTimes();
    });
    q('#segWrap').addEventListener('change', e => { const k = e.target.dataset.segtype; if (k != null) { segs[+k].type = e.target.value; segs[+k].types = null; } });
    const partDrag = { handle:'.part .grip', item:'.part', targets:'.part', scroller: () => r.querySelector('.modal'), drop: (item, t, pos) => {
      const from = +item.dataset.seg; let to = +t.dataset.seg + (pos === 'after' ? 1 : 0);
      const [m] = segs.splice(from, 1); if (from < to) to--; segs.splice(to, 0, m); drawSegs(); } };
    DRAGS.push(partDrag);
    new MutationObserver((_, o) => { if (!r.isConnected) { const i = DRAGS.indexOf(partDrag); if (i >= 0) DRAGS.splice(i, 1); o.disconnect(); } }).observe(document.body, { childList:true });
    ['#bfH','#bfM'].forEach(s => q(s).addEventListener('input', () => { updTimes(); sess.paint(); }));
    r.querySelectorAll('.wcol').forEach(c => c.addEventListener('scroll', updTimes));
    drawSegs();
    q('#dbSave').onclick = () => {
      const v = readBlockForm(r); if (!v.dur) { toast('Set a duration longer than 0 minutes'); return; }
      if (segs) {
        if (segs.some(x => !x.dur)) { toast('Every part needs a duration'); return; }
        if (segs.reduce((a,x) => a + x.dur, 0) > v.dur) { toast('The parts add up to more than the block. Shorten a part or lengthen the block.'); return; }
      }
      const bid = id || uid();
      if (isExtra) { const arr = (S.plan.extra[date] ||= []); const k = arr.findIndex(x => x.id === bid); const nb = { id:bid, ...v, ...(b.actual ? { actual:true } : {}) }; if (k >= 0) arr[k] = nb; else arr.push(nb); }
      else {
        const orig = routePath(date).blocks.find(x => x.id === bid);
        const norm = x => JSON.stringify([bTypes(x), bSubjs(x), x.note || '', x.start, +x.dur, wkOf(x), x.nc ?? null]);
        const ov = (S.plan.ov[date] ||= {});
        if (orig && norm(orig) === norm(v)) delete ov[bid]; else ov[bid] = v;
        if (!Object.keys(ov).length) delete S.plan.ov[date];
      }
      const logs = (S.plan.log[date] ||= {});
      let n = 0;
      if (segs) {
        const planSame = fromPlan && JSON.stringify(segs) === JSON.stringify((getSegs(date, { ...b, id:bid }) || []).filter(x => !x._free).map(x => ({ id:x.id, type:x.type, types:x.types, subj:x.subj || 'any', subjs:x.subjs, dur:+x.dur, note:x.note || '', gap:!!x.gap })));
        /* first time it's cut: carry an existing whole-block log over to the first part */
        if (!(saved && saved.segs) && wasDone) { const first = segs.find(x => !x.gap); if (first && !logs[bid + '~' + first.id]) logs[bid + '~' + first.id] = sess.record(v.start) || newLog(); }
        if (planSame) delete logs[bid]; else logs[bid] = { segs: segs.map(x => x.gap ? { id:x.id, gap:true, dur:x.dur } : { id:x.id, type:x.type, types:x.types || null, subj:x.subj, subjs:x.subjs || null, dur:x.dur, note:x.note || '', ...(x.nc != null ? { nc:x.nc } : {}) }) };
        const keep = new Set(segs.filter(x => !x.gap).map(x => bid + '~' + x.id)); keep.add(bid + '~free');
        Object.keys(logs).forEach(k => { if (k.startsWith(bid + '~') && !keep.has(k)) delete logs[k]; });
      } else {
        Object.keys(logs).forEach(k => { if (k.startsWith(bid + '~')) delete logs[k]; });
        const rec = sess.record(v.start); if (rec) logs[bid] = rec; else delete logs[bid];
        n = sess.applyGrades();
        if (!!lg.done !== wasDone) revsInBlock(date, bid).forEach(rv => markRev(rv.id, lg.done));
      }
      touch('plan'); closeModal(true); render();
      toast((segs ? `Saved as ${segs.filter(x => !x.gap).length} separate blocks` : lg.done ? 'Session saved' : 'Saved for this day') + (n ? ` · prep updated for ${n}` : ''));
    };
    const sk = q('#dbSkip'); if (sk) sk.onclick = () => { (S.plan.ov[date] ||= {})[id] = { skip:true }; touch('plan'); closeModal(true); render(); toast('Skipped for today'); };
    const rs = q('#dbReset'); if (rs) rs.onclick = () => { if (S.plan.ov[date]) delete S.plan.ov[date][id]; touch('plan'); closeModal(true); render(); toast('Back to the routine version'); };
    const dl = q('#dbDel'); if (dl) dl.onclick = () => { S.plan.extra[date] = (S.plan.extra[date]||[]).filter(x => x.id !== id); const L2 = S.plan.log[date] || {}; Object.keys(L2).forEach(k => { if (k === id || k.startsWith(id + '~')) delete L2[k]; }); touch('plan'); closeModal(true); render(); };
  }, 'wide');
}

/* ---------- a revision, logged like a study block ---------- */
function openRevLog(id){
  const it = S.rev.items.find(x => x.id === id); if (!it) return;
  const c = chapterById(it.ch), tm = revTimes(it);
  const lg = clone({ ...(it.log || {}), done: !!it.done }); lg.topics = lg.topics || []; lg.subs = lg.subs || [];
  const pseudo = { start: it.start || '18:00' };
  const head = `<div class="part-crumb"><span class="mode-tag plan" style="color:#ffd6f3;background:rgba(255,122,217,.12);box-shadow:inset 0 0 0 1px rgba(255,122,217,.4)">Revision</span>
    <span class="sg" style="color:${c?SUBJ[c.subj].c:''}">${c?SUBJ[c.subj].g:''}</span><b>${esc(c?.name || 'Chapter')}</b><span class="mute">${fmtD(it.date, { weekday:'short', day:'numeric', month:'short' })} · ${it.start || '—'}–${it.end || ''} · ${durTxt(tm.planned)}</span>
    <span class="grow"></span><button type="button" class="btn sm ghost" id="rlTime">Change time…</button></div>`;
  const foot = `<button class="btn danger" id="rlDel">Cancel revision</button><span class="grow"></span><button class="btn ghost" data-close>Close</button><button class="btn pri" id="rlSave">Save</button>`;
  modal(`Revise · ${c?.name || 'chapter'}`, head + sessHTML(lg, pseudo, c ? c.subj : 'phy'), foot, r => {
    const q1 = s => r.querySelector(s);
    const sess = mountSession(r, { lg, planned: () => tm.planned, plannedSrc: () => 'the revision slot' });
    if (c) { const sj = q1('#tpSubj'); sj.value = c.subj; sj.dispatchEvent(new Event('change')); const chs = q1('#tpCh'); chs.value = c.id; chs.dispatchEvent(new Event('change')); }
    q1('#rlTime').onclick = () => { closeModal(true); openRev(S.rev.items.find(x => x.id === id)); };
    q1('#rlDel').onclick = () => { S.rev.items = S.rev.items.filter(x => x.id !== id); touch('rev'); closeModal(true); render(); toast('Revision cancelled', { label:'Undo', fn:undo }); };
    q1('#rlSave').onclick = () => {
      const rec = sess.record(pseudo.start), n = sess.applyGrades();
      const cur = S.rev.items.find(x => x.id === id);
      if (rec) { const { done, ...rest } = rec; cur.log = rest; } else delete cur.log;
      if (!!lg.done !== !!cur.done) markRev(id, lg.done);
      touch('rev'); closeModal(true); render(); toast((lg.done ? 'Revision logged' : 'Revision saved') + (n ? ` · prep updated for ${n}` : ''));
    };
  }, 'wide');
}

/* ---------- one part of a split block, as an independent block ---------- */
function partSource(date, pid, sid){
  const lg = (S.plan.log[date] || {})[pid];
  if (lg && lg.segs) return { arr: lg.segs, i: lg.segs.findIndex(x => String(x.id) === sid) };
  const arr = (S.plan.dplan[date] || {})[pid];
  return arr ? { arr, i: arr.findIndex(x => String(x.id) === sid) } : { arr:null, i:-1 };
}
function openPartBlock(date, cid){
  const b = dayBlocks(date).find(x => x.id === cid); if (!b) return;
  const pid = b._parent, sid = b._sid, parent = dayBlocks(date, false).find(x => x.id === pid);
  const src = partSource(date, pid, sid), editable = src.arr && src.i >= 0;
  const saved = (S.plan.log[date] || {})[cid];
  const lg = clone(saved || newLog()); lg.topics = lg.topics || []; lg.subs = lg.subs || [];
  const wasDone = !!(saved && saved.done);
  const subjSel = bSubjs(b).find(s => SUBJ[s]) || 'phy';
  const head = `<div class="part-crumb"><span class="mode-tag plan">Block ${b._seg + 1} of ${b._nseg}</span><span class="mute">from ${esc(typeNames(parent || b))} · ${b.start}–${hm(bEnd(b))}</span><span class="grow"></span><button type="button" class="btn sm ghost" id="pbWhole">Edit the whole block…</button></div>`;
  const form = editable ? `<div class="part-mode">${blockFormHTML(b)}</div>` : `<p class="mute" style="margin:0">This is the unplanned time left in the block. Plan it in the Daily plan to give it a type and subject.</p>`;
  const foot = `${b._free ? '' : '<button class="btn danger" id="pbRemove">Remove this block</button>'}<span class="grow"></span><button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="pbSave">Save</button>`;
  modal(`${fmtD(date, { weekday:'short', day:'numeric', month:'short' })} · ${esc(typeNames(b))}`, head + form + sessHTML(lg, b, subjSel), foot, r => {
    const q = s => r.querySelector(s);
    if (editable) { mountBlockForm(r); r.querySelector('[data-manage-in]').onclick = () => { closeModal(true); openManage(() => openPartBlock(date, cid)); }; }
    const sess = mountSession(r, { lg, planned: () => editable ? +q('#bfH').value * 60 + +q('#bfM').value : +b.dur, plannedSrc: () => 'this block’s length' });
    if (editable) ['#bfH','#bfM'].forEach(s => q(s).addEventListener('input', () => sess.paint()));
    q('#pbWhole').onclick = () => { closeModal(true); openDayBlock(date, pid); };
    q('#pbSave').onclick = () => {
      if (editable) {
        const v = readBlockForm(r); if (!v.dur) { toast('Set a duration longer than 0 minutes'); return; }
        const seg = src.arr[src.i];
        Object.assign(seg, { type:v.type, types:v.types, subj:v.subj, subjs:v.subjs, note:v.note, dur:v.dur, wk:v.wk }); if (v.nc !== undefined) seg.nc = v.nc; else delete seg.nc;
      }
      const logs = (S.plan.log[date] ||= {}), rec = sess.record(b.start);
      if (rec) logs[cid] = rec; else delete logs[cid];
      const n = sess.applyGrades();
      if (!!lg.done !== wasDone) revsInBlock(date, cid).forEach(rv => markRev(rv.id, lg.done));
      touch('plan'); closeModal(true); render(); toast((lg.done ? 'Block logged' : 'Block saved') + (n ? ` · prep updated for ${n}` : ''));
    };
    const rm = q('#pbRemove'); if (rm) rm.onclick = () => { if (editable) { const x = src.arr[src.i]; src.arr[src.i] = { id:x.id, gap:true, dur:x.dur }; }
      if (S.plan.log[date]) delete S.plan.log[date][cid]; touch('plan'); closeModal(true); render(); toast('Block removed, its time left empty', { label:'Undo', fn:undo }); };
  }, 'wide');
}

/* ---------- types & subjects manager ---------- */
function openManage(onDone){
  const sec = (k, title, ph) => `<div class="fld-l">${title}</div><div class="mlist">${S.plan[k].map((x,i) => `<div class="mrow"><button type="button" class="swatch" style="background:${x.c}" data-mcolor="${k}|${i}" title="Change colour" aria-label="Change colour"></button><input class="inp" value="${esc(x.name)}" data-mname="${k}|${i}" aria-label="Name"><button type="button" class="icon-btn ghost" data-mdel="${k}|${i}" aria-label="Delete">×</button></div>`).join('') || '<div class="dim" style="font-size:13px">None.</div>'}</div>
    <div class="row"><input class="inp grow" placeholder="${ph}" data-mnew="${k}"><button type="button" class="btn sm" data-madd="${k}">Add</button></div>`;
  const draw = r => { r.querySelector('.modal-b').innerHTML = sec('types', 'Types of study', 'New type, e.g. NCERT reading') + '<hr class="sep" style="margin:6px 0">' + sec('rsubj', 'Subjects', 'New subject, e.g. Organic chemistry'); };
  modal('Block types & subjects', '', '<span class="dim grow" style="font-size:12.5px">Click a name to rename it. Click × twice to delete.</span><button class="btn pri" data-close>Done</button>', r => {
    draw(r);
    r.addEventListener('click', e => {
      const t = e.target.closest('[data-mcolor],[data-mdel],[data-madd]'); if (!t) return;
      if (t.dataset.mcolor) { const [k,i] = t.dataset.mcolor.split('|'); const x = S.plan[k][+i]; x.c = PALETTE[(PALETTE.indexOf(x.c) + 1) % PALETTE.length]; t.style.background = x.c; return; }
      if (t.dataset.mdel) { const [k,i] = t.dataset.mdel.split('|');
        if (k === 'types' && S.plan.types.length === 1) { toast('Keep at least one type'); return; }
        if (!t.dataset.arm) { t.dataset.arm = 1; t.textContent = 'Delete?'; t.classList.add('armed'); setTimeout(() => { if (t.isConnected) { delete t.dataset.arm; t.textContent = '×'; t.classList.remove('armed'); } }, 2500); return; }
        S.plan[k].splice(+i, 1); draw(r); return; }
      if (t.dataset.madd) { const k = t.dataset.madd, inp = r.querySelector(`[data-mnew="${k}"]`), v = inp.value.trim(); if (!v) return;
        S.plan[k].push({ id: (k === 'types' ? 't_' : 's_') + uid(), name:v, c: PALETTE[S.plan[k].length % PALETTE.length] }); draw(r); r.querySelector(`[data-mnew="${k}"]`).focus(); }
    });
    r.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.mnew) { e.preventDefault(); r.querySelector(`[data-madd="${e.target.dataset.mnew}"]`).click(); } });
    r.addEventListener('change', e => { const n = e.target.dataset.mname; if (!n) return; const [k,i] = n.split('|'); const v = e.target.value.trim(); if (v) S.plan[k][+i].name = v; else e.target.value = S.plan[k][+i].name; });
  }, '', () => { touch('plan'); onDone ? onDone() : render(); });
}

/* ---------- fork helpers ---------- */

  const draw = r => { r.querySelector('.modal-b').innerHTML = `
    <label class="fld">Follow this branch<select class="inp" id="cWhen">
      <optgroup label="Calendar">${['lecture','nolecture','test','notest'].map(k => `<option value="${k}" ${st.when===k?'selected':''}>${CONDS[k]}</option>`).join('')}</optgroup>
      <optgroup label="Day tags">${S.plan.flags.map(f => `<option value="flag:${esc(f)}" ${st.when==='flag'&&st.flag===f?'selected':''}>If the day is tagged “${esc(f)}”</option><option value="noflag:${esc(f)}" ${st.when==='noflag'&&st.flag===f?'selected':''}>If the day is not tagged “${esc(f)}”</option>`).join('') || '<option disabled>No tags yet, create one below</option>'}</optgroup>
      <optgroup label="Other"><option value="custom" ${st.when==='custom'?'selected':''}>Custom condition (combine several checks)…</option><option value="else" ${st.when==='else'?'selected':''}>Otherwise (always matches)</option></optgroup>
    </select></label>
    ${st.when==='custom' ? `<div class="custom-box">
        <label class="fld">Name it (optional)<input class="inp" id="cLabel" value="${esc(st.label)}" placeholder="e.g. Lecture day but exhausted"></label>
        <div class="row" style="gap:8px"><span class="mute" style="font-size:13.5px">Follow when</span><div class="seg"><button type="button" data-match="all" class="${st.match==='all'?'on':''}">all</button><button type="button" data-match="any" class="${st.match==='any'?'on':''}">any</button></div><span class="mute" style="font-size:13.5px">of these are true:</span></div>
        ${st.rules.map((ru,k) => `<div class="row rule">${k ? `<span class="m dim">${st.match==='all'?'and':'or'}</span>` : '<span class="m dim">if</span>'}<select class="inp" data-rw="${k}">${Object.entries(RULES).map(([v,l]) => `<option value="${v}" ${ru.when===v?'selected':''}>${l}</option>`).join('')}</select>${ru.when==='flag'||ru.when==='noflag' ? `<select class="inp" data-rf="${k}">${flagOpts(ru.flag)}</select>` : ''}${st.rules.length > 1 ? `<button type="button" class="icon-btn ghost" data-rdel="${k}" aria-label="Remove check">×</button>` : ''}</div>`).join('')}
        <div><button type="button" class="btn sm" id="cAddRule">＋ Add check</button></div></div>` : ''}
 ${true ? `<div class="row"><input class="inp grow" id="cNewTag" placeholder="New tag, e.g. School exam week"><button type="button" class="btn sm" id="cAddTag">Create tag</button></div><p class="dim" style="font-size:12.5px;margin:0">Switch tags on for a date in the Day planner.</p>` : ''}
    <p class="mute" style="font-size:13px;margin:0">Lectures and tests come from your calendar. Branches are checked left to right and the first match wins.</p>`; };
  modal('Branch condition', '', `<button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="cOk">Save</button>`, r => {
    draw(r);
    r.addEventListener('change', e => { const t = e.target;

function moveBlock(sp, si, tp, ti){
  const day = V.rtDay, sn = getNode(day, sp), tn = getNode(day, tp);
  const sS = mins(seqStart(day, sp)), tS = mins(seqStart(day, tp));
  if (sn === tn && (ti === si || ti === si + 1)) return;
  const [blk] = sn.blocks.splice(si, 1); if (!blk) return;
  if (sn === tn && si < ti) ti--;
  tn.blocks.splice(clamp(ti, 0, tn.blocks.length), 0, blk);
  const anc = (a, b) => a === b || b.startsWith(a + '.');
  if (anc(tp, sp)) setStart(tn, tS); else if (anc(sp, tp)) setStart(sn, sS); else { setStart(sn, sS); setStart(tn, tS); }
  touch('plan'); render(); toast('Block moved, times updated');
}
function insertBranch(root, nb){
  if (!root.fork) { root.fork = { branches:[nb] }; return; }
  const brs = root.fork.branches, k = brs.findIndex(b => b.when === 'else');
  if (nb.when !== 'else' && k >= 0) brs.splice(k, 0, nb); else brs.push(nb);
}
function openCopyBranch(path, bi){
  const br = getNode(V.rtDay, path).fork.branches[bi];
  modal('Copy branch to other days', `<p class="mute" style="margin:0;font-size:14px">“${esc(condLabel(br))}” and everything under it (${treeSize(br.node)} block${treeSize(br.node)===1?'':'s'}) is added as a branch of each day’s first fork, keeping its times. Days without a fork get one.</p>${dayChecks(V.rtDay)}`,
    `<button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="cpOk">Copy branch</button>`, r => {
      r.querySelector('#cpOk').onclick = () => { const days = checkedDays(r); if (!days.length) { toast('Pick at least one day'); return; }
        days.forEach(i => insertBranch(treeFor(i), { ...clone(br), id:uid(), node: cloneNode(br.node) }));
        touch('plan'); closeModal(true); render(); toast(`Copied to ${days.map(keyShort).join(', ')}`); };
    });
}
function openCopyDay(){
  const src = treeFor(V.rtDay);
  modal(`Copy ${keyName(V.rtDay)} to…`, `<p class="mute" style="margin:0;font-size:14px">The whole ${esc(keyName(V.rtDay))} routine replaces the routine on the days you pick.</p>${dayChecks(V.rtDay)}
    <div class="row" style="gap:6px"><button type="button" class="btn sm" data-sel="1,2,3,4,5">Mon–Fri</button><button type="button" class="btn sm" data-sel="1,2,3,4,5,6,0">Every day</button></div>`,
    `<button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="cdOk">Copy and replace</button>`, r => {
      r.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { const s = b.dataset.sel.split(',').map(Number); r.querySelectorAll('.daychecks input').forEach(x => x.checked = s.includes(parseKey(x.value))); });
      r.querySelector('#cdOk').onclick = () => { const days = checkedDays(r); if (!days.length) { toast('Pick at least one day'); return; }
        days.forEach(i => setTree(i, cloneNode(src))); touch('plan'); closeModal(true); render(); toast(`Copied to ${days.map(keyShort).join(', ')}`); };
    });
}
function exampleDay(){
  const B = (type, dur, note = '', subj = 'any') => ({ id:uid(), type, subj, note, start:'05:00', dur });
  const n = { blocks:[B('t_rev',60,'Formula sheets + flashcards'), B('t_self',150,'Backlog chapter'), B('t_brk',30,'Breakfast'), B('t_prac',180,'PYQs, timed'), B('t_brk',60,'Lunch + rest'), B('t_self',180,'Today’s weakest chapter'), B('t_brk',60)],
    fork:{ branches:[
      { id:uid(), when:'lecture', flag:'', node:{ blocks:[B('t_lec',180,'Coaching'), B('t_hw',60,'Same-day DPP')], fork:null } },
      { id:uid(), when:'else', flag:'', node:{ blocks:[B('t_prac',120,'Mixed problem set'), B('t_ana',60,'Error log'), B('t_rev',60,'Revise today’s topics')], fork:null } },
    ] } };
  setStart(n, 5*60); return n;
}

  if (b.dataset.cfg === 'startFrom') { if (b.dataset.value) { S.cfg.startDate = addDays(b.dataset.value, 7); touch('cfg'); render(); toast('Routines now appear from ' + fmtD(b.dataset.value, { day:'numeric', month:'short', year:'numeric' })); } }
  else if (b.dataset.cfg) { S.cfg[b.dataset.cfg] = b.dataset.value; touch('cfg'); render(); if (b.dataset.value) toast('Exam date saved'); }

<script>

    if (f.size > 20*1024*1024) { toast(`${f.name} is over 20 MB`); continue; }
    const rec = { id:uid(), name:f.name.replace(/\.[^.]+$/,''), type:f.type, size:f.size, added:Date.now() };
    toast(`Uploading ${f.name}…`);
    let ok = false;
    if (ASSETS) { try { const r = await ASSETS.upload(f); rec.assetId = r.id; ok = true; } catch(e){} }
    if (!ok) { try { await idb.put(rec.id, f); rec.localKey = rec.id; ok = true; } catch(e){} }
    if (!ok) { toast(`Couldn’t store ${f.name}`); continue; }

/* ---------- study log → day planner ----------
   A session goes into the study block it happened in. If it runs past that
   block, the whole session still goes to it and the block grows in the Actual
   column. A session spanning two blocks fills the first up to where the second
   starts and gives the rest to the second. A session touching no block goes to
   the nearest study block that day; only a day with no study blocks at all gets
   a block made for it. Each piece remembers which session made it, so editing or
   deleting the session in BTracker updates the planner, while anything you edit
   by hand in the planner is kept. */
/* the study blocks a session can go to. A block the study log split by subject

   not in whichever subject's part happens to sit at that minute. */
let BT_RECV = null;   /* the block types a session may go into, chosen in BTracker's Settings */
function btPlanBlocks(date){
  const L = S.plan.log[date] || {};
  const recv = b => !BT_RECV || bTypes(b).some(t => BT_RECV.includes(t));
  const ok = b => !b._btMade && !b.actual && b.start && countsStudy(b) && !typeOf(b.type).brk && recv(b);

  const split = new Set(whole.filter(b => (L[b.id] || {}).btSplit).map(b => b.id));

      delete lg.btOrig;

/* A block holding sessions of two or more subjects is cut into one part per

   4. THE TREE
   ============================================================ */
let TREE = null;
function buildTree(){
  TREE = {order:[], subjects:{}};
  for(const code of ["M","P","C"]){
    const b = BUILTIN[code];
    const sub = {code, name:S.x.ren["s:"+code]||b.name, short:b.short, accent:colorOf("s:"+code)||b.accent, custom:false, modules:{}, order:[]};
    /* every module exists before any chapter is placed, so a chapter moved
       into a later module still has somewhere to land */
    for(let m=1;m<=6;m++){
      sub.modules[m] = {id:m, name:S.x.ren["m:"+code+":"+m]||("Module "+m), color:colorOf("m:"+code+":"+m), custom:false, chapters:[]};
      sub.order.push(m);
    }
    for(let m=1;m<=6;m++){
      (b.modules[m]||[]).forEach(row=>{
        /* a built-in chapter can be re-homed into another module by the user */
        const dest = (S.x.mod||{})["c:"+code+":"+row[0]];
        const home = (dest!==undefined && Number(dest)>=1 && Number(dest)<=6) ? Number(dest) : m;
        const ch = {no:row[0], name:S.x.ren["c:"+code+":"+row[0]]||row[1], custom:false, mod:home, exs:[]};
        BUILT_EX.forEach(e=>ch.exs.push({code:e.code, name:S.x.ren["e:"+code+":"+ch.no+":"+e.code]||e.name,
                                         tag:e.tag, custom:false, base:row[e.i]*(e.mult||1)}));
        sub.modules[home].chapters.push(ch);
      });
    }
    TREE.subjects[code] = sub; TREE.order.push(code);
  }
  S.x.subs.forEach(cs=>{
    TREE.subjects[cs.code] = {code:cs.code, name:cs.name, short:cs.name, accent:colorOf("s:"+cs.code)||cs.accent, custom:true, modules:{}, order:[]};
    TREE.order.push(cs.code);
  });
  for(const sc of TREE.order){
    const sub = TREE.subjects[sc];
    (S.x.mods[sc]||[]).forEach(cm=>{ sub.modules[cm.id] = {id:cm.id, name:cm.name, color:colorOf("m:"+sc+":"+cm.id), custom:true, chapters:[]}; sub.order.push(cm.id); });
    for(const mid of sub.order)
      (S.x.chs[sc+"|"+mid]||[]).forEach(cc=>sub.modules[mid].chapters.push({no:cc.no, name:cc.name, custom:true, mod:mid, exs:[]}));
    for(const mid of sub.order)
      sub.modules[mid].chapters.forEach(ch=>
        (S.x.exs[sc+"|"+ch.no]||[]).forEach(ce=>ch.exs.push({code:ce.code, name:ce.name, tag:"Added by you", custom:true})));
    labelChapters(sc);
  }
  return TREE;
}
/* ch.no is the permanent key; ch.label is the number on screen */
function labelChapters(sc){
  const sub = TREE.subjects[sc];
  let flow = 0;
  sub.order.forEach(m=>sub.modules[m].chapters.forEach(ch=>{ if(!ch.custom) flow = Math.max(flow, ch.no); }));
  sub.order.forEach(m=>{
    let seq = 0;
    sub.modules[m].chapters.forEach(ch=>{
      const k = "c:"+sc+":"+ch.no;
      const set = S.x.num[k];
      if(set !== undefined && set !== null) ch.label = Number(set);
      else if(!ch.custom) ch.label = ch.no;
      else if(Number(m) <= 6) ch.label = flow + 1;          /* keep the syllabus running on */
      else ch.label = seq + 1;                              /* a module of your own starts at 1 */
      if(Number(m) <= 6) flow = Math.max(flow, ch.label);
      seq = Math.max(seq, ch.label);
    });
    sub.modules[m].chapters.sort((a,b)=>a.label-b.label);
  });
}
const chLabel = ch => (ch && ch.label !== undefined) ? ch.label : (ch?ch.no:"");
const chTitle = ch => ch ? chLabel(ch)+". "+ch.name : "";
const subjOf = sc => TREE.subjects[sc];
const modOf  = (sc,m) => { const s = subjOf(sc); return s && s.modules[m]; };
function chapOf(sc, no){
  const s = subjOf(sc); if(!s) return null;
  for(const m of s.order){ const c = s.modules[m].chapters.find(c=>c.no===Number(no)); if(c) return c; }
  return null;
}
const exOf = (sc,ch,code) => ch && ch.exs.find(e=>e.code===code);
function qCount(sc, ch, code){
  const k = key(sc, ch.no, code);
  if(S.x.cnt[k] !== undefined) return S.x.cnt[k];
  const e = exOf(sc, ch, code);
  return e ? (e.base||0) : 0;
}
const exList = (sc,ch) => ch.exs.filter(e => e.custom || qCount(sc,ch,e.code) > 0);
function allChapters(sc){
  const s = subjOf(sc); if(!s) return [];
  let out=[]; s.order.forEach(m=>{ out = out.concat(s.modules[m].chapters); }); return out;
}
function arrFor(sc,no,code,len){
  const k = key(sc,no,code);
  if(!S.d[k] || S.d[k].length!==len){
    const old = S.d[k]||[], next = new Array(len).fill(0);
    for(let i=0;i<Math.min(old.length,len);i++) next[i]=old[i];
    S.d[k]=next;
  }
  return S.d[k];
}

const blank = () => ({n:0,done:0,correct:0,wrong:0,cant:0,flag:0});
function addTo(a,b){ ["n","done","correct","wrong","cant","flag"].forEach(k=>a[k]+=b[k]); return a; }
function exStats(sc,ch,code){
  const n = qCount(sc,ch,code), st = blank(); st.n = n;
  const a = S.d[key(sc,ch.no,code)]; if(!a) return st;
  for(let i=0;i<n;i++){ const v=a[i]||0;
    if(isDone(v)) st.done++;
    const r=result(v); if(r===1) st.correct++; else if(r===2) st.wrong++; else if(r===3) st.cant++;
    if(isFlag(v)) st.flag++; }
  return st;
}
function chapStats(sc,ch){ const t=blank(); exList(sc,ch).forEach(e=>addTo(t,exStats(sc,ch,e.code))); return t; }
function modStats(sc,m){ const t=blank(); const mo=modOf(sc,m); if(mo) mo.chapters.forEach(c=>addTo(t,chapStats(sc,c))); return t; }
function subjStats(sc){ const t=blank(); const s=subjOf(sc); if(s) s.order.forEach(m=>addTo(t,modStats(sc,m))); return t; }
const pct = st => st.n ? Math.round(st.done/st.n*100) : 0;
const acc = st => (st.correct+st.wrong) ? Math.round(st.correct/(st.correct+st.wrong)*100) : null;

   5. HOMEWORK
   ============================================================ */
function parseRange(str, max){
  const out=[], bad=[];
  const parts = String(str).split(",").map(p=>p.trim()).filter(Boolean);
  if(!parts.length) return {list:[], error:"Type a question range, like 20-30."};
  for(const p of parts){
    const m = p.match(/^(\d+)\s*(?:[-–—to]+\s*(\d+))?$/i);
    if(!m) return {list:[], error:'"'+p+'" is not a range. Use 20-30, or 12, or 20-30, 45.'};
    let a=parseInt(m[1],10), b=m[2]?parseInt(m[2],10):a;
    if(a>b){ const t=a; a=b; b=t; }
    if(a<1) return {list:[], error:"Question numbers start at 1."};
    if(b>max) bad.push(p);
    for(let i=a;i<=b;i++) out.push(i-1);
  }
  if(bad.length) return {list:[], error:"This exercise has "+max+" questions, so "+bad.join(", ")+" is outside it."};
  return {list:[...new Set(out)].sort((x,y)=>x-y), error:null};
}
function toRange(idx){
  if(!idx.length) return "";
  const s=[...idx].sort((a,b)=>a-b), out=[]; let a=s[0], p=s[0];
  for(let i=1;i<=s.length;i++){
    if(i<s.length && s[i]===p+1){ p=s[i]; continue; }
    out.push(a===p ? String(a+1) : (a+1)+"-"+(p+1));
    a=s[i]; p=s[i];
  }
  return out.join(",");
}
function hwResolve(it){
  if(it.kind==="back"){
    const sub = it.s?subjOf(it.s):null, ch = (it.s&&it.c)?chapOf(it.s,it.c):null;
    const ex = (ch&&it.e)?exOf(it.s,ch,it.e):null;
    return {back:true, missing:!!(it.e && !ex), list:[], n:ex?qCount(it.s,ch,it.e):0, sub, ch, ex};
  }
  /* a task may name none, some or all of a location */
  if(it.kind==="task") return {task:true, missing:false, list:[], n:0,
    sub: it.s?subjOf(it.s):null, ch:(it.s&&it.c)?chapOf(it.s,it.c):null, ex:null};
  const sub = subjOf(it.s), ch = sub ? chapOf(it.s, it.c) : null;
  const ex = ch ? exOf(it.s, ch, it.e) : null;
  if(!sub||!ch||!ex) return {missing:true, list:[], sub, ch, ex, n:0};
  const n = qCount(it.s, ch, it.e);
  const raw = parseRange(it.r, Number.MAX_SAFE_INTEGER).list;
  const list = raw.filter(i=>i<n);
  return {missing:false, over:raw.length-list.length, list, sub, ch, ex, n};
}
function hwStats(it){
  if(it.kind==="task") return {done: it.done?1:0, total:1, r:hwResolve(it)};
  if(it.kind==="back"){
    const r = hwResolve(it);
    if(!r.ex) return {done: it.done?1:0, total:1, r};     /* a lecture, ticked by hand */
    const a = S.d[key(it.s,it.c,it.e)]||[];
    let done = 0; for(let i=0;i<r.n;i++) if(isDone(a[i]||0)) done++;
    return {done, total:r.n, r};
  }
  const r = hwResolve(it); if(r.missing) return {done:0,total:0,r};
  const a = S.d[key(it.s,it.c,it.e)]||[];
  let done=0; r.list.forEach(i=>{ if(isDone(a[i]||0)) done++; });
  return {done, total:r.list.length, r};
}
/* how much of everything ever set for one chapter is done, finished lists included */
function chapterHwStats(sc, cno){
  let done=0, total=0;
  S.h.concat(S.hd).forEach(it=>{
    if(it.kind==="task" || it.kind==="back") return;
    if(it.s!==sc || String(it.c)!==String(cno)) return;
    const st = hwStats(it); done += st.done; total += st.total;
  });
  return {done, total, pct: total ? Math.round(done/total*100) : 0};
}
/* take specific questions back out of whatever lists cover them */
function removeQsFromHomework(qks){
  const set = new Set(qks);
  let touched = 0;
  S.h = S.h.filter(it=>{
    if(it.kind==="task" || it.kind==="back") return true;
    const base = key(it.s,it.c,it.e);
    const before = parseRange(it.r, Number.MAX_SAFE_INTEGER).list;
    const after = before.filter(i=>!set.has(base+"."+i));
    if(after.length === before.length) return true;
    touched++;
    if(!after.length) return false;
    it.r = toRange(after);
    return true;
  });
  return touched;
}
function hwTotals(){ let done=0,total=0; S.h.forEach(it=>{const s=hwStats(it); done+=s.done; total+=s.total;}); return {done,total,left:total-done}; }
/* pull a set of questions out of every homework list that mentions them */
function removeFromHomework(qks){
  const want = new Set(qks);
  let touched = 0, dropped = 0;
  S.h = S.h.filter(it=>{
    if(it.kind==="task" || it.kind==="back") return true;
    const base = key(it.s,it.c,it.e);
    const list = parseRange(it.r, Number.MAX_SAFE_INTEGER).list;
    const kept = list.filter(i=>!want.has(base+"."+i));
    if(kept.length === list.length) return true;
    touched += list.length - kept.length;
    if(!kept.length){ dropped++; return false; }
    it.r = toRange(kept);
    return true;
  });
  return {touched, dropped};
}

/* how much homework a chapter has ever carried, finished lists included */
function chapterHwStats(sc, cno){
  const seen = {};
  S.h.concat(S.hd).forEach(it=>{
    if(it.kind==="task" || it.kind==="back") return;
    if(it.s!==sc || String(it.c)!==String(cno)) return;
    const base = key(it.s,it.c,it.e);
    hwResolve(it).list.forEach(i=>{ seen[base+"."+i] = true; });
  });
  const keys = Object.keys(seen);
  let done = 0;
  keys.forEach(qk=>{
    const dot = qk.lastIndexOf(".");
    const arr = S.d[qk.slice(0,dot)];
    if(arr && isDone(arr[Number(qk.slice(dot+1))]||0)) done++;
  });
  return {total:keys.length, done, pct: keys.length?Math.round(done/keys.length*100):0};
}

function hwIndexSet(sc,no,code){
  const set = new Set();
  S.h.forEach(it=>{ if(it.kind==="task"||it.kind==="back") return;
    if(it.s===sc && String(it.c)===String(no) && it.e===code) hwResolve(it).list.forEach(i=>set.add(i)); });
  return set;
